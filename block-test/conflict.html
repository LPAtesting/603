rdict": "BEST", "html": ""}, {"letter": "E", "code": "C2.10.2", "title": "Route B: Forum International Public Policy", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Royal Boskalis<\/i>,<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">per <i>Westacre<\/i>, so is<\/mark> <mark class=\"new\">a contract to break Xalarat's quota<\/mark> <mark class=\"same\">under any<\/mark> <mark class=\"new\">proper law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So the loan, the casino debt and the charter all fall to forum international public policy.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Route B is for conduct any civilised tribunal would refuse, such as extreme duress or corruption. Unlicensed lending, gambling and a quota breach are handled by the mandatory rules and <i>Foster<\/i>."}, {"letter": "F", "code": "C2.10.5", "title": "Ralli: Independent Rule", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ralli Brothers<\/i>,<\/mark> <mark class=\"new\">landing fuel in Xalarat above the quota<\/mark> <mark class=\"same\">is unenforceable in so far as unlawful at<\/mark> <mark class=\"new\">the contractual place of performance<\/mark><mark class=\"same\">, whatever<\/mark> <mark class=\"new\">Singapore law, the proper law, says<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">(1) Independent rule (start here): per <i>Esben<\/i>, Dicey's rule rooted in comity, catching supervening and initial illegality alike<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "<i>Ralli<\/i> asks whether the performance the contract requires is unlawful where it must be done. The charter required carriage to the coast; the illegal landing was the parties' plan at formation, which is <i>Foster<\/i>'s ground."}, {"letter": "G", "code": "C2.2.2", "title": "Attack: Not Bona Fide", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Peh Teck Quee<\/i>, choosing<\/mark> <mark class=\"new\">Charltonian law<\/mark> <mark class=\"same\">to evade<\/mark> <mark class=\"new\">the Moneylenders Act<\/mark> <mark class=\"same\">defeats the clause only if evasion was the sole purpose.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Negligible<\/mark> <mark class=\"same\">connection and<\/mark> <mark class=\"new\">the lawyers' advice<\/mark> <mark class=\"same\">show that evading<\/mark> <mark class=\"new\">Singapore law, the OPL,<\/mark> <mark class=\"same\">was the sole purpose, so the clause is struck out completely<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">\"Another law\": per C&amp;Y, usually<\/mark> <mark class=\"new\">Singapore law as the OPL<\/mark><mark class=\"same\">, but possibly<\/mark> <mark class=\"new\">the Moneylenders Act<\/mark> <mark class=\"same\">(<i>Golden Acres<\/i>), whose evasion fails twice<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "C-07.2", "side": "C", "hyp": 7, "n": 2, "source": "Mock Paper 7, Hypo 14", "title": "Sterling v EPA and the Shipyard", "full": "Mock Paper 7, Hypo 14", "q": "<p>Assume the Singapore court will assume jurisdiction in each dispute.<\/p><p>Sterling Maritime Pte Ltd is a Singapore shipping company. In 2025, Elbonian soldiers boarded Sterling's tanker, the <i>Grace<\/i>, in an Elbonian port and held her crew at gunpoint. Sterling was told that the crew would remain in custody unless it signed a Port Agreement with Elbonia Port Authority (EPA), a state-owned company. The agreement, which is governed by Elbonian law, requires Sterling to pay US$10 million and to waive all claims against EPA. Sterling signed and paid, and now seeks to recover the money. EPA relies on the agreement.<\/p><p>In the same year, a Suburbian shipyard refused to finish repairs on another Sterling vessel unless Sterling agreed to pay 40% above the contract price, knowing that the vessel was about to begin a lucrative charter. Sterling agreed to a variation of the repair contract, which is governed by Suburbian law, and wants the extra sum back.<\/p><p>Under Elbonian law, the Port Agreement is valid and binding, and duress is not recognised as a ground for setting aside a contract with a state entity. Suburbian law has no doctrine of economic duress; under Singapore law, the variation would be voidable for economic duress. Advise Sterling.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Two kinds of duress with two different homes. Extreme duress engages forum public policy whatever the proper law; economic duress stays with the proper law. Then work out how Sterling gets its money back.<\/p>\n<p><strong>The line: C2.10.2.<\/strong> Holding a crew at gunpoint is the kind of duress \"any civilised tribunal\" would refuse to give effect to (<i>Royal Boskalis<\/i>), so the Elbonian proper law does not save the Port Agreement. Economic duress, by contrast, is for the proper law (<i>Dimskal<\/i>), and Suburbian law has none, so the shipyard variation stands.<\/p>\n<p><strong>The waiver: C2.10.7.<\/strong> EPA cannot rely on the agreement's waiver as a defence, because that would give effect to the agreement the court refuses to recognise (<i>Royal Boskalis<\/i> majority).<\/p>\n<p><strong>Recovery: C3.11.<\/strong> The restitution claim follows the proper law of the obligation, which for a contract is the contract's proper law, Elbonian law, but without the excised agreement. Elbonian unjust enrichment law is not given, so if it is not pleaded, Singapore law applies by default.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not apply Singapore's economic duress rule to the shipyard because Sterling is suing here. Economic duress is below the public policy threshold.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The Port Agreement was procured by extreme duress that offends forum international public policy whatever its Elbonian proper law, so EPA cannot rely on it or its waiver, and Sterling can recover the US$10 million in restitution; but economic duress is for the proper law, and Suburbian law has no such doctrine, so the shipyard keeps the extra sum.<\/blockquote>", "items": [{"letter": "A", "code": "C1.6.3", "title": "Default Rule: Foreign Law Not Pleaded", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Brownlie<\/i>, if neither party pleads<\/mark> <mark class=\"new\">Elbonian unjust enrichment law<\/mark><mark class=\"same\">, Singapore law applies in its own right (adversarial procedure, arguably tacit agreement), not by presumption.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">That fills the gap in the restitution claim.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Fills the gap in the restitution claim if Elbonian law is not pleaded. One line."}, {"letter": "B", "code": "C2.10.3", "title": "Foster", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Foster v Driscoll<\/i> and <i>Regazzoni<\/i> (in Singapore, <i>Patriot v Lam Hong<\/i>; <i>Esben<\/i>), a contract whose real object and intention is<\/mark> <mark class=\"new\">extracting money under threat<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Elbonia<\/mark> <mark class=\"same\">is unenforceable<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So the Port Agreement fails under Foster.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "<i>Foster<\/i> concerns a contract whose object is to break a friendly state's law. The Port Agreement breaks no foreign law; it was extracted by force, which is Route B."}, {"letter": "C", "code": "C2.10.7", "title": "Reliance on the Agreement as a Defence", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per the majority,<\/mark> <mark class=\"new\">EPA<\/mark> <mark class=\"same\">could not rely on<\/mark> <mark class=\"new\">the Port Agreement's waiver<\/mark> <mark class=\"same\">as a defence, that being akin to<\/mark> <mark class=\"new\">enforcing a claim the court will not enforce<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Contra (Phillips LJ), note its scope:<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">he dissented only on illegality, so cite him for<\/mark> <mark class=\"new\">foreign illegality<\/mark><mark class=\"same\">, not<\/mark> <mark class=\"new\">extreme duress<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "C1.8", "title": "Fundamental Public Policy", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Royal Boskalis<\/i>,<\/mark> <mark class=\"new\">a contract procured by holding a crew at gunpoint<\/mark><mark class=\"same\">, and per <i>Foster v Driscoll<\/i>,<\/mark> <mark class=\"new\">a contract to break a friendly state's law<\/mark><mark class=\"same\">, whereas<\/mark> <mark class=\"new\">economic duress<\/mark> <mark class=\"same\">stays with the proper law (Dimskal) (C2.10).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The same line, stated at the level of principle.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "States the same line as C2.10.2 at the level of principle. Either block works for the opening; C2.10.2 is where the duress cases sit."}, {"letter": "E", "code": "C2.10.2", "title": "Extreme v Economic Duress", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Royal Boskalis<\/i>,<\/mark> <mark class=\"new\">an Iraqi-law agreement<\/mark> <mark class=\"same\">procured by<\/mark> <mark class=\"new\">a human-shield threat<\/mark> <mark class=\"same\">was refused, as \"any civilised tribunal\" would refuse it<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">So too an agreement signed while the crew was held at gunpoint.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Threshold: Higher Order Only: Per <i>Dimskal<\/i>,<\/mark> <mark class=\"new\">economic duress<\/mark> <mark class=\"same\">is for<\/mark> <mark class=\"new\">the proper law<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Suburbian law has no economic duress doctrine, so the shipyard keeps the extra sum.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "C3.11", "title": "Unjust Enrichment", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">per Dicey Rule 230 (adopted), the proper law of<\/mark> <mark class=\"new\">Sterling's restitution claim<\/mark><mark class=\"same\">: (a)<\/mark> <mark class=\"new\">the Port Agreement<\/mark><mark class=\"same\">'s (putative) proper law<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">That is Elbonian law, without the excised agreement; if Elbonian unjust enrichment law is not pleaded, Singapore law applies by default.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "C2.2.3", "title": "Duress and the Choice of Law Clause", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Royal Boskalis<\/i>,<\/mark> <mark class=\"new\">extreme duress, such as holding a crew at gunpoint,<\/mark> <mark class=\"same\">engages forum public policy (C2.10.2), whereas per <i>Dimskal<\/i><\/mark> <mark class=\"new\">economic duress<\/mark> <mark class=\"same\">stays with<\/mark> <mark class=\"new\">the proper law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So the Elbonian choice of law cannot shield the Port Agreement, but the Suburbian choice decides the shipyard dispute.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Confirms the split between extreme and economic duress from the choice of law side. A supporting line."}]}, {"id": "C-07.3", "side": "C", "hyp": 7, "n": 3, "source": "Mock Paper 7, Hypo 14", "title": "Sterling v Kaspar and Mr Lim", "full": "Mock Paper 7, Hypo 14", "q": "<p>Assume the Singapore court will assume jurisdiction in each dispute.<\/p><p>Sterling Maritime Pte Ltd, a Singapore shipping company, is controlled by Mr Wee, a Singapore citizen.<\/p><p><strong>The <i>Hope<\/i>.<\/strong> In 2024, the government of Elbonia issued a decree confiscating without compensation all vessels in Elbonian waters owned by persons of Mr Wee's ethnic group. Sterling's tanker, the <i>Hope<\/i>, was seized in Elbonian waters and sold by the Elbonian government to Kaspar Shipping Ltd, a Buritanian company which knew the circumstances. Kaspar took delivery in Elbonia and renamed the vessel. She recently called at Singapore, and Sterling is suing Kaspar there for conversion. Under Elbonian law, the decree passed good title to the government and then to Kaspar. Conversion of a vessel in these circumstances would be a tort under Singapore law.<\/p><p><strong>The agent.<\/strong> Sterling agreed to pay Mr Lim, a Singapore citizen who lives in Suburbia, a commission for securing berthing rights at a Suburbian port. Under the agency contract, which is governed by Suburbian law, Mr Lim paid \"facilitation fees\" to Suburbian port officials, which is lawful under Suburbian law. Sterling refuses to pay Mr Lim, and it also refuses to reimburse him for the fees. Section 37 of the Prevention of Corruption Act 1960 extends the Act to acts by Singapore citizens outside Singapore, and Mr Lim's payments would be corrupt under Singapore law if made in Singapore.<\/p><p>Advise Sterling.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A foreign rule the forum finds abhorrent, and a Singapore statute that follows its citizens abroad. One is public policy, the other a mandatory rule, and neither works through the flexible exception.<\/p>\n<p><strong>The decree: C1.8.<\/strong> A discriminatory, uncompensated confiscation offends Singapore's fundamental public policy, so the court refuses to give effect to it (Lord Steyn's route in <i>Kuwait Airways<\/i>). Without it, Sterling keeps title. Kaspar knew the circumstances.<\/p>\n<p><strong>Not the exception: C3.6.6.<\/strong> The <i>Kuwait Airways<\/i> majority used the flexible exception to excise the decree, but after <i>Rickshaw<\/i> that is unavailable in Singapore: Elbonia, where the seizure happened, is not fortuitous. Public policy within the rule is the route.<\/p>\n<p><strong>The agent: C1.7.<\/strong> Section 37 PCA is a conduct-regulating statute that reaches Singapore citizens abroad, so it applies as a mandatory rule whatever the Suburbian proper law. Legality where the payments were made does not save them (<i>Dimskal<\/i>). Mr Lim cannot recover the fees, and his commission is tainted if earned through them.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not use the flexible exception to get rid of an offensive foreign law. The exception picks the most connected law; it does not cut parts out of it.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The Elbonian decree is refused effect as contrary to Singapore's fundamental public policy, not through the flexible exception, which is unavailable because Elbonia is not fortuitous, so Sterling keeps title and Kaspar, which knew the circumstances, is likely liable in conversion; and s 37 PCA applies to Mr Lim as a mandatory rule despite the Suburbian proper law, so he cannot recover the facilitation fees.<\/blockquote>", "items": [{"letter": "A", "code": "C3.5", "title": "Proof of Foreign Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>EFT Holdings<\/i> (applying <i>Goh Chok Tong v Tang Liang Hong<\/i>), pleading<\/mark> <mark class=\"new\">Elbonian law<\/mark> <mark class=\"same\">is voluntary, so if<\/mark> <mark class=\"new\">Kaspar<\/mark> <mark class=\"same\">does not plead it, no conflicts issue arises<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Without the decree, Kaspar must plead and prove that Elbonian law still gives it a defence; otherwise Singapore law applies.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Once the decree is excised, Kaspar must plead and prove that Elbonian law still gives it a defence; otherwise Singapore law applies by default. A good follow-on point."}, {"letter": "B", "code": "C3.6.6", "title": "Public Policy Is Not a Ground for the Exception", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Kuwait Airways: the majority excised<\/mark> <mark class=\"new\">the Elbonian decree<\/mark> <mark class=\"same\">from<\/mark> <mark class=\"new\">Elbonian law<\/mark> <mark class=\"same\">via the exception, but Lord Scott (dissenting) said it is for applying<\/mark> <mark class=\"new\">the most connected law<\/mark><mark class=\"same\">, not disapplying<\/mark> <mark class=\"new\">parts of it<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Singapore Position: after <i>Rickshaw<\/i>, the exception cannot do this,<\/mark> <mark class=\"new\">Elbonia<\/mark> <mark class=\"same\">not being fortuitous<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "C1.8", "title": "Fundamental Public Policy", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, the court refuses<\/mark> <mark class=\"new\">the confiscatory decree<\/mark> <mark class=\"same\">or<\/mark> <mark class=\"new\">a contract<\/mark> <mark class=\"same\">only if it infringes Singapore's fundamental (international) public policy, narrower than domestic policy<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">A discriminatory, uncompensated confiscation qualifies, so the decree is disregarded and Sterling keeps title.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "C1.7", "title": "Forum Mandatory Rules: s 37 PCA", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>JIO Minerals<\/i>,<\/mark> <mark class=\"new\">a conduct-regulating statute like s 37 PCA<\/mark> <mark class=\"same\">more readily applies extraterritorially<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Section 37 reaches Mr Lim's payments abroad, so legality in Suburbia does not save them (<i>Dimskal<\/i>), and he cannot recover the fees.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "C2.10.2", "title": "Corruption and International Policy", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">per <i>Westacre<\/i>, so is<\/mark> <mark class=\"new\">a contract for corruption<\/mark> <mark class=\"same\">under any<\/mark> <mark class=\"new\">proper law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Facilitation payments to port officials arguably reach that level, and the commission is tainted if earned by them.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Corruption also offends international public policy (<i>Westacre<\/i>), which supports refusing Mr Lim's claims. C1.7 is the sharper route because the statute reaches him directly."}, {"letter": "F", "code": "C3.6.1", "title": "The Flexible Exception", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Rickshaw<\/i>, the exception (Boys v Chaplin; Red Sea) may displace<\/mark> <mark class=\"new\">Elbonian law<\/mark> <mark class=\"same\">for the law with the most significant relationship to<\/mark> <mark class=\"new\">the conversion claim<\/mark> <mark class=\"same\">and the parties, so<\/mark> <mark class=\"new\">Sterling<\/mark> <mark class=\"same\">argues<\/mark> <mark class=\"new\">Elbonia<\/mark> <mark class=\"same\">is fortuitous because<\/mark> <mark class=\"new\">the seizure was a political act<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Singapore law governs the conversion claim instead.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Elbonia, where the vessel was seized and sold, is not fortuitous, so the exception cannot displace Elbonian law. Public policy is the route."}, {"letter": "G", "code": "C3.3.3", "title": "Applying Limb 2", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Elbonian law, through the decree, gives Kaspar good title,<\/mark> <mark class=\"same\">so<\/mark> <mark class=\"new\">Kaspar<\/mark> <mark class=\"same\">escapes unless<\/mark> <mark class=\"new\">Elbonian law<\/mark> <mark class=\"same\">is displaced (C3.6.3).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">That is why the decree must be dealt with first.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Shows why the decree matters: with it, Elbonian law gives Kaspar title and limb 2 fails. That sets up C1.8."}]}, {"id": "C-08.1", "side": "C", "hyp": 8, "n": 1, "source": "Mock Paper 8, Hypo 16", "title": "Lumiere SG v Konrad and Zenobia", "full": "Mock Paper 8, Hypo 16", "q": "<p>Assume the Singapore court will assume jurisdiction over all relevant parties.<\/p><p>Lumiere Holding AG, a Charltonian company, owns Lumiere Family Office Pte Ltd (Lumiere SG), a Singapore wealth manager. Konrad, a Charltonian citizen, is employed by Lumiere AG under a contract governed by Charltonian law, clause 11 of which reads: \"All claims arising from this employment shall be governed by Charltonian law.\"<\/p><p>In 2022, Lumiere AG seconded Konrad to Singapore to run Lumiere SG. He signed no contract with Lumiere SG, but was appointed one of its directors and worked from its Singapore office. At meetings in Singapore, he gave Lumiere SG's client list to Zenobia Wealth Ltd, a competitor incorporated in Yesouth, and agreed with Zenobia's chief executive that he would steer clients to Zenobia and share the fees. Lumiere SG lost clients worth US$4 million a year in Singapore. Separately, through a clerical error by Lumiere SG's staff in Singapore, US$500,000 meant for another employee was paid into Konrad's bank account in Xalarat. He knew of the mistake and kept the money.<\/p><p>Lumiere SG sues Konrad for breach of fiduciary duty, sues Konrad and Zenobia for conspiracy, and claims the US$500,000 from Konrad as money paid by mistake. Konrad says Charltonian law governs every claim because they all arise from his employment. Under Charltonian law, an employee owes duties only to his contractual employer. Conspiracy to injure by unlawful means is a tort under Singapore and Yesouth law, but not under Charltonian law. Under Xalarat law, a person who keeps money paid by mistake must return it only if he knew of the mistake at the time. Advise Lumiere SG on the law that governs each claim.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A clause in the wrong contract. Cl 11 binds Konrad and the parent, but the claimant is the subsidiary, so characterise each claim by its own foundation.<\/p>\n<p><strong>Foundation: C1.1.5.<\/strong> A fiduciary claim follows its legal foundation. Lumiere SG has no contract with Konrad; its claim rests on his directorship of a Singapore company.<\/p>\n<p><strong>Fiduciary duty and the mistaken payment: C3.11.<\/strong> Directors' duties follow the place of incorporation (<i>Focus Energy<\/i>), which party autonomy cannot change (<i>Base Metal Trading<\/i>), so Singapore law governs. The mistaken payment is unjust enrichment not tied to any contract between these parties, so the place of enrichment, Xalarat, governs; Konrad knew, so he must repay.<\/p>\n<p><strong>Conspiracy: C3.4.<\/strong> The agreement, the acts and the loss were all in Singapore, so this is a local tort with Singapore law on both limbs. Displacing it needs fortuity, and there is none.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not apply cl 11 because express choices are \"virtually conclusive\": that holds only between the parties to the clause. And note that the mistaken payment takes a different law from the other claims.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Cl 11 is in Konrad's contract with the parent, not with Lumiere SG, so it governs none of these claims: the fiduciary claim follows Singapore law as the law of incorporation, the conspiracy is a local tort governed by Singapore law on both limbs, and the mistaken payment follows Xalarat law as the place of enrichment, under which Konrad, who knew of the mistake, must repay.<\/blockquote>", "items": [{"letter": "A", "code": "C3.3.2", "title": "Locating the Conspiracy", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>EFT Holdings<\/i>, weigh<\/mark> <mark class=\"new\">Konrad (in Singapore) and Zenobia<\/mark><mark class=\"same\">, where<\/mark> <mark class=\"new\">they agreed (Singapore)<\/mark><mark class=\"same\">,<\/mark> <mark class=\"new\">the handover of the list (Singapore)<\/mark><mark class=\"same\">,<\/mark> <mark class=\"new\">Lumiere SG<\/mark><mark class=\"same\">'s location and<\/mark> <mark class=\"new\">the lost clients (Singapore)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Every factor is in Singapore, so the conspiracy is a local tort.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Locates the conspiracy with the <i>EFT<\/i> factors, all of which are in Singapore. Quick here; C3.4 carries the consequence."}, {"letter": "B", "code": "C1.1.5", "title": "Novel Issue: Legal Foundation", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently<\/mark> <mark class=\"new\">breach of fiduciary duty<\/mark> <mark class=\"same\">fits no category. Per <i>Rickshaw<\/i>, rejecting the Australian lex fori approach, COL centres on its legal foundation,<\/mark> <mark class=\"new\">a Singapore directorship, not a contract<\/mark><mark class=\"same\">, by its \"nature and origins\" in<\/mark> <mark class=\"new\">Konrad's appointment<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Rappo<\/i> and <i>Perry<\/i>,<\/mark> <mark class=\"new\">fiduciary claims<\/mark> <mark class=\"same\">founded on<\/mark> <mark class=\"new\">a contract<\/mark> <mark class=\"same\">are contractual<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">But Konrad has no contract with Lumiere SG: cl 11 is in his contract with the parent.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "C2.2.1", "title": "Express Choice: Virtually Conclusive", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Peh Teck Quee<\/i>, applying <i>Vita Food<\/i>,<\/mark> <mark class=\"new\">cl 11<\/mark><mark class=\"same\">'s choice of<\/mark> <mark class=\"new\">Charltonian law<\/mark> <mark class=\"same\">is virtually conclusive unless not (a) bona fide, (b) legal, or (c) consistent with public policy<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Nothing suggests bad faith, so Charltonian law governs all of Lumiere SG's claims.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "An express choice is virtually conclusive only between the contracting parties. Lumiere SG is not a party to the employment contract, so cl 11 does not reach its claims."}, {"letter": "D", "code": "C3.6.5", "title": "Party Autonomy in Tort", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Konrad<\/mark> <mark class=\"same\">argues<\/mark> <mark class=\"new\">cl 11 (\"all claims arising from this employment\")<\/mark> <mark class=\"same\">applies<\/mark> <mark class=\"new\">Charltonian law<\/mark> <mark class=\"same\">to<\/mark> <mark class=\"new\">the conspiracy<\/mark><mark class=\"same\">, an open question (<i>Ong Ghee Soon<\/i>), though \"just a small step away\" (C&amp;Y).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">But a choice can bind only those who made it: Lumiere SG and Zenobia never agreed to cl 11.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Answers Konrad's argument on the conspiracy: whether a contract's law can govern a tort is open, but Lumiere SG and Zenobia never agreed to cl 11. One line."}, {"letter": "E", "code": "C1.1.2", "title": "Framing the Cause of Action", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Rickshaw<\/i>, absent bad faith<\/mark> <mark class=\"new\">Lumiere SG<\/mark> <mark class=\"same\">may frame its claim most advantageously, tort liability being concurrent (<i>Henderson v Merrett<\/i>)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">However, per <i>Rickshaw<\/i>,<\/mark> <mark class=\"new\">a fiduciary claim<\/mark> <mark class=\"same\">rooted in<\/mark> <mark class=\"new\">an employment contract<\/mark> <mark class=\"same\">is usually characterised as contractual (C1.1.5)<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">Konrad says every claim is rooted in his employment.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Konrad's best point: equitable claims rooted in a contract follow it. But there is no contract between Konrad and Lumiere SG to root them in."}, {"letter": "F", "code": "C3.11", "title": "Directors' Duties; Unjust Enrichment", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Directors' duties: the law of<\/mark> <mark class=\"new\">Singapore, Lumiere SG's place of incorporation<\/mark> <mark class=\"same\">(<i>Focus Energy<\/i>), which<\/mark> <mark class=\"new\">cl 11<\/mark> <mark class=\"same\">cannot vary (<i>Base Metal Trading<\/i>).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">per Dicey Rule 230 (adopted), the proper law of<\/mark> <mark class=\"new\">the obligation to repay<\/mark><mark class=\"same\">: (a)<\/mark> <mark class=\"new\">any related contract's proper law<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">else (c)<\/mark> <mark class=\"new\">the place of enrichment, Xalarat<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">No contract between Lumiere SG and Konrad underlies the payment, so (c) applies; he knew, so he must repay.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "C3.4", "title": "Local Torts", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Rickshaw<\/i>, rejecting <i>Metall<\/i>'s English-law-only rule as \"unduly parochial\" and contrary to comity,<\/mark> <mark class=\"new\">a conspiracy<\/mark> <mark class=\"same\">in Singapore still runs both limbs, both pointing to<\/mark> <mark class=\"new\">Singapore law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Point of difference: the exception may apply<\/mark> <mark class=\"new\">Charltonian law<\/mark> <mark class=\"same\">where<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">is purely fortuitous<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">It is not: the agreement, the acts and the loss were all in Singapore.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "C-08.2", "side": "C", "hyp": 8, "n": 2, "source": "Mock Paper 8, Hypo 16", "title": "Lumiere SG v Konrad", "full": "Mock Paper 8, Hypo 16", "q": "<p>Assume the Singapore court will assume jurisdiction, and that Singapore law governs each of Lumiere SG's claims.<\/p><p>Lumiere Family Office Pte Ltd (Lumiere SG), a Singapore wealth manager, is suing Konrad, one of its directors, in Singapore for breach of fiduciary duty (secret commissions and diverting clients), breach of confidence and conspiracy. Konrad was seconded to Singapore by Lumiere SG's Charltonian parent, Lumiere AG, which employs him under a contract governed by Charltonian law. Clause 12 of that contract reads: \"The Employee shall not be liable for any loss caused by him unless it is caused by his gross negligence.\" Konrad signed no contract with Lumiere SG.<\/p><p>Lumiere SG discovered the wrongdoing in February 2024 but did not act while it negotiated with Konrad; it sued in June 2026. In a letter sent from Charltonia in 2023, Lumiere AG's chairman promised Konrad that he would never be pursued for \"anything done in Singapore\", and Konrad says he relied on it.<\/p><p>Konrad says that: (i) clause 12 is a complete defence, as he was not grossly negligent, whatever the claims are called; (ii) the claims are time-barred under Charltonian law, and in any event Lumiere SG delayed unreasonably; and (iii) the letter bars the claims. Under Charltonian law, a claim against an employee must be brought within two years of discovery. Under Singapore law, the contract and tort claims are in time, and there is no statutory period for the fiduciary claim. Under Charltonian law, the letter binds Lumiere AG but not Lumiere SG; under Singapore law, it may give rise to a promissory estoppel against both. Advise Lumiere SG.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Three defences that all depend on a contract Lumiere SG never signed. Once Singapore law governs the claims, each defence has to find its own way in, and none does.<\/p>\n<p><strong>Time: C1.5.2.<\/strong> Under the FLPA only the lex causae's limitation law applies, including to equitable claims. Singapore law governs, so Charltonia's two-year period is irrelevant.<\/p>\n<p><strong>Cl 12: C3.8.2.<\/strong> Cl 12 is in Konrad's contract with the parent. A non-party cannot be bound by it, and deliberate wrongs such as secret commissions are not within a gross negligence exemption anyway.<\/p>\n<p><strong>The letter: C3.11.<\/strong> Promissory estoppel on a contractual obligation follows the contract's proper law. As to the employment contract, Charltonian law makes the letter bind Lumiere AG only. Under Singapore law it might found an estoppel, but Konrad's own dishonesty defeats it.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not reach for the common law extinguish-or-bar test. The FLPA applies the governing law's limitation rules, and that law is Singapore's.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Singapore law governs the claims, so under the FLPA Charltonia's two-year period does not apply and the fiduciary claim faces only Singapore's equitable doctrines, under which 28 months of negotiation is not fatal; cl 12 is in Konrad's contract with the parent and cannot bind Lumiere SG, nor would it cover deliberate wrongs; and the chairman's letter binds only Lumiere AG under Charltonian law, while any Singapore estoppel fails for Konrad's dishonesty.<\/blockquote>", "items": [{"letter": "A", "code": "C1.5.1", "title": "Common Law: Extinguish v Bar", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>BBA v BAZ<\/i>, a statute extinguishing the right is substantive, following<\/mark> <mark class=\"new\">Charltonian law<\/mark><mark class=\"same\">, but one barring the remedy is procedural<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Charltonia's two-year rule extinguishes the claim, so it applies whatever law governs.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "That test is superseded. Under the FLPA, the limitation rules of the governing law apply, and the governing law is Singapore's."}, {"letter": "B", "code": "C1.5.5", "title": "Equitable Claims and Laches", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Unlike s 4(3) UK FLPA 1984, the FLPA has no laches carve-out, consistent with COL for equity (Rickshaw), so<\/mark> <mark class=\"new\">Singapore law<\/mark><mark class=\"same\">'s time bar applies to<\/mark> <mark class=\"new\">the fiduciary claim<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Under Singapore law, 28 months spent partly negotiating is not fatal delay.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Answers the delay point: there is no separate laches carve-out, so Singapore's equitable rules apply, and negotiating for 28 months is not fatal. A line after C1.5.2."}, {"letter": "C", "code": "C1.5.2", "title": "FLPA: General Rule", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 3(1) FLPA, only<\/mark> <mark class=\"new\">the lex causae<\/mark><mark class=\"same\">'s limitation law applies<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">Here that is Singapore law, so Charltonia's two years is irrelevant.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">(applies equally to equitable claims)<\/mark> <mark class=\"new\">So the fiduciary claim is covered too.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "C1.5.4", "title": "Undue Hardship (s 4(2))", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 4(2) FLPA,<\/mark> <mark class=\"new\">Charltonia's two-year period<\/mark> <mark class=\"same\">is contrary to public policy if it causes<\/mark> <mark class=\"new\">Lumiere SG<\/mark> <mark class=\"same\">undue hardship.<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Needed only if Charltonian law governed, and weak, since Lumiere SG chose to negotiate.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Relevant only if Charltonian law governed, and weak, since Lumiere SG chose to negotiate. One line in the alternative."}, {"letter": "E", "code": "C1.1.2", "title": "Framing the Cause of Action", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Rickshaw<\/i>, absent bad faith<\/mark> <mark class=\"new\">Lumiere SG<\/mark> <mark class=\"same\">may frame its claim most advantageously, tort liability being concurrent (<i>Henderson v Merrett<\/i>)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Konrad's \"whatever the claims are called\" point fails anyway: there is no contract between him and Lumiere SG to frame around.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Konrad says cl 12 applies however the claims are framed, but there is no contract between him and Lumiere SG to frame around. A supporting line."}, {"letter": "F", "code": "C3.8.2", "title": "Exemption Clause and Non-Parties", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Non-Party Reliance:<\/mark> <mark class=\"new\">a contracting party<\/mark> <mark class=\"same\">cannot invoke<\/mark> <mark class=\"new\">cl 12 against a non-party<\/mark> <mark class=\"same\">unless<\/mark> <mark class=\"new\">the proper law<\/mark> <mark class=\"same\">allows it (Ong Ghee Soon).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Lumiere SG is not a party to cl 12, and deliberate wrongs like secret commissions are not within a gross negligence exemption anyway.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "C3.11", "title": "Promissory Estoppel", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Slide Questions:<\/mark> <mark class=\"new\">promissory estoppel<\/mark> <mark class=\"same\">on<\/mark> <mark class=\"new\">the chairman's letter<\/mark> <mark class=\"same\">follows the contract's proper law<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">As to the employment contract, that is Charltonian law, which binds Lumiere AG only; under Singapore law, Konrad's own dishonesty defeats it.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "C-08.3", "side": "C", "hyp": 8, "n": 3, "source": "Mock Paper 8, Hypo 16", "title": "Lumiere SG v Konrad", "full": "Mock Paper 8, Hypo 16", "q": "<p>Assume the Singapore court will assume jurisdiction, and that Singapore law governs the fiduciary claim.<\/p><p>Konrad, a director of Lumiere Family Office Pte Ltd (Lumiere SG), a Singapore wealth manager, caused a trust settled in Singapore by Mrs Chua, a Lumiere SG client, with Lumiere SG as trustee, to invest in a fund run by his friend, and took a secret commission of US$2 million for doing so. The trust deed is expressly governed by Singapore law. The commission was paid into Konrad's bank account in Xalarat, and he used it to buy an apartment in Elbonia. Konrad is employed by Lumiere SG's Charltonian parent under a contract governed by Charltonian law, and Charltonian law has no law of trusts.<\/p><p>Lumiere SG sues Konrad in Singapore for breach of fiduciary duty and seeks a declaration that the Elbonian apartment is held on constructive trust for it. Konrad says that a constructive trust is not available under Charltonian law. Under Elbonian law, a constructive trust cannot be recognised over Elbonian land, but a court may order a person to transfer land he bought with another's money. Advise Lumiere SG.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A remedy question in three layers: which law governs the claim, whether that law gives a trust, and what the law of the land's location allows.<\/p>\n<p><strong>Foundation: C1.1.5.<\/strong> The fiduciary claim rests on Konrad's directorship and Lumiere SG's trusteeship, not on his Charltonian employment contract, so Singapore law governs it.<\/p>\n<p><strong>The remedy: C1.3.1.<\/strong> Remedies follow the law governing the claim (<i>Goh Suan Hee<\/i>; <i>Rappo<\/i>). Singapore law gives a constructive trust over the proceeds of a secret commission, so Charltonian law's lack of trusts is irrelevant.<\/p>\n<p><strong>The apartment: C3.11.<\/strong> For a constructive trust over land, C&amp;Y prefer the lex situs, and Elbonian law will not recognise one over Elbonian land. So ask for the functional equivalent: a personal order that Konrad transfer the apartment, which Elbonian law itself recognises.<\/p>\n<p><strong>Trap to avoid.<\/strong> Konrad's employment contract chooses Charltonian law, but that contract is with the parent and does not govern Lumiere SG's claim or its remedies.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The fiduciary claim rests on Konrad's directorship and Lumiere SG's trusteeship, so Singapore law governs it and its remedies, and Charltonian law's lack of trusts is irrelevant; but a constructive trust over Elbonian land is for Elbonian law as the lex situs, which will not recognise one, so Lumiere SG should seek a personal order that Konrad transfer the apartment, with a freezing order meanwhile.<\/blockquote>", "items": [{"letter": "A", "code": "C1.6.3", "title": "Limits on the Presumption", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Intrusive relief: per EFT Holdings explaining OMG Holdings, no<\/mark> <mark class=\"new\">order about land in Elbonia<\/mark> <mark class=\"same\">on a bare presumption<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Lumiere SG should prove the Elbonian transfer remedy, not rely on similarity.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "An order about land abroad will not be made on a bare presumption of similarity, so Lumiere SG should prove the Elbonian remedy. Practical, not decisive."}, {"letter": "B", "code": "C2.2.1", "title": "Express Choice of Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Peh Teck Quee<\/i>, applying <i>Vita Food<\/i>,<\/mark> <mark class=\"new\">Konrad's employment contract<\/mark><mark class=\"same\">'s choice of<\/mark> <mark class=\"new\">Charltonian law<\/mark> <mark class=\"same\">is virtually conclusive<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Charltonian law, which has no trusts, governs the remedy.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The employment contract's choice of Charltonian law binds Konrad and Lumiere AG. It does not govern Lumiere SG's fiduciary claim, which rests on a different foundation."}, {"letter": "C", "code": "C3.11", "title": "Trusts and the Situs", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Trusts:<\/mark> <mark class=\"new\">express trusts<\/mark> <mark class=\"same\">follow<\/mark> <mark class=\"new\">the settlor's chosen law, here Singapore law,<\/mark> <mark class=\"same\">or closest connection<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">for<\/mark> <mark class=\"new\">a constructive trust over the apartment<\/mark><mark class=\"same\">, C&amp;Y prefer<\/mark> <mark class=\"new\">the lex situs, Elbonian law,<\/mark> <mark class=\"same\">to<\/mark> <mark class=\"new\">the law of the event<\/mark> <mark class=\"same\">(Rappo).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Elbonian law will not recognise a trust over Elbonian land, so ask for a personal order to transfer instead.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "C1.3.1", "title": "Final Remedies", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Goh Suan Hee<\/i>, it is \"untenable in principle to separate remedy from rights\", so<\/mark> <mark class=\"new\">Singapore law<\/mark> <mark class=\"same\">decides whether, and what kind of,<\/mark> <mark class=\"new\">remedy<\/mark> <mark class=\"same\">lies for<\/mark> <mark class=\"new\">Lumiere SG<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Synthesis: Functional Equivalent: Per C&amp;Y,<\/mark> <mark class=\"new\">Singapore law<\/mark> <mark class=\"same\">decides entitlement, but the court grants only remedies known to the lex fori<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Charltonian law's lack of trusts is irrelevant, as Charltonian law does not govern.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "C1.1.5", "title": "Legal Foundation", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently<\/mark> <mark class=\"new\">breach of fiduciary duty<\/mark> <mark class=\"same\">fits no category. Per <i>Rickshaw<\/i>, rejecting the Australian lex fori approach, COL centres on its legal foundation,<\/mark> <mark class=\"new\">Konrad's directorship and Lumiere SG's trusteeship<\/mark><mark class=\"same\">, by its \"nature and origins\" in<\/mark> <mark class=\"new\">the facts<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Not his Charltonian employment contract, to which Lumiere SG is not a party.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "C1.3.2", "title": "Interim Remedies", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y,<\/mark> <mark class=\"new\">a freezing order over Konrad's assets<\/mark> <mark class=\"same\">protects the court's own processes, so the lex fori governs its grant against<\/mark> <mark class=\"new\">Konrad<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Useful to stop a sale of the apartment while the action proceeds.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "A freezing order is for the lex fori and would stop Konrad selling the apartment meanwhile. Useful advice, but not the answer to the trust question."}, {"letter": "G", "code": "C2.7", "title": "Immovables", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Immovables:<\/mark> <mark class=\"new\">a contract to sell land<\/mark> <mark class=\"same\">follows this section, but<\/mark> <mark class=\"new\">any transfer's formalities<\/mark> <mark class=\"same\">follow the lex situs.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So a transfer ordered here must be carried out in Elbonia under Elbonian law.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Confirms that the formalities of any transfer follow the lex situs, so a transfer order must be carried out under Elbonian law. A supporting line."}]}, {"id": "C-09.1", "side": "C", "hyp": 9, "n": 1, "source": "Mock Paper 9, Hypo 18", "title": "GreenSeal v Verdant", "full": "Mock Paper 9, Hypo 18", "q": "<p>Assume the Singapore court has jurisdiction, and that no question of the validity of a foreign patent arises.<\/p><p>GreenSeal Technologies Pte Ltd, a Singapore company, developed an enzyme process that improves palm oil yields. It holds registered patents for the process in Singapore and in Buritania, but none in Suburbia. In 2021, GreenSeal and Verdant Agro Ltd, a Buritanian plantation company, signed a licence agreement in Buritania, under which all the licensed activities were to take place at Verdant's Buritanian sites and all payments were made there. Clause 7 grants Verdant a licence to use the process \"at all of Verdant's operations in the Region\"; \"Region\" is not defined. Clause 15 reads: \"All disputes arising out of or in connection with this agreement shall be governed by the law of the country in which the party commencing proceedings has its head office.\"<\/p><p>Verdant has used the process at its plantations in Buritania, at its refinery in Suburbia, and at a pilot plant it ran in Singapore for six months in 2025. GreenSeal sues Verdant in Singapore for infringement of its Singapore patent and of its Buritanian patent, each in respect of all three operations. Verdant pleads the licence. GreenSeal's counsel also wishes to argue that the double actionability rule should be abolished.<\/p><p>Floating choice of law clauses are valid under Buritanian, but not Singapore, conflict of laws rules. Under Buritanian contract law \"the Region\" means the whole of Southeast Asia, including all three countries; under Singapore contract law it is too uncertain to have any effect. Under Buritanian law, a licensee's use within the scope of its licence is a complete answer to any claim in tort. Advise GreenSeal and Verdant.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Two patents, three sites and a licence whose meaning depends on a floating clause. Draw the territorial grid first, then decide which law tests the licence.<\/p>\n<p><strong>The grid: C3.7.2.<\/strong> Patents are territorial. The Singapore patent is infringed only by the Singapore plant, a local tort. The Buritanian patent can be infringed only in Buritania, and that claim needs the exception to displace a fortuitous lex fori. Suburbia, with no patent, infringes nothing.<\/p>\n<p><strong>The licence's law: C2.2.5.<\/strong> By the lex fori cl 15 is void, so the OPL applies: Buritania (signing, sites, payment). By the OPL, Buritanian law validates cl 15, so GreenSeal, as the party suing, gets Singapore law. Argue both.<\/p>\n<p><strong>The licence's effect: C3.8.1.<\/strong> Its effect on tort liability is a tort question, and its validity a contract question for its proper law (<i>Galaxias<\/i>). Under Buritanian law \"the Region\" covers all three sites and the licence defeats every claim; under Singapore law the licence is void for uncertainty.<\/p>\n<p><strong>Trap to avoid.<\/strong> Never tick both limbs for a foreign patent infringed here or a Singapore patent infringed abroad. And check who benefits from reform: abolishing the lex fori limb helps only on the Buritanian patent.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Only the Singapore plant infringes the Singapore patent and only the Buritanian sites can infringe the Buritanian patent, which also needs the exception; whether Verdant's licence answers those claims depends on its proper law: Buritanian law if the floating clause is void under the lex fori, under which \"the Region\" covers every site, or Singapore law if the OPL validates the clause, under which the licence is void for uncertainty.<\/blockquote>", "items": [{"letter": "A", "code": "C3.10", "title": "Evaluation and Reform", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">the lex fori limb is \"parochial\" (<i>Red Sea<\/i>, quoting the Law Commission; C&amp;Y)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">per <i>Rickshaw<\/i>, reform is for Parliament, with a \"wise and judicious\" use of the exception meanwhile<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Abolishing the lex fori limb would help GreenSeal only on the Buritanian patent, the one claim that limb defeats.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Counsel's reform argument is for the Court of Appeal or Parliament (<i>Rickshaw<\/i>). Worth a line, noting that it helps GreenSeal only on the Buritanian patent."}, {"letter": "B", "code": "C3.7.2", "title": "Intellectual Property: Territoriality", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">per C&amp;Y, statutory<\/mark> <mark class=\"new\">patent<\/mark> <mark class=\"same\">rights are territorial: conduct abroad cannot infringe<\/mark> <mark class=\"new\">the Singapore patent<\/mark><mark class=\"same\">, nor conduct here<\/mark> <mark class=\"new\">the Buritanian patent<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">(i) Singapore right infringed abroad: fails both limbs, and<\/mark> <mark class=\"new\">Singapore law<\/mark> <mark class=\"same\">is not fortuitous for<\/mark> <mark class=\"new\">the Singapore patent<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">(iii) Foreign right infringed there:<\/mark> <mark class=\"new\">the Buritanian patent infringed in Buritania<\/mark> <mark class=\"same\">may succeed via the exception displacing<\/mark> <mark class=\"new\">a fortuitous Singapore law<\/mark><mark class=\"same\">, if<\/mark> <mark class=\"new\">jurisdiction is assumed<\/mark> <mark class=\"same\">(cf <i>Pearce v Ove Arup<\/i>).<\/mark><\/span><\/li><li><span class=\"n\">4<\/span><span class=\"tx\"><mark class=\"new\">Each patent: its own country's sites only.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "C2.2.8", "title": "Straight to the OPL", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Shanghai Turbo<\/i> and <i>The Iran Vojdan<\/i>, as<\/mark> <mark class=\"new\">GreenSeal and Verdant<\/mark> <mark class=\"same\">turned their minds to<\/mark> <mark class=\"new\">the law<\/mark> <mark class=\"same\">and failed<\/mark> <mark class=\"new\">(a floating clause)<\/mark><mark class=\"same\">, inferring a choice is \"artificial\", so go to Stage 3.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">At Stage 3, Buritania: the signing, the licensed sites and the payments are all there.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The bridge once cl 15 fails under the lex fori: skip Stage 2 and go to the OPL, Buritania. One line within the C2.2.5 analysis."}, {"letter": "D", "code": "C3.8.1", "title": "Contract Relied on to Negate the Tort", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y (North), (i) the effect of<\/mark> <mark class=\"new\">the licence<\/mark> <mark class=\"same\">on tort liability is a tort question for double actionability, and (ii) its validity a contract question for<\/mark> <mark class=\"new\">the law cl 15 selects<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">A local tort<\/mark> <mark class=\"same\">itself runs double actionability, and for a tort in<\/mark> <mark class=\"new\">Buritania<\/mark> <mark class=\"same\">with<\/mark> <mark class=\"new\">this licence<\/mark><mark class=\"same\">, (i) follows the lex fori and<\/mark> <mark class=\"new\">Buritanian law<\/mark> <mark class=\"same\">and (ii)<\/mark> <mark class=\"new\">Buritanian law<\/mark> <mark class=\"same\">(North).<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Buritanian law: the licence covers all three sites; Singapore law: void.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "C3.6.2", "title": "Displacing the Lex Fori", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Red Sea<\/i>,<\/mark> <mark class=\"new\">GreenSeal<\/mark> <mark class=\"same\">may rely solely on<\/mark> <mark class=\"new\">Buritanian law<\/mark> <mark class=\"same\">though<\/mark> <mark class=\"new\">the Buritanian patent claim<\/mark> <mark class=\"same\">is unknown to the lex fori<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">per C&amp;Y, <i>Red Sea<\/i> would likely survive <i>Rickshaw<\/i>,<\/mark> <mark class=\"new\">Singapore<\/mark><mark class=\"same\">'s only link being<\/mark> <mark class=\"new\">the forum<\/mark><mark class=\"same\">, so<\/mark> <mark class=\"new\">Singapore law, for a Buritanian patent used in Buritania,<\/mark> <mark class=\"same\">may be fortuitous.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Needed for the Buritanian patent claim, where the exception displaces a fortuitous Singapore law (<i>Red Sea<\/i>; <i>Pearce<\/i>). C3.7.2 already routes you there."}, {"letter": "F", "code": "C3.3.4", "title": "Statutory Deeming: THPA", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 6(4) THPA 2014,<\/mark> <mark class=\"new\">Verdant's conduct in Buritania<\/mark> <mark class=\"same\">causing haze is actionable \"whether or not\" actionable abroad, so<\/mark> <mark class=\"new\">Verdant<\/mark> <mark class=\"same\">cannot rely on<\/mark> <mark class=\"new\">Buritanian law<\/mark> <mark class=\"same\">for<\/mark> <mark class=\"new\">its operations in Buritania<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So limb 2 is abrogated for GreenSeal's claims too.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The THPA abrogates limb 2 for haze claims only. Patent infringement runs ordinary double actionability, subject to territoriality."}, {"letter": "G", "code": "C2.2.5", "title": "Attack: Floating Proper Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">As contracts cannot exist \"in a legal vacuum\" (<i>Amin Rasheed<\/i>),<\/mark> <mark class=\"new\">cl 15<\/mark> <mark class=\"same\">applying<\/mark> <mark class=\"new\">the law of whichever party sues<\/mark> <mark class=\"same\">on<\/mark> <mark class=\"new\">the choice of who sues first<\/mark> <mark class=\"same\">is \"meaningless\" and of no legal effect (<i>Shanghai Turbo<\/i>)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">OPL (+): per Prof Chong, if<\/mark> <mark class=\"new\">Buritanian law, the OPL,<\/mark> <mark class=\"same\">permits floating clauses,<\/mark> <mark class=\"new\">cl 15<\/mark> <mark class=\"same\">is valid and<\/mark> <mark class=\"new\">Singapore law<\/mark> <mark class=\"same\">governs once<\/mark> <mark class=\"new\">GreenSeal sues first<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Lex fori: void, so Buritanian law; OPL: valid, so Singapore law. The licence turns on which.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "C-09.2", "side": "C", "hyp": 9, "n": 2, "source": "Mock Paper 9, Hypo 18", "title": "Marina v Verdant", "full": "Mock Paper 9, Hypo 18", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>Verdant Agro Ltd, a Buritanian company, owns large plantations in Buritania. In September 2025, contractors engaged by Verdant cleared land in Buritania by burning. For three weeks the smoke drifted over Singapore, and Marina Stay Pte Ltd, a Singapore hotel operator, lost a large number of bookings. Marina sues Verdant in Singapore under section 6 of the Transboundary Haze Pollution Act 2014 and, in the alternative, in negligence and nuisance at common law. Marina's counsel also wishes to argue, if necessary before the Court of Appeal, that the double actionability rule should be abolished because the lex fori limb is an anachronism.<\/p><p>Open burning for land clearance is lawful under Buritanian law, and Marina has no claim under Buritanian law on any basis. Marina's economic loss would be recoverable in negligence under Singapore law, but only if a Singapore court finds that Verdant owed it a duty of care. The conduct required for liability under section 6 is satisfied on the facts. Advise Marina.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A statute that removes the foreign-law limb for haze, set against common law claims that still need it. One route succeeds, the other fails on the law of the place where the fires were lit.<\/p>\n<p><strong>The Act: C3.3.4.<\/strong> Section 6(4) makes haze actionable whether or not it is actionable abroad, so Verdant cannot rely on Buritanian law. Marina suffered economic loss in Singapore, so it has standing under s 6(3), and the required conduct is made out. The claim succeeds.<\/p>\n<p><strong>Common law, location: C3.3.2.<\/strong> Negligence focuses on the act (<i>Vibrant Group<\/i>), so the tort is in Buritania, where the land was burned. Chong (seminar) puts haze claims there too.<\/p>\n<p><strong>Common law, limb 2: C3.3.3.<\/strong> Burning is lawful under Buritanian law and Marina has no claim there, so limb 2 fails. The flexible exception cannot help, because Buritania is not fortuitous.<\/p>\n<p><strong>Trap to avoid.<\/strong> Check who benefits from reform. Abolishing the lex fori limb would not help Marina, whose problem is the lex loci delicti limb.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Marina succeeds under s 6 of the Act, which makes the haze actionable whether or not it is actionable in Buritania; its common law claims in negligence and nuisance fail, because the tort was committed where the burning took place, Buritanian law permits the burning, and Buritania is not fortuitous; and abolishing the lex fori limb would not help Marina, whose problem lies in the other limb.<\/blockquote>", "items": [{"letter": "A", "code": "C3.3.2", "title": "Negligence: Focus on the Act", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Vibrant Group<\/i>, the place of<\/mark> <mark class=\"new\">the burning<\/mark> <mark class=\"same\">prevails, so<\/mark> <mark class=\"new\">the land clearing<\/mark> <mark class=\"same\">performed in<\/mark> <mark class=\"new\">Buritania<\/mark> <mark class=\"same\">locates the tort there despite<\/mark> <mark class=\"new\">the lost bookings<\/mark> <mark class=\"same\">in Singapore.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So the common law claims are torts committed in Buritania.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "C3.4", "title": "Local Torts", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Rickshaw<\/i>, rejecting <i>Metall<\/i>'s English-law-only rule as \"unduly parochial\" and contrary to comity,<\/mark> <mark class=\"new\">haze damage<\/mark> <mark class=\"same\">in Singapore still runs both limbs, both pointing to<\/mark> <mark class=\"new\">Singapore law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The bookings were lost here, so the common law claims are local torts.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Negligence is located by the act, not by where loss was felt (<i>Vibrant Group<\/i>), and the burning was in Buritania. Arguing damage here under <i>Metall<\/i> is a long shot."}, {"letter": "C", "code": "C3.2", "title": "Limb 1: Lex Fori", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>IM Skaugen<\/i>, ask whether<\/mark> <mark class=\"new\">the burning and the haze<\/mark><mark class=\"same\">, if all done in Singapore, would be<\/mark> <mark class=\"new\">negligence or nuisance<\/mark><mark class=\"same\">, so limb 1<\/mark> <mark class=\"new\">is satisfied only if a duty of care is found<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The THPA claim supplies limb 1 by statute in any event.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "For the common law claims, limb 1 depends on a duty of care, which is uncertain; the Act supplies limb 1 by statute. A supporting line."}, {"letter": "D", "code": "C3.10", "title": "Evaluation and Reform", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">the lex fori limb is \"parochial\" (<i>Red Sea<\/i>, quoting the Law Commission; C&amp;Y)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">But Marina's problem is the lex loci delicti limb, so abolishing the lex fori limb would not help it.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Counsel's argument, answered: reform is for the Court of Appeal or Parliament, and removing the lex fori limb would not help Marina anyway. A line."}, {"letter": "E", "code": "C3.6.3", "title": "Displacing the Lex Loci Delicti", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Rickshaw Caveat (−): per C&amp;Y, a road accident's place is rarely fortuitous<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">nor is the place where the burning was done.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So the exception cannot rescue the common law claims.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Marina might ask the court to displace Buritanian law, but the place where the fires were lit is not fortuitous. A line to close it off."}, {"letter": "F", "code": "C3.3.3", "title": "Limb 2 Fails", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Buritanian law permits open burning and gives Marina no claim<\/mark><mark class=\"same\">, so<\/mark> <mark class=\"new\">Verdant<\/mark> <mark class=\"same\">escapes unless<\/mark> <mark class=\"new\">Buritanian law<\/mark> <mark class=\"same\">is displaced (C3.6.3).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So the common law claims fail on limb 2.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "C3.3.4", "title": "THPA: Limb 2 Abrogated", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 6(4) THPA 2014,<\/mark> <mark class=\"new\">Verdant's burning in Buritania<\/mark> <mark class=\"same\">causing haze is actionable \"whether or not\" actionable abroad, so<\/mark> <mark class=\"new\">Verdant<\/mark> <mark class=\"same\">cannot rely on<\/mark> <mark class=\"new\">Buritanian law<\/mark> <mark class=\"same\">for<\/mark> <mark class=\"new\">the burning<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Standing: per s 6(3),<\/mark> <mark class=\"new\">Marina, suffering economic loss<\/mark> <mark class=\"same\">in Singapore sues, still proving<\/mark> <mark class=\"new\">the statutory tort<\/mark> <mark class=\"same\">under Singapore law.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "C-09.3", "side": "C", "hyp": 9, "n": 3, "source": "Mock Paper 9, Hypo 18", "title": "GreenSeal and Mr Surya v Verdant", "full": "Mock Paper 9, Hypo 18", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>GreenSeal Technologies Pte Ltd, a Singapore company whose name is well known for its enzyme products in Singapore and Suburbia, licensed its process to Verdant Agro Ltd, a Buritanian company. Verdant has sold its palm oil in Singapore and Suburbia under the name \"GreenSeal Gold\", and consumers have believed that it is connected with GreenSeal. GreenSeal sues Verdant in Singapore for passing off in Singapore and Suburbia, with an injunction restraining sales under the name in both countries.<\/p><p>Separately, during a palm oil conference in Singapore, Verdant's chauffeur negligently drove the company car into Mr Surya, a Buritanian agronomist employed by Verdant, who was crossing the road outside the conference hotel. Both had flown in for the conference, and both live in Buritania. Mr Surya sues Verdant in Singapore in negligence. His employment contract is governed by Buritanian law. Verdant says the claim is really a Buritanian one and that Singapore's connection is an accident.<\/p><p>Passing off is actionable under Singapore law. Suburbian law has no tort of passing off, but its Consumer Code gives a trader a civil claim for compensation and an injunction against the deceptive use of its name. Neither party has yet pleaded or proved Suburbian law. Under Buritanian law, an employee cannot sue an employer in tort for an injury at work, but has a no-fault state compensation claim worth about one fifth of what a Singapore court would award. Mr Surya's claim would otherwise succeed under Singapore law. Advise GreenSeal and Mr Surya.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A tort committed in two countries, where one country's law has not been proved, and a road accident in Singapore between two foreigners. Locate each tort, then ask what proof each remedy needs.<\/p>\n<p><strong>Passing off: C3.7.2.<\/strong> Passing off is a common law tort, so territoriality is no bar. Sales in Singapore are a local tort and GreenSeal succeeds. Sales in Suburbia are a tort there, where the Consumer Code gives a civil claim, enough for limb 2.<\/p>\n<p><strong>Proof: C3.5.<\/strong> Neither side has pleaded Suburbian law, so Singapore law applies by default and GreenSeal can recover damages for Suburbia. But an injunction against conduct in Suburbia needs Suburbian law proved (<i>OMG Holdings<\/i>).<\/p>\n<p><strong>Mr Surya: C3.4.<\/strong> The accident happened in Singapore, so both limbs point to Singapore law (<i>Rickshaw<\/i>). Verdant must show Singapore is purely fortuitous, and the place of an accident rarely is. Mr Surya wins.<\/p>\n<p><strong>Trap to avoid.<\/strong> Buritanian law's bar on employee claims matters only if Buritania is the place of the tort or displaces Singapore law. It is neither.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Passing off in Singapore is a local tort and succeeds, and GreenSeal can recover for Suburbia under Singapore law while Suburbian law is unpleaded, but it needs Suburbian law proved for an injunction there; Mr Surya's accident is a Singapore tort governed by Singapore law on both limbs, and Singapore is not so fortuitous that Buritanian law should displace it, so he recovers full damages.<\/blockquote>", "items": [{"letter": "A", "code": "C3.4", "title": "Local Torts", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Rickshaw<\/i>, rejecting <i>Metall<\/i>'s English-law-only rule as \"unduly parochial\" and contrary to comity,<\/mark> <mark class=\"new\">negligent driving<\/mark> <mark class=\"same\">in Singapore still runs both limbs, both pointing to<\/mark> <mark class=\"new\">Singapore law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Point of difference: the exception may apply<\/mark> <mark class=\"new\">Buritanian law<\/mark> <mark class=\"same\">where<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">is purely fortuitous<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">The place of an accident is rarely fortuitous, so Singapore law stays.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "C3.3.3", "title": "Limb 2 Fails", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Buritanian law bars an employee's tort claim against an employer<\/mark><mark class=\"same\">, so<\/mark> <mark class=\"new\">Verdant<\/mark> <mark class=\"same\">escapes unless<\/mark> <mark class=\"new\">Buritanian law<\/mark> <mark class=\"same\">is displaced (C3.6.3).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Mr Surya is left with the no-fault state scheme.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Buritania is not the place of Mr Surya's tort; Singapore is. Buritanian law could matter only through the flexible exception, which fails."}, {"letter": "C", "code": "C3.7.2", "title": "Passing Off", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Passing Off: a common law tort, so<\/mark> <mark class=\"new\">territoriality<\/mark> <mark class=\"same\">is no bar, but per <i>OMG Holdings<\/i><\/mark> <mark class=\"new\">an injunction<\/mark> <mark class=\"same\">against passing off in<\/mark> <mark class=\"new\">Suburbia<\/mark> <mark class=\"same\">needs<\/mark> <mark class=\"new\">Suburbian law<\/mark> <mark class=\"same\">proved (C3.5).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Singapore sales are a local tort, so GreenSeal succeeds there.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "C3.5", "title": "Unpleaded Foreign Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>EFT Holdings<\/i> (applying <i>Goh Chok Tong v Tang Liang Hong<\/i>), pleading<\/mark> <mark class=\"new\">Suburbian law<\/mark> <mark class=\"same\">is voluntary, so if<\/mark> <mark class=\"new\">Verdant<\/mark> <mark class=\"same\">does not plead it, no conflicts issue arises<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Intrusive relief abroad: no<\/mark> <mark class=\"new\">injunction<\/mark> <mark class=\"same\">against<\/mark> <mark class=\"new\">sales in Suburbia<\/mark> <mark class=\"same\">on a bare presumption (OMG Holdings), explained by<\/mark> <mark class=\"new\">the relief sought<\/mark> <mark class=\"same\">(EFT).<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">So GreenSeal can recover for Suburbia under Singapore law by default, but must prove Suburbian law for the injunction.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "C3.6.1", "title": "A Strict Test", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">per <i>Rickshaw<\/i>, it is \"imperative\" that<\/mark> <mark class=\"new\">the exception<\/mark> <mark class=\"same\">be strictly applied, favouring certainty over flexibility, so<\/mark> <mark class=\"new\">Verdant<\/mark> <mark class=\"same\">needs<\/mark> <mark class=\"new\">clear fortuity<\/mark><mark class=\"same\">, not<\/mark> <mark class=\"new\">a more favourable law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Two Buritanians at a Singapore conference is not enough.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Verdant's fortuity argument fails on <i>Rickshaw<\/i>'s strict test: a more favourable law is not enough. A line after C3.4."}, {"letter": "F", "code": "C1.6.3", "title": "Default Rule", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Brownlie<\/i>, if neither party pleads<\/mark> <mark class=\"new\">Suburbian law<\/mark><mark class=\"same\">, Singapore law applies in its own right (adversarial procedure, arguably tacit agreement), not by presumption.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">That covers the damages claim for Suburbia, but not the injunction.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "States the default rule for the unpleaded Suburbian law. C3.5 adds the limit on injunctions, which is the point here."}, {"letter": "G", "code": "C3.6.5", "title": "Party Autonomy in Tort", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Verdant<\/mark> <mark class=\"same\">argues<\/mark> <mark class=\"new\">Mr Surya's Buritanian-law employment contract<\/mark> <mark cla
