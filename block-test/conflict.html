ss=\"same\">applies<\/mark> <mark class=\"new\">Buritanian law<\/mark> <mark class=\"same\">to<\/mark> <mark class=\"new\">the road accident<\/mark><mark class=\"same\">, an open question (<i>Ong Ghee Soon<\/i>), though \"just a small step away\" (C&amp;Y).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">But <i>Rickshaw<\/i> declined to apply an employment contract's law to a separate tort.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Verdant may say the employment contract's Buritanian law governs, but <i>Rickshaw<\/i> declined to do that for a separate tort. One line."}]}, {"id": "C-10.1", "side": "C", "hyp": 10, "n": 1, "source": "Mock Paper 10, Hypo 20", "title": "Acacia v Growers", "full": "Mock Paper 10, Hypo 20", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>Acacia Foods Pte Ltd, a Singapore company, makes chocolate at its factory in Utopia. Cacao Growers Ltd, a Ruritanian company, grows cocoa in Ruritania. In January 2024, Acacia sent Growers a purchase order for 10,000 tonnes of organic cocoa beans, to be shipped over two years from Ruritania to Acacia's Utopian factory, with payment into Growers' bank account in Suburbia. The purchase order states: \"This contract is governed by Singapore law.\" Growers replied with a sales confirmation on the same commercial terms, stating: \"In the event of a dispute, Ruritanian law governs if Growers commences the action and Singapore law governs if Acacia commences the action.\" Neither party responded further, and shipments began. All the negotiations took place in Suburbia, where the parties' agents are based.<\/p><p>At a meeting in Suburbia before the order, Growers' sales director told Acacia's buyer that all Growers' beans were certified organic. The buyer e-mailed this to Acacia's board in Singapore, which approved the purchase there. The beans were uncertified. Both documents contain a term that the seller gives no warranty and accepts no liability for any statement about the origin of goods, whether in contract or tort. On 1 January 2025, Ruritania banned all cocoa exports to Utopia, and Growers stopped shipping.<\/p><p>Acacia sues Growers in Singapore for damages in the tort of misrepresentation. Under Singapore contract law a contract is concluded on the terms of the last document sent; under Ruritanian contract law the first document prevails if the terms conflict. Floating choice of law clauses are valid under Ruritanian, but not Singapore, conflict of laws rules. The statement is actionable as a misrepresentation under Singapore and Suburbian tort law, but not Ruritanian tort law. The exclusion term is valid under Ruritanian and Suburbian law, but not Singapore law, as it fails the requirement of reasonableness; it may be raised as a defence to a tort claim under all relevant laws. Advise Acacia on the law governing the contract and whether its misrepresentation claim survives the exclusion term.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A battle of forms in which one form floats, and an exclusion term that both forms contain. Fix the proper law first, because the exclusion term's validity follows it.<\/p>\n<p><strong>Battle of forms: C2.6.<\/strong> Each clause would validate itself, and choosing between them by a putative law makes no sense (<i>Dornoch<\/i>). On Yeo's map, the order's Singapore clause fails under Singapore's last-shot rule, and the confirmation's Ruritanian limb fails under Ruritania's first-shot rule.<\/p>\n<p><strong>The floating limb: C2.2.5.<\/strong> What is left is a floating clause: invalid by the lex fori, and valid only if the OPL permits it, so the law would depend on who sues. No stable choice survives (cf Art 6(1)(b) of the Hague Principles), so go to the OPL: Ruritania, where the seller performs.<\/p>\n<p><strong>The exclusion term: C3.8.2.<\/strong> Both forms contain it, so it is agreed. It can be raised against a tort claim under all laws, so admissibility is met even on the preferred view. Validity is for the proper law, Ruritanian law, under which the term is valid: the claim fails.<\/p>\n<p><strong>Trap to avoid.<\/strong> Singapore's reasonableness rule does not override a foreign proper law unless it is a mandatory rule, and s 27(2) UCTA is not engaged. Acacia wins only if Singapore law is the proper law.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Neither form's choice of law survives the battle of forms, and the confirmation's floating limb gives no stable choice, so the objective proper law, most likely Ruritanian law, governs; the exclusion term is admissible against the tort claim under every law and valid under that proper law, so Acacia's misrepresentation claim fails unless it can show that Singapore law governs the contract.<\/blockquote>", "items": [{"letter": "A", "code": "C2.6", "title": "Battle of Forms", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Acacia<\/mark><mark class=\"same\">'s<\/mark> <mark class=\"new\">Singapore law clause<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">Growers' floating clause<\/mark> <mark class=\"same\">may each validate themselves, and \"it makes no sense to decide which one to choose by any putative law\" (<i>Dornoch<\/i>).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Yeo (deadlock overstated): map each law's<\/mark> <mark class=\"new\">first shot / last shot<\/mark> <mark class=\"same\">rule; both clauses apply only where each validates itself; where neither survives, use<\/mark> <mark class=\"new\">the putative OPL<\/mark><mark class=\"same\">, then<\/mark> <mark class=\"new\">the lex fori, if Lew allows<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Each clause largely fails by its own law.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "C1.7", "title": "Forum Mandatory Rules: s 27(2) UCTA", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">per s 27(2) UCTA, UCTA applies despite<\/mark> <mark class=\"new\">the foreign proper law<\/mark> <mark class=\"same\">if (a)<\/mark> <mark class=\"new\">the term<\/mark> <mark class=\"same\">was imposed wholly or mainly to evade it, or (b)<\/mark> <mark class=\"new\">a party<\/mark> <mark class=\"same\">dealt as consumer while habitually resident here<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Neither applies: the term was not imposed to evade UCTA, and Acacia is a company, not a consumer.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Answers Acacia's hope that Singapore's reasonableness rule applies anyway: s 27(2) needs evasion or a consumer, and there is neither."}, {"letter": "C", "code": "C2.4.3", "title": "Weighting at Stage 3", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per Prof Chong, the strongest argument is usually<\/mark> <mark class=\"new\">the place where both perform, but they perform apart: Growers in Ruritania, Acacia by paying in Suburbia<\/mark><mark class=\"same\">, so<\/mark> <mark class=\"new\">Ruritanian law<\/mark> <mark class=\"same\">is the OPL.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, <i>Pacific Recreation<\/i>'s \"equal weight\" dictum is puzzling, as<\/mark> <mark class=\"new\">the place of performance<\/mark> <mark class=\"same\">carries great weight<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Argue Suburbia, the place of negotiation, agents and payment, in the alternative.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Needed to finish the proper law: the parties perform apart, so weigh the seller's performance in Ruritania against negotiation, agents and payment in Suburbia. The term is valid under both, so the result is the same."}, {"letter": "D", "code": "C2.10.5", "title": "Ralli: The Export Ban", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ralli Brothers<\/i>,<\/mark> <mark class=\"new\">shipping beans after Ruritania's export ban<\/mark> <mark class=\"same\">is unenforceable in so far as unlawful at<\/mark> <mark class=\"new\">the contractual place of performance<\/mark><mark class=\"same\">, whatever<\/mark> <mark class=\"new\">Ruritanian law<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">(1) Independent rule (start here): per <i>Esben<\/i>, Dicey's rule rooted in comity<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">So the exclusion term never comes into play.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "<i>Ralli<\/i> goes to Acacia's non-delivery claim after the export ban. It has nothing to say about the misrepresentation claim or the exclusion term."}, {"letter": "E", "code": "C2.2.5", "title": "Attack: Floating Proper Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">As contracts cannot exist \"in a legal vacuum\" (<i>Amin Rasheed<\/i>),<\/mark> <mark class=\"new\">the confirmation's clause<\/mark> <mark class=\"same\">applying<\/mark> <mark class=\"new\">Ruritanian or Singapore law<\/mark> <mark class=\"same\">on<\/mark> <mark class=\"new\">who sues first<\/mark> <mark class=\"same\">is \"meaningless\" and of no legal effect (<i>Shanghai Turbo<\/i>)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">OPL (+): per Prof Chong, if<\/mark> <mark class=\"new\">Ruritanian law, as the OPL,<\/mark> <mark class=\"same\">permits floating clauses,<\/mark> <mark class=\"new\">the confirmation's clause<\/mark> <mark class=\"same\">is valid and<\/mark> <mark class=\"new\">Singapore law<\/mark> <mark class=\"same\">governs once<\/mark> <mark class=\"new\">Acacia sues first<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">No stable choice survives, so go to the OPL: Ruritania, where the seller's characteristic performance takes place.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "C3.8.2", "title": "Exemption Clause as a Defence to Tort", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">(1) admissibility is a tort question for double actionability, and (2) validity a contract question for<\/mark> <mark class=\"new\">the proper law<\/mark><mark class=\"same\">, so<\/mark> <mark class=\"new\">the exclusion term<\/mark><mark class=\"same\">, valid under<\/mark> <mark class=\"new\">Ruritanian law<\/mark><mark class=\"same\">, succeeds only if admissible under both<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">the place of the tort<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Admissible under all laws on the facts, so even the preferred view leaves only validity: Ruritanian law upholds the term, and the claim fails.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "C3.3.2", "title": "Locating the Misrepresentation", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>JIO Minerals<\/i> (tentatively, citing Yeo) and <i>Ong Ghee Soon<\/i>,<\/mark> <mark class=\"new\">a statement<\/mark> <mark class=\"same\">directed at<\/mark> <mark class=\"new\">Acacia<\/mark> <mark class=\"same\">and received and acted on in<\/mark> <mark class=\"new\">Singapore (the board)<\/mark> <mark class=\"same\">is a tort there, unless<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">is fortuitous.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Receipt and reliance split: the specific rule fails, so use<\/mark> <mark class=\"new\">the substance test: Suburbia or Singapore<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Both laws make it actionable, so the location matters little.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Locates the tort: receipt and reliance split, so the substance test points to Suburbia or Singapore. The statement is actionable under both, so this decides nothing; the exclusion term does."}]}, {"id": "C-10.2", "side": "C", "hyp": 10, "n": 2, "source": "Mock Paper 10, Hypo 20", "title": "Acacia v Growers", "full": "Mock Paper 10, Hypo 20", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>Acacia Foods Pte Ltd, a Singapore company, makes chocolate at its factory in Utopia. In January 2024, it contracted with Cacao Growers Ltd, a Ruritanian company, for 10,000 tonnes of cocoa beans to be shipped over two years from Ruritania to Acacia's factory in Utopia, with payment into Growers' bank account in Suburbia. Assume that the contract is governed by Ruritanian law. On 1 January 2025, Ruritania banned all cocoa exports to Utopia after a trade dispute. Growers stopped shipping at once and claims the price of beans already shipped. Acacia claims damages for non-delivery of the rest.<\/p><p>The ban would frustrate the contract under Singapore and Suburbian contract law. Under Ruritanian contract law, Growers would have to pay damages unless it had taken all steps to obtain an exemption, which it did not.<\/p><p>Advise Acacia on the effect of the ban. How, if at all, would your answer change if the ban had been announced in December 2023, before the contract was made, to take effect on 1 January 2025, and both parties had planned for the last shipments to leave through a neighbouring country so as to avoid it?<\/p>", "why": "<p><strong>What the question is testing.<\/strong> The same ban, at two different times. Imposed after contracting, it is a <i>Ralli<\/i> question about performance. Known at contracting and planned around, it is a <i>Foster<\/i> question about intention.<\/p>\n<p><strong>Actual facts: C2.10.5.<\/strong> On the <i>Esben<\/i> reading, performance illegal at the place of performance is unenforceable, so Acacia's non-delivery claim fails. On the <i>Peh Teck Quee<\/i> frustration reading, Ruritanian law governs and the contract is not frustrated, so Growers is liable. Prefer <i>Esben<\/i> (Chong). Export is performance, not a preparatory step. The price claim accrued before the ban and is unaffected.<\/p>\n<p><strong>Alternative facts: C2.10.3.<\/strong> Both parties planned at formation to route the last shipments round the ban. That is <i>Foster<\/i> with joint intention, so neither party can enforce as to those shipments. The act is contemplated in Ruritania, where the export starts (<i>Surewin<\/i>).<\/p>\n<p><strong>Routing: C2.10.1.<\/strong> <i>Ralli<\/i> looks to action, <i>Foster<\/i> to intention (<i>Magdeev<\/i>), and the timing of the ban decides which applies. <i>Esben<\/i> also catches initial illegality, while <i>Peh Teck Quee<\/i> declined <i>Ralli<\/i> where the ban pre-dated the contract.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not let the ban touch the price for shipments already made. Ask also whether the illegal part goes to the essence and whether earlier shipments can be severed (<i>Magdeev<\/i>).<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>On the actual facts, the ban engages Ralli: on the Esben reading Acacia's non-delivery claim fails, while on the frustration reading Ruritanian law keeps Growers liable, and the price of beans already shipped is unaffected; in the alternative scenario both parties intended at formation to evade a known ban, so Foster bars either from enforcing the contract as to the last shipments.<\/blockquote>", "items": [{"letter": "A", "code": "C2.10.5", "title": "Ralli: Export Ban", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ralli Brothers<\/i>,<\/mark> <mark class=\"new\">exporting beans from Ruritania after its ban<\/mark> <mark class=\"same\">is unenforceable in so far as unlawful at<\/mark> <mark class=\"new\">the contractual place of performance<\/mark><mark class=\"same\">, whatever<\/mark> <mark class=\"new\">Ruritanian law, the proper law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">(1) Independent rule (start here): per <i>Esben<\/i>, Dicey's rule rooted in comity, catching supervening and initial illegality alike<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">(2) Frustration (alternative): <i>Peh Teck Quee<\/i> leaned to it, declining <i>Ralli<\/i> where<\/mark> <mark class=\"new\">the ban pre-dated the contract<\/mark><mark class=\"same\">, so ask whether<\/mark> <mark class=\"new\">Ruritanian law<\/mark> <mark class=\"same\">frustrates or permits<\/mark> <mark class=\"new\">non-delivery without damages<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "C2.10.4", "title": "Lemenda", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Lemenda<\/i>,<\/mark> <mark class=\"new\">a cocoa sale<\/mark> <mark class=\"same\">under<\/mark> <mark class=\"new\">a Ruritanian-law contract<\/mark> <mark class=\"same\">is unenforced if contrary to both a forum policy founded on general morality and the same policy at<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Ruritania's trade policy now forbids it.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "<i>Lemenda<\/i> is for contracts contrary to a public policy shared by the forum and the place of performance, such as buying influence. A trade embargo is written law, which goes to <i>Ralli<\/i> or <i>Foster<\/i>."}, {"letter": "C", "code": "C2.10.3", "title": "Foster: The Planned Detour", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Foster v Driscoll<\/i> and <i>Regazzoni<\/i> (in Singapore, <i>Patriot v Lam Hong<\/i>; <i>Esben<\/i>), a contract whose real object and intention is<\/mark> <mark class=\"new\">routing the last shipments round the ban<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">is unenforceable<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Surewin<\/i>,<\/mark> <mark class=\"new\">the evasion<\/mark> <mark class=\"same\">must be contemplated within<\/mark> <mark class=\"new\">Ruritania<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">The export starts there, so it is.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">With joint intention, neither party can enforce as to those shipments.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "C2.10.7", "title": "Illegality as a Shield", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Esben<\/i>, ex dolo malo bars<\/mark> <mark class=\"new\">causes of action<\/mark><mark class=\"same\">, not defences; illegality is a shield, not a sword<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Growers relies on the ban defensively, against the non-delivery claim.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Growers uses the ban as a shield, which is allowed. It does not decide whether the ban bites."}, {"letter": "E", "code": "C2.4.3", "title": "Weighting at Stage 3", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per Prof Chong, the strongest argument is usually<\/mark> <mark class=\"new\">where both parties perform, but they perform apart: Growers in Ruritania, Acacia by paying in Suburbia<\/mark><mark class=\"same\">, so<\/mark> <mark class=\"new\">Ruritanian law<\/mark> <mark class=\"same\">is the OPL.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The proper law matters on the frustration reading: Suburbian law would frustrate, Ruritanian law would not.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The proper law matters on the frustration reading, since Suburbian law would frustrate the contract and Ruritanian law would not. Here it is assumed to be Ruritanian."}, {"letter": "F", "code": "C2.10.1", "title": "Foster v Ralli: Timing", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, breach of foreign written law<\/mark> <mark class=\"new\">planned at formation<\/mark> <mark class=\"same\">goes to Foster and<\/mark> <mark class=\"new\">arising in performance<\/mark> <mark class=\"same\">to Ralli<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">per <i>Magdeev<\/i>, \"<i>Ralli<\/i> looks to action, <i>Foster<\/i> <span class=\"gap\">…<\/span> to intention\".<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">So the timing of the ban decides: imposed after contracting, <i>Ralli<\/i>; known and planned around at contracting, <i>Foster<\/i>.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "C2.2.1", "title": "Express Choice of Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Peh Teck Quee<\/i>, applying <i>Vita Food<\/i>,<\/mark> <mark class=\"new\">a choice of Ruritanian law<\/mark> <mark class=\"same\">is virtually conclusive<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Peh Teck Quee<\/i>,<\/mark> <mark class=\"new\">Ruritanian law<\/mark> <mark class=\"same\">needs no connection (cf Art 2(4) Hague Principles)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">On the assumed facts, Ruritanian law governs.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The proper law is assumed, so one line at most."}]}, {"id": "C-10.3", "side": "C", "hyp": 10, "n": 3, "source": "Mock Paper 10, Hypo 20", "title": "Acacia v Growers", "full": "Mock Paper 10, Hypo 20", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>Acacia Foods Pte Ltd, a Singapore company, makes chocolate at its factory in Utopia. It buys cocoa beans from Cacao Growers Ltd, a Ruritanian company, for shipment from Ruritania to Utopia, with payment into Growers' bank account in Suburbia. Assume that the contract is governed by Ruritanian law. Acacia has not paid for beans already shipped, and Growers sues for the price.<\/p><p>To cut import duty, Acacia under-declared the value of the beans to the Utopian customs authorities on each shipment, which Growers knew about but took no part in. Under-declaration is a crime under Utopian law. Acacia also obtained a tax refund in Utopia by a false return on an unrelated product line. To obtain a Ruritanian export permit, Growers paid Mr Dao, a former Ruritanian minister, a fee to use his influence with the Trade Minister; Acacia knew and refunded half the fee to Growers under a side letter.<\/p><p>Contracts for the purchase of personal influence are against Ruritanian and Singapore public policy if the relevant acts are committed within the jurisdiction; under Utopian and Suburbian law, such contracts are valid wherever the acts are committed. Under Singapore law, neither the customs fraud nor the payment to Mr Dao is so closely connected to the contract as to prevent Growers or Acacia from enforcing it; under Ruritanian law, both are. Advise Acacia on whether these matters let it resist Growers' price claim.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Three wrongs of very different weight around one sale: a customs fraud that the seller knew of, an influence payment, and an unrelated tax fraud. Sort each into its route, then ask whether any of them reaches the price claim.<\/p>\n<p><strong>Customs fraud: C2.10.3.<\/strong> Acacia intended to break Utopian law, but Growers only knew and took no active part, and more authorities treat a seller in that position as innocent (<i>Dimplex Gems<\/i>). Duty is also incidental to a cocoa sale, so it is doubtful that the fraud is the contract's dominant object.<\/p>\n<p><strong>The Dao fee: C2.10.4.<\/strong> Influence-buying offends Ruritanian and Singapore policy where the influence is exerted (<i>Lemenda<\/i>), and here the proper law agrees, so the <i>Westacre<\/i> query does not arise. Whether a <i>Lemenda<\/i> breach is serious enough to taint is open (Chong).<\/p>\n<p><strong>Tainting: C2.10.6.<\/strong> Step 2 decides it. Under Singapore principles there is no sufficient connection; under Ruritanian principles, the proper law of the contract sued on, both wrongs taint it, so neither side could enforce. The unrelated tax refund has no connection at all.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not treat the customs fraud as a <i>Ralli<\/i> problem. The contract does not require under-declaration, so performance is not illegal at the place of performance.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The customs fraud does not bar Growers under Foster, as Growers only knew of it and duty is incidental to the sale, and the Dao fee is a Lemenda breach; whether either taints the price claim turns on whose principles decide connection: none under Singapore law, but under the Ruritanian proper law both do, in which case neither party can enforce; the unrelated tax fraud is irrelevant.<\/blockquote>", "items": [{"letter": "A", "code": "C2.10.3", "title": "Foster: Knowledge Without Participation", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Foster v Driscoll<\/i> and <i>Regazzoni<\/i> (in Singapore, <i>Patriot v Lam Hong<\/i>; <i>Esben<\/i>), a contract whose real object and intention is<\/mark> <mark class=\"new\">under-declaring the beans<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Utopia<\/mark> <mark class=\"same\">is unenforceable<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Mental state: per <i>Dimplex Gems<\/i>,<\/mark> <mark class=\"new\">Growers' mere knowledge<\/mark> <mark class=\"same\">does not disqualify<\/mark> <mark class=\"new\">Growers<\/mark><mark class=\"same\">; active participation is needed (doubting <i>Soetanto<\/i>).<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">And duty is incidental to a cocoa sale, so it is hardly the dominant object (<i>Magdeev<\/i>).<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "C2.10.4", "title": "Lemenda", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Lemenda<\/i>,<\/mark> <mark class=\"new\">Mr Dao's fee for influencing the Trade Minister<\/mark> <mark class=\"same\">under<\/mark> <mark class=\"new\">an arrangement made in Ruritania<\/mark> <mark class=\"same\">is unenforced if contrary to both a forum policy founded on general morality and the same policy at<\/mark> <mark class=\"new\">Ruritania, where the influence was exerted<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Lemenda as a Taint?: Per Prof Chong, whether<\/mark> <mark class=\"new\">a Lemenda breach<\/mark> <mark class=\"same\">meets the tainting threshold (C2.10.6)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "C2.10.1", "title": "Routing Starter", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Acacia<\/mark> <mark class=\"same\">pleads illegality against<\/mark> <mark class=\"new\">Growers' price claim<\/mark> <mark class=\"same\">via (A) the proper law, (B) forum international public policy, (C) Foster, (D) Lemenda, (E) Ralli, (F) tainting, or (G) reliance as a defence.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Customs fraud points to Foster, the Dao fee to Lemenda, and both to tainting.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The right opening, routing the customs fraud to <i>Foster<\/i>, the Dao fee to <i>Lemenda<\/i>, and both to tainting. It only routes you."}, {"letter": "D", "code": "C2.10.7", "title": "Illegality as a Shield", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Esben<\/i>, ex dolo malo bars<\/mark> <mark class=\"new\">causes of action<\/mark><mark class=\"same\">, not defences; illegality is a shield, not a sword<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Acacia may raise the illegality defensively, even though the customs fraud is its own.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Acacia raises the illegality as a defence, which is allowed. It does not decide whether the illegality bites."}, {"letter": "E", "code": "C2.10.2", "title": "Corruption and International Policy", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">per <i>Westacre<\/i>, so is<\/mark> <mark class=\"new\">a contract for corruption<\/mark> <mark class=\"same\">under any<\/mark> <mark class=\"new\">proper law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Paying a former minister for influence may come close, but the facts frame it as influence-buying, a <i>Lemenda<\/i> matter.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Corruption offends international policy whatever the proper law (<i>Westacre<\/i>). The facts frame the Dao fee as influence-buying, which is <i>Lemenda<\/i>'s territory."}, {"letter": "F", "code": "C2.10.6", "title": "Tainting by Foreign Illegality", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Acacia<\/mark> <mark class=\"same\">argues<\/mark> <mark class=\"new\">the under-declaration and the Dao payment taint<\/mark> <mark class=\"new\">Growers' price claim<\/mark><mark class=\"same\">, asking per <i>Euro-Diam<\/i> (1) is there a relevant foreign illegality, and (2) is it sufficiently connected to<\/mark> <mark class=\"new\">the claim<\/mark><mark class=\"same\">?<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Which proper law: per Chong (seminar), that of<\/mark> <mark class=\"new\">the cocoa contract, the claim sued on<\/mark><mark class=\"same\">, not of<\/mark> <mark class=\"new\">the Dao arrangement, the tainting transaction<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Singapore principles: no connection; Ruritanian principles: connected, so neither side could enforce.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "C2.10.5", "title": "Ralli", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ralli Brothers<\/i>,<\/mark> <mark class=\"new\">importing under-declared beans into Utopia<\/mark> <mark class=\"same\">is unenforceable in so far as unlawful at<\/mark> <mark class=\"new\">the contractual place of performance<\/mark><mark class=\"same\">, whatever<\/mark> <mark class=\"new\">Ruritanian law<\/mark> <mark class=\"new\">says<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Growers cannot recover the price.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "<i>Ralli<\/i> asks whether the performance the contract requires is illegal where it must be done. Shipping and paying for cocoa are lawful; the under-declaration was Acacia's own choice, not contractual performance."}]}, {"id": "C-11.1", "side": "C", "hyp": 11, "n": 1, "source": "Block Finder set 1, Q6", "title": "Zephyr v Talon", "full": "", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>By a contract dated 1 June 2025, signed in Ruritania, Zephyr Pte Ltd, a Singapore company, agrees to sell 2,000 drone motors to Talon Co, a Ruritanian company. Delivery and payment are both to take place at Port Asher, Ruritania. Clause 12 says: \"This contract is governed by Singapore law if Zephyr commences proceedings, and by Ruritanian law if Talon commences proceedings.\"<\/p><p>On 1 February 2026 Ruritania bans the import of drone motors. Talon refuses to take delivery at Port Asher or to pay. Zephyr sues Talon in Singapore for damages for non-acceptance.<\/p><p>You are told that Ruritanian law permits a clause like cl 12. Under Singapore domestic law the ban would frustrate the contract. Under Ruritanian domestic law it would not, because the seller can deliver to the nearest available port. Advise on the law governing the contract and whether the ban defeats Zephyr's claim.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> \"X law if A sues, Y law if B sues\" is Chong's reused clause. You are told Ruritanian law permits it, and that signals both routes must be run.<\/p>\n<p><strong>The clause: C2.2.5.<\/strong> Under the lex fori, cl 12 is invalid, so go to the OPL. Under the OPL, if Ruritanian law permits it, cl 12 is valid and Singapore law governs because Zephyr sued. Run both.<\/p>\n<p><strong>The OPL: C2.4.3.<\/strong> Both parties perform at Port Asher and the contract was signed in Ruritania, so Ruritanian law is the OPL. The lex fori route therefore ends in Ruritanian law, and the OPL route ends in Singapore law.<\/p>\n<p><strong>The ban: C2.10.5.<\/strong> A ban after contracting at the place of performance is <i>Ralli<\/i>. On reading (1) it bars enforcement whatever the proper law. On reading (2) the answer flips with the proper law: frustrated under Singapore law, not under Ruritanian law. So Zephyr wants cl 12 struck out: only then does Ruritanian law govern and the contract survive.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not assume Zephyr wants its own clause upheld. Upholding cl 12 gives it Singapore law, which frustrates the contract on reading (2). Work out each route's outcome before you advise.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Cl 12 is a floating clause, invalid under the lex fori but valid if the OPL, Ruritanian law, permits it, so argue both; the ban at Port Asher engages Ralli, which bars the claim on the Esben reading and otherwise turns on whether the proper law frustrates the contract.<\/blockquote>", "items": [{"letter": "A", "code": "C2.2.6", "title": "Change of Proper Law; Split", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Kredietbank v Sinotani<\/i> (and <i>James Miller<\/i>),<\/mark> <mark class=\"new\">Zephyr and Talon<\/mark> <mark class=\"same\">may change<\/mark> <mark class=\"new\">Singapore law<\/mark> <mark class=\"same\">to<\/mark> <mark class=\"new\">Ruritanian law<\/mark><mark class=\"same\">, though whether the lex fori or the original proper law decides if the change is allowed is open.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Coherence: the split must be internally coherent, so not<\/mark> <mark class=\"new\">different laws<\/mark> <mark class=\"same\">depending on<\/mark> <mark class=\"new\">which party sues<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Zephyr's best rebuttal: cl 12 is a permitted split, not a floating clause. Worth a sentence, but the coherence line cuts against it, as the law cannot turn on who sues."}, {"letter": "B", "code": "C2.10.1", "title": "Framework: Foster vs Ralli vs Lemenda", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, breach of foreign written law intended at formation goes to <i>Foster<\/i> and in required performance to <i>Ralli<\/i>, while foreign public policy alone goes to <i>Lemenda<\/i>; per <i>Magdeev<\/i>, \"<i>Ralli<\/i> looks to action, <i>Foster<\/i> <span class=\"gap\">…<\/span> to intention\".<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Ask which of these the Port Asher ban engages.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The right routing line for your opening, and one sentence is enough. It only sends you to C2.10.5, where the marks are."}, {"letter": "C", "code": "C2.10.3", "title": "Foster: Comity; Wicked Intention", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Foster v Driscoll<\/i> and <i>Regazzoni<\/i> (in Singapore, <i>Patriot v Lam Hong<\/i>; <i>Esben<\/i>), a contract whose real object and intention is<\/mark> <mark class=\"new\">importing banned motors<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">is unenforceable<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Magdeev<\/i> (and <i>Waugh v Morris<\/i>), intention at formation decides, even if the plan was never carried out<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Foster turns on intention at formation, and per Magdeev a later prohibition does not suffice. The ban came eight months after contracting and no one planned to break it. Dates decide between Foster and Ralli."}, {"letter": "D", "code": "C2.2.8", "title": "Skip Stage 2", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Shanghai Turbo<\/i> and <i>The Iran Vojdan<\/i>, as<\/mark> <mark class=\"new\">Zephyr and Talon<\/mark> <mark class=\"same\">turned their minds to the governing law and failed<\/mark> <mark class=\"new\">(a floating clause)<\/mark><mark class=\"same\">, inferring a choice is \"artificial\", so go to Stage 3.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Low stakes: per <i>Pacific Recreation<\/i>, skipping Stage 2 is \"not as significant a step as it seems\", as the same factors recur at Stage 3.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Correct and needed, but it is a one-line bridge: no implied choice, straight to the OPL."}, {"letter": "E", "code": "C2.2.5", "title": "Which Law Tests Validity?", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, the <i>Shanghai Turbo<\/i> HC on balance used the lex fori (also testing both candidate laws), whereas <i>The Iran Vojdan<\/i> used the OPL<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Lex fori (−): per Prof Chong, under Singapore law<\/mark> <mark class=\"new\">cl 12<\/mark> <mark class=\"same\">is invalid even with an election mechanism, so the OPL governs.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">OPL (+): per Prof Chong, if<\/mark> <mark class=\"new\">the OPL, Ruritanian law,<\/mark> <mark class=\"same\">permits floating clauses,<\/mark> <mark class=\"new\">cl 12<\/mark> <mark class=\"same\">is valid and<\/mark> <mark class=\"new\">Singapore law<\/mark> <mark class=\"same\">governs once<\/mark> <mark class=\"new\">Zephyr<\/mark> <mark class=\"new\">sues first<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "C2.4.3", "title": "Application: Where Both Perform", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per Prof Chong, the strongest argument is usually<\/mark> <mark class=\"new\">Port Asher, where both parties perform<\/mark><mark class=\"same\">, supported by<\/mark> <mark class=\"new\">the place of contracting<\/mark><mark class=\"same\">, so<\/mark> <mark class=\"new\">Ruritanian law<\/mark> <mark class=\"same\">is the OPL.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, <i>Pacific Recreation<\/i>'s \"equal weight\" dictum is puzzling, as the place of performance carries great weight (<i>Bonython<\/i>; <i>Enka<\/i>)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "C2.10.5", "title": "Ralli: Three Readings", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y (and Day), <i>Ralli<\/i> is (1) an independent conflicts rule, (2) frustration under<\/mark> <mark class=\"new\">the proper law<\/mark><mark class=\"same\">, or (3) comity-based abstention, and<\/mark> <mark class=\"new\">the result<\/mark> <mark class=\"same\">turns on<\/mark> <mark class=\"new\">the reading<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">(1) Independent rule (start here): per <i>Esben<\/i>, Dicey's rule rooted in comity, catching supervening and initial illegality alike<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">(2) Frustration (alternative):<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">ask whether<\/mark> <mark class=\"new\">the proper law<\/mark> <mark class=\"same\">frustrates or permits<\/mark> <mark class=\"new\">delivery to the nearest available port<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "C-12.1", "side": "C", "hyp": 12, "n": 1, "source": "Block Finder set 1, Q7", "title": "Aster v Bahari and Dorn", "full": "", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>By a contract dated 2 February 2026, governed by Singapore law (the Sale Contract), Aster Pte Ltd, a Singapore company, sells 500 cooling units to Bahari Co, a Ruritanian company, for US$2 million. Delivery is at Aster's warehouse in Jurong. Ruritanian law has banned the import of these units since 2024.<\/p><p>From the outset Bahari plans to smuggle the units into Ruritania, labelled as spare parts. A week before delivery, Aster's sales manager learns of the plan and says nothing. Aster delivers at Jurong as agreed and takes no other part. Ruritanian customs seize the units, and Bahari refuses to pay.<\/p><p>Aster sues Bahari for the price. It also sues Dorn Ltd, Bahari's Utopian parent, on a guarantee of the price governed by Utopian law (the Guarantee). You are told that the smuggling is sufficiently connected to the Guarantee to taint it under Utopian law, but not under Singapore law. Advise Aster on both claims.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> The illegality cluster: which route, whose intention, and which law decides tainting. The last line of the hypo is Chong's usual \"under X law but not Y law\" signal.<\/p>\n<p><strong>Does Foster apply? C2.10.3 Territorial.<\/strong> Delivery in Jurong is lawful, but the court looks to the real object, and the plan was to import into Ruritania. Foster is forum public policy, so the Singapore proper law does not remove it.<\/p>\n<p><strong>Can Aster still sue? C2.10.3 Unilateral.<\/strong> The intention was Bahari's alone, so it bars only Bahari. The manager's late knowledge is not active participation, so Aster may sue for the price.<\/p>\n<p><strong>The Guarantee: C2.10.6 Step 2.<\/strong> Whether it is tainted depends on which law decides: the lex fori says no, Utopian law says yes. If proper law, it is the law of the Guarantee, the claim sued on, not the Sale Contract. Run both and pick one.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not use the Sale Contract's Singapore law as \"the proper law\" for tainting. Chong's point is that it is the law of the contract sued on.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Bahari's plan engages Foster though delivery was at Jurong, but the intention was Bahari's alone and the manager's late knowledge is not participation, so Aster recovers the price; the Guarantee turns on whether tainting is for the lex fori, which says no, or Utopian law as its proper law, which says yes, so argue both.<\/blockquote>", "items": [{"letter": "A", "code": "C2.10.6", "title": "Proportionality", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ting Siew May<\/i> (applied in <i>Surewin<\/i>), refusing<\/mark> <mark class=\"new\">the Guarantee<\/mark> <mark class=\"same\">must be proportionate, weighing (a) the prohibiting rule's purpose, (b) gravity, (c) remoteness or centrality, (d) object, intent and conduct and (e) consequences of denial.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Surewin application: refusing the pledge was disproportionate, as the bank was unaware<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Use this if you pick the lex fori route, since it is how Singapore principles work. But it only runs after Step 2 picks Singapore, so it is a branch, not the opening block."}, {"letter": "B", "code": "C2.10.6", "title": "Step 1: Relevant Foreign Illegality", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\"><i>Anuva<\/i> excluded illegal acts, but per C&amp;Y a transaction is made of acts (cf <i>Howard v Shirlstar<\/i>), so per <i>Surewin<\/i> ask whether<\/mark> <mark class=\"new\">the smuggling<\/mark> <mark class=\"same\">breached<\/mark> <mark class=\"new\">Ruritanian law<\/mark><mark class=\"same\">, or whether Singapore would enforce<\/mark> <mark class=\"new\">the Sale Contract<\/mark> <mark class=\"same\">(C2.10.3 to C2.10.5).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ryder Industries<\/i>, not every breach counts:<\/mark> <mark class=\"new\">a breach of forum international policy<\/mark> <mark class=\"same\">qualifies<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "You must clear this, but it is short. A planned breach of a Ruritanian import ban is a serious illegality, and the hypo already assumes the link. The dispute is at Step 2."}, {"letter": "C", "code": "C2.10.3", "title": "Unilateral Intention; Mental State", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Royal Boskalis<\/i>, unilateral intention bars only its holder, so<\/mark> <mark class=\"new\">Aster<\/mark> <mark class=\"same\">may sue (<i>Ang v Lyu<\/i>; <i>Surewin<\/i>), though not for an order compelling the illegal performance.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Mental state: per <i>Dimplex Gems<\/i>,<\/mark> <mark class=\"new\">the sales manager's<\/mark> <mark class=\"same\">mere knowledge does not disqualify<\/mark> <mark class=\"new\">Aster<\/mark><mark class=\"same\">; active participation is needed (doubting <i>Soetanto<\/i>).<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "C2.10.3", "title": "Territorial; Proper Law Irrelevant", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Surewin<\/i>,<\/mark> <mark class=\"new\">importing the units<\/mark> <mark class=\"same\">must be contemplated within<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">, though per <i>Foster<\/i> and <i>Regazzoni<\/i> not necessarily at<\/mark> <mark class=\"new\">Jurong<\/mark><mark class=\"same\">, the court looking to the real object.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ang v Lyu<\/i> and <i>Surewin<\/i>, <i>Foster<\/i> is forum public policy, so it applies under<\/mark> <mark class=\"new\">a Singapore<\/mark> <mark class=\"same\">proper law alike<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "C2.10.6", "title": "Step 2: Which Law's Principles?", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Unresolved,<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">per Prof Chong, if tainting is part of the lex fori, Singapore's principles decide, and if of the proper law, that law's do.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Which proper law: per Chong (seminar), that of<\/mark> <mark class=\"new\">the Guarantee, the claim sued on<\/mark><mark class=\"same\">, not of<\/mark> <mark class=\"new\">the Sale Contract, the tainting transaction<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Submission (C&amp;Y; Forsyth): apply<\/mark> <mark class=\"new\">Utopian law<\/mark><mark class=\"same\">'s principles unless<\/mark> <mark class=\"new\">Singapore's<\/mark> <mark class=\"same\">rise to overriding mandatory rules or international policy<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "C2.10.4", "title": "Lemenda: Double Policy Breach", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Lemenda<\/i>,<\/mark> <mark class=\"new\">a sale of units bound for Ruritania<\/mark> <mark class=\"same\">under<\/mark> <mark class=\"new\">a Singapore-law contract<\/mark> <mark class=\"same\">is unenforced if contrary to both a forum policy founded on general morality and the same policy at<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Shaikh Faisal<\/i>, breaching<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">'s policy does not bar a Singapore-law contract absent a similar Singapore policy<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Lemenda is for foreign public policy alone. Here a written Ruritanian law is broken, so C2.10.1's framework sends the issue to Foster."}, {"letter": "G", "code": "C2.10.5", "title": "Ralli: Illegal Performance", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ralli Brothers<\/i>,<\/mark> <mark class=\"new\">delivery into Ruritania after its ban<\/mark> <mark class=\"same\">is unenforceable in so far as unlawful at the contractual place of performance, whatever the proper law.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">(1) Independent rule (start here): per <i>Esben<\/i>, Dicey's rule rooted in comity, catching supervening and initial illegality alike<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Ralli needs illegality in required performance at the contractual place, and that is Jurong, where delivery is lawful. The smuggling is Bahari's own plan, not a contractual duty."}]}, {"id": "C-13.1", "side": "C", "hyp": 13, "n": 1, "source": "Block Finder set 1, Q8", "title": "Ember v Castellan", "full": "", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>Ember Pte Ltd, a Singapore company, buys a logistics business from Castellan SA, a Utopian company. While working in Utopia, Castellan's CFO emails a profit forecast to Ember's CEO, who opens it on holiday in Ruritania. Back in Singapore, Ember's board reviews the forecast and resolves to buy, and the sale agreement is signed in Singapore.<\/p><p>The sale agreement is expressly governed by Utopian law. In clause 9 Ember confirms that it \"has not relied on any statement made before this agreement\". Clause 14 says that all disputes arising out of or in connection with the agreement are governed by Utopian law.<\/p><p>The forecast was carelessly prepared and false. Ember sues Castellan in Singapore in the tort of negligent misrepresentation only. Under Utopian law, clause 9 is valid and a complete defence, and a two-year limitation period has expired. Under Singapore law, clause 9 would fail a reasonableness test, and the claim is in time. Advise on the law or laws governing the claim and whether clause 9 and the Utopian time bar defeat it.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Made in Utopia, read in Ruritania, relied on in Singapore: the place of the tort decides almost everything else, including the time bar.<\/p>\n<p><strong>Locate the tort: C3.3.2 Misrepresentation.<\/strong> Receipt and reliance split, so the specific rule fails and you use the substance test. Receipt on holiday is fortuitous, and the board relied in Singapore, so the tort is on balance in Singapore. Castellan replies with <i>IM Skaugen<\/i>: across several countries, the place of making may prevail, which would be Utopia. If Singapore holds, both limbs point to Singapore law and the Utopian time bar falls away.<\/p>\n<p><strong>Castellan's way back: C3.6.5.<\/strong> Cl 14 is wide, so Castellan argues Utopian law governs the tort through the flexible exception. It is an open question, and <i>Rickshaw<\/i>'s fortuity threshold is the obstacle, because Singapore is not fortuitous here.<\/p>\n<p><strong>Cl 9: C3.8.2.<\/strong> Run the <i>Sayers<\/i> majority first: valid under Utopian law, so the claim fails. Then the preferred approach: valid under its proper law, but it must also be admissible under Singapore law on both limbs, and there it fails the reasonableness test.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not treat the governing law clause as settling the tort. The claim is framed in tort, so double actionability runs first (<i>Rickshaw<\/i>).<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The tort is on balance in Singapore, receipt in Ruritania being fortuitous and reliance here, so both limbs point to Singapore law and the Utopian time bar falls away unless cl 14 displaces them through the exception, which is open and hard to fit with Rickshaw; cl 9 is valid under Utopian law but, on the preferred approach, inadmissible under Singapore law.<\/blockquote>", "items": [{"letter": "A", "code": "C3.9.2", "title": "Lex Loci Delicti's Period", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 3(1) and s 3(2) FLPA 2012,<\/mark> <mark class=\"new\">Utopian law<\/mark><mark class=\"same\">'s domestic limitation period alone applies, renvoi being excluded (ss 3(5), 6(2)), so<\/mark> <mark class=\"new\">the claim<\/mark> <mark class=\"new\">is<\/mark> <mark class=\"same\">barred, subject to s 4(2) undue hardship (C1.5.4).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">per s 3(2) FLPA, locating the tort in Singapore avoids<\/mark> <mark class=\"new\">Utopian law<\/mark><mark class=\"same\">'s shorter period (C3.3).<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The right result, in one line. Limitation follows from where the tort is located, so C3.3.2 does the work."}, {"letter": "B", "code": "C3.8.1", "title": "Contract Negating an Element", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y (North), (i) the effect of<\/mark> <mark class=\"new\">the sale agreement<\/mark> <mark class=\"same\">on tort liability is a tort question for double actionability, and (ii) its validity a contract question for<\/mark> <mark class=\"new\">its proper law, Utopian law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Galaxias: the trespass was an English tort, so English law held a contractual right to remain negates trespass<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The same two-question logic. But this block is for a contract that answers an element, like a licence. The router sends a non-reliance clause raised as a defence to C3.8.2."}, {"letter": "C", "code": "C3.8.2", "title": "Clause as a Defence: Sayers and the Preferred Approach", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">only the proper law of the contract mattered, and it being Dutch, \"this action is dead\" (Salmon LJ), so if<\/mark> <mark class=\"new\">Utopian law<\/mark> <mark class=\"same\">validates cl<\/mark> <mark class=\"new\">9<\/mark><mark class=\"same\">, the claim fails.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">(1) admissibility is a tort question for double actionability, and (2) validity a contract question for<\/mark> <mark class=\"new\">Utopian law<\/mark><mark class=\"same\">, so cl<\/mark> <mark class=\"new\">9<\/mark><mark class=\"same\">, valid under<\/mark> <mark class=\"new\">Utopian law<\/mark><mark class=\"same\">, succeeds only if admissible under both Singapore law and the lex loci delicti.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "C3.4", "title": "Double Actionability for Local Torts", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Rickshaw<\/i>, rejecting <i>Metall<\/i>'s English-law-only rule as \"unduly parochial\" and contrary to comity,<\/mark> <mark class=\"new\">negligent misrepresentation<\/mark> <mark class=\"same\">in Singapore still runs both limbs, both pointing to Singapore law.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Point of difference: the exception may apply<\/mark> <mark class=\"new\">Utopian law<\/mark> <mark class=\"same\">where the Singapore locus is purely fortuitous, no stricter test applying<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Correct once you locate the tort here, and it shows the exception still runs. But it is a consequence of C3.3.2, not the opening move."}, {"letter": "E", "code": "C3.6.5", "title": "Party Autonomy: Route Through the Exception", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Castellan<\/mark> <mark class=\"same\">argues cl<\/mark> <mark class=\"new\">14<\/mark> <mark class=\"same\">applies<\/mark> <mark class=\"new\">Utopian law<\/mark> <mark class=\"same\">to the tort, an open question (<i>Ong Ghee Soon<\/i>), though \"just a small step away\" (C&amp;Y).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Obstacle: <i>Rickshaw<\/i>'s fortuity threshold and non-exclusive concession blocked it (C3.4), so<\/mark> <mark class=\"new\">Ember<\/mark> <mark class=\"same\">argues the separate tort stays.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "C3.3.2", "title": "Misrepresentation: Receipt + Reliance", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>JIO Minerals<\/i> (tentatively, citing Yeo) and <i>Ong Ghee Soon<\/i>,<\/mark> <mark class=\"new\">a forecast<\/mark> <mark class=\"same\">directed at<\/mark> <mark class=\"new\">Ember<\/mark> <mark class=\"same\">and received and acted on in<\/mark> <mark class=\"new\">one place<\/mark> <mark class=\"same\">is a tort there, unless that place is fortuitous.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Receipt and reliance split: the specific rule fails, so use the substance test<\/mark> <mark class=\"new\">: Ruritania was a holiday, and the board relied in Singapore.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "C3.3.2", "title": "Negligence: Focus on the Act", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Vibrant Group<\/i>, the place of<\/mark> <mark class=\"new\">the CFO's careless forecast<\/mark> <mark class=\"same\">prevails, so<\/mark> <mark class=\"new\">the forecast<\/mark> <mark class=\"same\">performed in<\/mark> <mark class=\"new\">Utopia<\/mark> <mark class=\"same\">locates the tort there despite reliance and loss in Singapore.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Reliance weighs less: in negligence, reliance is only one route to a duty (<i>NTUC Foodfare<\/i>; <i>Vibrant<\/i>).<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Vibrant's act-focused rule is for negligence such as an audit. Ember pleads a misrepresentation directed at it, and per Vibrant reliance counts for more there, so Utopia is not the answer."}]}];
const FULL = {"Mock Paper 1, Hypo 1": "<p>Aurelia Pte Ltd (Aurelia) is incorporated in Singapore, where it assembles battery packs for electric buses. It also has a sales office in Utopia. Kestrel Inc (Kestrel) is incorporated in Utopia and carries on business there only. The two companies have concluded three contracts.<\/p><p>The Cell Supply Agreement, dated 1 August 2016, requires Kestrel to deliver lithium cells to Aurelia's Singapore plant. It is expressly governed by Singapore law and provides:<\/p><blockquote>31. The courts of Singapore shall have non-exclusive jurisdiction over all disputes arising out of or in connection with this agreement.<\/blockquote><p>The Module Supply Agreement, dated 1 March 2019, requires Kestrel to deliver battery modules to the same plant. It is expressly governed by Utopian law and provides:<\/p><blockquote>14. The parties submit to the jurisdiction of the Singapore High Court in respect of all disputes arising under this agreement.<\/blockquote><p>The Distribution Agreement, dated 1 November 2021, appoints Aurelia as distributor of Kestrel's finished battery packs throughout ASEAN. It is expressly governed by Singapore law and provides:<\/p><blockquote>40. The courts of Utopia shall have exclusive jurisdiction over all disputes arising under this agreement.<br>41. Notwithstanding Clause 40, Kestrel may commence proceedings against Aurelia in any other court of competent jurisdiction.<\/blockquote><p>In September 2025, several buses fitted with Aurelia's packs caught fire. Aurelia's investigators blamed defects in Kestrel's cells and modules. Aurelia stopped paying Kestrel's invoices and purported to terminate the Cell Supply Agreement and the Module Supply Agreement. Kestrel responded by terminating the Distribution Agreement for Aurelia's failure to meet its minimum purchase obligations.<\/p><p>In January 2026, Kestrel commenced proceedings against Aurelia in the court of Utopia for: (a) the price due under the Cell Supply Agreement; (b) a declaration that it has not breached the Module Supply Agreement; and (c) damages for breach of the Distribution Agreement. The originating process was served at Aurelia's Utopian sales office. Aurelia applied to set aside service on the ground that Singapore was the more appropriate forum. In June 2026, the Utopian court dismissed the application. It held that it had jurisdiction over claims (a) and (b) because Aurelia has a place of business in Utopia, and that it was bound to hear claim (c) under the Hague Convention on Choice of Court Agreements because Clause 40 is an exclusive choice of court agreement. Trial of all the claims is fixed for February 2027.<\/p><p>Aurelia wants all its disputes with Kestrel to be resolved in Singapore, and it wishes to claim damages for the defective cells and modules. Advise Aurelia. Include in your advice: (1) what steps it might take in Singapore to pursue its claims and to prevent the Utopian proceedings from continuing; and (2) what effect the Utopian judgments would have in Singapore if they are in Kestrel's favour.<\/p><p>Assume the following:<\/p><ol><li>The Hague Convention on Choice of Court Agreements took legal effect in Utopia on 1 January 2018.<\/li><li>Under Singapore contract law, Clause 41 qualifies Clause 40.<\/li><li>Under Utopian contract law, a clause in the form of Clause 14 is a binding promise that neither party will sue elsewhere.<\/li><li>The Utopian court takes about 4 years on average to decide a case, compared to 12 months in Singapore.<\/li><li>Utopian law caps damages for defective goods at the contract price of those goods. Singapore law has no such cap.<\/li><li>The main witnesses on the alleged defects are Kestrel's engineers, who all work in Utopia. Aurelia's most important witness is a retired Kestrel metallurgist who lives in Utopia and has refused to give evidence voluntarily.<\/li><li>Both the Utopian and Singapore courts have video-conferencing facilities.<\/li><li>Utopian contract law is derived from the German Civil Code, and one of the International Judges of the Singapore International Commercial Court is trained in German law.<\/li><\/ol>", "Mock Paper 1, Hypo 2": "<p>Medira Inc (Medira) is the national hospital operator of Buritania. It receives government funding and is a public body under Buritanian law. In 2024, it negotiated with Vantis Corp (Vantis), a company incorporated in Elbonia, for the lease of 20 MRI scanners for five years. At a technical briefing at Medira's head office in Buritania, a Vantis sales engineer told Medira's procurement committee that the scanners had achieved 99.5% uptime in hospitals worldwide. The committee recommended the deal to Medira's board. The board met in Singapore, where its members were attending a medical trade fair, and approved the deal there after reading the engineer's slides. The lease was signed in Singapore on 3 June 2024. The scanners are to be installed in Medira's hospitals in Buritania. Rent is payable in US dollars into Vantis's bank account in Lusitania.<\/p><p>The lease provides:<\/p><blockquote>12. This lease is governed by Buritanian law unless Vantis, within 30 days of any dispute arising, gives written notice electing Elbonian law, in which event Elbonian law shall govern this lease.<br>19. Medira acknowledges that it has not entered into this lease in reliance on any statement made by or on behalf of Vantis.<\/blockquote><p>The Buritanian Radiation Safety Act prohibits the import of an MRI scanner without a safety certificate, which takes about 18 months to obtain. Breach is an offence punishable by a fine. During the negotiations, Vantis's regional director decided that Vantis would clear the scanners through Buritanian customs as \"laboratory furniture\" so that deliveries would not be delayed. He mentioned this to Medira's head of procurement, who replied that customs clearance was Vantis's responsibility and said nothing further. The scanners were imported in this way.<\/p><p>The Buritanian Public Contracts Code provides: \"A contract with a public body which does not bear the seal of the Ministry of Health is of no effect.\" The lease does not bear this seal.<\/p><p>Vantis had also engaged Dario, a Charltonian resident and domiciliary, to use his friendship with the Buritanian Health Minister to secure the lease for Vantis. Dario was to be paid a commission into his Singapore bank account if the lease was signed. The contract between Vantis and Dario was concluded in Elbonia and contains a choice of law clause for Charltonian law. Both parties chose that law because they knew that such contracts are against Buritanian public policy.<\/p><p>The scanners have in fact achieved only 81% uptime. When Medira complained, Vantis referred it to Clause 19 and, on 1 March 2026, gave written notice under Clause 12 electing Elbonian law.<\/p><p>Separately, Medira negotiated with Haldane Pte Ltd (Haldane), a Singapore incorporated company with a Suburbian parent company, for the maintenance of the scanners in Buritania. After agreeing the price by e-mail, Haldane e-mailed Medira its standard Service Terms with a note stating: \"Unless we hear from you within 14 days, we will treat these terms as agreed.\" An annexe to the Service Terms contains a choice of law clause for Suburbian law, which was not brought to Medira's attention. Medira did not reply. Nothing has been signed.<\/p><p>Following a change of government in Buritania, Medira no longer wishes to go through with either transaction. It also wishes to sue Vantis for damages in the tort of misrepresentation. It seeks your advice on Singapore conflict of laws as to whether: (1) it can escape from the lease and from any contract with Haldane; and (2) it can succeed in its misrepresentation action. Assume that the Singapore court will assume jurisdiction over all relevant parties.<\/p><p>You are given the following additional information:<\/p><ol><li>A clause in the form of Clause 12 is valid as a matter of Elbonian, but not Buritanian, conflict of laws rules.<\/li><li>The engineer's statement is an actionable misrepresentation under Singapore and Buritanian domestic tort laws, but not Elbonian domestic tort law.<\/li><li>A contract can be rescinded for actionable misrepresentation under all relevant laws.<\/li><li>A no-reliance clause may be raised as a defence to an action in misrepresentation under all relevant laws. Clause 19 is valid under Buritanian and Elbonian domestic contract laws, but not under Singapore domestic contract law as it does not satisfy the requirement of reasonableness.<\/li><li>Contracts for the purchase of personal influence are against Buritanian and Singapore public policies if the relevant acts are committed within the jurisdiction. Such contracts are valid under Charltonian law wherever the acts are committed.<\/li><li>There is a sufficient connection between the Dario contract and the lease to prevent Vantis from enforcing the lease under Singapore and Elbonian laws, but not Buritanian law.<\/li><li>Under Suburbian domestic contract law, but not Singapore or Buritanian domestic contract laws, Medira's silence amounts to acceptance, and the Suburbian choice of law clause is incorporated into the resulting contract.<\/li><\/ol>", "Mock Paper 2, Hypo 3": "<p>Novara Pte Ltd (Novara) is incorporated in Singapore and distributes vaccines across Southeast Asia. Frostline Inc (Frostline), incorporated in Ruritania, provides ultra-cold freight and storage services. Frostline is not registered under the Singapore Companies Act.<\/p><p>Since 2021, Polar Agency Pte Ltd (Polar), a Singapore incorporated company, has represented Frostline in Singapore. Polar leases its own premises at Changi, where it also represents two other logistics companies. Polar is paid by commission. Mei, an employee of Polar, quotes prices from Frostline's rate card and forwards all bookings to Ruritania, where Frostline decides whether to accept them. Frostline's logo appears on Polar's door alongside the logos of the two other companies.<\/p><p>On 14 February 2022, following a meeting in Singapore at which Stefan Holt, Frostline's Chief Operating Officer, told Novara's directors that every Frostline container was independently certified to hold minus 70 degrees Celsius, Novara signed a Master Logistics Agreement with Frostline. Mr Holt is a Ruritanian citizen and domiciliary. The agreement provides:<\/p><blockquote>22. Any dispute arising out of or in connection with this agreement shall be determined by the Singapore International Commercial Court.<br>23. This agreement is governed by Ruritanian law.<\/blockquote><p>In July 2025, two million doses of vaccine bound for Singapore hospitals spoiled while stored in Suburbia, at a warehouse operated by Cryovault Ltd (Cryovault). Cryovault is a Suburbian company engaged by Frostline as a subcontractor. Novara has no contract with Cryovault. Novara's investigators found that the container concerned had never been certified, and that Cryovault had switched off its back-up power to save costs.<\/p><p>Novara wishes to sue, preferably in a single proceeding in Singapore: (a) Frostline for breach of contract; (b) Mr Holt for the tort of deceit; and (c) Cryovault for the tort of negligence.<\/p><p>Mr Holt lives in Ruritania, but Novara's chief executive has learnt that he will pass through Changi Airport next month on a three-hour stopover. She proposes to invite him to a \"without prejudice settlement meeting\" at an airport hotel, with no intention of discussing settlement, so that he can be served there.<\/p><p>In October 2025, Frostline sued Novara in Ruritania for unpaid storage fees. On its Ruritanian lawyers' advice, Novara filed a defence on the merits in December 2025 without reserving its position on jurisdiction. Novara has since changed lawyers. The Ruritanian trial is fixed for June 2027. In March 2026, Cryovault commenced proceedings in Suburbia for a declaration that it owes Novara no duty of care. Novara would like both sets of foreign proceedings stopped.<\/p><p>Advise Novara on: (1) the likelihood of the Singapore court, including the SICC, hearing its claims against Frostline, Mr Holt and Cryovault; and (2) whether it can restrain the Ruritanian and Suburbian proceedings.<\/p><p>Assume the following:<\/p><ol><li>Neither Ruritania nor Suburbia is a party to the Hague Convention on Choice of Court Agreements.<\/li><li>Singapore choice of law rules point towards Ruritanian law for the contract claim and Singapore law for the deceit claim. The negligence claim is actionable under both Singapore and Suburbian laws.<\/li><li>Under Ruritanian contract law, a clause naming a court without using the word \"exclusive\" is non-exclusive.<\/li><li>All of Frostline's assets are in Ruritania, and Ruritanian courts do not enforce Singapore judgments.<\/li><li>All of Cryovault's witnesses and records are in Suburbia. The Suburbian courts are efficient and fair.<\/li><li>Ruritanian law, unlike Singapore law, does not recognise a claim for damages for loss of reputation arising from a breach of contract.<\/li><li>Ruritanian contract law is derived from the English common law. There is no Ruritanian-trained International Judge in the SICC.<\/li><\/ol>", "Mock Paper 2, Hypo 4": "<p>Helion Materials Ltd (Helion), a Lusitanian incorporated company, mines and refines rare-earth metals in Lusitania. On 3 March 2024, Helion concluded a contract in Lusitania with Quanta Pte Ltd (Quanta), a Singapore incorporated company which manufactures electric motors at its factory in Freedonia. Helion agreed to sell 1,200 tonnes of rare-earth magnets to Quanta in 12 equal monthly shipments, from a Lusitanian port to Quanta's factory in Freedonia. Payment was to be made in US dollars into Helion's Singapore bank account against shipping documents.<\/p><p>The contract contains the following clause:<\/p><blockquote>9. This contract is governed by English law.<\/blockquote><p>Neither party has any connection with England. Helion's lawyers recommended this clause because, if Lusitanian law governed the contract, Helion would be liable to pay an 8% statutory strategic minerals surcharge to the Lusitanian government.<\/p><p>On 1 September 2024, following a diplomatic dispute, the government of Freedonia enacted a decree prohibiting the import of magnets from Lusitania. Importers in breach are liable to a fine. Six shipments had by then been delivered. Quanta asked Helion to discharge the remaining shipments at a port in Charltonia, a neighbouring country to Freedonia. Helion agreed. Quanta's logistics manager then arranged, unknown to Helion, for the magnets to be trucked across the land border into Freedonia under invoices describing them as scrap metal. Smuggling is a crime punishable by imprisonment under Freedonian law. The false description on the invoices is, on its own, an administrative infringement of Freedonian customs rules which attracts a small penalty.<\/p><p>Four more shipments were delivered in this way. In February 2025, the Freedonian press reported the smuggling and Helion stopped shipping at once. It has not been paid for the last two shipments delivered. A week later, Helion sold the remaining 200 tonnes to Rivala Corp (Rivala), a Suburbian company, at a much higher price. At a meeting in Suburbia, Rivala's sales director, who knew of Helion's contract with Quanta, had offered Helion that price on the condition that Helion stopped supplying Quanta.<\/p><p>Quanta incorporated the magnets into motors which it sold to Bellamy Ltd (Bellamy), an Elbonian electric vehicle manufacturer, under a contract expressly governed by Elbonian law. Bellamy has refused to pay for the last consignment of motors, on the ground that they were built with smuggled magnets.<\/p><p>Quanta wishes to sue: (a) Helion for damages for non-delivery; (b) Bellamy for the price of the motors; and (c) Rivala for the tort of inducing brea
