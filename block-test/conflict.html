t could not have found with diligence, which the e-mails may be. A real point, but it reaches only US$5 million, and Meridian chose not to defend."}, {"letter": "B", "code": "J7.5.4", "title": "Excess Damages (s 16); Severance (s 19)", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 16, the court may refuse<\/mark> <mark class=\"new\">the Novo judgment<\/mark> <mark class=\"same\">insofar as it awards damages, such as<\/mark> <mark class=\"new\">the US$6 million<\/mark><mark class=\"same\">, exceeding compensation for actual loss.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per s 19, the court must enforce<\/mark> <mark class=\"new\">the US$18 million<\/mark> <mark class=\"same\">of<\/mark> <mark class=\"new\">the judgment<\/mark> <mark class=\"same\">if applied for<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "These sections belong to the CCAA. Utopia is not a Contracting State and there is no choice of court agreement, so the common law penal rule and <i>Licea<\/i> apply instead."}, {"letter": "C", "code": "J7.2.3", "title": "Natural Justice", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Sang Cheol Woo<\/i> and C&amp;Y,<\/mark> <mark class=\"new\">Meridian<\/mark><mark class=\"same\">,<\/mark> <mark class=\"new\">validly served in Singapore<\/mark><mark class=\"same\">, chose not to appear in<\/mark> <mark class=\"new\">Novo<\/mark><mark class=\"same\">; letting<\/mark> <mark class=\"new\">the default judgment<\/mark> <mark class=\"same\">go by is no breach.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Meridian has no natural justice defence.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Rules out a natural justice defence: Meridian was properly served and chose not to appear. One line."}, {"letter": "D", "code": "J7.1.4", "title": "Fresh Money Judgment for a Definite Sum", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y,<\/mark> <mark class=\"new\">each money sum<\/mark> <mark class=\"same\">must be fixed or arithmetically ascertainable<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">Principal and interest at a stated rate both qualify.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y,<\/mark> <mark class=\"new\">the order to deliver up share certificates<\/mark> <mark class=\"same\">is not enforceable at common law, a relic of indebitatus assumpsit.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "J7.2.8", "title": "Satisfaction", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y,<\/mark> <mark class=\"new\">Meridian<\/mark> <mark class=\"same\">has paid<\/mark> <mark class=\"new\">US$7 million, through the Elbonian sale,<\/mark> <mark class=\"same\">of<\/mark> <mark class=\"new\">the judgment debt<\/mark><mark class=\"same\">, so<\/mark> <mark class=\"new\">Ostrava<\/mark> <mark class=\"same\">may enforce only<\/mark> <mark class=\"new\">the rest<\/mark><mark class=\"same\">; a satisfied judgment cannot be enforced again<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Credit the US$7 million against the compensatory sum.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "J7.2.5", "title": "Punitive Damages; Severance", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Schnabel v Lui<\/i> (NSW), punitive damages punishing<\/mark> <mark class=\"new\">Meridian's failure to obey the order for production<\/mark> <mark class=\"same\">are penal though paid to<\/mark> <mark class=\"new\">Ostrava<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Licea<\/i>, where<\/mark> <mark class=\"new\">the Novo judgment<\/mark> <mark class=\"same\">awards<\/mark> <mark class=\"new\">US$18 million<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">US$6 million in punitive damages<\/mark><mark class=\"same\">,<\/mark> <mark class=\"new\">Ostrava<\/mark> <mark class=\"same\">enforces the unobjectionable part if clearly identifiable and separable<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">As in <i>Sang Cheol Woo<\/i> (statutory interest to a private creditor was not penal, penal meaning payable to the State),<\/mark> <mark class=\"new\">the 20% interest<\/mark> <mark class=\"same\">is not penal.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "J7.1.3", "title": "Final and Conclusive", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Humpuss<\/i> and <i>Eleven v Boxsentry<\/i>,<\/mark> <mark class=\"new\">the default judgment<\/mark> <mark class=\"same\">is final if given final effect until set aside, although<\/mark> <mark class=\"new\">Meridian<\/mark> <mark class=\"same\">may still apply to<\/mark> <mark class=\"new\">the Novo court<\/mark> <mark class=\"same\">to set it aside.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The open appeal period does not change that, as Novo law treats the judgment as binding.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Needed and met: a default judgment that binds until set aside is final (<i>Humpuss<\/i>). One line."}]}, {"id": "J-03.3", "side": "J", "hyp": 3, "n": 3, "source": "Mock Paper 3, Hypo 5", "title": "Ostrava v Meridian and Mr Tan", "full": "Mock Paper 3, Hypo 5", "q": "<p>Ostrava Capital LLC obtained a default judgment in the Novo State Court (State of Novo, Utopia) against Meridian Hospitality Pte Ltd, a Singapore company, for unpaid loan sums. Ostrava then sought enforcement in Elbonia. Meridian defended there on the ground that Ostrava had forged the drawdown notices on which US$5 million of the claim was based. After a full hearing, the Elbonian court found no forgery and declared the Novo judgment enforceable in Elbonia.<\/p><p>Ostrava has now sued Meridian in Singapore on both the Novo judgment and the Elbonian judgment. It also intends to enforce the Novo judgment in Yesouth, where Meridian owns its last remaining hotel. The courts of Yesouth will enforce a Novo judgment without inquiring into allegations of fraud. Last week a former Ostrava employee gave Meridian e-mails which appear to show that the drawdown notices were forged; Meridian could not have obtained them earlier. Neither Utopia nor Elbonia is gazetted under REFJA or a party to the Hague Convention on Choice of Court Agreements.<\/p><p>Advise Meridian on: the effect of the Elbonian judgment in Singapore; whether Ostrava has any other route against it in Singapore; and whether the Singapore court can stop Ostrava from enforcing in Yesouth.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A second judgment that only blesses the first, an original debt that survives both, and a request to stop enforcement in a third country. Each needs a different block.<\/p>\n<p><strong>The Elbonian judgment: J7.1.1.<\/strong> It only declares the Novo judgment enforceable in Elbonia. That is a judgment on a judgment: not on the merits and unenforceable here (<i>Sang Cheol Woo<\/i>). Ostrava must rely on the Novo judgment itself.<\/p>\n<p><strong>Other routes: J7.3.1.<\/strong> A foreign judgment does not merge the original claim (<i>Ocean Tankers<\/i>), so Ostrava can still sue on the loan in Singapore if it is in time. Warn Meridian.<\/p>\n<p><strong>Yesouth: J7.6.0.<\/strong> An AEI needs exceptional circumstances. Fraud can qualify (<i>Ellerman Lines<\/i>), and the evidence is new, so there is no culpable delay. But Elbonia has rejected the forgery after a full hearing, Singapore's interest in Yesouth enforcement is thin, and AEIs \"should generally be refused\". Best view: refused; resist in Yesouth and appeal in Novo.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not treat the Elbonian ruling on forgery as an estoppel through the Elbonian judgment itself. Its real force is the <i>House of Spring Gardens<\/i> bar, and that matters mainly for extrinsic fraud.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The Elbonian judgment is a judgment on a judgment, unenforceable here and raising no estoppel on liability, so Ostrava must rely on the Novo judgment, though it may still sue on the loan because there is no merger; an anti-enforcement injunction against enforcement in Yesouth needs exceptional circumstances, and despite the fresh fraud evidence it is likely to be refused.<\/blockquote>", "items": [{"letter": "A", "code": "J7.3.1", "title": "No Merger", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ocean Tankers<\/i> (SGCA, preliminary view),<\/mark> <mark class=\"new\">the loan claim<\/mark> <mark class=\"same\">does not merge into<\/mark> <mark class=\"new\">the Novo judgment<\/mark><mark class=\"same\">, unlike a Singapore judgment, so<\/mark> <mark class=\"new\">Ostrava<\/mark> <mark class=\"same\">could re-sue on it here<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So even if both judgments fail, Ostrava may sue Meridian on the loan itself, if time allows. Warn Meridian.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "J7.6.0", "title": "Anti-Enforcement Injunction", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Sun Travels<\/i> and C&amp;Y, beyond the usual ASI requirements (J6),<\/mark> <mark class=\"new\">Meridian<\/mark> <mark class=\"same\">must show exceptional circumstances tied to unconscionability.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Sun Travels<\/i>,<\/mark> <mark class=\"new\">Ostrava<\/mark><mark class=\"same\">'s fraud in obtaining<\/mark> <mark class=\"new\">the Novo judgment<\/mark><mark class=\"same\">, e.g.,<\/mark> <mark class=\"new\">forged drawdown notices<\/mark><mark class=\"same\">, is an exceptional circumstance<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Sun Travels<\/i>, AEIs \"should generally be refused\"<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">Elbonia has rejected the forgery, and Singapore's interest in Yesouth is thin.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "J7.3.2.4", "title": "Judgment on a Judgment: No Estoppel", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Merck<\/i>,<\/mark> <mark class=\"new\">the Elbonian judgment<\/mark> <mark class=\"same\">declaring<\/mark> <mark class=\"new\">the Novo judgment<\/mark> <mark class=\"same\">enforceable in<\/mark> <mark class=\"new\">Elbonia<\/mark> <mark class=\"same\">raises no estoppel on<\/mark> <mark class=\"new\">liability<\/mark><mark class=\"same\">; look to<\/mark> <mark class=\"new\">the Novo judgment<\/mark> <mark class=\"same\">itself.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Ostrava's better point is that Elbonia rejected the forgery after a full hearing.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Correct and quick: a judgment on a judgment raises no estoppel on liability (<i>Merck<\/i>). J7.1.1 already carries this point."}, {"letter": "D", "code": "J7.2.1", "title": "Mistake: No Review of the Merits", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Godard v Gray<\/i> and <i>Ralli v Angullia<\/i>,<\/mark> <mark class=\"new\">Meridian<\/mark><mark class=\"same\">'s claim that<\/mark> <mark class=\"new\">the Novo court<\/mark> <mark class=\"same\">erred in<\/mark> <mark class=\"new\">fact<\/mark> <mark class=\"same\">on<\/mark> <mark class=\"new\">the drawdowns<\/mark><mark class=\"same\">, even on Singapore law, is irrelevant; Singapore does not sit on appeal from<\/mark> <mark class=\"new\">the Novo court<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So the forgery point cannot be raised in Singapore at all.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The no-review rule covers mere errors. Fraud is a separate defence with its own test, so the forgery can still be raised."}, {"letter": "E", "code": "J7.1.1", "title": "Judgment on a Judgment", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">The Elbonian judgment<\/mark> <mark class=\"same\">merely declares<\/mark> <mark class=\"new\">the Novo judgment<\/mark> <mark class=\"same\">enforceable in<\/mark> <mark class=\"new\">Elbonia<\/mark><mark class=\"same\">. Per <i>Sang Cheol Woo<\/i> (not following <i>Morgan Stanley v Pilot Lead<\/i> (HK)), it is unenforceable at common law<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Ostrava<\/mark> <mark class=\"same\">must enforce<\/mark> <mark class=\"new\">the Novo judgment<\/mark> <mark class=\"same\">directly.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y,<\/mark> <mark class=\"new\">the Elbonian judgment<\/mark> <mark class=\"same\">(i) never examined<\/mark> <mark class=\"new\">the loan<\/mark><mark class=\"same\">, so is not on the merits; (ii) decides only its territorial effect in<\/mark> <mark class=\"new\">Elbonia<\/mark> <mark class=\"same\">(Merck: no estoppel, J7.3.2.4)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "J6.1", "title": "Amenability", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Glencore<\/i>,<\/mark> <mark class=\"new\">Ostrava<\/mark><mark class=\"same\">, having sued<\/mark> <mark class=\"new\">Meridian<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Singapore on the judgments<\/mark><mark class=\"same\">, submitted to all its incidents, including<\/mark> <mark class=\"new\">counterclaims<\/mark> <mark class=\"same\">and related relief such as<\/mark> <mark class=\"new\">an AEI<\/mark> <mark class=\"same\">(J2.2.2).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So the Singapore court can reach it; whether it should is the question.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Ostrava sued here, so it is amenable to an AEI. Needed, but not where the application is won or lost."}, {"letter": "G", "code": "J7.2.2", "title": "Fraud Already Rejected Abroad", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, fraud cannot be raised where<\/mark> <mark class=\"new\">pleading it is abusive<\/mark> <mark class=\"same\">or<\/mark> <mark class=\"new\">an Elbonian judgment<\/mark> <mark class=\"same\">has rejected it (<i>House of Spring Gardens v Waite<\/i>), which in Singapore matters mainly for<\/mark> <mark class=\"new\">extrinsic<\/mark> <mark class=\"same\">fraud.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The forgery is intrinsic, and Meridian now has fresh evidence (<i>Hong Pian Tee<\/i>).<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Ostrava's best reply on fraud: Elbonia rejected it after a full hearing (<i>House of Spring Gardens<\/i>). But per C&amp;Y that bar matters mainly for extrinsic fraud, and the forgery is intrinsic, where fresh evidence is the test."}]}, {"id": "J-04.1", "side": "J", "hyp": 4, "n": 1, "source": "Mock Paper 4, Hypo 7", "title": "Corvus v Dragoman", "full": "Mock Paper 4, Hypo 7", "q": "<p>Corvus Pte Ltd, a Singapore drilling contractor, drills wells off the Elbonian coast for Dragoman SA, a state-linked Elbonian oil company. Dragoman is registered as a foreign company under the Singapore Companies Act, with a registered office and an authorised representative here, from where it trades crude oil. Their Drilling Services Agreement, dated 10 May 2021 and expressly governed by Elbonian law, provides in clause 17: \"All disputes arising out of or in connection with this agreement shall be resolved exclusively by the local courts.\"<\/p><p>In March 2025, a military junta seized power in Elbonia. It suspended the Elbonian Commercial Court and created \"Economic Tribunals\", staffed by serving military officers, to hear all disputes involving state-linked companies. All 214 reported Tribunal decisions since then have favoured state-linked companies. Corvus's Elbonian lawyer was arrested. When Corvus filed a claim at the Commercial Court registry in June 2025, the registry returned it with a note that the court \"will not accept claims against state-linked entities until further notice\".<\/p><p>Corvus has sued Dragoman in Singapore for unpaid fees, serving it at its Singapore registered office. Dragoman applies for a stay under the Choice of Court Agreements Act. Corvus also alleges that clause 17 was inserted after Dragoman bribed Corvus's then general counsel; under Elbonian law, including its choice of law rules, such a clause is void, but Corvus has no evidence of Elbonian law yet. The Hague Convention on Choice of Court Agreements took legal effect in Elbonia on 1 January 2019. Advise Corvus.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A CCAA stay where the chosen court has collapsed. The marks are in the s 12 exceptions, and then in the common law test that takes over once an exception applies.<\/p>\n<p><strong>Which court: J1.4.1.<\/strong> \"The local courts\" in an Elbonian-law contract for work off Elbonia means Elbonia (<i>6DM<\/i>). Elbonia (2019) and the 2021 contract are in scope, so s 12 applies: Singapore must stay unless an exception applies.<\/p>\n<p><strong>Exceptions: J1.4.2.<\/strong> They are read narrowly, but military judges, 214 rulings out of 214 and an arrested lawyer are cogent evidence of manifest injustice under (c). The registry note arguably means the chosen court declined under (e).<\/p>\n<p><strong>Then strong cause: J4.3.3.<\/strong> Once an exception applies, the common law decides. Corvus is suing in breach, so it bears strong cause, and a chosen court made unavailable by a coup is the <i>Vinmar<\/i> example of it.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not lead with the bribery point. Null and void is for Elbonian law, which Corvus must prove and cannot yet, so it is a weaker lead than the exceptions on the evidence Corvus has.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Cl 17 chooses the Elbonian courts, so s 12 requires a stay unless an exception applies; the military tribunals, the 214 one-sided rulings and the arrested lawyer show manifest injustice, and the registry's refusal arguably means the chosen court declined; the stay then falls to the common law, where a chosen court made unavailable by the coup is strong cause, so Corvus's claim stays in Singapore.<\/blockquote>", "items": [{"letter": "A", "code": "J1.2.5", "title": "Validity: Law of the Chosen Court", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Corvus<\/mark> <mark class=\"same\">says<\/mark> <mark class=\"new\">cl 17<\/mark> <mark class=\"same\">is invalid for<\/mark> <mark class=\"new\">bribery of its general counsel<\/mark><mark class=\"same\">. Per ss 11(1) and 12(1)(a) and the Hartley–Dogauchi Report, validity is for the law of<\/mark> <mark class=\"new\">Elbonia, the chosen court's State<\/mark><mark class=\"same\">, including its choice of law rules<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Corvus has no evidence of Elbonian law yet, and per s 5 the attack must be on cl 17 itself.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "A real argument, and right on the law: Elbonian law, including its choice of law rules, decides validity. But Corvus has no evidence of Elbonian law yet, so this is a plea in the alternative, not the lead."}, {"letter": "B", "code": "J1.4.2", "title": "The Exceptions", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per the Hartley–Dogauchi Report (and C&amp;Y), exceptions (c) and (d) apply \"only in the most exceptional circumstances\" and are read narrowly.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Corvus<\/mark> <mark class=\"same\">leads cogent evidence that<\/mark> <mark class=\"new\">the Tribunals have military judges and a 214–0 record, and its lawyer was arrested<\/mark><mark class=\"same\">, the kind of case the Hartley–Dogauchi Report contemplates.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">(e)<\/mark> <mark class=\"new\">The registry<\/mark> <mark class=\"same\">has<\/mark> <mark class=\"new\">refused Corvus's claim<\/mark><mark class=\"same\">, so<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">may hear<\/mark> <mark class=\"new\">it<\/mark> <mark class=\"same\">under its own rules without breaching the Convention.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "J1.3", "title": "Must Hear", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Cl 17<\/mark> <mark class=\"same\">designates<\/mark> <mark class=\"new\">\"the local courts\", which Corvus reads as Singapore,<\/mark> <mark class=\"same\">and the CCAA applies (J1.2). Per s 11(1),<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">must not decline unless<\/mark> <mark class=\"new\">cl 17<\/mark> <mark class=\"same\">is null and void under Singapore law, including its choice of law rules.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per s 11(2),<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">cannot decline in favour of<\/mark> <mark class=\"new\">Elbonia<\/mark><mark class=\"same\">, so neither Spiliada nor strong cause applies<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "\"The local courts\" in an Elbonian-law contract for Elbonian work means Elbonia, not Singapore (<i>6DM<\/i>). Singapore is the non-chosen court, so s 12 applies, not s 11."}, {"letter": "D", "code": "J4.3.3", "title": "Chosen Court Unavailable", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Vinmar<\/i>, strong cause exists where<\/mark> <mark class=\"new\">Elbonia<\/mark><mark class=\"same\">'s chosen court is dissolved or unavailable through<\/mark> <mark class=\"new\">a coup<\/mark><mark class=\"same\">, or trial there would be so overwhelmingly difficult as to deny justice, if unforeseeable; notorious delay in<\/mark> <mark class=\"new\">Elbonia<\/mark> <mark class=\"same\">is foreseeable and insufficient.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Once an exception applies, the stay is decided at common law: Corvus, suing in breach, bears strong cause, and a court suspended by a junta supplies it.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "J4.1.3", "title": "Stage 2: Unfair Trial", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Rotary<\/i>, once<\/mark> <mark class=\"new\">Elbonia<\/mark> <mark class=\"same\">is clearly more appropriate, refusing a stay is \"at least unusual\";<\/mark> <mark class=\"new\">Corvus<\/mark> <mark class=\"same\">needs cogent evidence of a real and material risk of injustice in<\/mark> <mark class=\"new\">Elbonia<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Cumulative irregularities<\/mark> <mark class=\"same\">(<i>AK Investment<\/i>) or<\/mark> <mark class=\"new\">an arrested lawyer and military judges<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">suffice on cogent evidence<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Spiliada stage 2 is for a stay where there is no clause. Under an exclusive clause, run the s 12 exceptions and then strong cause; the same facts belong there."}, {"letter": "F", "code": "J2.1.4", "title": "Registered and Trading", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per ss 16(2), 17(1)(c),<\/mark> <mark class=\"new\">Dragoman<\/mark> <mark class=\"same\">is served under s 376(a)<\/mark> <mark class=\"new\">at its Singapore registered office, as Corvus did,<\/mark> <mark class=\"same\">without <i>Adams v Cape<\/i>.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So jurisdiction exists as of right; Dragoman's only way out is a stay, and that turns on cl 17.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Correct, and one line: registered and trading, so served as of right. Dragoman does not dispute existence; the fight is over the stay."}, {"letter": "G", "code": "J1.4.1", "title": "Stage 1: \"The Local Courts\"", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Cl 17<\/mark> <mark class=\"same\">refers to<\/mark> <mark class=\"new\">\"the local courts\"<\/mark><mark class=\"same\">. Similar to <i>6DM<\/i>, where \"the local courts\" in an English-law distribution agreement meant England because it renewed an earlier English-clause agreement on a related party's template,<\/mark> <mark class=\"new\">cl 17<\/mark> <mark class=\"same\">means<\/mark> <mark class=\"new\">Elbonia<\/mark> <mark class=\"same\">given<\/mark> <mark class=\"new\">the governing law and the place of the work<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Elbonia has been a Contracting State since 2019 and the agreement dates from 2021, so s 12 is engaged: Singapore must stay unless an exception applies.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "J-04.2", "side": "J", "hyp": 4, "n": 2, "source": "Mock Paper 4, Hypo 7", "title": "Corvus v DL and Lion", "full": "Mock Paper 4, Hypo 7", "q": "<p>Corvus Pte Ltd, a Singapore drilling contractor with a branch office in Suburbia, leases its drilling rig from Dragoman Leasing Ltd (DL), a Suburbian company with no registration or place of business in Singapore, under a Rig Lease dated 3 February 2023 and expressly governed by Suburbian law: \"25. The courts of Suburbia shall have non-exclusive jurisdiction over any dispute under this lease.\" Corvus also holds a political risk policy dated 1 September 2020 from Lion Assurance Pte Ltd, a Singapore insurer, covering the rig. The policy was negotiated in Singapore, is expressly governed by Singapore law and provides: \"30. The English courts shall have exclusive jurisdiction over any dispute under this policy.\" Corvus's drilling contract with Dragoman SA, DL's Elbonian parent, dates from 2021.<\/p><p>In March 2025, a military junta in Elbonia seized the rig, which was working off the Elbonian coast. In January 2026, Corvus sued DL in the Singapore General Division for a declaration that no rent is due after the seizure, and Lion for payment under the policy; it is also suing Dragoman here over the same seizure. DL's finance director, Mr Petrov, was served at a Singapore hotel while on a family holiday; Lion was served at its registered office. DL applies to set aside service and, in the alternative, for a stay in favour of Suburbia. Lion applies for a stay in favour of England. Corvus says it would be absurd for the same seizure to be litigated in several countries.<\/p><p>Litigating in England would cost Corvus about three times as much as in Singapore, and trial in Suburbia takes about three years against 12 months here. The Hague Convention on Choice of Court Agreements applied to the United Kingdom as a member of the European Union from 1 October 2015, and in its own right from 1 January 2021. Advise Corvus.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Two defendants with two different problems: a company served through a director on holiday, and an English clause whose CCAA status turns on a date.<\/p>\n<p><strong>DL: J3.0.2.<\/strong> The defendant is DL, not Mr Petrov. Serving its director founds jurisdiction only if DL itself is present here (<i>Adams v Cape<\/i>), and it has no place of business here. Service is set aside, and Corvus must serve out.<\/p>\n<p><strong>Lion's clause: J1.2.2.<\/strong> The policy dates from 1 September 2020, between the UK's two dates, and continuity across Brexit is contested. If the CCAA applies, s 12 requires a stay, and cost is no exception.<\/p>\n<p><strong>Fragmentation: J4.3.4.<\/strong> At common law Corvus bears strong cause. Fragmentation is its best point, since Dragoman and DL are non-parties and their contracts post-date the policy. But these are three separate contracts with three counterparties, and the English courts work. Best view: stayed either way.<\/p>\n<p><strong>Trap to avoid.<\/strong> <i>Maharanee<\/i> is for a defendant who is a natural person. Serving a company's officer on holiday does not make the company present.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Service on DL's director on holiday does not found jurisdiction over DL, which is not present here, so Corvus must serve DL out and then show Singapore is clearly more appropriate despite the Suburbian clause; Lion's English clause is within the CCAA if the UK's Convention status carried across Brexit, requiring a stay, and even at common law Corvus's fragmentation argument is unlikely to amount to strong cause.<\/blockquote>", "items": [{"letter": "A", "code": "J2.1.1", "title": "Natural Person Present", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Maharanee of Baroda v Wildenstein<\/i> and <i>Colt Industries v Sarlie<\/i>, presence on<\/mark> <mark class=\"new\">a family holiday<\/mark> <mark class=\"same\">suffices without any substantive connection<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So serving Mr Petrov at his hotel founded jurisdiction over DL.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Transient presence founds jurisdiction over a natural person defendant. The defendant here is DL, so Mr Petrov's holiday is irrelevant."}, {"letter": "B", "code": "J2.2.3", "title": "Fall-Back Stay", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Zoom<\/i> and <i>Williams<\/i>, a stay prayed as a fall-back to<\/mark> <mark class=\"new\">DL's set-aside<\/mark> <mark class=\"same\">is not submission, even in<\/mark> <mark class=\"new\">one application<\/mark><mark class=\"same\">, the prayers being considered in sequence.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So DL has not submitted by asking for a stay in the alternative.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Confirms DL's alternative stay is not submission (<i>Zoom<\/i>), so DL's set-aside can still succeed. One line."}, {"letter": "C", "code": "J4.3.4", "title": "Fragmentation", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Vinmar<\/i> (citing <i>Donohue<\/i>), where<\/mark> <mark class=\"new\">non-parties like Dragoman and DL<\/mark> <mark class=\"same\">are involved, splitting<\/mark> <mark class=\"new\">the seizure dispute<\/mark> <mark class=\"same\">across<\/mark> <mark class=\"new\">Singapore and England<\/mark> <mark class=\"same\">risks duplication, inconsistent findings and a race to judgment, and may be strong cause, unless foreseeable at contracting.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The Dragoman contract and the Rig Lease post-date the 2020 policy, so the split was arguably unforeseeable; but these are three contracts with three counterparties.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "J1.2.2", "title": "Contracting State and Date: UK Clauses", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">UK clauses (±): the HCCCA applied to the UK via the EU from 1 October 2015 and in its own right from 1 January 2021; continuity across Brexit is contested, so<\/mark> <mark class=\"new\">cl 30, concluded on 1 September 2020,<\/mark> <mark class=\"same\">is arguable either way.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">If the CCAA applies, s 12 requires a stay, and cost and fragmentation are no exception; if not, strong cause decides.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "J1.1.2", "title": "Foreign NEJC: No Breach Either Way", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Corvus<\/mark> <mark class=\"same\">sues here though<\/mark> <mark class=\"new\">cl 25<\/mark> <mark class=\"same\">names<\/mark> <mark class=\"new\">the courts of Suburbia<\/mark> <mark class=\"same\">non-exclusively. Per <i>Shanghai Turbo (CA)<\/i>, the \"wide waiver of objection\" is rejected, so suing here is no breach, and<\/mark> <mark class=\"new\">DL<\/mark><mark class=\"same\">'s objection is none either, as<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">is not named. Plain Spiliada applies (J4.1).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">If DL is served out, Corvus must show Singapore is clearly more appropriate.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Once DL is served out, the Suburbian clause is non-exclusive, so plain Spiliada applies with the burden on Corvus. That comes after the service problem."}, {"letter": "F", "code": "J1.2.3", "title": "International Case", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 4(1),<\/mark> <mark class=\"new\">the Lion claim<\/mark> <mark class=\"same\">is international unless the parties reside in the same Contracting State and everything else, apart from the chosen court's location, is connected only with that State.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Both parties reside in Singapore, but the rig and the seizure are in Elbonia, so the exception fails.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Needed for Lion: both parties are in Singapore, but the rig and the seizure are in Elbonia, so the case is international. Met, so one line."}, {"letter": "G", "code": "J3.0.2", "title": "The Chairperson-on-Holiday Problem", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per Chong (mid-term feedback), the defendant is<\/mark> <mark class=\"new\">DL<\/mark><mark class=\"same\">, not<\/mark> <mark class=\"new\">Mr Petrov<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">So: serving<\/mark> <mark class=\"new\">Mr Petrov<\/mark> <mark class=\"same\">under O 7 r 2(1)(b) founds jurisdiction only if<\/mark> <mark class=\"new\">DL<\/mark> <mark class=\"same\">is itself present (Adams v Cape; J2.1.5); Maharanee of Baroda (transient presence) is for<\/mark> <mark class=\"new\">a defendant who is a natural person<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">DL has no registration or place of business here, so service is set aside; Corvus must serve out.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "J-04.3", "side": "J", "hyp": 4, "n": 3, "source": "Mock Paper 4, Hypo 7", "title": "Corvus v Dragoman", "full": "Mock Paper 4, Hypo 7", "q": "<p>Corvus Pte Ltd, a Singapore drilling contractor with a branch office in Suburbia, drills wells off the Elbonian coast for Dragoman SA, an Elbonian state-linked oil company, under a Drilling Services Agreement dated 10 May 2021 and expressly governed by Elbonian law. Clause 17 reads: \"All disputes arising out of or in connection with this agreement shall be resolved exclusively by the local courts\", which means the Elbonian courts. Under Elbonian law, clause 17 is a promise that neither party will sue elsewhere.<\/p><p>In February 2026, Dragoman sued Corvus in the court of Suburbia for US$3 million in liquidated damages under the agreement. The originating process was served at Corvus's Suburbian branch. Corvus ignored it, and in April 2026 the Suburbian court gave default judgment against it for US$3 million. Corvus is suing Dragoman in Singapore for unpaid fees, and Dragoman relies on the Suburbian judgment both as a defence to that claim and as a debt due to it.<\/p><p>The Hague Convention on Choice of Court Agreements took legal effect in Elbonia on 1 January 2019 and in Suburbia on 1 January 2020. Suburbia is not gazetted under REFJA. Advise Corvus on the effect of the Suburbian judgment in Singapore, and on any further remedy it has because Dragoman sued in Suburbia.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A judgment from a court nobody chose, obtained in breach of an exclusive clause. Find the regime first, then jurisdiction, then the one defence that fits.<\/p>\n<p><strong>Regime: J7.5.5.<\/strong> Suburbia was not the chosen court, so its judgment is outside CCAA Part 3. The common law still applies.<\/p>\n<p><strong>Jurisdiction: J7.1.2.3.<\/strong> Corvus was served at its own Suburbian branch, a fixed place of business, so it was present and the Suburbian court had international jurisdiction. The default judgment is on the merits and, on the facts, final.<\/p>\n<p><strong>Defence: J7.2.6.<\/strong> Cl 17 is promissory under Elbonian law, and Corvus did not submit, so Dragoman's suit was a real breach. No Singapore case decides the defence, but C&amp;Y support it.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not run the CCAA's refusal grounds just because Suburbia is a Contracting State. Part 3 applies only to judgments of the chosen court.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The Suburbian judgment is outside the CCAA because Suburbia was not the chosen court, so the common law applies; Corvus was present through its Suburbian branch, so the requirements are met, but the suit breached the promissory cl 17 and Corvus never submitted, which gives it an arguable, though untested, defence; even if recognised, the judgment bars the fee claim only on issues it actually decided.<\/blockquote>", "items": [{"letter": "A", "code": "J7.3.2.1", "title": "Estoppel: Requirements", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Merck<\/i> (adopting <i>The Sennar (No 2)<\/i>),<\/mark> <mark class=\"new\">Dragoman<\/mark> <mark class=\"same\">must show (a) a foreign judgment capable of recognition; (b) identical parties or privies; and (c) the same issue.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y,<\/mark> <mark class=\"new\">Dragoman, the Suburbian claimant,<\/mark> <mark class=\"same\">chose<\/mark> <mark class=\"new\">Suburbia<\/mark><mark class=\"same\">, whereas<\/mark> <mark class=\"new\">Corvus<\/mark> <mark class=\"same\">was brought there, may rationally have limited its defence<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">So the judgment is a defence to the fee claim only if it decided the same issue.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Answers Dragoman's use of the judgment as a defence: it estops only on issues actually and necessarily decided, with caution for a default judgment. A line after the defence."}, {"letter": "B", "code": "J7.1.2.3", "title": "Presence: Companies", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Adams v Cape<\/i>,<\/mark> <mark class=\"new\">Corvus<\/mark> <mark class=\"same\">is present in<\/mark> <mark class=\"new\">Suburbia<\/mark> <mark class=\"same\">if, for more than a minimal period, its own business was carried on at or from a fixed place of business<\/mark> <mark class=\"new\">of its own, its Suburbian branch<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">It was served there, so the Suburbian court had international jurisdiction.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "J7.5.3", "title": "Mandatory Refusal (s 14)", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">(−) Per s 14(a), refusal is mandatory if<\/mark> <mark class=\"new\">Corvus<\/mark> <mark class=\"same\">was not notified of<\/mark> <mark class=\"new\">the Suburbian claim<\/mark> <mark class=\"same\">in time to arrange its defence.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Suburbia is a Contracting State, so the CCAA grounds apply.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "CCAA Part 3 covers only the chosen court's judgments. Suburbia's judgment is outside it, so these grounds never apply."}, {"letter": "D", "code": "J7.2.6", "title": "Breach of a Dispute-Resolution Agreement", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per Prof Chong (March 2026 answer scheme), the defence needs a breach, so<\/mark> <mark class=\"new\">cl 17<\/mark> <mark class=\"same\">must have promissory content, e.g.,<\/mark> <mark class=\"new\">a promise under Elbonian law not to sue elsewhere<\/mark><mark class=\"same\">, not<\/mark> <mark class=\"new\">a bare choice<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y,<\/mark> <mark class=\"new\">Corvus<\/mark> <mark class=\"same\">loses the objection if it<\/mark> <mark class=\"new\">had submitted, but it ignored the claim<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">There is no Singapore authority yet, but C&amp;Y support the defence.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "J7.5.5", "title": "Judgment of a Non-Chosen Court", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">cl 17<\/mark> <mark class=\"same\">chose<\/mark> <mark class=\"new\">the Elbonian courts<\/mark><mark class=\"same\">, but<\/mark> <mark class=\"new\">Dragoman<\/mark> <mark class=\"same\">sued in<\/mark> <mark class=\"new\">the Suburbian court<\/mark> <mark class=\"same\">in breach. (+) Per C&amp;Y,<\/mark> <mark class=\"new\">the Suburbian judgment<\/mark> <mark class=\"same\">is outside the CCAA, which does not bar its enforcement under<\/mark> <mark class=\"new\">the common law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">(−) Submitted that the common law should recognise a defence (J7.2.6)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "J1.7", "title": "Damages for Breach", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Tradewaves<\/i> (applying <i>Sunrock Aircraft<\/i>), damages \"can\", not \"must\", be awarded.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Corvus's Suburbian costs<\/mark> <mark class=\"same\">should normally be sought in<\/mark> <mark class=\"new\">the Suburbian action<\/mark><mark class=\"same\">, and<\/mark> <mark class=\"new\">Corvus<\/mark> <mark class=\"same\">must prove the \"unusual features\" in <i>Union Discount v Zoller<\/i><\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Corvus can claim damages for the breach, but damages \"can\", not \"must\", be awarded, and foreign costs are normally for the foreign court (<i>Tradewaves<\/i>). Worth mentioning; not the main answer."}, {"letter": "G", "code": "J7.6.0", "title": "Anti-Enforcement Injunction", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Sun Travels<\/i>, neither<\/mark> <mark class=\"new\">Dragoman<\/mark><mark class=\"same\">'s breach of<\/mark> <mark class=\"new\">cl 17<\/mark> <mark class=\"same\">nor<\/mark> <mark class=\"new\">vexatious conduct<\/mark> <mark class=\"same\">suffices alone<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Judgment has been given, so an AEI needs exceptional circumstances, and the chosen court is Elbonia's, not Singapore's.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Judgment is already given, so restraint needs exceptional circumstances, and breach alone is not enough (<i>Sun Travels<\/i>). The chosen court is Elbonia's, so Singapore is the wrong place to ask."}]}, {"id": "J-05.1", "side": "J", "hyp": 5, "n": 1, "source": "Mock Paper 5, Hypo 9", "title": "Bright Harvest v Nordlund", "full": "Mock Paper 5, Hypo 9", "q": "<p>Bright Harvest Pte Ltd, a Singapore palm oil trader, was placed under judicial management by the Singapore court in February 2026. Nordlund AS, a Lusitanian company with no presence in Singapore, had sued Bright Harvest in the Singapore General Division in 2023, claiming that the proceeds of a cargo were held on trust for it. After a full trial in 2024, the court dismissed the claim, finding that there was no trust.<\/p><p>In March 2026, Nordlund sued Bright Harvest in Suburbia on the same dealings under the Suburbian doctrine of \"judicial estoppel\", which is unknown to Singapore law, and obtained an attachment over a receivable owed to Bright Harvest in Suburbia. Nordlund says its new claim rests on e-mails it found in 2025. Those e-mails were disclosed to it in the Singapore action in 2023. If the attachment stands, Nordlund will rank ahead of Bright Harvest's other creditors.<\/p><p>The judicial managers ask whether the Singapore court, excluding the SICC, can and should restrain Nordlund from continuing the Suburbian proceedings. Advise them.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A foreign claim brought after a Singapore judgment, by the party that lost here. Name the basis first: abuse of Singapore's process, which has its own, shorter list of elements.<\/p>\n<p><strong>Interest: J6.2.2.<\/strong> Singapore has already given judgment, so its interest in protecting that judgment is self-evident and the natural forum is irrelevant (<i>BCS v Baker<\/i>).<\/p>\n<p><strong>Abuse: J6.3.3.<\/strong> Judicial estoppel is the decided trust issue under a new label, and it does not matter that it could not be brought here. Suing abroad to jump ahead of other creditors in a Singapore judicial management is abuse in its own right (<i>BCS v Baker<\/i>, citing <i>SNIA<\/i>). E-mails disclosed in 2023 are not new facts.<\/p>\n<p><strong>Advantage: J6.4.<\/strong> For an abuse ASI there is no weighing of Nordlund's lost advantage. The attachment and the priority are exactly what make the suit abusive.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not run natural forum or the vexation balancing. Abuse of process needs only amenability and Singapore's self-evident interest. Ask for the attachment to be released too.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Singapore has a self-evident interest in protecting its 2024 judgment; Nordlund's judicial estoppel claim is the decided trust issue under a new label, and suing abroad to rank ahead of other creditors in a Singapore judicial management is itself abusive, so its Suburbian advantage is no answer and, once Nordlund is shown to be amenable, the ASI should be granted.<\/blockquote>", "items": [{"letter": "A", "code": "J6.3.2", "title": "Relitigation as Vexation", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Even without<\/mark> <mark class=\"new\">a breach of agreement<\/mark><mark class=\"same\">,<\/mark> <mark class=\"new\">the judicial managers<\/mark> <mark class=\"same\">argue<\/mark> <mark class=\"new\">Nordlund<\/mark><mark class=\"same\">'s<\/mark> <mark class=\"new\">Suburbian proceedings<\/mark> <mark class=\"same\">are vexatious or oppressive.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Similar to <i>BCS v Baker<\/i>, where a Californian judicial estoppel claim after the SICC judgment repackaged the decided trust issue,<\/mark> <mark class=\"new\">Nordlund<\/mark><mark class=\"same\">'s<\/mark> <mark class=\"new\">Suburbian claim<\/mark> <mark class=\"same\">reopens<\/mark> <mark class=\"new\">the trust issue<\/mark> <mark class=\"same\">decided in<\/mark> <mark class=\"new\">the 2023 action<\/mark> <mark class=\"same\">under a new label: both vexatious and an abuse (J6.3.3).<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The relitigation line reaches the same answer under vexation. But vexation brings back the <i>SNIA<\/i> balancing; the abuse basis is cleaner and needs no natural forum."}, {"letter": "B", "code": "J6.2.2", "title": "Self-Evident Interest; Consecutive Proceedings", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently, Singapore has given judgment in<\/mark> <mark class=\"new\">the 2023 trust action<\/mark><mark class=\"same\">, so it has interest to protect<\/mark> <mark class=\"new\">that judgment<\/mark> <mark class=\"same\">from collateral attack by<\/mark> <mark class=\"new\">Nordlund<\/mark> <mark class=\"same\">relitigating res judicata issues abroad (<i>Baker v BCS<\/i>; C&amp;Y).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>BCS v Baker<\/i>, natural forum is then irrelevant: Singapore's interest in protecting its processes, jurisdiction and judgments is \"generally self-evident\"<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">The judicial estoppel claim was raised in March 2026, after the 2024 judgment, so the proceedings are consecutive.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "J6.1", "title": "Amenability", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Glencore<\/i>,<\/mark> <mark class=\"new\">Nordlund<\/mark><mark class=\"same\">, having sued<\/mark> <mark class=\"new\">Bright Harvest<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">the 2023 action<\/mark><mark class=\"same\">, submitted to all its incidents, including<\/mark> <mark class=\"new\">costs and counterclaims<\/mark> <mark class=\"same\">and related relief such as<\/mark> <mark class=\"new\">an ASI<\/mark> <mark class=\"same\">(J2.2.2).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">If<\/mark> <mark class=\"new\">Nordlund<\/mark> <mark class=\"same\">is<\/mark> <mark class=\"new\">treated as abroad, its 2023 submission being spent<\/mark><mark class=\"same\">,<\/mark> <mark class=\"new\">the judicial managers<\/mark> <mark class=\"same\">must first obtain permission to serve<\/mark> <mark class=\"new\">the ASI claim<\/mark> <mark class=\"same\">out under O 8 r 1 ROC 2021 (J3.1).<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Always required, and live here: Nordlund sued in 2023, but submission in an earlier suit may not carry over (<i>Lakshmi<\/i>), so serve the ASI claim out if needed. A paragraph, not the deciding issue."}, {"letter": "D", "code": "J6.2.5", "title": "Dual Fora: Singapore Is Neither", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Nordlund<\/mark> <mark class=\"same\">sued in<\/mark> <mark class=\"new\">Suburbia<\/mark> <mark class=\"same\">while the natural forum is<\/mark> <mark class=\"new\">in doubt: the dealings were in Singapore, but the receivable is in Suburbia<\/mark><mark class=\"same\">. Per <i>Airbus<\/i>, comity generally requires Singapore to have sufficient interest before indirectly interfering.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Akai<\/i>,<\/mark> <mark class=\"new\">the Suburbian court<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">this court<\/mark> <mark class=\"same\">may legitimately differ, and Singapore should not be an \"international busybody\"<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Dual fora is for a foreign suit in which Singapore has no interest of its own. Here Singapore's own judgment is under attack, so its interest is self-evident."}, {"letter": "E", "code": "J6.4", "title": "Abuse: Advantage Is No Answer", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Abuse of process: the advantage is irrelevant (BCS v Baker).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>BCS v Baker<\/i>, \"it is the very existence of an advantage outside the forum which may justify injunctive relief\" where<\/mark> <mark class=\"new\">Suburbian laws<\/mark> <mark class=\"same\">are used to interfere with<\/mark> <mark class=\"new\">Singapore's processes<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Nordlund<\/mark><mark class=\"same\">'s<\/mark> <mark class=\"new\">attachment and priority over other creditors<\/mark> <mark class=\"same\">is exactly what makes<\/mark> <mark class=\"new\">the Suburbian proceedings<\/mark> <mark class=\"same\">abusive.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "J6.3.3", "title": "Abuse of Singapore's Process", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Similar to <i>BCS v Baker<\/i>, where the judicial estoppel claim was the decided trust issue under a new label (\"different sides of the same coin\"), added as an afterthought,<\/mark> <mark class=\"new\">Nordlund<\/mark><mark class=\"same\">'s<\/mark> <mark class=\"new\">Suburbian claim<\/mark> <mark class=\"same\">is in substance<\/mark> <mark class=\"new\">the trust issue decided in 2024<\/mark><mark class=\"same\">; that it could not be brought here is irrelevant.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>BCS v Baker<\/i> (citing <i>SNIA<\/i>), abuse also covers<\/mark> <mark class=\"new\">Nordlund<\/mark> <mark class=\"same\">suing abroad to gain an advantage over<\/mark> <mark class=\"new\">other creditors<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Bright Harvest's judicial management<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "J7.3.1", "title": "Cause of Action Estoppel", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Arnold<\/i>, it arises where the cause of action in<\/mark> <mark class=\"new\">the Suburbian action<\/mark> <mark class=\"same\">is identical to that in<\/mark> <mark class=\"new\">the 2023 Singapore action<\/mark><mark class=\"same\">, between the same parties or privies, on the same subject matter; per C&amp;Y it is an absolute bar absent<\/mark> <mark class=\"new\">fraud or collusion<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Bright Harvest should plead the 2024 judgment as res judicata in Suburbia and leave it there.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "This block is about the effect in Singapore of a foreign judgment. The judgment here is Singapore's own, and whether it bars the Suburbian claim is for the Suburbian court; it does not found an ASI."}]}, {"id": "J-05.2", "side": "J", "hyp": 5, "n": 2, "source": "Mock Paper 5, Hypo 9", "title": "Bright Harvest v Agrimax", "full": "Mock Paper 5, Hypo 9", "q": "<p>Bright Harvest Pte Ltd, a Singapore palm oil trader, was placed under judicial management by the Singapore court in February 2026. For many years it sold palm oil to Agrimax Inc, a Utopian company, through Agrimax's Singapore branch, under contracts governed by Singapore law which were negotiated, concluded and performed in Singapore and contain no jurisdiction clause. Agrimax was registered as a foreign company in Singapore; it closed its branch in January 2026 but remains on the register.<\/p><p>In April 2025, Agrimax sued Bright Harvest in Utopia under the Utopian Fair Commodities Act, alleging price-fixing and claiming treble damages. That claim can only be brought in Utopia, and Bright Harvest's dealings with Agrimax would not amount to a wrong under Singapore law. Bright Harvest's previous management knew of the action but did nothing. Trial is fixed for January 2027. Agrimax has now applied to the Utopian court for an order restraining Bright Harvest from seeking any relief in Singapore in relation to the Utopian action.<\/p><p>The judicial managers ask whether the Singapore court, excluding the SICC, can and should restrain Agrimax from continuing the Utopian action and from pursuing its Utopian application. Advise them.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A claim that exists only abroad, against a Singapore company in insolvency, plus a foreign application aimed at Singapore's own court. There is no clause, so the basis is single forum, with an anti-anti-suit layer on top.<\/p>\n<p><strong>Interest: J6.2.4.<\/strong> Singapore can never be the natural forum for a Utopian statutory claim, so ask whether Singapore has sufficient interest and whether the suit is unconscionable. The dealings were Singapore business under Singapore law (<i>Midland Bank v Laker<\/i>), and the insolvency is administered here (<i>BCS v Baker<\/i>).<\/p>\n<p><strong>Agrimax's application: J6.5.1.<\/strong> Singapore may restrain Agrimax from seeking a Utopian order against relief in Singapore, to protect its own proceedings. That is stronger here, because the target is the judicial management's own court.<\/p>\n<p><strong>Delay: J6.3.1.5.<\/strong> The previous management sat on the action for about a year, and that counts against the company. Trial is close, so the judicial managers must apply at once.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not treat the claim as vexatious just because Singapore law knows no such wrong (<i>British Airways v Laker<\/i>). The case for relief rests on the Singapore character of the dealings and the insolvency, and it remains arguable.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Agrimax's statutory claim lies only in Utopia, so the question is whether Singapore has sufficient interest and the suit is unconscionable: the Singapore-centred dealings and the Singapore judicial management support an ASI, and an anti-anti-suit injunction is stronger still because Agrimax targets the judicial management's own court, but the year of delay under the previous management and the harshness of removing Agrimax's only remedy make the outcome arguable, so the judicial managers must apply now.<\/blockquote>", "items": [{"letter": "A", "code": "J6.3.1.5", "title": "Delay and Comity", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Bright Harvest<\/mark> <mark class=\"same\">waited<\/mark> <mark class=\"new\">about a year<\/mark> <mark class=\"same\">after<\/mark> <mark class=\"new\">the Utopian action<\/mark> <mark class=\"same\">began<\/mark> <mark class=\"new\">in April 2025<\/mark><mark class=\"same\">. Per <i>Sun Travels<\/i> (following <i>Ecobank<\/i> and <i>Sea Powerful<\/i>), comity is relevant to delay even in contractual cases, and how far<\/mark> <mark class=\"new\">the action has<\/mark> <mark class=\"same\">progressed matters more than the delay's length<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The previous management's inaction counts against the company, and trial is fixed for January 2027, so apply at once.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "J6.3.1.1", "title": "Breach of Agreement", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, breach is a question of interpretation under<\/mark> <mark class=\"new\">Singapore law, the contracts' proper law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Sun Travels<\/i>, breach is a separate basis: no unconscionability is needed<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">Suing abroad on Singapore-law dealings breaches the contracts.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The contracts have no jurisdiction clause, and a choice of Singapore law is not a promise not to sue elsewhere. There is no contractual basis here."}, {"letter": "C", "code": "J6.3.2", "title": "Claim Unknown Here Is Not Vexation", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">treble damages for price-fixing<\/mark> <mark class=\"same\">cannot be brought in<\/mark> <mark class=\"new\">Singapore<\/mark><mark class=\"same\">. Per <i>British Airways v Laker<\/i>, respect for foreign substantive law is part of comity, so that alone is not vexatious<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Agrimax will cite <i>British Airways v Laker<\/i>, but Bright Harvest dealt in Singapore, not under a Utopian licensing regime.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Agrimax's best answer: respect for foreign law is part of comity. Bright Harvest distinguishes <i>British Airways v Laker<\/i> because it never submitted to a Utopian regime. A line within single forum."}, {"letter": "D", "code": "J6.2.4", "title": "Single Forum", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Agrimax's claim<\/mark> <mark class=\"same\">lies only in<\/mark> <mark class=\"new\">the Utopian court<\/mark><mark class=\"same\">, so Singapore can never be the natural forum. Per <i>Airbus<\/i> and <i>BCS v Baker<\/i>, the questions are whether Singapore still has sufficient interest and whether pursuing<\/mark> <mark class=\"new\">that claim<\/mark> <mark class=\"same\">is unconscionable.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Similar to <i>Midland Bank v Laker<\/i>, where an English bank's dealings with Laker were English banking business under English law, \"overwhelmingly English\" in character (<i>Airbus<\/i>),<\/mark> <mark class=\"new\">Bright Harvest<\/mark><mark class=\"same\">'s dealings with<\/mark> <mark class=\"new\">Agrimax<\/mark> <mark class=\"same\">were<\/mark> <mark class=\"new\">conducted in Singapore under Singapore law<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "J2.1.4", "title": "Ceased Business, Still Registered", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 376(c),<\/mark> <mark class=\"new\">Agrimax, which<\/mark> <mark class=\"same\">\"has ceased to maintain a place of business in Singapore\" is served at<\/mark> <mark class=\"new\">its registered office in Utopia<\/mark><mark class=\"same\">, or under (a)–(b) if<\/mark> <mark class=\"new\">its Singapore office or representative<\/mark> <mark class=\"same\">remains.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Agrimax is amenable: it is still on the register.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Agrimax is still registered, so it can be served under s 376(c) and is amenable. Needed, but not contested."}, {"letter": "F", "code": "J6.4", "title": "Weighing Agrimax's Loss", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, weigh (i) the<\/mark> <mark class=\"new\">treble damages claim<\/mark> <mark class=\"same\">lost, e.g.,<\/mark> <mark class=\"new\">its only remedy<\/mark><mark class=\"same\">, which counts less where<\/mark> <mark class=\"new\">Utopia<\/mark> <mark class=\"same\">is not the natural forum (UBS v Telesto); (ii)<\/mark> <mark class=\"new\">the remedy<\/mark> <mark class=\"same\">sought abroad; and (iii) how far<\/mark> <mark class=\"new\">the Utopian proceedings<\/mark> <mark class=\"same\">have advanced (J6.3.1.5).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">An ASI here removes Agrimax's only remedy, so C&amp;Y call it especially harsh.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The other side of the scale: the ASI would remove Agrimax's only remedy. Worth weighing, but it does not decide whether Singapore has an interest."}, {"letter": "G", "code": "J6.5.1", "title": "Anti-Anti-Suit Injunctions", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Agrimax has applied<\/mark> <mark class=\"same\">to<\/mark> <mark class=\"new\">the Utopian court<\/mark> <mark class=\"same\">for an ASI against<\/mark> <mark class=\"new\">any Singapore relief<\/mark><mark class=\"same\">. Per <i>Airbus<\/i> and C&amp;Y, Singapore may restrain<\/mark> <mark class=\"new\">Agrimax<\/mark> <mark class=\"same\">from seeking it, to protect its own proceedings, on the usual requirements (J6.1–J6.4).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The application targets relief in the judicial management's own court, which strengthens the case.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "J-05.3", "side": "J", "hyp": 5, "n": 3, "source": "Mock Paper 5, Hypo 9", "title": "Bright Harvest v Seastar and Kalmar", "full": "Mock Paper 5, Hypo 9", "q": "<p>Bright Harvest Pte Ltd, a Singapore palm oil trader, is under judicial management in Singapore. Its judicial managers are concerned about two foreign actions.<\/p><ul><li>Seastar Shipping Ltd, an Elbonian company with no presence in Singapore, chartered a vessel to Bright Harvest under a charterparty governed by English law, which refers all disputes to arbitration in London. In May 2026, Seastar sued Bright Harvest in Ruritania for demurrage. Bright Harvest applied for a stay there, but the Ruritanian court refused it. No arbitration has begun. Ruritania is a party to the New York Convention.<\/li><li>Kalmar Ltd, a Buritanian company with no presence in Singapore, claims that Bright Harvest's former subsidiary destroyed its plantation in Buritania. The events, the witnesses and the governing law are all in Buritania. Bright Harvest's only link with Lusitania is a bank account there. Kalmar has sued Bright Harvest in Lusitania, where it can get a jury trial on a contingency fee basis. Bright Harvest has started proceedings in Buritania for a declaration of non-liability. The Buritanian courts cannot grant anti-suit injunctions, and Kalmar has no assets or presence outside Buritania.<\/li><\/ul><p>No Singapore proceedings are pending against Seastar or Kalmar. Advise the judicial managers whether the Singapore court, excluding the SICC, can and should restrain the Ruritanian and Lusitanian actions.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Two foreign suits with no Singapore anchor. Each fails on a different element, so name the basis for each (<i>Cooperative Muratori<\/i>) before reaching for remedies.<\/p>\n<p><strong>Seastar: J6.2.7.<\/strong> The arbitration is seated in London under English law. Singapore generally refrains from ASIs supporting foreign arbitration, and <i>UniCredit<\/i> relied on an English-law connection that Singapore lacks here. Leave it to the English court.<\/p>\n<p><strong>Kalmar: J6.2.5.<\/strong> Singapore is neither the natural nor the agreed forum. That Buritania cannot grant ASIs is not enough (<i>Airbus<\/i>); only an interested court can act.<\/p>\n<p><strong>Amenability: J6.1.<\/strong> Neither respondent has any presence or assets here, and there is no Singapore action against either. Service out may not be enough (<i>Akai<\/i>), and without amenability no ASI issues at all.<\/p>\n<p><strong>Trap to avoid.<\/strong> The judicial management does not make every foreign creditor's suit an abuse of Singapore's process. That works for a creditor trying to jump the queue after a Singapore judgment, as Nordlund did, not for ordinary claims abroad.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Seastar's breach of a London arbitration agreement gives Singapore no interest of its own, Singapore is neither the natural nor the agreed forum for Kalmar's Buritanian dispute, and neither respondent is amenable here, so both applications should be refused; Bright Harvest should go to the English court on the arbitration and defend or resist in Lusitania and Buritania.<\/blockquote>", "items": [{"letter": "A", "code": "J6.3.1.1", "title": "Breach of an Arbitration Agreement", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, the same applies to suits in breach of<\/mark> <mark class=\"new\">the London arbitration agreement<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Seastar is in breach, but breach does not give Singapore an interest in a London arbitration.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Seastar is in breach of the London clause, but breach alone does not give Singapore a sufficient interest in someone else's seat."}, {"letter": "B", "code": "J6.5.3", "title": "s 4(10A) CLA", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">s 4(10A) CLA (±): Power to aid<\/mark> <mark class=\"new\">the Buritanian court<\/mark><mark class=\"same\">'s proceedings is not discretion: the Akai objection to interfering with<\/mark> <mark class=\"new\">the Lusitanian court<\/mark> <mark class=\"same\">remains (J6.2.5).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So the 2022 power does not answer the comity objection.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The 2022 power to aid foreign proceedings gives power, not a reason to interfere with Lusitania. One line on Kalmar."}, {"letter": "C", "code": "J6.1", "title": "Amenability: Service Out Alone", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Similar to <i>Akai<\/i>, where the respondent, though served out on ostensible evidence, was not amenable as it had no presence or assets here and only opposed the ASI,<\/mark> <mark class=\"new\">Seastar and Kalmar have no presence or assets in Singapore<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">If<\/mark> <mark class=\"new\">Seastar or Kalmar<\/mark> <mark class=\"same\">is<\/mark> <mark class=\"new\">abroad without submitting<\/mark><mark class=\"same\">,<\/mark> <mark class=\"new\">Bright Harvest<\/mark> <mark class=\"same\">must first obtain permission to serve<\/mark> <mark class=\"new\">the ASI claim<\/mark> <mark class=\"same\">out under O 8 r 1 ROC 2021 (J3.1).<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "J6.0.2", "title": "Foreign Court Refused a Stay", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">the Ruritanian court<\/mark> <mark class=\"same\">refused to stay<\/mark> <mark class=\"new\">Seastar's action<\/mark><mark class=\"same\">. Per <i>Lakshmi<\/i>, comity does not generally bar an ASI if Singapore is clearly the more appropriate forum and<\/mark> <mark class=\"new\">Seastar<\/mark> <mark class=\"same\">sued vexatiously.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So the refusal is no bar in itself, but Singapore is not the more appropriate forum either.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The Ruritanian refusal is no bar in itself (<i>Lakshmi<\/i>), but that helps only where Singapore is the more appropriate forum, which it is not."}, {"letter": "E", "code": "J6.2.5", "title": "Dual Fora: Singapore Is Neither", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Kalmar<\/mark> <mark class=\"same\">sued in<\/mark> <mark class=\"new\">Lusitania<\/mark> <mark class=\"same\">while the natural forum is<\/mark> <mark class=\"new\">Buritania<\/mark><mark class=\"same\">. Per <i>Airbus<\/i>, comity generally requires Singapore to have sufficient interest before indirectly interfering.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Similar to <i>Airbus<\/i>, where India, the natural forum, could not reach the claimants,<\/mark> <mark class=\"new\">Buritania<\/mark><mark class=\"same\">'s inability to<\/mark> <mark class=\"new\">restrain Kalmar<\/mark> <mark class=\"same\">does not justify Singapore acting: \"only the courts of an interested jurisdiction can act\".<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "J6.2.2", "title": "Protecting Singapore's Own Process", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Seastar's and Kalmar's suits abuse<\/mark> <mark class=\"same\">Singapore's process by<\/mark> <mark class=\"new\">undermining the judicial management<\/mark><mark class=\"same\">. Per <i>BCS v Baker<\/i>, natural forum is then irrelevant<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The judicial management makes Singapore's interest self-evident.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "That basis protects a Singapore judgment or pending Singapore proceedings. There is none against Seastar or Kalmar, and the judicial management alone does not make their claims an abuse."}, {"letter": "G", "code": "J6.2.7", "title": "Arbitration Seated Abroad", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Seastar<\/mark> <mark class=\"same\">sued in<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">in breach of<\/mark> <mark class=\"new\">the charterparty's arbitration clause<\/mark> <mark class=\"same\">seated in<\/mark> <mark class=\"new\">London<\/mark><mark class=\"same\">. Per C&amp;Y, Singapore generally refrains from ASIs supporting foreign arbitration. Per <i>R1 International<\/i> (obiter), a permanent ASI needs strong reasons<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>UniCredit<\/i>, comity has little role where<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">England<\/mark> <mark class=\"same\">are New York Convention states.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">But <i>UniCredit<\/i> relied on an English-law connection; nothing links this charter to Singapore.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "J-05.4", "side": "J", "hyp": 5, "n": 4, "source": "Mock Paper 5, Hypo 9", "title": "Bright Harvest v Agrimax", "full": "Mock Paper 5, Hypo 9", "q": "<p>Bright Harvest Pte Ltd, a Singapore palm oil trader now under judicial management in Singapore, sold palm oil for many years to Agrimax Inc, a Utopian company, through Agrimax's Singapore branch, under Singapore-law contracts negotiated and performed in Singapore. Bright Harvest has never had an office or staff in Utopia.<\/p><p>In April 2025, Agrimax sued Bright Harvest in Utopia under the Utopian Fair Commodities Act, claiming treble damages for price-fixing. The Act provides that treble damages are payable to the private claimant \"in order to punish and deter price-fixing\". The originating process was served on Bright Harvest in Singapore under Utopian service out rules. Bright Harvest's previous management knew of the action but did nothing. Its dealings would not amount to a wrong under Singapore law. Utopia is not gazetted under REFJA and is not a party to the Hague Convention on Choice of Court Agreements.<\/p><p>The judicial managers ask what effect a Utopian judgment for treble damages would have in Singapore if the action is not restrained, and whether the answer would differ if a Singapore anti-suit injunction had been granted and Agrimax had carried on regardless. Advise them.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A foreign judgment against a defendant that never went there, for a multiple of damages meant to punish. Start with jurisdiction; the penal point and the ASI point are fallbacks.<\/p>\n<p><strong>Jurisdiction: J7.1.2.<\/strong> Agrimax must show presence or submission by Singapore's rules. Bright Harvest had no office in Utopia and did nothing there, and Utopian service-out jurisdiction does not count. So the judgment is not enforceable here.<\/p>\n<p><strong>If that fails: J7.2.5.<\/strong> Treble damages paid to a private party but designed to \"punish and deter\" are an open question; <i>Licea<\/i> left RICO open, and C&amp;Y questio
