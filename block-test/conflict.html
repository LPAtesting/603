w\">Ruritanian law<\/mark> <mark class=\"same\">governs, its limitation law applies and Singapore's does not; per s 3(2), in tort<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">'s period applies<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">If every court applies<\/mark> <mark class=\"new\">Ruritanian law<\/mark><mark class=\"same\">'s period, the bar follows<\/mark> <mark class=\"new\">Mei Foods<\/mark> <mark class=\"same\">everywhere, so time bars recede at stage 2<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Mei Foods sued 14 months after the collision, so it is out of time in Singapore too.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "J-08.2", "side": "J", "hyp": 8, "n": 2, "source": "Mock Paper 8, Hypo 15", "title": "Ocean Reefer v Aster Line", "full": "Mock Paper 8, Hypo 15", "q": "<p>Ocean Reefer Pte Ltd, a Singapore seafood importer, shipped chilled seafood from Suburbia to Singapore on the MV <i>Aster<\/i>, operated by Aster Line Ltd, a Suburbian company with no presence in Singapore. The bill of lading, dated 2 January 2025 and expressly governed by Suburbian law, provides: \"25. Any claim against the Carrier under this bill of lading shall be brought exclusively in the courts of Suburbia.\" Ocean Reefer also has a Master Services Agreement with Aster Line dated 1 June 2024, expressly governed by Singapore law, under which Aster Line agreed to give Ocean Reefer priority space and to monitor its chilled cargo during every voyage. It provides: \"12. The Singapore courts shall have exclusive jurisdiction over all disputes arising out of or in connection with this agreement.\"<\/p><p>On 12 January 2025, the <i>Aster<\/i> collided with another vessel in Ruritanian waters and all the cargo was lost. Ocean Reefer says that the crew failed to monitor the cargo before the collision and sailed too fast in fog. It obtained approval to serve Aster Line in Suburbia with a Singapore claim for breach of the Master Services Agreement and of the bill of lading, and for negligence. Aster Line applies to set aside service in favour of Suburbia.<\/p><p>Suburbia has been a party to the Hague Convention on Choice of Court Agreements since 1 January 2019. Advise Ocean Reefer. Exclude any discussion of the SICC.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Two exclusive clauses pointing to two countries, and three claims arising from one voyage. Fix the regime, then send each claim to the clause it belongs to.<\/p>\n<p><strong>Regime: J1.2.4.<\/strong> Carriage of goods is excluded from the CCAA, so the bill of lading clause, and arguably the Master Services clause, are dealt with at common law, even though both States are Contracting States.<\/p>\n<p><strong>Which clause: J1.5.2.<\/strong> With competing clauses there is no extended <i>Fiona Trust<\/i> presumption (<i>Allianz<\/i>); ask which clause each claim is most closely connected with (<i>Bunge<\/i>). The bill of lading claim goes to Suburbia under cl 25. The monitoring claim under the Master Services Agreement stays in Singapore under cl 12, where Aster Line bears strong cause.<\/p>\n<p><strong>The negligence claim: J1.5.1.<\/strong> \"Under this bill\" is narrower wording, but reframing a cargo claim as negligence rarely escapes a jurisdiction clause (<i>The Jian He<\/i>). Sailing too fast in fog is the carriage itself, so the claim likely goes with cl 25.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not apply s 11 because cl 12 names Singapore: carriage of goods takes the case out of the CCAA, and in any event cl 12 covers only the Master Services dispute.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The carriage exclusion takes both clauses out of the CCAA, so each claim goes to the clause it is most closely connected with: the bill of lading claim, and likely the negligence claim, to Suburbia under cl 25, where Ocean Reefer cannot show strong cause, and the monitoring claim under the Master Services Agreement to Singapore under cl 12, where Aster Line bears strong cause; the resulting split is the foreseeable price of the parties' own clauses.<\/blockquote>", "items": [{"letter": "A", "code": "J1.2.4", "title": "Excluded Matters", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">The CCAA excludes,<\/mark> <mark class=\"same\">per s 9(2), matters such as<\/mark> <mark class=\"new\">carriage of goods<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So the bill of lading clause, and arguably the Master Services clause, fall outside the CCAA, though Suburbia and Singapore are Contracting States.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "J1.3", "title": "Must Hear", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Cl 12<\/mark> <mark class=\"same\">designates<\/mark> <mark class=\"new\">the Singapore courts<\/mark> <mark class=\"same\">and the CCAA applies (J1.2). Per s 11(1),<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">must not decline unless<\/mark> <mark class=\"new\">cl 12<\/mark> <mark class=\"same\">is null and void<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So the whole case stays here, whatever cl 25 says.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Carriage of goods is excluded from the CCAA, so s 11 does not apply. And cl 12 reaches only the Master Services claims, not the whole case."}, {"letter": "C", "code": "J1.5.1", "title": "Reframing Rarely Escapes", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>The Jian He<\/i> (and <i>Rickshaw<\/i>),<\/mark> <mark class=\"new\">Ocean Reefer<\/mark> <mark class=\"same\">may frame its claim in<\/mark> <mark class=\"new\">negligence<\/mark><mark class=\"same\">, but reframing<\/mark> <mark class=\"new\">a cargo claim<\/mark> <mark class=\"same\">rarely escapes a widely drafted<\/mark> <mark class=\"new\">cl 25<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Cl 25 covers claims \"under this bill\", which is narrower, but sailing too fast in fog is the carriage itself.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "J4.3.4", "title": "Fragmentation From the Parties' Own Clauses", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Plead it against<\/mark> <mark class=\"new\">Ocean Reefer<\/mark> <mark class=\"same\">invoking fragmentation (the foreseeable price of<\/mark> <mark class=\"new\">two clauses pointing to two countries<\/mark><mark class=\"same\">)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The split between Suburbia and Singapore is one the parties built into their own contracts.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Ocean Reefer will complain of a split; the reply is that it is the foreseeable result of the two clauses the parties agreed. A line in the strong cause analysis."}, {"letter": "E", "code": "J1.5.2", "title": "Competing Clauses", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Where<\/mark> <mark class=\"new\">the bill of lading<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">the Master Services Agreement<\/mark> <mark class=\"same\">contain competing clauses, there is no extended Fiona Trust presumption (<i>Allianz<\/i>). Per <i>Bunge<\/i>, adopting <i>Oei Hong Leong<\/i>, apply the clause the parties objectively intended, i.e. the one with which<\/mark> <mark class=\"new\">each claim<\/mark> <mark class=\"same\">has the closest connection in its \"pith and substance\"<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Cargo loss in carriage goes to Suburbia; failure to monitor under the Master Services Agreement goes to Singapore.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "J4.3.1", "title": "Not Spiliada", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Strong cause applies where<\/mark> <mark class=\"new\">Ocean Reefer<\/mark> <mark class=\"same\">breaches<\/mark> <mark class=\"new\">cl 25<\/mark><mark class=\"same\">; Spiliada where<\/mark> <mark class=\"new\">no one<\/mark> <mark class=\"same\">does.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Ocean Reefer bears strong cause for the bill of lading claim, and fails.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Correct for the bill of lading claim: suing here breaches cl 25, so strong cause is on Ocean Reefer. Secondary to deciding which clause covers which claim."}, {"letter": "G", "code": "J3.2", "title": "Singapore Clause, Defendant Abroad", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">In practice,<\/mark> <mark class=\"new\">Ocean Reefer<\/mark> <mark class=\"same\">need only show a good arguable case that<\/mark> <mark class=\"new\">cl 12<\/mark> <mark class=\"same\">is valid, binds<\/mark> <mark class=\"new\">Aster Line<\/mark> <mark class=\"same\">and covers<\/mark> <mark class=\"new\">the monitoring claim<\/mark> <mark class=\"same\">(J1.5–J1.6), plus a serious question<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Forum: need not be proved. If<\/mark> <mark class=\"new\">Aster Line<\/mark> <mark class=\"same\">contests it, that breaches its promise<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Explains why the monitoring claim survives the set-aside: Ocean Reefer need only show cl 12 is valid, binds and covers it. Follows once the clauses are sorted."}]}, {"id": "J-08.3", "side": "J", "hyp": 8, "n": 3, "source": "Mock Paper 8, Hypo 15", "title": "Ocean Reefer and Mei Foods v Dunmore", "full": "Mock Paper 8, Hypo 15", "q": "<p>Ocean Reefer Pte Ltd and Mei Foods Pte Ltd, Singapore seafood importers, lost their cargo when the MV <i>Aster<\/i> collided with the MV <i>Boreas<\/i> in Ruritanian waters in January 2025. The <i>Boreas<\/i> is owned by Dunmore Shipping Ltd, an Elbonian company registered in Singapore. Both importers have sued Dunmore in Singapore for negligence, governed on any view by Ruritanian law. More than 50 other cargo owners have sued both shipowners in the Ruritanian Maritime Court, where a 30-day test trial on liability has been held, and the Ruritanian court has ruled, on Dunmore's application, that Ruritania is the natural forum for all claims arising from the collision. Dunmore has applied for a stay of the Singapore actions.<\/p><p>In July 2026, Dunmore began a limitation action in Yesouth, where one of its vessels happened to be calling. Yesouth has no other link with the collision, and its law would limit Dunmore's liability to a fraction of that available elsewhere.<\/p><p>Ocean Reefer and Mei Foods ask whether the Singapore court can restrain the Yesouth action. Exclude any discussion of the SICC.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> An ASI whose basis depends on whether Singapore keeps the case at all. Run it in two branches: Singapore stays its actions, or it does not.<\/p>\n<p><strong>If Singapore stays: J6.2.5.<\/strong> Singapore is then neither the natural nor the agreed forum. Comity requires a sufficient interest, and there is none (<i>Airbus<\/i>). The court to ask is Ruritania's.<\/p>\n<p><strong>If Singapore keeps the case: J6.2.3.<\/strong> Natural forum alone never justifies an ASI (<i>SNIA<\/i>), and given the strong stay case, Singapore is unlikely to be the natural forum anyway.<\/p>\n<p><strong>Vexation: J6.3.2.<\/strong> If an interest exists, the Yesouth action looks vexatious: its only link is a ship that happened to call there, and its purpose is a lower limit. That is the strongest point for the importers.<\/p>\n<p><strong>Trap to avoid.<\/strong> An ASI needs an interest, and the interest falls away with the stay. Do not reach for a contractual basis: Dunmore is not party to the bills of lading.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>If the Singapore actions are stayed in favour of Ruritania, Singapore has no sufficient interest to restrain the Yesouth limitation action and the importers should apply in Ruritania; only if Singapore keeps the case could the tactical, unconnected Yesouth action be restrained as vexatious, and even then natural forum alone would not be enough.<\/blockquote>", "items": [{"letter": "A", "code": "J6.2.5", "title": "Dual Fora: Singapore Is Neither", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Dunmore<\/mark> <mark class=\"same\">sued in<\/mark> <mark class=\"new\">Yesouth<\/mark> <mark class=\"same\">while the natural forum is<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">. Per <i>Airbus<\/i>, comity generally requires Singapore to have sufficient interest before indirectly interfering.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">If Singapore stays its own actions, it is neither the natural nor the agreed forum, and the court to ask is Ruritania's.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "J6.3.1.1", "title": "Breach of Agreement", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, breach is a question of interpretation under<\/mark> <mark class=\"new\">Suburbian law<\/mark><mark class=\"same\">. Presently,<\/mark> <mark class=\"new\">Dunmore<\/mark> <mark class=\"same\">breached<\/mark> <mark class=\"new\">the bill of lading clause<\/mark><mark class=\"same\">, an exclusive<\/mark> <mark class=\"new\">Suburbian<\/mark> <mark class=\"same\">clause, by suing in<\/mark> <mark class=\"new\">Yesouth<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So the importers have a contractual basis for the ASI.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The bill of lading clause is between each importer and the carrier, Aster Line. Dunmore is not a party, so it breaches nothing by suing in Yesouth."}, {"letter": "C", "code": "J6.1", "title": "Amenability", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Dunmore<\/mark> <mark class=\"same\">is amenable, having<\/mark> <mark class=\"new\">defended here<\/mark> <mark class=\"same\">or been validly served<\/mark> <mark class=\"new\">in<\/mark> <mark class=\"same\">Singapore (<i>Koh Kay Yew<\/i>; <i>Westbridge v Mittal<\/i>; C&amp;Y).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">It is registered here, so amenability is not in doubt.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Dunmore is registered and served here, so it is amenable. One line."}, {"letter": "D", "code": "J6.4", "title": "No Undue Injustice", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Kirkham<\/i>, vexation and injustice to<\/mark> <mark class=\"new\">Dunmore<\/mark> <mark class=\"same\">are \"two sides of the same coin\"<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Check too whether the importers' own advantage in Singapore survives the stay; if it does not, they have little to protect.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The balancing step. It matters only if Singapore has an interest; and if the importers lose their own Singapore forum, there is little left for them to protect."}, {"letter": "E", "code": "J6.3.4", "title": "Singapore Public Policy", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, an ASI may give effect to<\/mark> <mark class=\"new\">a Singapore policy of full compensation for cargo loss<\/mark><mark class=\"same\">, in very exceptional cases overriding even<\/mark> <mark class=\"new\">a foreign clause<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">A limitation fund at a fraction of the claims offends that policy.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Different limitation regimes are not policies \"so at variance\" that comity is overridden. This basis is reserved for very exceptional cases."}, {"letter": "F", "code": "J6.2.3", "title": "Alternative Fora: Singapore Is One Forum", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">the cargo claims<\/mark> <mark class=\"same\">can be heard in Singapore or<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">. Per <i>BCS v Baker<\/i> and <i>Airbus<\/i>, an ASI is normally granted where Singapore is the natural forum and the other requirements are met.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>SNIA<\/i> and C&amp;Y, natural forum alone never justifies an ASI<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Given the stay application, Singapore is unlikely to be the natural forum at all.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "J6.3.2", "title": "Vexation or Oppression", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Even without<\/mark> <mark class=\"new\">a breach of agreement<\/mark><mark class=\"same\">,<\/mark> <mark class=\"new\">the importers<\/mark> <mark class=\"same\">argue<\/mark> <mark class=\"new\">Dunmore<\/mark><mark class=\"same\">'s<\/mark> <mark class=\"new\">Yesouth proceedings<\/mark> <mark class=\"same\">are vexatious or oppressive.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Yesouth's only link is a ship that happened to call there, and the action is a tactical bid for a lower limit.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "J-09.1", "side": "J", "hyp": 9, "n": 1, "source": "Mock Paper 9, Hypo 17", "title": "Aerovia v Skylane", "full": "Mock Paper 9, Hypo 17", "q": "<p>Skylane Airways Pte Ltd, a Singapore airline with no assets or place of business in Freedonia, leased aircraft from Aerovia Finance SA, a Freedonian company. Each lease, dated 5 March 2022 and expressly governed by Freedonian law, provides: \"The Freedonian Commercial Court shall have exclusive jurisdiction over all disputes arising out of or in connection with this lease.\"<\/p><p>In February 2025, Aerovia sued Skylane in the Commercial Court for rent under the leases of Aircraft 1 and Aircraft 2, and Skylane defended on the merits. In April 2025, the Commercial Court approved a settlement of the Aircraft 2 claim, under which Skylane agreed to pay US$4 million; it has not paid. In June 2025, over Skylane's timely objection, the Commercial Court transferred the Aircraft 1 claim to the Regional Court of Port Vel, also in Freedonia, to relieve congestion. Shortly before trial, Aerovia's lawyer bribed a court clerk to bring the hearing forward by two days so that Skylane's expert witness could not attend. Skylane learnt of the bribe only after the trial.<\/p><p>In January 2026, the Regional Court ordered Skylane to pay US$20 million in unpaid rent and US$15 million as a statutory multiple of the rent for late return of Aircraft 1, and to deliver up Aircraft 1. Aerovia's actual loss from the late return was US$2 million. Skylane has appealed; under Freedonian law the judgment is enforceable pending the appeal, which will be heard in about 18 months. A 2026 Freedonian Supreme Court decision has since reversed the reading of the law on which the Regional Court found Skylane liable for rent.<\/p><p>Aircraft 1 is parked at Changi. Aerovia applies under the Choice of Court Agreements Act to enforce the judgment and the settlement, and also relies on a Memorandum of Guidance between the Supreme Courts of Singapore and Freedonia. The Hague Convention on Choice of Court Agreements took legal effect in Freedonia on 1 January 2019. Freedonia is not gazetted under REFJA. Advise Skylane on the extent to which the judgment and the settlement will be recognised and enforced under the CCAA.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A CCAA enforcement with one judgment from a transferee court and one judicial settlement. Run scope first, then the mandatory ground before the discretionary ones.<\/p>\n<p><strong>Scope: J7.5.1.<\/strong> A judgment of a court to which the chosen court transferred the case qualifies, and the delivery-up order is a non-money \"judgment\". The Aircraft 2 settlement, approved by the chosen court, is enforced like a judgment if it is enforceable in Freedonia.<\/p>\n<p><strong>Mandatory refusal: J7.5.3.<\/strong> Bribing a clerk to move the hearing so that the expert cannot attend is fraud in connection with procedure. Refusal is mandatory, so the Aircraft 1 judgment fails here entirely.<\/p>\n<p><strong>Discretion, if s 14 fails: J7.5.4.<\/strong> The transfer was discretionary and over a timely objection (s 15(4)). The US$15 million multiple exceeds the US$2 million actual loss (s 16), so sever and enforce the rest (s 19). The pending appeal also allows refusal or postponement (s 15(2)).<\/p>\n<p><strong>Trap to avoid.<\/strong> Mandatory grounds come before discretionary ones. And the fraud has nothing to do with the settlement, so Skylane still owes the US$4 million.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The Regional Court judgment and the settlement are within the CCAA, but the bribed hearing date is procedural fraud, so s 14(b) requires refusal of the Aircraft 1 judgment; in the alternative it may be refused for the objected transfer, with the excess US$13 million cut under s 16 and the rest severed, while the US$4 million settlement is enforced.<\/blockquote>", "items": [{"letter": "A", "code": "J7.4.1", "title": "REFJA Analogues", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 4(5), only<\/mark> <mark class=\"new\">the US$2 million actually lost<\/mark> <mark class=\"same\">of<\/mark> <mark class=\"new\">the statutory multiple<\/mark> <mark class=\"same\">is registered; compare <i>Licea<\/i> at<\/mark> <mark class=\"new\">the common law<\/mark> <mark class=\"same\">(J7.2.5).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per s 4(4),<\/mark> <mark class=\"new\">the delivery-up order<\/mark> <mark class=\"same\">is registrable if \"just and convenient\", unlike at<\/mark> <mark class=\"new\">the common law<\/mark> <mark class=\"same\">(J7.1.4).<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "These are REFJA rules. Freedonia is not gazetted, and REFJA is not examined, so this is not the route."}, {"letter": "B", "code": "J7.5.1", "title": "Scope: Transferee Court; Settlement", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 2(1), only judgments of<\/mark> <mark class=\"new\">the Freedonian Commercial Court<\/mark> <mark class=\"same\">of a Contracting State, or of a court to which it transferred the case under internal allocation rules, qualify.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per ss 2(1) and 20,<\/mark> <mark class=\"new\">the Aircraft 2 settlement<\/mark> <mark class=\"same\">approved by or concluded before<\/mark> <mark class=\"new\">the Commercial Court<\/mark><mark class=\"same\">, ending<\/mark> <mark class=\"new\">that claim<\/mark> <mark class=\"same\">and officially recorded, is enforced (not \"recognised\") like a judgment if enforceable in<\/mark> <mark class=\"new\">Freedonia<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Delivery up also counts (s 2(1)).<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "J7.5.3", "title": "Procedural Fraud (s 14(b))", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 14(b), refusal is mandatory if<\/mark> <mark class=\"new\">the Aircraft 1 judgment<\/mark> <mark class=\"same\">was obtained by fraud in connection with procedure, e.g.,<\/mark> <mark class=\"new\">Aerovia bribing a court clerk to move the hearing<\/mark><mark class=\"same\">; per C&amp;Y, this ≈ extrinsic fraud (J7.2.2).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Keeping Skylane's expert away goes to the result, so the fraud is material, and this defeats the Aircraft 1 judgment whatever the other grounds.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "J7.2.2", "title": "Extrinsic Fraud", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Aerovia's lawyer bribed a court clerk<\/mark><mark class=\"same\">. Per <i>Hong Pian Tee<\/i>, <i>Abouloff<\/i> applies: no new evidence is needed<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, extrinsic fraud includes fraud by<\/mark> <mark class=\"new\">court staff<\/mark><mark class=\"same\">, e.g.,<\/mark> <mark class=\"new\">a bribed clerk<\/mark><mark class=\"same\">, overlapping with natural justice, so <i>Abouloff<\/i> applies.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">This also defeats Aerovia's fallback action at common law.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The same bribe is extrinsic fraud at common law, so Aerovia's fallback action fails too (<i>Abouloff<\/i>: no new evidence needed). The question asks about the CCAA, so this is the alternative."}, {"letter": "E", "code": "J7.5.2", "title": "Effect in the State of Origin; No Merits Review", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 13(2),<\/mark> <mark class=\"new\">the Regional Court judgment<\/mark> <mark class=\"same\">is recognised only if it has effect in<\/mark> <mark class=\"new\">Freedonia<\/mark><mark class=\"same\">, and enforced only if enforceable there<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">It is enforceable pending appeal, so this is no bar.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per s 13(3)(a), the court may not review<\/mark> <mark class=\"new\">the judgment<\/mark><mark class=\"same\">'s merits save to apply Part 3<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">so the 2026 Supreme Court ruling is for Skylane's appeal, not for Singapore.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The judgment is enforceable in Freedonia despite the appeal, so s 13(2) is no bar, and the later Supreme Court ruling is for the appeal. Worth a line, but it decides nothing."}, {"letter": "F", "code": "J7.5.4", "title": "Objected Transfer; Excess Damages; Severance", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 15(4), where<\/mark> <mark class=\"new\">the Commercial Court<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Freedonia<\/mark> <mark class=\"same\">exercised a discretion to transfer to<\/mark> <mark class=\"new\">the Regional Court<\/mark> <mark class=\"same\">over<\/mark> <mark class=\"new\">Skylane<\/mark><mark class=\"same\">'s timely objection, the court may refuse<\/mark> <mark class=\"new\">the Regional Court judgment<\/mark> <mark class=\"same\">against<\/mark> <mark class=\"new\">Skylane<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per s 16, the court may refuse<\/mark> <mark class=\"new\">the judgment<\/mark> <mark class=\"same\">insofar as it awards damages, such as<\/mark> <mark class=\"new\">the US$15 million multiple<\/mark><mark class=\"same\">, exceeding compensation for actual loss.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Per s 19, the court must enforce<\/mark> <mark class=\"new\">the rent award<\/mark> <mark class=\"same\">of<\/mark> <mark class=\"new\">the judgment<\/mark> <mark class=\"same\">if applied for<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "J7.0.2", "title": "Memorandum of Guidance", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Aerovia<\/mark> <mark class=\"same\">relies on the MoG between Singapore and<\/mark> <mark class=\"new\">the Freedonian Supreme Court<\/mark><mark class=\"same\">. Per C&amp;Y, MoGs are non-binding statements of each side's existing law, so<\/mark> <mark class=\"new\">the judgment<\/mark> <mark class=\"same\">must still satisfy<\/mark> <mark class=\"new\">the CCAA or the common law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per s 21 CCAA, the common law remains open, but per C&amp;Y the CCAA is almost always better for<\/mark> <mark class=\"new\">Aerovia<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Disposes of the Memorandum: it is non-binding, so Aerovia still needs the CCAA or the common law. One line."}]}, {"id": "J-09.2", "side": "J", "hyp": 9, "n": 2, "source": "Mock Paper 9, Hypo 17", "title": "Skylane v Aerovia", "full": "Mock Paper 9, Hypo 17", "q": "<p>Aerovia Finance SA, a Freedonian company, leased Aircraft 3 to Skylane Airways Pte Ltd, a Singapore airline, under a lease governed by Freedonian law, which provides that the aircraft may never be sold without Aerovia's consent. In 2024, Aircraft 3 was grounded in Ruritania when Zephyr Aviation Ltd, a Ruritanian maintenance company, asserted a lien over it for unpaid maintenance charges. Zephyr sued in Ruritania. Skylane appeared; Aerovia was notified of the action but chose not to take part. Aerovia has no presence in Ruritania.<\/p><p>In 2025, the Ruritanian court ordered Aircraft 3 to be sold and declared that the buyer, Ostro Air, took title free of all other interests. As a necessary step in fixing Zephyr's lien, the court also decided, on Skylane's argument, that the Aircraft 3 lease had been validly terminated by Skylane in December 2024 because Aerovia had failed to maintain the aircraft. Under Ruritanian law, an order of sale of this kind binds all persons with an interest in the aircraft, whether or not they were parties to the action.<\/p><p>Ostro Air has flown Aircraft 3 to Singapore. Aerovia says that Ostro Air's title is bad and that Skylane still owes it rent on Aircraft 3. Ruritania is not a party to the Hague Convention on Choice of Court Agreements and is not gazetted under REFJA. Advise Skylane on the effect in Singapore of the Ruritanian judgment.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> One judgment with two parts: an order about the aircraft, which binds the world, and a finding about the lease, which binds only those the court had jurisdiction over.<\/p>\n<p><strong>Title: J7.0.2.<\/strong> The order of sale adjudicated title to an aircraft situated in Ruritania when the action began, so it is in rem (<i>Pattni v Ali<\/i>). It binds everyone, including Aerovia, so Ostro Air's title stands.<\/p>\n<p><strong>The lease finding: J7.3.2.1.<\/strong> Skylane wants to use the finding that the lease was terminated as an issue estoppel against Aerovia. The finding was necessary, but an estoppel also needs a recognisable judgment between the same parties.<\/p>\n<p><strong>Jurisdiction over Aerovia: J7.1.2.<\/strong> An in personam finding binds Aerovia only if the Ruritanian court had international jurisdiction over it. Aerovia was never present in Ruritania and took no part, and notice alone is not submission. No estoppel.<\/p>\n<p><strong>Trap to avoid.<\/strong> The in rem order and the in personam finding come from the same judgment but have different reach. Skylane must prove termination again, in Freedonia under the lease's clause.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The order of sale is a judgment in rem over an aircraft located in Ruritania, so Ostro Air's title binds Aerovia; but the finding that the lease was terminated is in personam, and since Aerovia was neither present in Ruritania nor submitted to its court, it raises no estoppel against Aerovia, so Skylane must prove termination again.<\/blockquote>", "items": [{"letter": "A", "code": "J7.1.1", "title": "Judgment on the Merits", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>The Sennar (No 2)<\/i>,<\/mark> <mark class=\"new\">the Ruritanian judgment<\/mark> <mark class=\"same\">is on the merits as<\/mark> <mark class=\"new\">the Ruritanian court<\/mark> <mark class=\"new\">decided title and the lien after hearing argument<\/mark><mark class=\"same\">, not merely<\/mark> <mark class=\"new\">a point of procedure<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So that requirement is met.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Met, and uncontested. One line."}, {"letter": "B", "code": "J7.0.2", "title": "Judgments In Rem", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Pattni v Ali<\/i> (adopted by the SGCA),<\/mark> <mark class=\"new\">the order of sale<\/mark> <mark class=\"same\">is in rem if<\/mark> <mark class=\"new\">the Ruritanian court<\/mark><mark class=\"same\">, where<\/mark> <mark class=\"new\">Aircraft 3<\/mark> <mark class=\"same\">was situated, adjudicated title against the world.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y,<\/mark> <mark class=\"new\">Aircraft 3<\/mark> <mark class=\"same\">must have been in<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">when proceedings began (also s 5(3)(b) REFJA). It is usually recognised, e.g.,<\/mark> <mark class=\"new\">as proof of title<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">So Ostro Air's title stands against Aerovia, despite its absence and the lease.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "J7.3.2.3", "title": "Issues Singapore Decides for Itself", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, whether<\/mark> <mark class=\"new\">Aerovia<\/mark> <mark class=\"same\">submitted to<\/mark> <mark class=\"new\">the Ruritanian court<\/mark> <mark class=\"same\">is for Singapore's conflict rules.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So the Ruritanian rule that the order binds everyone does not settle the in personam point.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Confirms that Singapore, not Ruritanian law, decides whether Aerovia submitted. A supporting line in the jurisdiction analysis."}, {"letter": "D", "code": "J7.1.2", "title": "International Jurisdiction", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Skylane<\/mark> <mark class=\"same\">must prove that<\/mark> <mark class=\"new\">Aerovia<\/mark> <mark class=\"same\">was present in<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">(J7.1.2.1–J7.1.2.3) or submitted to<\/mark> <mark class=\"new\">the Ruritanian court<\/mark> <mark class=\"same\">(J7.1.2.4–J7.1.2.5).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Notice is not submission, and Aerovia was never present, so the in personam finding does not bind it.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "J7.5.1", "title": "CCAA Scope", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 2(1), only judgments of<\/mark> <mark class=\"new\">the chosen court<\/mark> <mark class=\"same\">of a Contracting State, or of a court to which it transferred the case under internal allocation rules, qualify.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The lease's Freedonian court clause makes the CCAA the route for any judgment about the lease.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The Ruritanian court was not chosen by anyone, and Ruritania is not a Contracting State. The CCAA has nothing to say about this judgment."}, {"letter": "F", "code": "J7.3.2.1", "title": "Issue Estoppel: Requirements", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Merck<\/i> (adopting <i>The Sennar (No 2)<\/i>),<\/mark> <mark class=\"new\">Skylane<\/mark> <mark class=\"same\">must show (a) a foreign judgment capable of recognition; (b) identical parties or privies; and (c) the same issue.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Merck<\/i> (citing <i>Carl Zeiss<\/i>),<\/mark> <mark class=\"new\">the finding that the lease was terminated<\/mark> <mark class=\"same\">must have been necessary to<\/mark> <mark class=\"new\">the Ruritanian court<\/mark><mark class=\"same\">'s decision, not collateral<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">It was necessary, but requirements (a) and (b) are the problem against Aerovia.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "J7.1.2.4", "title": "Submission by Conduct", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Nimbus<\/i>,<\/mark> <mark class=\"new\">Aerovia<\/mark> <mark class=\"same\">submitted only by a step that necessarily waived its objection to<\/mark> <mark class=\"new\">the Ruritanian court<\/mark><mark class=\"same\">'s jurisdiction<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Choosing not to take part is no such step.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Choosing not to take part is not a step that waives an objection (<i>Nimbus<\/i>). Part of the jurisdiction answer."}]}, {"id": "J-09.3", "side": "J", "hyp": 9, "n": 3, "source": "Mock Paper 9, Hypo 17", "title": "Skylane v Aerovia", "full": "Mock Paper 9, Hypo 17", "q": "<p>Aerovia Finance SA, a Freedonian company, leased three aircraft to Skylane Airways Pte Ltd, a Singapore airline, under separate leases dated 5 March 2022, each expressly governed by Freedonian law and providing: \"33. The Freedonian Commercial Court shall have exclusive jurisdiction over all disputes arising out of or in connection with this lease.\" In 2025, Aerovia sued Skylane in Freedonia for rent. Skylane defended on the merits, and in January 2026 a Freedonian court gave judgment against it; Skylane has appealed.<\/p><p>Skylane has now started a claim in Singapore against Aerovia for fraudulent misrepresentation, alleging that Aerovia lied about the maintenance history of all three aircraft when the leases were signed, and that the leases are therefore voidable. Skylane knew of this allegation when it defended the Freedonian action but decided not to raise it there, though Freedonian procedure would have allowed a counterclaim. It also relies on a 2026 decision of the Freedonian Supreme Court reversing the interpretation of the Freedonian Aviation Code on which the Freedonian court found it liable for rent. Aerovia applies for a stay.<\/p><p>The Hague Convention on Choice of Court Agreements took legal effect in Freedonia on 1 January 2019. Advise Skylane whether it may pursue its new claim in Singapore.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A new claim that the leases were procured by fraud, brought in the wrong court. The clause stops it before the foreign judgment rules come into play.<\/p>\n<p><strong>Scope: J1.5.1.<\/strong> \"Arising out of or in connection with\" covers a claim that the leases were induced by misrepresentation (<i>Fiona Trust<\/i>). The claim falls within cl 33.<\/p>\n<p><strong>Stay: J1.4.<\/strong> Cl 33 is an exclusive clause choosing the Freedonian court, and Freedonia and the leases are in scope, so s 12 requires a stay unless an exception applies. None is suggested.<\/p>\n<p><strong>Separability: J1.6.<\/strong> Attacking the leases does not attack cl 33. Fraud in procuring the contract does not infect the clause (<i>CIMB<\/i>; <i>PT Selecta<\/i>; s 5 CCAA).<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not start with <i>Henderson<\/i> or <i>Arnold<\/i>. Those depend on the Freedonian judgment being recognised; cl 33 stops the new claim first.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The fraud claim falls within cl 33's \"in connection with\" wording, attacking the leases does not touch the clause itself, and since the CCAA applies, s 12 requires Singapore to stay the claim in favour of the Freedonian court; whether it would also be a Henderson abuse, and the effect of the later Supreme Court decision, are matters for Freedonia and the pending appeal.<\/blockquote>", "items": [{"letter": "A", "code": "J1.2.2", "title": "Contracting State and Date", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Freedonia, the chosen court's State,<\/mark> <mark class=\"same\">is a Contracting State, and<\/mark> <mark class=\"new\">cl 33<\/mark> <mark class=\"same\">was concluded on<\/mark> <mark class=\"new\">5 March 2022<\/mark><mark class=\"same\">, after the HCCCA entered into force for it<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So the CCAA applies to the clause.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Needed to bring the clause within the CCAA, and met. One line."}, {"letter": "B", "code": "J7.3.4", "title": "The Arnold Exception", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Merck<\/i>, it is open whether the exception applies<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, (iv) is best, consistent with finality under<\/mark> <mark class=\"new\">Freedonian<\/mark> <mark class=\"same\">law (J7.1.3).<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Either way, the Supreme Court decision belongs in Skylane's Freedonian appeal.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Whether <i>Arnold<\/i> applies to foreign judgments is open (<i>Merck<\/i>). The Supreme Court decision belongs in the appeal, not in a Singapore action."}, {"letter": "C", "code": "J1.4", "title": "Singapore Is Not the Chosen Court (s 12)", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Aerovia<\/mark> <mark class=\"same\">seeks a stay because<\/mark> <mark class=\"new\">cl 33<\/mark> <mark class=\"same\">designates<\/mark> <mark class=\"new\">the Freedonian Commercial Court<\/mark><mark class=\"same\">. Per s 12(1), \"despite any other written law or rule of law\",<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">must stay or dismiss unless exception (a)–(e) applies<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Freedonia (2019) and the 2022 leases are in scope, and the clause is exclusive.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "J1.6", "title": "Attacking the Contract, Relying on the Clause", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>CIMB<\/i>, where the parties dispute existence or validity (rather than agreeing there was no contract),<\/mark> <mark class=\"new\">the misrepresentation dispute<\/mark> <mark class=\"same\">is decided under the contract's clauses as if valid.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>PT Selecta<\/i> and <i>CIMB<\/i>, the question is whether<\/mark> <mark class=\"new\">the alleged fraud<\/mark> <mark class=\"same\">also infects<\/mark> <mark class=\"new\">cl 33<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Fraud in procuring the leases does not touch consent to cl 33.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "J4.3.1", "title": "Not Spiliada", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Strong cause applies where<\/mark> <mark class=\"new\">Skylane<\/mark> <mark class=\"same\">breaches<\/mark> <mark class=\"new\">cl 33<\/mark><mark class=\"same\">; Spiliada where<\/mark> <mark class=\"new\">no one<\/mark> <mark class=\"same\">does.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Skylane can show strong cause because the Freedonian court got the law wrong.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Under s 12 there is no strong cause analysis unless an exception applies, and a foreign court's error of law is not strong cause anyway."}, {"letter": "F", "code": "J1.5.1", "title": "Broad Construction", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Skylane<\/mark> <mark class=\"same\">argues<\/mark> <mark class=\"new\">the misrepresentation claim<\/mark> <mark class=\"same\">is outside<\/mark> <mark class=\"new\">cl 33<\/mark><mark class=\"same\">. Per <i>Fiona Trust<\/i>, applied to jurisdiction clauses in <i>Trisuryo<\/i> and <i>Bunge<\/i>, rational businessmen are presumed to want all disputes arising out of<\/mark> <mark class=\"new\">their leases<\/mark> <mark class=\"same\">decided in one forum unless<\/mark> <mark class=\"new\">the words<\/mark> <mark class=\"same\">clearly exclude them.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">\"In connection with\" covers a claim that the leases were procured by fraud.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "J7.3.3", "title": "Rule in Henderson v Henderson", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Skylane<\/mark> <mark class=\"same\">raises<\/mark> <mark class=\"new\">the misrepresentation claim<\/mark> <mark class=\"same\">in Singapore that could and should have been raised in<\/mark> <mark class=\"new\">the Freedonian proceedings<\/mark><mark class=\"same\">, so<\/mark> <mark class=\"new\">Aerovia<\/mark> <mark class=\"same\">pleads abuse. Per <i>Humpuss<\/i>, the court weighs all the circumstances<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">This bites only if the Freedonian judgment is recognised, and cl 33 stops the claim first.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Skylane could and should have counterclaimed in Freedonia, which makes the new claim look abusive. But the point arises only if the Freedonian judgment is recognised, and cl 33 decides the case first."}]}, {"id": "J-10.1", "side": "J", "hyp": 10, "n": 1, "source": "Mock Paper 10, Hypo 19", "title": "Sunpath v Helios and Bastion", "full": "Mock Paper 10, Hypo 19", "q": "<p>Sunpath Energy Pte Ltd, a Singapore company, is building a solar farm in Ruritania. Two of its contracts are relevant.<\/p><p>The Construction Contract, dated 1 July 2022, is with Helios Build Ltd, a Ruritanian company with no presence in Singapore. Clause 30 reads: \"Disputes under this contract shall be governed by the law, and resolved in the courts, of the country which Sunpath nominates in writing once a dispute has arisen.\"<\/p><p>The Parent Guarantee, also dated 1 July 2022, is with Bastion Holdings Ltd, Helios's Elbonian parent, which also has no presence in Singapore. It is expressly governed by Elbonian law. Clause 8 reads: \"Any dispute under this guarantee shall be resolved in the courts of Singapore or Elbonia.\" Under Elbonian contract law, such a clause is an exclusive choice of court agreement in favour of the two named courts.<\/p><p>In 2026, Helios stopped work, claiming unpaid invoices; Sunpath says the work was defective. Sunpath nominated Singapore under clause 30. Helios denies that clause 30 has any effect and has sued Sunpath in Ruritania. Sunpath has sued Helios and Bastion in the Singapore General Division and must serve both abroad. Floating choice of law clauses are valid under Ruritanian but not Singapore conflict of laws rules. The Hague Convention on Choice of Court Agreements took legal effect in Ruritania and Elbonia on 1 January 2021. All the construction records and witnesses are in Ruritania, and the Ruritanian court takes about four years to decide a case. Advise Sunpath whether it can sue Helios and Bastion in Singapore, and who bears what burden. Exclude any discussion of the SICC.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Two unusual clauses: a floating clause that couples law and courts, and a clause naming two States. Characterise each clause before choosing a test, because the burden follows from what each one promises.<\/p>\n<p><strong>Clause triage: J1.1.3.<\/strong> A floating jurisdiction clause is valid if not too uncertain, and Sunpath's written nomination is the mechanism. The law limb is void by the lex fori, so ask whether the court limb survives: the Court of Appeal severed where the two were not interdependent, but cl 30 couples them in one sentence, closer to <i>The Iran Vojdan<\/i>. Cl 8 names two fora, and objecting in either is Bastion's breach.<\/p>\n<p><strong>CCAA: J1.2.1.<\/strong> Cl 8 names two States, so it is outside the CCAA. For cl 30, coverage is unclear: there was no chosen court before the nomination, but the nomination arguably crystallised an exclusive choice of Singapore. Helios replies that a unilateral election is not the parties' agreement.<\/p>\n<p><strong>Service out: J3.2.<\/strong> In practice Sunpath need only show that cl 8 (and cl 30, if it survives) is valid, binds the defendant and covers the claim, plus a serious question. Forum need not be proved: objecting is the defendant's own breach, so strong cause is on it.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not apply s 12 to cl 8. Singapore is one of the named courts, so Sunpath is not in breach, and the clause is outside the CCAA anyway.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Cl 8 names two States, so it is outside the CCAA, but at common law it is exclusive to both and Bastion's objection is a breach, so Sunpath serves out and Bastion bears strong cause; cl 30's court limb is valid if it survives the void law limb, in which case Helios too bears strong cause, and otherwise Sunpath must show Singapore is clearly more appropriate, which the Ruritanian evidence makes unlikely.<\/blockquote>", "items": [{"letter": "A", "code": "J3.2", "title": "Singapore Clause, Defendant Abroad", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Nexus:<\/mark> <mark class=\"new\">cl 8<\/mark> <mark class=\"same\">itself, under para 63(3)(r)<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">or (d)(iv) (<i>Shanghai Turbo (CA)<\/i>; J3.1.2).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">In practice,<\/mark> <mark class=\"new\">Sunpath<\/mark> <mark class=\"same\">need only show a good arguable case that<\/mark> <mark class=\"new\">cl 8<\/mark> <mark class=\"same\">is valid, binds<\/mark> <mark class=\"new\">Bastion<\/mark> <mark class=\"same\">and covers<\/mark> <mark class=\"new\">the claim<\/mark> <mark class=\"same\">(J1.5–J1.6), plus a serious question<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Forum: need not be proved. If<\/mark> <mark class=\"new\">Bastion<\/mark> <mark class=\"same\">contests it, that breaches its promise, so per <i>Shanghai Turbo (CA)<\/i><\/mark> <mark class=\"new\">Bastion<\/mark> <mark class=\"same\">bears strong cause (J4.3)<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">Likewise Helios, if cl 30 survives.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "J2.1.5", "title": "Never-Registered Foreign Company", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">although Division 2 applies to<\/mark> <mark class=\"new\">an unregistered company like Helios<\/mark> <mark class=\"same\">(s 365), per C&amp;Y s 376(a)–(b) fail with<\/mark> <mark class=\"new\">no Singapore office or representative<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">So<\/mark> <mark class=\"new\">Sunpath<\/mark> <mark class=\"same\">relies on s 16(1)(a)(i) and must prove presence.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Sunpath should try to serve Helios and Bastion here before serving out.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Neither Helios nor Bastion has any presence here, so there is no service in to argue. Both must be served out."}, {"letter": "C", "code": "J1.1.3", "title": "Floating and Multi-Forum Clauses", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Shanghai Turbo (CA)<\/i> and C&amp;Y, a floating jurisdiction clause is valid at common law if not too uncertain, unlike<\/mark> <mark class=\"new\">cl 30's law limb<\/mark><mark class=\"same\">, which is void (C2). It needs an election mechanism, e.g.,<\/mark> <mark class=\"new\">Sunpath's written nomination<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">cl 30<\/mark> <mark class=\"same\">couples<\/mark> <mark class=\"new\">a law option<\/mark> <mark class=\"same\">with<\/mark> <mark class=\"new\">a court option<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">closer to <i>The Iran Vojdan<\/i>.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Shanghai Turbo (CA)<\/i>, the waiver applies to each named forum, so<\/mark> <mark class=\"new\">Bastion<\/mark><mark class=\"same\">'s objection in either<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">or<\/mark> <mark class=\"new\">Elbonia<\/mark> <mark class=\"same\">is a breach.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "J1.2.1", "title": "Floating Clause; More Than One State", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">cl 30<\/mark> <mark class=\"same\">lets<\/mark> <mark class=\"new\">Sunpath nominate any country's courts<\/mark><mark class=\"same\">; per C&amp;Y, CCAA coverage is unclear. (−) Before election there is no chosen court, so arguably no s 3(1) agreement. (+) Once<\/mark> <mark class=\"new\">Sunpath's written nomination arrived<\/mark><mark class=\"same\">,<\/mark> <mark class=\"new\">cl 30<\/mark> <mark class=\"same\">crystallised into a mutually exclusive choice of<\/mark> <mark class=\"new\">Singapore<\/mark><mark class=\"same\">, probably within the CCAA.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Cl 8<\/mark> <mark class=\"same\">designates<\/mark> <mark class=\"new\">Singapore or Elbonia<\/mark><mark class=\"same\">, not the courts \"of one Contracting State\"<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">so it is outside the CCAA, though<\/mark> <mark class=\"new\">exclusive at common law under Elbonian law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "J1.4", "title": "Singapore Is Not the Chosen Court (s 12)", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Bastion<\/mark> <mark class=\"same\">seeks a stay because<\/mark> <mark class=\"new\">cl 8<\/mark> <mark class=\"same\">designates<\/mark> <mark class=\"new\">the courts of Elbonia<\/mark><mark class=\"same\">. Per s 12(1), \"despite any other written law or rule of law\",<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">must stay or dismiss unless exception (a)–(e) applies<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Elbonia has been a Contracting State since 2021, before the guarantee was signed.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Section 12 is for a clause that does not choose Singapore. Cl 8 names Singapore and two States, so it is outside the CCAA, and Bastion's objection goes to strong cause."}, {"letter": "F", "code": "J4.2.3", "title": "Second Bite After Service Out", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently<\/mark> <mark class=\"new\">the construction records and witnesses point to Ruritania<\/mark><mark class=\"same\">, so can<\/mark> <mark class=\"new\">Sunpath<\/mark> <mark class=\"same\">still show injustice there? Per <i>Oro Negro<\/i> and <i>IM Skaugen (CA)<\/i>, this is open: <i>Lewis v King<\/i> and <i>Metall<\/i> for; <i>Konamaneni<\/i> and Fentiman against.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">This arises only if cl 30 fails, and a four-year trial is ordinary delay.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Needed only if cl 30 falls. The records and witnesses then point to Ruritania, and Sunpath's best hope is the open second-bite argument; four years' delay is ordinary."}, {"letter": "G", "code": "J4.2.1", "title": "Burden Stays on Claimant", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Spiliada<\/i>, <i>Oriental Insurance<\/i> and <i>Zoom<\/i>,<\/mark> <mark class=\"new\">Sunpath<\/mark> <mark class=\"same\">bears it without notice and still when<\/mark> <mark class=\"new\">Helios<\/mark> <mark class=\"same\">sets aside, jurisdiction over<\/mark> <mark class=\"new\">a Ruritanian defendant<\/mark> <mark class=\"same\">being \"an imposition\" on it (<i>Li Shengwu<\/i>).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Spiliada<\/i>, <i>AK Investment<\/i> and <i>Zoom<\/i>,<\/mark> <mark class=\"new\">Sunpath<\/mark> <mark class=\"same\">must show Singapore \"clearly\" more appropriate than<\/mark> <mark class=\"new\">Ruritania<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">This applies only if cl 30 is struck out.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The fallback for Helios if cl 30 is struck out: Sunpath bears the burden and must show Singapore is clearly more appropriate. A line in the alternative."}]}, {"id": "J-10.2", "side": "J", "hyp": 10, "n": 2, "source": "Mock Paper 10, Hypo 19", "title": "Sunpath v Aeolus", "full": "Mock Paper 10, Hypo 19", "q": "<p>Sunpath Energy Pte Ltd, a Singapore company, bought turbines from Aeolus Inc, a Utopian company with no presence in Singapore, under a Turbine Supply Agreement dated 1 September 2023 and expressly governed by Singapore law. Clause 19 reads: \"The parties shall first attempt to resolve any dispute by negotiation, then by mediation at the Singapore Mediation Centre. If the dispute is not resolved, the Singapore High Court shall have exclusive jurisdiction.\"<\/p><p>After one negotiating meeting and no mediation, Aeolus sued Sunpath in Utopia for the price. It has also sued Sunpath's chief executive, Ms Rao, in Utopia in deceit, for statements she made when Sunpath signed the agreement; Aeolus's lawyers told it that this is a way of escaping clause 19. Ms Rao, who is not a party to the agreement, lives in Singapore, where the agreement was negotiated and signed. The price claim has reached an advanced stage. Sunpath knew of it for 11 months before objecting, though it learnt only a week before the hearing that Aeolus's summary judgment application was being heard.<\/p><p>The Hague Convention on Choice of Court Agreements took legal effect in Utopia on 1 January 2021. Advise Sunpath whether it can restrain the Utopian proceedings against it and against Ms Rao.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A tiered exclusive clause, a party that sued too early and in the wrong place, and a suit against a non-party designed to get round the clause. Then the delay problem.<\/p>\n<p><strong>Breach: J6.3.1.1.<\/strong> \"Shall first attempt\" makes negotiation and mediation preconditions (<i>Finaport<\/i>), and the Singapore High Court clause is exclusive. Suing in Utopia breaches both, so the contractual basis applies.<\/p>\n<p><strong>Delay: J6.3.1.5.<\/strong> Sunpath knew of the action for 11 months, and the price claim is at an advanced stage. Comity re-enters with delay (<i>Sun Travels<\/i>), and this is Sunpath's real risk. The late notice of the summary judgment hearing helps only a little.<\/p>\n<p><strong>Ms Rao: J6.5.2.<\/strong> Cl 19 does not clearly cover claims against officers (<i>Asiana<\/i>). But Aeolus's own advice shows the suit is meant to bypass cl 19, which makes it vexatious as between Aeolus and Sunpath. Granted on that ground.<\/p>\n<p><strong>Trap to avoid.<\/strong> A tiered clause still ends in an exclusive clause. And Sunpath is not free of the tiers either, so it should negotiate and mediate before suing in Singapore itself.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Aeolus breached cl 19 by suing in Utopia without negotiating or mediating and in breach of the Singapore High Court clause, so a contractual ASI is available unless Aeolus shows strong reasons, but Sunpath's 11-month delay with the price claim well advanced puts it at real risk; the suit against Ms Rao is a bypass of cl 19 and can be restrained as vexatious between Aeolus and Sunpath.<\/blockquote>", "items": [{"letter": "A", "code": "J6.3.1.4", "title": "Strong Reasons", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">As<\/mark> <mark class=\"new\">Aeolus<\/mark> <mark class=\"same\">sued in<\/mark> <mark class=\"new\">Utopia<\/mark> <mark class=\"same\">in breach of<\/mark> <mark class=\"new\">cl 19<\/mark><mark class=\"same\">, the ASI ordinarily issues unless<\/mark> <mark class=\"new\">Aeolus<\/mark> <mark class=\"same\">shows strong reasons<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Aeolus will say Sunpath has not kept to the tiers either.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Aeolus bears strong reasons and will point to Sunpath's own failure to follow the tiers. Worth a line; delay is the bigger risk."}, {"letter": "B", "code": "J6.3.1.2", "title": "Singapore NEJC: No Breach", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">cl 19<\/mark> <mark class=\"same\">is a Singapore NEJC. Per C&amp;Y and <i>Shanghai Turbo<\/i>, suing in<\/mark> <mark class=\"new\">Utopia<\/mark> <mark class=\"same\">is not ordinarily a breach<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Cl 19 is a tiered clause, so litigation was always allowed in the end.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Cl 19 ends in an exclusive Singapore High Court clause, so it is not a non-exclusive clause. Suing in Utopia is a breach."}, {"letter": "C", "code": "J6.5.2", "title": "Suing a Non-Party to Bypass the Clause", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">(b) Bypass (+): The real purpose of suing<\/mark> <mark class=\"new\">Ms Rao<\/mark> <mark class=\"same\">is to bypass<\/mark> <mark class=\"new\">cl 19<\/mark><mark class=\"same\">, making the suit vexatious as between<\/mark> <mark class=\"new\">Aeolus and Sunpath<\/mark> <mark class=\"same\">(Asiana, citing Clearlake and Giorgio Armani).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">That needs a \"quite clear indication\" (Asiana, adopting Team Y&amp;R). Presently,<\/mark> <mark class=\"new\">cl 19<\/mark> <mark class=\"same\">covers only disputes<\/mark> <mark class=\"new\">under the agreement<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Aeolus's own lawyers' advice shows the purpose.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "J6.3.1.5", "title": "Delay at an Advanced Stage", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Sunpath<\/mark> <mark class=\"same\">waited<\/mark> <mark class=\"new\">11 months<\/mark> <mark class=\"same\">after<\/mark> <mark class=\"new\">the Utopian action<\/mark> <mark class=\"same\">began<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">Per <i>Sun Travels<\/i> (following <i>Ecobank<\/i> and <i>Sea Powerful<\/i>), comity is relevant to delay even in contractual cases, and how far<\/mark> <mark class=\"new\">the price claim has<\/mark> <mark class=\"same\">progressed matters more than the delay's length<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Similar to <i>Hilton<\/i> (HC), where the Maldivian proceedings were already \"too far advanced\" for an ASI (C&amp;Y),<\/mark> <mark class=\"new\">the price claim has<\/mark> <mark class=\"same\">reached<\/mark> <mark class=\"new\">an advanced stage<\/mark><mark class=\"same\">, so the ASI should be refused.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "J1.5.3", "title": "Third Party Relying on the Clause", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>VKC v VJZ<\/i>, CRTPA s 2(1)(b) (\"purports to confer a benefit\") does not apply to an EJC<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Ms Rao cannot rely on cl 19 herself; her own ASI needs vexation.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Ms Rao cannot take the benefit of cl 19 under the CRTPA (<i>VKC<\/i>), so her own ASI would need vexation. Sunpath's bypass route is better."}, {"letter": "F", "code": "J6.3.1.1", "title": "Multi-Tiered Clause", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Similar to <i>Finaport<\/i>, where \"shall first attempt\" negotiation, then SMC mediation, then litigation was mandatory,<\/mark> <mark class=\"new\">cl 19<\/mark><mark class=\"same\">'s<\/mark> <mark class=\"new\">\"shall first attempt\"<\/mark> <mark class=\"same\">wording makes<\/mark> <mark class=\"new\">negotiation and mediation<\/mark> <mark class=\"same\">a precondition, so suing in<\/mark> <mark class=\"new\">Utopia<\/mark> <mark class=\"same\">first breaches it.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Suing in Utopia at all also breaches the Singapore High Court EJC.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "J6.5.3", "title": "Singapore EJC; Other Contracting State Suit", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, as the chosen court, Singapore may be given more leeway, consistent with the HCCCA's primacy for<\/mark> <mark class=\"new\">Singapore, the chosen court<\/mark><mark class=\"same\">.<\/mark> <mark class=\"new\">The Utopian court<\/mark> <mark class=\"same\">should itself have declined under art 6, so the ASI supports<\/mark> <mark class=\"new\">the Convention scheme<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "As the chosen court, Singapore gets more leeway, since Utopia should have declined under art 6. Support inside strong reasons."}]}, {"id": "J-10.3", "side": "J", "hyp": 10, "n": 3, "source": "Mock Paper 10, Hypo 19", "title": "Sunpath v Mr Adi", "full": "Mock Paper 10, Hypo 19", "q": "<p>Sunpath Energy Pte Ltd, a Singapore company, is building a solar farm in Ruritania. The land was bought in the name of Mr Adi, a Ruritanian national, who holds it on trust for Sunpath under a nominee deed dated 1 March 2022. The deed is expressly governed by Ruritanian law and gives the courts of Ruritania exclusive jurisdiction. The Ruritanian courts do not recognise trusts: under Ruritanian law, Sunpath's beneficial interest in the land would not be recognised, so a Ruritanian court would dismiss its claim.<\/p><p>Mr Adi has purported to sell the land to a local buyer. Sunpath has sued him in Singapore for breach of trust, serving him in Singapore while he was visiting his daughter. Mr Adi applies for a stay under the Choice of Court Agreements Act. The Hague Convention on Choice of Court Agreements took legal effect in Ruritania on 1 January 2021. Advise Sunpath.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A defendant served here, an exclusive foreign clause, and a claimant whose best argument is that the chosen court will give it nothing. That argument looks like <i>Trisuryo<\/i>, but the governing law cuts against it.<\/p>\n<p><strong>Regime: J1.2.4.<\/strong> Rights in rem in land are excluded from the CCAA. A personal claim on the deed is arguably outside the exclusion, so s 12 may still apply.<\/p>\n<p><strong>If the CCAA applies: J1.4.2.<\/strong> The exceptions are read narrowly. A legal system that does not recognise trusts is neither biased nor unavailable, so manifest injustice is unlikely.<\/p>\n<p><strong>At common law: J4.3.3.<\/strong> Sunpath, suing in breach of the deed's clause, bears strong cause and will cite <i>Trisuryo<\/i>: no remedy at all in the chosen court. But Ruritanian law also governs the deed, so the trust claim fails in Singapore too (<i>Perry<\/i>). Distinguish <i>Trisuryo<\/i>. Best view: stay.<\/p>\n<p><strong>Trap to avoid.<\/strong> Serving Mr Adi here founds jurisdiction, but the clause still decides whether Singapore exercises it. Sunpath should look for a personal or restitutionary claim instead.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Mr Adi was validly served here, but the deed's exclusive Ruritanian clause governs the stay: if the CCAA applies despite the land exclusion, s 12 requires a stay and no exception fits, and at common law Sunpath's Trisuryo argument fails because Ruritanian law governs the deed too, so the trust claim would fail in Singapore as well; a stay is likely.<\/blockquote>", "items": [{"letter": "A", "code": "J2.1.1", "title": "Natural Person Present", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 16(1)(a)(i) SCJA,<\/mark> <mark class=\"new\">Mr Adi<\/mark> <mark class=\"same\">present<\/mark> <mark class=\"new\">on a visit to his daughter<\/mark> <mark class=\"same\">is personally served as of right under O 7 r 2(1)(a).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y,<\/mark> <mark class=\"new\">Mr Adi<\/mark><mark class=\"same\">'s weak connection is irrelevant to existence but relevant to the natural forum<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Mr Adi was present when served, so jurisdiction exists. The fortuity of his visit goes to the stay, which the clause decides anyway."}, {"letter": "B", "code": "J1.3", "title": "Must Hear", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 11(2),<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">cannot decline in favour of<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">, so neither Spiliada nor strong cause applies<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Mr Adi was served here, so Singapore must hear the case.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Section 11 applies when Singapore is the chosen court. Here Ruritania is chosen, so s 12, not s 11, is engaged, and service here does not change that."}, {"letter": "C", "code": "J4.1.3", "title": "Relief Unavailable Abroad", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Rappo<\/i>,<\/mark> <mark class=\"new\">no trust<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">is no injustice where<\/mark> <mark class=\"new\">Ruritanian law<\/mark> <mark class=\"same\">governs, as it would be unavailable here too<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The same logic answers Sunpath's <i>Trisuryo<\/i> argument.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The <i>Rappo<\/i> point, that a remedy unavailable under the governing law is no injustice, is the right idea, but this is a <i>Spiliada<\/i> stage 2 block. Under the clause, make the same point within strong cause."}, {"letter": "D", "code": "J4.3.3", "title": "No Remedy at All", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Trisuryo<\/i>, strong cause was shown because<\/mark> <mark class=\"new\">Ruritanian law<\/mark> <mark class=\"same\">would not recognise<\/mark> <mark class=\"new\">the trust over Ruritanian land<\/mark><mark class=\"same\">, so<\/mark> <mark class=\"new\">Sunpath<\/mark> <mark class=\"same\">could get no remedy in<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">. It was exceptional<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">But here Ruritanian law also governs the deed, so the trust fails in Singapore too (<i>Perry<\/i>): distinguish <i>Trisuryo<\/i>.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "J1.2.4", "title": "Excluded Matters", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">The CCAA excludes,<\/mark> <mark class=\"same\">per s 9(2), matters such as<\/mark> <mark class=\"new\">rights in rem in land<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">A personal claim for breach of trust under the deed is arguably outside that exclusion, so s 12 may still apply.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "J1.4.2", "title": "The Exceptions", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per the Hartley–Dogauchi Report (and C&amp;Y), exceptions (c) and (d) apply \"only in the most exceptional circumstances\" and are read narrowly.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">A legal system that does not recognise trusts is neither biased nor unavailable, so exception (c) is unlikely.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "J4.3.1", "title": "Foreseeable Factors", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Strong cause applies where<\/mark> <mark class=\"new\">Sunpath<\/mark> <mark class=\"same\">breaches<\/mark> <mark class=\"new\">the deed's Ruritanian clause<\/mark><mark class=\"same\">; Spiliada where<\/mark> <mark class=\"new\">no one<\/mark> <mark class=\"same\">does.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Vinmar<\/i>,<\/mark> <mark class=\"new\">Ruritanian law and its view of trusts<\/mark> <mark class=\"same\">foreseeable at contracting carry little weight<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Ruritanian law and its view of trusts were known when the deed was signed, so they carry little weight as strong cause. A supporting line."}]}, {"id": "J-11.1", "side": "J", "hyp": 11, "n": 1, "source": "Block Finder set 1, Q1", "title": "Harbour v Kestrel", "full": "", "q": "<p>Harbour Pte Ltd, a Singapore company, buys marine sensors from Kestrel AG, a Utopian company with no office, assets or registration in Singapore. Their supply contract, dated 1 March 2025, is expressly governed by Singapore law. Clause 20 reads: \"Kestrel submits to the jurisdiction of the Singapore High Court and may sue Harbour only in that court. Harbour may sue Kestrel in the Singapore High Court or in any other court of competent jurisdiction.\"<\/p><p>The sensors fail in Singapore waters. Harbour sues Kestrel for breach of contract in the General Division and obtains approval to serve the originating claim out of Singapore. Kestrel applies to set aside service, saying Utopia is the more appropriate forum: the sensors were designed and tested there, and its engineers, all Kestrel employees, live there.<\/p><p>Singapore and Utopia have both been Contracting States to the Hague Convention on Choice of Court Agreements since before the contract. Advise Harbour on the test that decides Kestrel's application, who carries the burden, and the likely result.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Cl 20 is one-sided and names Singapore, so the work lies in spotting who is in breach. The
