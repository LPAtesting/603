<template id="how"><details class="how"><summary>How it works</summary><div class="card"><ul><li><strong>Seven options, pick the best 3.</strong> Each option is a pre-write block already filled in for this hypo, labelled with its code. The options are deliberately close: most are blocks you could use, but only three decide the outcome.</li><li><strong>Labels give nothing away.</strong> A question is marked only J or C, with the parties' names. Options can come from any file on that side, so the codes on the options are the only clue, and they are meant to be.</li><li><strong>Colours.</strong> <em>Italic</em> (green on the page) is copied unchanged from the pre-write; <strong>bold</strong> (amber on the page) is changed for this hypo; "…" marks pre-write text left out.</li><li><strong>Check.</strong> Score is out of 3. Each option you did not need is marked <strong>Close</strong> (worth a line, but not top 3) or <strong>Wrong</strong> (the wrong rule for these facts), with a short reason. One <strong>compiled reason</strong> explains the best three and gives a result line.</li></ul></div></details></template>

<script>
const QS = [{"id": "J-01.1", "side": "J", "hyp": 1, "n": 1, "source": "Mock Paper 1, Hypo 1", "title": "Aurelia v Kestrel", "full": "Mock Paper 1, Hypo 1", "q": "<p>Aurelia Pte Ltd, a Singapore company, buys battery modules from Kestrel Inc, a Utopian company that carries on business only in Utopia. Their Module Supply Agreement, dated 1 March 2019, is expressly governed by Utopian law. Clause 14 reads: \"The parties submit to the jurisdiction of the Singapore High Court in respect of all disputes arising under this agreement.\"<\/p><p>After bus fires in September 2025, Aurelia blamed Kestrel's modules and terminated the agreement. In January 2026, Kestrel sued Aurelia in Utopia for a declaration that it has not breached the agreement, serving Aurelia at its Utopian sales office. Aurelia applied there to set aside service on forum non conveniens grounds, and the Utopian court dismissed the application in June 2026. Trial is fixed for February 2027. Aurelia has now sued Kestrel in the Singapore High Court for damages and served it in Utopia.<\/p><p>The Hague Convention on Choice of Court Agreements took legal effect in Utopia on 1 January 2018. Under Utopian contract law, a clause in the form of clause 14 is a binding promise that neither party will sue elsewhere. Advise Aurelia whether the Singapore court will restrain Kestrel from continuing the Utopian action, and what stands in its way.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Cl 14 never says \"exclusive\", so the work is finding the promise. The CCAA deeming rule and the \"submit to\" wording both pull you towards the wrong source of it.<\/p>\n<p><strong>Breach: J6.3.1.1.<\/strong> Breach is a question of construction under the proper law. Utopian law makes cl 14 a promise not to sue elsewhere, so Kestrel's suit is a breach and the contractual basis applies. No vexation is needed.<\/p>\n<p><strong>Strong reasons: J6.3.1.4.<\/strong> Kestrel must show strong reasons. Its preference for its home court was bargained away, and Utopia, a Contracting State, should have declined under art 6, so comity counts for little.<\/p>\n<p><strong>Delay: J6.3.1.5.<\/strong> This is the real risk. Aurelia fought jurisdiction in Utopia first, which does not excuse delay (<i>Sun Travels<\/i>). The Utopian action is still before trial, so Aurelia must apply at once.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not rest breach on s 3(2). The deeming decides whether Singapore must hear the case, not whether Kestrel promised not to sue in Utopia. The March 2026 answer scheme ran a vexation ASI for a deemed-exclusive clause with no promise.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Under Utopian law, its proper law, cl 14 is a promise not to sue elsewhere, so Kestrel's Utopian suit is a breach and the ASI ordinarily issues unless Kestrel shows strong reasons, which a home-court preference and a court bound to decline under art 6 cannot supply; Aurelia's jurisdiction challenge in Utopia does not excuse its delay, so it must apply before the February 2027 trial.<\/blockquote>", "items": [{"letter": "A", "code": "J6.3.2", "title": "Parallel Proceedings Alone Not Enough", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Even without<\/mark> <mark class=\"new\">a breach of agreement<\/mark><mark class=\"same\">,<\/mark> <mark class=\"new\">Aurelia<\/mark> <mark class=\"same\">argues<\/mark> <mark class=\"new\">Kestrel<\/mark><mark class=\"same\">'s<\/mark> <mark class=\"new\">Utopian proceedings<\/mark> <mark class=\"same\">are vexatious or oppressive. Per <i>Kirkham<\/i> and <i>UBS v Telesto<\/i> (C&amp;Y), an ASI issues only in \"the clearest of circumstances\"<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>UBS v Telesto<\/i> and C&amp;Y, parallel proceedings and the risk of conflicting judgments do not alone justify an ASI<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">Kestrel merely sued at home on the same dispute.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Vexation is the fallback when there is no breach. Here there is one, so Aurelia need not clear the \"clearest of circumstances\" threshold."}, {"letter": "B", "code": "J6.3.1.2", "title": "Singapore NEJC: No Breach", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">cl 14<\/mark> <mark class=\"same\">is a Singapore NEJC. Per C&amp;Y and <i>Shanghai Turbo<\/i>, suing in<\/mark> <mark class=\"new\">Utopia<\/mark> <mark class=\"same\">is not ordinarily a breach, the parties having accepted parallel proceedings<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">So<\/mark> <mark class=\"new\">Aurelia<\/mark> <mark class=\"same\">relies on vexation (J6.3.2) or abuse (J6.3.3).<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Cl 14 never uses the word \"exclusive\", and says only that the parties \"submit\".<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The wording trap. Cl 14 looks like a non-exclusive submission clause, but its proper law makes it a promise not to sue elsewhere, so there is a breach and this block's premise fails."}, {"letter": "C", "code": "J1.2.1", "title": "Deemed Exclusive; Separability", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 3(2),<\/mark> <mark class=\"new\">cl 14 (\"submit to the jurisdiction of the Singapore High Court\")<\/mark> <mark class=\"same\">is deemed exclusive unless the parties expressly provide otherwise.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">At common law the same unlabelled clause could go either way under<\/mark> <mark class=\"new\">Utopian law<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Per s 5,<\/mark> <mark class=\"new\">cl 14<\/mark> <mark class=\"same\">is independent of<\/mark> <mark class=\"new\">the Module Supply Agreement<\/mark><mark class=\"same\">, so its validity cannot be challenged solely because<\/mark> <mark class=\"new\">the agreement<\/mark> <mark class=\"same\">is said to be<\/mark> <mark class=\"new\">terminated<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "True and worth a line on the regime: s 3(2) deems cl 14 exclusive, so Singapore must hear Aurelia's own claim, and termination does not touch the clause. But deeming creates no promise; the breach comes from Utopian law."}, {"letter": "D", "code": "J6.3.1.4", "title": "Strong Reasons; Foreign Court Bound to Decline", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">As<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">sued in<\/mark> <mark class=\"new\">Utopia<\/mark> <mark class=\"same\">in breach of<\/mark> <mark class=\"new\">cl 14<\/mark><mark class=\"same\">, the ASI ordinarily issues unless<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">shows strong reasons<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>UniCredit<\/i>, comity has little role where<\/mark> <mark class=\"new\">Utopia<\/mark> <mark class=\"same\">is bound by treaty to decline jurisdiction<\/mark> <mark class=\"new\">, here under art 6 HCCCA<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">On balance,<\/mark> <mark class=\"new\">Kestrel<\/mark><mark class=\"same\">'s<\/mark> <mark class=\"new\">wish to litigate at home<\/mark> <mark class=\"same\">is<\/mark> <mark class=\"new\">an advantage it bargained away<\/mark><mark class=\"same\">, so per C&amp;Y the general rule applies and<\/mark> <mark class=\"new\">cl 14<\/mark> <mark class=\"same\">is enforced by ASI.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "J6.5.3", "title": "Singapore EJC; Other Contracting State Suit", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, the HCCCA reduces but does not remove<\/mark> <mark class=\"new\">parallel proceedings<\/mark><mark class=\"same\">, as a non-chosen<\/mark> <mark class=\"new\">Contracting State court, here Utopia,<\/mark> <mark class=\"same\">must generally decline save under art 6.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, as the chosen court, Singapore may be given more leeway, consistent with the HCCCA's primacy for<\/mark> <mark class=\"new\">Singapore, the chosen court<\/mark><mark class=\"same\">.<\/mark> <mark class=\"new\">The Utopian court<\/mark> <mark class=\"same\">should itself have declined under art 6, so the ASI supports<\/mark> <mark class=\"new\">the Convention scheme<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Good support: as the chosen court, Singapore gets more leeway because Utopia should have declined. It is one line inside strong reasons and does not decide whether there was a breach."}, {"letter": "F", "code": "J6.3.1.5", "title": "Delay; Contesting Jurisdiction", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Aurelia<\/mark> <mark class=\"same\">says it first objected to<\/mark> <mark class=\"new\">the Utopian court<\/mark><mark class=\"same\">'s jurisdiction. Per <i>Sun Travels<\/i> (citing <i>The Angelic Grace<\/i>, <i>Toepfer<\/i> and <i>Ecobank<\/i>), that does not excuse delay: no \"two bites at the cherry\".<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">the Utopian proceedings<\/mark> <mark class=\"same\">are at an early stage, with only<\/mark> <mark class=\"new\">a failed jurisdiction challenge behind them<\/mark><mark class=\"same\">, which points to the ASI<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">But trial is fixed for February 2027, so Aurelia must apply now.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "J6.3.1.1", "title": "Exclusive Clause Breached", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, breach is a question of interpretation under<\/mark> <mark class=\"new\">Utopian law, the proper law, which makes cl 14 a promise that neither party will sue elsewhere<\/mark><mark class=\"same\">. Presently,<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">breached<\/mark> <mark class=\"new\">cl 14<\/mark><mark class=\"same\">, an exclusive<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">clause, by suing in<\/mark> <mark class=\"new\">Utopia<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Sun Travels<\/i>, breach is a separate basis: no unconscionability is needed, and the ASI ordinarily issues absent strong reasons (J6.3.1.4).<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "J-01.2", "side": "J", "hyp": 1, "n": 2, "source": "Mock Paper 1, Hypo 1", "title": "Aurelia v Kestrel", "full": "Mock Paper 1, Hypo 1", "q": "<p>Aurelia Pte Ltd, a Singapore company with a sales office in Utopia, distributes the battery packs of Kestrel Inc, a Utopian company that carries on business only in Utopia, throughout ASEAN. Their Distribution Agreement, dated 1 November 2021, is expressly governed by Singapore law and provides:<\/p><p>\"40. The courts of Utopia shall have exclusive jurisdiction over all disputes arising under this agreement. 41. Notwithstanding Clause 40, Kestrel may commence proceedings against Aurelia in any other court of competent jurisdiction.\"<\/p><p>In 2025, Kestrel terminated the agreement for Aurelia's failure to meet its minimum purchase obligations, and in January 2026 it sued Aurelia in Utopia for damages. The Utopian court held that it was bound to hear the claim under the Hague Convention on Choice of Court Agreements because clause 40 is an exclusive choice of court agreement. Trial is fixed for February 2027.<\/p><p>Aurelia wants to sue Kestrel in Singapore for wrongful termination and to stop the Utopian action. Under Singapore contract law, clause 41 qualifies clause 40. The Convention took legal effect in Utopia on 1 January 2018. The Utopian court takes about four years to decide a case, compared with 12 months in Singapore, and Utopian law would cap Aurelia's damages where Singapore law would not. Advise Aurelia.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A one-sided clause where the option belongs to the other side. Aurelia is the restricted party, so every route it wants (suing here, stopping Kestrel) runs into its own promise.<\/p>\n<p><strong>Regime: J1.2.1.<\/strong> Cl 41 qualifies cl 40, so the clause is asymmetric and not exclusive under the CCAA (<i>CHLOE V<\/i>). Section 12 is not engaged, but at common law cl 40 still binds Aurelia to sue only in Utopia.<\/p>\n<p><strong>Suing here: J4.3.3.<\/strong> Aurelia would be suing in breach, so it bears strong cause. Notorious delay and a damages cap were foreseeable when cl 40 was agreed (<i>Vinmar<\/i>), and there is no abuse or denial of justice.<\/p>\n<p><strong>Stopping Kestrel: J6.3.1.4.<\/strong> Kestrel's Utopian suit breaches nothing; the clause lets it sue there. Seeking an ASI would be Aurelia's own breach, so there is no basis for one.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not accept the Utopian court's view that the Convention applies. Singapore decides that for itself, and the asymmetric clause takes the case out of s 12. The common law result is the same, though: Aurelia is bound to Utopia.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Cl 40 as qualified by cl 41 is asymmetric, so it is outside the CCAA whatever the Utopian court held, but at common law it binds Aurelia to Utopia; suing here, Aurelia must show strong cause, which foreseeable delay and a damages cap cannot supply, and since Kestrel's suit breaches nothing, an ASI would itself be Aurelia's breach, so Aurelia should defend in Utopia.<\/blockquote>", "items": [{"letter": "A", "code": "J1.2.1", "title": "Asymmetric Clause", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">cll 40–41 give Utopia<\/mark> <mark class=\"same\">exclusive jurisdiction but<\/mark> <mark class=\"new\">let Kestrel<\/mark> <mark class=\"same\">sue<\/mark> <mark class=\"new\">Aurelia<\/mark> <mark class=\"new\">in any other court<\/mark><mark class=\"same\">. Per <i>CHLOE V<\/i>, following the Hartley–Dogauchi Report (VCLT art 32), such a clause is not exclusive under the CCAA, so s 12 cannot be engaged even on<\/mark> <mark class=\"new\">the court's own motion<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Consequence: At common law<\/mark> <mark class=\"new\">cl 40<\/mark> <mark class=\"same\">stays exclusive against<\/mark> <mark class=\"new\">Aurelia<\/mark> <mark class=\"same\">(per C&amp;Y), so J1.1 applies.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "J1.1.4", "title": "Foreign EJC: Strong Cause on Claimant", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Aurelia<\/mark> <mark class=\"same\">suing here breaches, so<\/mark> <mark class=\"new\">Aurelia<\/mark> <mark class=\"same\">bears strong cause, whether<\/mark> <mark class=\"new\">Kestrel is served in or out<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Aurelia<\/mark> <mark class=\"same\">suing here still breaches<\/mark> <mark class=\"new\">cl 40, the EJC for Utopia,<\/mark> <mark class=\"same\">→ strong cause on<\/mark> <mark class=\"new\">Aurelia<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Correct and quick: whoever sues in breach of a foreign EJC bears strong cause. J4.3.3 is where you show Aurelia cannot meet it."}, {"letter": "C", "code": "J1.4", "title": "Singapore Is Not the Chosen Court (s 12)", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">seeks a stay because<\/mark> <mark class=\"new\">cl 40<\/mark> <mark class=\"same\">designates<\/mark> <mark class=\"new\">the courts of Utopia<\/mark><mark class=\"same\">. Per s 12(1), \"despite any other written law or rule of law\",<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">must stay or dismiss unless exception (a)–(e) applies<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The Utopian court has already held cl 40 to be an exclusive choice of court agreement.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Section 12 needs an exclusive agreement, and an asymmetric clause is not one under the CCAA (<i>CHLOE V<\/i>). The Utopian ruling does not change that."}, {"letter": "D", "code": "J4.3.3", "title": "Chosen Court Unavailable", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Aurelia sues here in breach of cl 40, so it bears strong cause.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Vinmar<\/i>, strong cause exists where<\/mark> <mark class=\"new\">Utopia<\/mark><mark class=\"same\">'s chosen court is dissolved or unavailable through<\/mark> <mark class=\"new\">war or a coup<\/mark><mark class=\"same\">, or trial there would be so overwhelmingly difficult as to deny justice, if unforeseeable; notorious delay in<\/mark> <mark class=\"new\">Utopia<\/mark> <mark class=\"same\">is foreseeable and insufficient.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">The four-year trial and the damages cap were both foreseeable when cl 40 was agreed.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "J4.1.3", "title": "Stage 2: Delay and Damages", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently trial takes<\/mark> <mark class=\"new\">four years<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Utopia<\/mark> <mark class=\"same\">against<\/mark> <mark class=\"new\">12 months<\/mark> <mark class=\"same\">here. Per C&amp;Y, delay is disregarded unless egregious<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per Chong's feedback, a legitimate juridical advantage alone is not conclusive<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">but the cap and the delay together show injustice in Utopia.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Spiliada stage 2 is for a case with no breach. Aurelia is suing in breach of cl 40, so the test is strong cause, where foreseeable delay counts for nothing."}, {"letter": "F", "code": "J6.3.1.4", "title": "Applicant Itself in Breach", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">the clause<\/mark> <mark class=\"same\">lets<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">sue in<\/mark> <mark class=\"new\">Utopia<\/mark><mark class=\"same\">, so its suit breaches nothing, but<\/mark> <mark class=\"new\">Aurelia<\/mark> <mark class=\"same\">promised to submit there. Per Chong (answer scheme), seeking the ASI is then<\/mark> <mark class=\"new\">Aurelia<\/mark><mark class=\"same\">'s own breach<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">There is no basis for an ASI: Aurelia should defend in Utopia.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "J7.3.2.3", "title": "HCCCA Ruling Not Binding", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per Prof Chong (March 2026 answer scheme),<\/mark> <mark class=\"new\">Aurelia<\/mark> <mark class=\"same\">may argue that<\/mark> <mark class=\"new\">the Utopian court<\/mark><mark class=\"same\">'s ruling that<\/mark> <mark class=\"new\">cl 40<\/mark> <mark class=\"same\">falls within the HCCCA raises no estoppel, each Contracting State court deciding for itself whether<\/mark> <mark class=\"new\">the Convention<\/mark> <mark class=\"same\">applies (J1).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Kestrel replies that the ruling was final, between the same parties and on the same issue.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "A good opening line: the Utopian ruling that cl 40 is within the Convention raises no estoppel, as each Contracting State decides for itself. It frees Singapore to apply <i>CHLOE V<\/i>, but the result turns on the blocks that follow."}]}, {"id": "J-01.3", "side": "J", "hyp": 1, "n": 3, "source": "Mock Paper 1, Hypo 1", "title": "Aurelia v Kestrel", "full": "Mock Paper 1, Hypo 1", "q": "<p>Aurelia Pte Ltd, a Singapore company, has a sales office in Utopia. In January 2026, Kestrel Inc, a Utopian company, sued Aurelia in Utopia for: (a) the price under a Cell Supply Agreement, which gives the Singapore courts non-exclusive jurisdiction; (b) a declaration that it has not breached a Module Supply Agreement, which provides that \"the parties submit to the jurisdiction of the Singapore High Court\", a clause that under the agreement's proper law (Utopian law) is a binding promise that neither party will sue elsewhere; and (c) damages under a Distribution Agreement, which gives the Utopian courts exclusive jurisdiction but lets Kestrel sue Aurelia in any other court.<\/p><p>The originating process was served at Aurelia's Utopian sales office. Aurelia applied to set aside service on the ground that Singapore was the more appropriate forum, and the application was dismissed. Utopia is not gazetted under REFJA. The Hague Convention on Choice of Court Agreements took legal effect in Utopia on 1 January 2018.<\/p><p>Assume the Utopian court gives final judgment for Kestrel on all three claims. Advise Aurelia on what effect those judgments will have in Singapore.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Three judgments from one court, each needing its own route. Settle the regime, then international jurisdiction, then what kind of order each is, then the defences.<\/p>\n<p><strong>Jurisdiction: J7.1.2.3.<\/strong> Aurelia was served at its own fixed place of business in Utopia, so it was present (<i>Adams v Cape<\/i>). That makes the argument over whether its forum challenge was submission unnecessary.<\/p>\n<p><strong>What is enforceable: J7.1.4.<\/strong> Claims (a) and (c) are money judgments. Claim (b) is a declaration, which is not enforceable at common law; at most it is recognised and pleaded as res judicata.<\/p>\n<p><strong>Defence: J7.2.6.<\/strong> Under Utopian law the Module Supply clause is a promise not to sue elsewhere, so the claim (b) proceedings breached it. No case decides the defence, but C&amp;Y support it, and the breach is real here. Claims (a) and (c) breach nothing: one clause is non-exclusive, the other lets Kestrel sue in Utopia.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not send claim (c) through the CCAA. The asymmetric clause is not exclusive under the Convention, so the common law applies to all three judgments.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Aurelia was present in Utopia through its sales office, so the Utopian court had international jurisdiction over all three claims; the price and damages judgments are enforceable money judgments at common law, while the declaration can only be recognised, and it is open to attack as obtained in breach of the promissory Module Supply clause, or as inconsistent with a Singapore judgment on the same dispute.<\/blockquote>", "items": [{"letter": "A", "code": "J7.2.6", "title": "Breach of a Dispute-Resolution Agreement", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per Prof Chong (March 2026 answer scheme), the defence needs a breach, so<\/mark> <mark class=\"new\">the Module Supply clause<\/mark> <mark class=\"same\">must have promissory content, e.g.,<\/mark> <mark class=\"new\">a promise not to sue elsewhere<\/mark><mark class=\"same\">, not<\/mark> <mark class=\"new\">a bare submission<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, no case decides it, but (i)<\/mark> <mark class=\"new\">Aurelia<\/mark> <mark class=\"same\">could recover damages for<\/mark> <mark class=\"new\">the breach<\/mark> <mark class=\"same\">here anyway (<i>Union Discount<\/i>; cf <i>Tradewaves<\/i>)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Utopian law makes that clause a promise, so this is a real defence to claim (b); claims (a) and (c) breach nothing.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "J7.5.4", "title": "CCAA Refusal Grounds", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 15(1)(d),<\/mark> <mark class=\"new\">the claim (c) judgment<\/mark> <mark class=\"same\">conflicts with<\/mark> <mark class=\"new\">a Singapore judgment<\/mark> <mark class=\"same\">between<\/mark> <mark class=\"new\">Aurelia and Kestrel<\/mark><mark class=\"same\">, earlier or later, not necessarily on the same cause of action<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per s 16, the court may refuse<\/mark> <mark class=\"new\">the judgment<\/mark> <mark class=\"same\">insofar as it awards damages, such as<\/mark> <mark class=\"new\">damages above Singapore's measure<\/mark><mark class=\"same\">, exceeding compensation for actual loss.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Claim (c) came from the chosen court, so the CCAA's refusal grounds apply.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "These are CCAA grounds. The Distribution clause is asymmetric and outside the Convention, so the Utopian judgment on claim (c) is not a CCAA judgment."}, {"letter": "C", "code": "J7.1.4", "title": "Non-Money Judgment", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y,<\/mark> <mark class=\"new\">the declaration on claim (b)<\/mark> <mark class=\"same\">is not enforceable at common law, a relic of indebitatus assumpsit.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">must register under REFJA or the CCAA (J7.4.1; J7.5.1), or sue afresh and plead<\/mark> <mark class=\"new\">the declaration<\/mark> <mark class=\"same\">as res judicata (J7.3.1).<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Claims (a) and (c) are money judgments for definite sums.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "J7.1.2.3", "title": "Presence: Companies", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Adams v Cape<\/i>,<\/mark> <mark class=\"new\">Aurelia<\/mark> <mark class=\"same\">is present in<\/mark> <mark class=\"new\">Utopia<\/mark> <mark class=\"same\">if, for more than a minimal period, its own business was carried on at or from a fixed place of business<\/mark> <mark class=\"new\">of its own, its Utopian sales office<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">It was served at that office, so presence is met for all three claims, and its failed forum challenge need not count as submission.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "J7.2.7", "title": "Conflicting Judgments", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Merck<\/i> and C&amp;Y,<\/mark> <mark class=\"new\">the claim (b) judgment<\/mark> <mark class=\"same\">is not recognised if inconsistent with<\/mark> <mark class=\"new\">a Singapore judgment on the Module Supply claim<\/mark> <mark class=\"same\">between<\/mark> <mark class=\"new\">Aurelia and Kestrel<\/mark><mark class=\"same\">, earlier or later.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Aurelia should press its own Singapore claim on the modules.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "A useful extra defence: a Singapore judgment on the Module Supply dispute, earlier or later, would bar recognition of the declaration (<i>Merck<\/i>). It depends on Aurelia getting one."}, {"letter": "F", "code": "J7.1.2.4", "title": "Setting Aside on FNC Grounds", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Henry v Geoprosco<\/i>,<\/mark> <mark class=\"new\">Aurelia<\/mark><mark class=\"same\">'s application to set aside<\/mark> <mark class=\"new\">service<\/mark> <mark class=\"same\">because<\/mark> <mark class=\"new\">Utopia<\/mark> <mark class=\"same\">was forum non conveniens asked<\/mark> <mark class=\"new\">the Utopian court<\/mark> <mark class=\"same\">to decline a jurisdiction it had, so was submission.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>IGCF<\/i> (PC), <i>Henry<\/i>'s existence/exercise line is \"unrealistic and irrational\"<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Needed only if presence failed. Presence through the sales office settles jurisdiction, so the <i>Henry<\/i> versus <i>IGCF<\/i> debate is a fallback."}, {"letter": "G", "code": "J7.0.2", "title": "Regime Router", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">If<\/mark> <mark class=\"new\">Utopia<\/mark> <mark class=\"same\">is an HCCCA Contracting State and<\/mark> <mark class=\"new\">the Utopian court<\/mark> <mark class=\"same\">is the court chosen in the exclusive COCA in<\/mark> <mark class=\"new\">the Distribution Agreement<\/mark><mark class=\"same\">, or its transferee,<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">proceeds under the CCAA (J7.5).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">But that clause is asymmetric, so not exclusive under the CCAA (<i>CHLOE V<\/i>): claim (c) goes to the common law, like (a) and (b).<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Start here, in one line: claim (c) would go to the CCAA only if the clause were exclusive, and an asymmetric clause is not. So all three go to the common law."}]}, {"id": "J-02.1", "side": "J", "hyp": 2, "n": 1, "source": "Mock Paper 2, Hypo 3", "title": "Novara v Frostline", "full": "Mock Paper 2, Hypo 3", "q": "<p>Novara Pte Ltd, a Singapore company, distributes vaccines across Southeast Asia. Frostline Inc, a Ruritanian company, provides ultra-cold freight and storage. Frostline is not registered in Singapore. Polar Agency Pte Ltd represents it here from Polar's own premises at Changi, which it shares with two other principals; Polar is paid by commission and forwards all bookings to Ruritania, where Frostline decides whether to accept them.<\/p><p>On 14 February 2022, Novara and Frostline signed a Master Logistics Agreement. Clause 22 reads: \"Any dispute arising out of or in connection with this agreement shall be determined by the Singapore International Commercial Court.\" Clause 23 reads: \"This agreement is governed by Ruritanian law.\" In July 2025, two million doses of vaccine spoiled at a subcontractor's warehouse in Suburbia.<\/p><p>Novara has filed a claim against Frostline for breach of contract in the SICC. Frostline objects that: (i) under Ruritanian contract law, a clause naming a court without using the word \"exclusive\" is non-exclusive; (ii) it has no presence in Singapore; and (iii) Ruritania is the natural forum, since all its assets are there and Ruritanian courts do not enforce Singapore judgments. It adds that Ruritanian law, unlike Singapore law, gives no damages for loss of reputation. Ruritania is not a party to the Hague Convention on Choice of Court Agreements. Advise Novara whether the SICC will hear its claim against Frostline.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> An SICC clause in a Ruritanian-law contract, against a defendant from a non-Contracting State. Each of Frostline's three objections sounds like a forum argument, and the CCAA answers all three.<\/p>\n<p><strong>Exclusive: J1.2.1.<\/strong> Cl 22 never says \"non-exclusive\", so s 3(2) deems it exclusive whatever Ruritanian law says. Objection (i) fails without any s 18F debate.<\/p>\n<p><strong>In scope: J1.2.2.<\/strong> The CCAA asks whether the chosen court's State is a Contracting State and whether the clause postdates entry into force: Singapore, 2022. Ruritania's non-party status does not matter.<\/p>\n<p><strong>Must hear: J1.3.<\/strong> Under s 11 the SICC must hear the claim unless cl 22 is null and void, and cannot decline in favour of Ruritania. No permission is needed to serve Frostline abroad. Objections (ii) and (iii) fail.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not run s 18F where the CCAA applies: the deeming already makes cl 22 exclusive, and s 18F matters only for breach, if Novara later wants an ASI. The hollow-judgment risk was foreseeable: warn Novara, but it does not affect jurisdiction.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Cl 22 is deemed exclusive under s 3(2), and the CCAA applies because Singapore, the chosen court's State, is a Contracting State and the clause postdates 1 October 2016; under s 11 the SICC must hear the claim, Frostline may be served abroad without permission, and its links to Ruritania are irrelevant.<\/blockquote>", "items": [{"letter": "A", "code": "J5.2.2", "title": "Exclusive or Not? (s 18F)", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 18F(1), absent express contrary words in<\/mark> <mark class=\"new\">cl 22<\/mark> <mark class=\"same\">(s 18F(2)),<\/mark> <mark class=\"new\">Novara and Frostline<\/mark> <mark class=\"same\">are taken to have agreed (a) to submit exclusively to the SICC<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Non-CCAA case,<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">debated. s 18F governs<\/mark> <mark class=\"new\">cl 22<\/mark> <mark class=\"same\">only if it is a forum mandatory rule, as<\/mark> <mark class=\"new\">Novara<\/mark> <mark class=\"same\">argues and<\/mark> <mark class=\"new\">Frostline<\/mark> <mark class=\"same\">denies (C1.7).<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Ruritanian law governs cl 22, so Novara must win this debate.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Tempting because Ruritanian law governs. But this is a CCAA case: s 3(2) deems cl 22 exclusive, so s 18F \"need not be argued\". The Yip–Chong debate matters only for breach."}, {"letter": "B", "code": "J5.3", "title": "Foreign Connections Irrelevant", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per O 2 r 3(3), as there is<\/mark> <mark class=\"new\">cl 22, a written jurisdiction agreement<\/mark><mark class=\"same\">, the SICC must not decline \"solely on the ground that the action <span class=\"gap\">…<\/span> is connected to a jurisdiction other than Singapore\".<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y and Chong (AY23-24 mid-term feedback), there is no Spiliada balancing, Australian test or strong cause, so<\/mark> <mark class=\"new\">Frostline<\/mark><mark class=\"same\">'s links to<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">count for nothing.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Right result: O 2 r 3(3) also stops the SICC declining because of Ruritanian connections. But s 11 already bars declining, so this is a supporting line, not the deciding rule."}, {"letter": "C", "code": "J1.2.2", "title": "Contracting State and Date", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Singapore, the chosen court's State,<\/mark> <mark class=\"same\">is a Contracting State, and<\/mark> <mark class=\"new\">cl 22<\/mark> <mark class=\"same\">was concluded on<\/mark> <mark class=\"new\">14 February 2022<\/mark><mark class=\"same\">, after the HCCCA entered into force for it (Singapore: 1 October 2016).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Ruritania's non-party status is beside the point: the CCAA asks about the chosen court's State, and the case is international.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "J4.1.3", "title": "Stage 2: Remedies and Enforcement", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, ordinary differences in<\/mark> <mark class=\"new\">remedies<\/mark> <mark class=\"same\">are disregarded.<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Presently<\/mark> <mark class=\"new\">Novara<\/mark> <mark class=\"same\">would recover<\/mark> <mark class=\"new\">no reputational damages<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">. Per Chong's feedback, a legitimate juridical advantage alone is not conclusive<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Frostline adds that a Singapore judgment would be hollow, as all its assets are in Ruritania.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "A Spiliada stage 2 block. Under s 11 there is no forum balancing at all, and the damages gap and the hollow judgment were foreseeable when cl 22 was agreed."}, {"letter": "E", "code": "J1.2.1", "title": "Deemed Exclusive", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 3(2),<\/mark> <mark class=\"new\">cl 22 (\"shall be determined by the Singapore International Commercial Court\")<\/mark> <mark class=\"same\">is deemed exclusive unless the parties expressly provide otherwise. At common law the same unlabelled clause could go either way under<\/mark> <mark class=\"new\">Ruritanian law, its proper law<\/mark> <mark class=\"same\">(J1.1).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Cl 22 never says \"non-exclusive\" or allows suit elsewhere, so the rebuttal fails, whatever Ruritanian law says.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "J1.3", "title": "Must Hear; Serving Abroad", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Cl 22<\/mark> <mark class=\"same\">designates<\/mark> <mark class=\"new\">the SICC<\/mark> <mark class=\"same\">and the CCAA applies (J1.2). Per s 11(1),<\/mark> <mark class=\"new\">the SICC<\/mark> <mark class=\"same\">must not decline unless<\/mark> <mark class=\"new\">cl 22<\/mark> <mark class=\"same\">is null and void under Singapore law, including its choice of law rules.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per s 11(2),<\/mark> <mark class=\"new\">the SICC<\/mark> <mark class=\"same\">cannot decline in favour of<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">, so neither Spiliada nor strong cause applies<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">No permission is needed to serve<\/mark> <mark class=\"new\">Frostline<\/mark> <mark class=\"same\">(O 5 r 6(2)(a) SICC Rules; J5.2.4).<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "J5.2.1", "title": "Starter and Conditions", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per O 2 r 1(1) and s 18D(1), the SICC has jurisdiction if, when first filed, (a)<\/mark> <mark class=\"new\">the claim<\/mark> <mark class=\"same\">is international and commercial (J5.1.1) and one the General Division could hear; (b) each named party submitted under a written jurisdiction agreement; and (c) no prerogative relief is sought.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">All three are met: Frostline is Ruritanian, the dispute is commercial, and cl 22 is in a signed agreement.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Must be stated, and every condition is met. Frostline contests none of them, so it earns one line."}]}, {"id": "J-02.2", "side": "J", "hyp": 2, "n": 2, "source": "Mock Paper 2, Hypo 3", "title": "Novara v Frostline", "full": "Mock Paper 2, Hypo 3", "q": "<p>Novara Pte Ltd, a Singapore vaccine distributor, has filed a claim in the SICC against Frostline Inc, a Ruritanian freight company, under a contract providing that \"any dispute arising out of or in connection with this agreement shall be determined by the Singapore International Commercial Court\". Novara also wants to sue, preferably in the same proceeding:<\/p><ul><li>Stefan Holt, Frostline's Chief Operating Officer, a Ruritanian citizen and domiciliary, for deceit, for telling Novara's directors at a meeting in Singapore that every Frostline container was independently certified to hold minus 70 degrees Celsius; and<\/li><li>Cryovault Ltd, a Suburbian company engaged by Frostline as a subcontractor, for negligence in switching off the back-up power at its Suburbian warehouse, where two million doses spoiled. Novara has no contract with Cryovault.<\/li><\/ul><p>Both claims, like the claim against Frostline, turn on whether the containers were certified and why the vaccine spoiled. Mr Holt will pass through Changi Airport next month on a three-hour stopover. Novara's chief executive proposes to invite him to a \"without prejudice settlement meeting\" at an airport hotel, with no intention of discussing settlement, so that he can be served there. All Cryovault's witnesses and records are in Suburbia, whose courts are efficient and fair. Singapore law governs the deceit claim, and the negligence claim is actionable under both Singapore and Suburbian law. Advise Novara.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Two non-parties to the SICC clause. The clause cannot reach them, so find another way in for each: service in for Mr Holt, joinder for both.<\/p>\n<p><strong>Mr Holt: J2.1.1.<\/strong> Presence on a transit stop is enough (<i>Maharanee<\/i>; <i>Colt<\/i>). But luring him with an invented settlement meeting is an abuse that can get service set aside (<i>Watkins<\/i>). Advise Novara to serve him at Changi without the pretence.<\/p>\n<p><strong>The clause: J3.2.<\/strong> Per Chong's feedback, the SICC clause cannot saddle a non-party director with a burden, so the SICC has no primary jurisdiction over Mr Holt or Cryovault.<\/p>\n<p><strong>Joinder: J5.6.<\/strong> Once the SICC has the Frostline action, it can join additional parties if the action stays international and commercial. All three claims turn on certification and the spoilage, so the issues are connected, and Cryovault need not have agreed to anything.<\/p>\n<p><strong>Trap to avoid.<\/strong> O 2 r 3(3) protects only parties to the written agreement. Cryovault never agreed, so the SICC may weigh its Suburbian links if it resists joinder.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The SICC clause binds neither Mr Holt nor Cryovault, so the SICC has no primary jurisdiction over them; Mr Holt can be served on his stopover, but not by a sham meeting, which risks setting aside for abuse, and both can be joined to the SICC action because their claims share the certification and spoilage issues, Cryovault being free to argue its Suburbian links since it signed nothing.<\/blockquote>", "items": [{"letter": "A", "code": "J4.2.1", "title": "Burden Stays on Claimant", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Spiliada<\/i>, <i>Oriental Insurance<\/i> and <i>Zoom<\/i>,<\/mark> <mark class=\"new\">Novara<\/mark> <mark class=\"same\">bears it without notice and still when<\/mark> <mark class=\"new\">Cryovault<\/mark> <mark class=\"same\">sets aside, jurisdiction over<\/mark> <mark class=\"new\">a Suburbian defendant<\/mark> <mark class=\"same\">being \"an imposition\" on it (<i>Li Shengwu<\/i>).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">In the General Division, Suburbia (the tort, the witnesses, fair courts) would likely win.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Explains why serving Cryovault out of the General Division is weak: Novara would bear the burden, and Suburbia looks the natural forum. That is why joinder in the SICC is the better route."}, {"letter": "B", "code": "J4.1.2", "title": "Stage 1: Place of the Tort", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>JIO<\/i> and <i>The Albaforth<\/i>, the place of the tort, located by the substance test (C3), is prima facie the natural forum unless fortuitous, here<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">because<\/mark> <mark class=\"new\">the statement was made and relied on here<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So if Mr Holt is served at Changi and seeks a stay, he bears stage 1 and will struggle.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The answer if Mr Holt, once served, seeks a stay: the deceit happened in Singapore, which is prima facie the natural forum. A line after service is sorted."}, {"letter": "C", "code": "J5.3", "title": "Foreign Connections Irrelevant", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per O 2 r 3(3), as there is<\/mark> <mark class=\"new\">a written jurisdiction agreement in the Frostline contract<\/mark><mark class=\"same\">, the SICC must not decline \"solely on the ground that the action <span class=\"gap\">…<\/span> is connected to a jurisdiction other than Singapore\".<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Cryovault's Suburbian links count for nothing.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "O 2 r 3(3) protects only parties to the written jurisdiction agreement. Cryovault is not one, so the SICC may weigh its links with Suburbia."}, {"letter": "D", "code": "J1.5.3", "title": "Party Scope", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Asiana<\/i>, adopting <i>Team Y&amp;R<\/i>, whether<\/mark> <mark class=\"new\">the SICC clause<\/mark> <mark class=\"same\">avails claims against<\/mark> <mark class=\"new\">Mr Holt and Cryovault<\/mark> <mark class=\"same\">is construction, and, in keeping with privity, it usually will not absent \"a quite clear indication otherwise\".<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Generally no, by privity, unless<\/mark> <mark class=\"new\">a non-party<\/mark> <mark class=\"same\">takes by<\/mark> <mark class=\"new\">assignment, subrogation or agency<\/mark> <mark class=\"same\">or otherwise claims under<\/mark> <mark class=\"new\">the contract<\/mark><mark class=\"same\">, taking the benefit subject to the burden (<i>Hai Jiang 1401<\/i>; J6.5.2).<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The underlying rule: a jurisdiction clause rarely reaches non-parties without a quite clear indication (<i>Asiana<\/i>). J3.2 applies it to exactly this case, so that is the block to open."}, {"letter": "E", "code": "J3.2", "title": "Non-Party Defendant", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per Chong (AY23-24 feedback),<\/mark> <mark class=\"new\">the SICC clause<\/mark> <mark class=\"same\">cannot be used to saddle<\/mark> <mark class=\"new\">Mr Holt, a non-party director,<\/mark> <mark class=\"same\">with a burden, and facts far less exceptional than <i>Global Partners v Babcock &amp; Brown<\/i> do not bring<\/mark> <mark class=\"new\">him<\/mark> <mark class=\"same\">within its party scope (J1.5).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">So:<\/mark> <mark class=\"new\">Novara<\/mark> <mark class=\"same\">must show Singapore is forum conveniens, and<\/mark> <mark class=\"new\">the SICC<\/mark> <mark class=\"same\">has no primary jurisdiction over<\/mark> <mark class=\"new\">him<\/mark><mark class=\"same\">, only transfer under SICC Rules O 2 r 4(1)(c) (J5).<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">The same holds for Cryovault.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "J5.6", "title": "Joinder of Additional Parties", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 18D(3)–(4), once the SICC has jurisdiction over an international and commercial action, it may hear claims by or against additional parties<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per O 10 r 6(1), joining<\/mark> <mark class=\"new\">Mr Holt and Cryovault<\/mark> <mark class=\"same\">is appropriate \"so that the Court can resolve all the matters in dispute in the proceedings or any issues that are connected to those matters\".<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Per O 10 r 5(2),<\/mark> <mark class=\"new\">Cryovault<\/mark> <mark class=\"same\">need not have submitted under a written jurisdiction agreement<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "J2.1.1", "title": "Natural Person Present; Lured", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Maharanee of Baroda v Wildenstein<\/i> and <i>Colt Industries v Sarlie<\/i>, presence on<\/mark> <mark class=\"new\">a three-hour stopover<\/mark> <mark class=\"same\">suffices without any substantive connection<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Watkins v North American Land<\/i>, service may be set aside for abuse of process where<\/mark> <mark class=\"new\">Novara<\/mark> <mark class=\"same\">lured<\/mark> <mark class=\"new\">Mr Holt<\/mark> <mark class=\"same\">here by<\/mark> <mark class=\"new\">a sham settlement meeting<\/mark><mark class=\"same\">, but not where he came for<\/mark> <mark class=\"new\">his own travel<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">So serve him at Changi without the pretence: he will be there anyway.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "J-02.3", "side": "J", "hyp": 2, "n": 3, "source": "Mock Paper 2, Hypo 3", "title": "Novara v Frostline", "full": "Mock Paper 2, Hypo 3", "q": "<p>Novara Pte Ltd, a Singapore company, and Frostline Inc, a Ruritanian company, signed a Master Logistics Agreement on 14 February 2022, governed by Ruritanian law. Clause 22 reads: \"Any dispute arising out of or in connection with this agreement shall be determined by the Singapore International Commercial Court.\" Under Ruritanian contract law, a clause naming a court without using the word \"exclusive\" is non-exclusive. Ruritania is not a party to the Hague Convention on Choice of Court Agreements. Novara has sued Frostline in the SICC.<\/p><p>In October 2025, Frostline sued Novara in Ruritania for unpaid storage fees. On its Ruritanian lawyers' advice, Novara filed a defence on the merits in December 2025 without reserving its position on jurisdiction. It has since changed lawyers. The Ruritanian trial is fixed for June 2027. In March 2026, Cryovault Ltd, a Suburbian subcontractor of Frostline with which Novara has no contract, sued Novara in Suburbia for a declaration that it owes Novara no duty of care. The Suburbian courts are efficient and fair, and Cryovault's witnesses and records are there.<\/p><p>Advise Novara whether it can restrain the Ruritanian and Suburbian proceedings.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Two foreign suits with different bases. Against Frostline, find a breach and then face Novara's own conduct; against Cryovault, there is no clause at all.<\/p>\n<p><strong>Breach: J5.2.2.<\/strong> Under Ruritanian law cl 22 is non-exclusive, so there is no promise not to sue elsewhere. Novara's route to a breach is s 18F as a forum mandatory rule (Chong); Yip disagrees. If it fails, Novara is left with vexation.<\/p>\n<p><strong>Novara's own conduct: J6.3.1.4.<\/strong> Novara filed a merits defence in Ruritania without reservation, which counts against an ASI (<i>UniCredit<\/i>), and its delay lets comity back in. Best view: uncertain, leaning against, unless Novara acts at once.<\/p>\n<p><strong>Cryovault: J6.3.2.<\/strong> Cryovault is not bound by cl 22, Suburbia is the natural forum for the tort, and a negative declaration is not itself vexatious. Refused.<\/p>\n<p><strong>Trap to avoid.<\/strong> The CCAA deeming rule settles Singapore's jurisdiction, not breach. The March 2026 answer scheme ran a vexation ASI for a deemed-exclusive clause with no promise.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Cl 22 is non-exclusive under its Ruritanian proper law, so an ASI against Frostline needs s 18F to apply as a forum mandatory rule, and even then Novara's unreserved merits defence and delay weigh heavily against it; Cryovault is bound by nothing and is suing in the natural forum, so no ASI lies against it.<\/blockquote>", "items": [{"letter": "A", "code": "J6.3.2", "title": "Parallel Proceedings Alone Not Enough", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>UBS v Telesto<\/i> and C&amp;Y, parallel proceedings and the risk of conflicting judgments do not alone justify an ASI<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Cryovault<\/mark> <mark class=\"same\">merely<\/mark> <mark class=\"new\">sued at home for a negative declaration<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Cryovault is not bound by cl 22, Suburbia is the natural forum for a Suburbian tort, and a negative declaration is not itself vexatious.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "J5.2.2", "title": "s 18F as a Forum Mandatory Rule", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per Chong (Chong &amp; Yip 2019 article), s 18F applies to<\/mark> <mark class=\"new\">cl 22<\/mark> <mark class=\"same\">whatever its governing law<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Why it matters: little for exercise, as O 2 r 3 treats<\/mark> <mark class=\"new\">exclusive and non-exclusive clauses<\/mark> <mark class=\"same\">alike (J5.3). It matters for breach: per C&amp;Y, suing in<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">breaches only an exclusive SICC clause, founding<\/mark> <mark class=\"new\">an ASI<\/mark> <mark class=\"same\">(J6.3.1.3; J1.7).<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Yip: s 18F applies only where Singapore law governs.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "J6.3.1.4", "title": "Applicant's Submission Abroad", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>UniCredit<\/i>, the court's discretion, like delay, may weigh<\/mark> <mark class=\"new\">Novara<\/mark> <mark class=\"same\">having submitted to<\/mark> <mark class=\"new\">the Ruritanian court<\/mark><mark class=\"same\">, e.g., by<\/mark> <mark class=\"new\">defending on the merits<\/mark> <mark class=\"same\">(J6.3.1.5). Presently,<\/mark> <mark class=\"new\">Novara took a merits defence without reservation<\/mark><mark class=\"same\">, arguably waiving<\/mark> <mark class=\"new\">cl 22<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Changing lawyers does not undo it, and the defence also gives any Ruritanian judgment jurisdiction by submission (J7.1.2.4).<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "J6.3.1.5", "title": "Delay and Comity", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Novara<\/mark> <mark class=\"same\">waited<\/mark> <mark class=\"new\">over six months<\/mark> <mark class=\"same\">after<\/mark> <mark class=\"new\">the Ruritanian proceedings<\/mark> <mark class=\"same\">began on<\/mark> <mark class=\"new\">October 2025<\/mark><mark class=\"same\">. Per <i>Sun Travels<\/i> (following <i>Ecobank<\/i> and <i>Sea Powerful<\/i>), comity is relevant to delay even in contractual cases<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">It must apply at once, before the June 2027 trial comes closer.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "A real obstacle alongside the merits defence: comity re-enters with delay (<i>Sun Travels<\/i>). Fold it into the discussion of Novara's conduct."}, {"letter": "E", "code": "J6.5.2", "title": "Third Parties", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">The ASI rests on<\/mark> <mark class=\"new\">cl 22<\/mark> <mark class=\"same\">only if<\/mark> <mark class=\"new\">Cryovault<\/mark> <mark class=\"same\">is bound. Per <i>Hai Jiang<\/i> and C&amp;Y,<\/mark> <mark class=\"new\">Cryovault<\/mark> <mark class=\"same\">is bound if it derives rights from a party by<\/mark> <mark class=\"new\">subrogation, assignment or a statutory or equitable right<\/mark><mark class=\"same\">, taking the benefit subject to the burden.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">It derives no rights from Frostline's contract.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Confirms Cryovault is not bound: it derives no rights from the Frostline contract. One line before the vexation analysis."}, {"letter": "F", "code": "J1.2.1", "title": "Deemed Exclusive", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 3(2),<\/mark> <mark class=\"new\">cl 22<\/mark> <mark class=\"same\">is deemed exclusive unless the parties expressly provide otherwise.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Frostline promised not to sue elsewhere, and its Ruritanian suit is a breach.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Section 3(2) deems the clause exclusive for the CCAA's jurisdiction rules. It does not turn cl 22 into a promise not to sue elsewhere, so it cannot found the breach."}, {"letter": "G", "code": "J6.3.1.3", "title": "Exclusive SICC Clause", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">cl 22<\/mark> <mark class=\"same\">is an exclusive SICC clause. Per C&amp;Y, arguably the strong reasons test does not apply at all, so<\/mark> <mark class=\"new\">Frostline<\/mark><mark class=\"same\">'s<\/mark> <mark class=\"new\">Ruritanian suit<\/mark> <mark class=\"same\">in breach should always be restrained.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">This helps only if s 18F first makes cl 22 exclusive.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "If s 18F makes cl 22 exclusive, C&amp;Y suggest the strong reasons test may not apply at all. It matters only once the breach point is won."}]}, {"id": "J-03.1", "side": "J", "hyp": 3, "n": 1, "source": "Mock Paper 3, Hypo 5", "title": "Ostrava v Meridian and Mr Tan", "full": "Mock Paper 3, Hypo 5", "q": "<p>Utopia is a federation of States, each with its own courts and contract law. Ostrava Capital LLC, incorporated in the State of Novo, lent US$20 million to Meridian Hospitality Pte Ltd, a Singapore company. Mr Tan, Meridian's founder, guaranteed the loan. Both the loan and the guarantee are governed by Novo law, and the guarantee requires Mr Tan to keep an address for notices in Novo, for which he named a firm of accountants. Meridian has no presence in Novo. It leases a marketing office in the State of Aurora, 2,000 km away, staffed by two Meridian employees who may not conclude contracts.<\/p><p>Ostrava sued both in the Novo State Court. It served Meridian in Singapore under Novo's service out rules. Its chairman invited Mr Tan to Novo to discuss a standstill agreement that was never intended, and Mr Tan was served at the end of his two-day visit. Meridian applied to set aside service on forum non conveniens grounds, failed, and took no further part; under Novo procedural law, such an application is not a submission. Mr Tan took no part at all: the hearing notice went to the accountants, who had stopped acting for him. In March 2026 the Novo court entered default judgment against both.<\/p><p>Utopia is not gazetted under REFJA and is not a party to the Hague Convention on Choice of Court Agreements. Ostrava now sues on the judgment in Singapore. Advise Meridian and Mr Tan whether Ostrava can enforce the Novo judgment against them.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A default judgment with no treaty, so everything turns on international jurisdiction, defendant by defendant. Service out alone is never enough (<i>Schibsby<\/i>), so ask whether each defendant was present or submitted.<\/p>\n<p><strong>Meridian, presence: J7.1.2.1.<\/strong> The Aurora office may be a place of business, but a State court needs presence in that State (<i>Adams v Cape<\/i>, obiter). Novo is a different State, so Meridian was not present.<\/p>\n<p><strong>Meridian, submission: J7.1.2.4.<\/strong> On <i>Henry v Geoprosco<\/i> the forum non conveniens set-aside is submission, but <i>IGCF<\/i> says it is a protest. Singapore law decides, with Novo procedure as context, and Novo treats it as no submission, so finding submission would be strange (C&amp;Y).<\/p>\n<p><strong>Mr Tan: J7.1.2.2.<\/strong> Temporary presence suffices only if it is voluntary. He was lured by a sham invitation, so he was not present (C&amp;Y).<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not import Singapore's own service rules. <i>Maharanee<\/i> tells you when a Singapore court can serve a visitor, not when a foreign court had international jurisdiction. An address for notices is not an express submission either.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Meridian was not present in Novo, its Aurora office being in another State, and its failed forum non conveniens challenge is best treated as a protest, not a submission; Mr Tan's presence was procured by a sham invitation and so was not voluntary; the Novo court therefore lacked international jurisdiction over both, and the judgment cannot be enforced in Singapore.<\/blockquote>", "items": [{"letter": "A", "code": "J7.1.2.5", "title": "Submission by Agreement", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">(+) Per <i>Vizcaya Partners<\/i> (PC), it may be implied if<\/mark> <mark class=\"new\">Mr Tan<\/mark> <mark class=\"same\">actually consented in advance to<\/mark> <mark class=\"new\">the Novo court<\/mark><mark class=\"same\">; it need not be contractual<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">(−) Per <i>Malaysia Marine<\/i> and other RECJA cases, it must be express.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Vizcaya Partners<\/i>,<\/mark> <mark class=\"new\">Mr Tan<\/mark> <mark class=\"same\">did not impliedly submit merely because<\/mark> <mark class=\"new\">he chose Novo law and named an address for notices there<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Ostrava's fallback against Mr Tan. Choosing Novo law and naming an address there are the kind of indicia <i>Vizcaya<\/i> calls insufficient, and RECJA cases demand express agreement. One line; it probably fails."}, {"letter": "B", "code": "J7.2.2", "title": "Extrinsic Fraud", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Ostrava induced Mr Tan to come to Novo by a sham invitation<\/mark><mark class=\"same\">. Per <i>Hong Pian Tee<\/i>, <i>Abouloff<\/i> applies: no new evidence is needed<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ee Hoong Liang<\/i>, extrinsic fraud is fraud<\/mark> <mark class=\"new\">Mr Tan<\/mark> <mark class=\"same\">had no opportunity to examine and challenge, going to<\/mark> <mark class=\"new\">the Novo court<\/mark><mark class=\"same\">'s jurisdiction<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The lure is not fraud in obtaining the judgment; it bears on whether Mr Tan was present at all. Running <i>Abouloff<\/i> here skips the requirement that decides the case."}, {"letter": "C", "code": "J7.1.1", "title": "Judgment on the Merits", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>The Sennar (No 2)<\/i>,<\/mark> <mark class=\"new\">the Novo judgment<\/mark> <mark class=\"same\">is on the merits as<\/mark> <mark class=\"new\">the Novo court<\/mark> <mark class=\"new\">entered judgment on liability and quantum<\/mark><mark class=\"same\">, not merely<\/mark> <mark class=\"new\">a ruling on procedure<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y,<\/mark> <mark class=\"new\">the March 2026 default judgment<\/mark> <mark class=\"same\">is on the merits although<\/mark> <mark class=\"new\">Meridian and Mr Tan<\/mark> <mark class=\"same\">did not appear and<\/mark> <mark class=\"new\">the Novo court<\/mark> <mark class=\"same\">may not have considered<\/mark> <mark class=\"new\">the evidence<\/mark><mark class=\"same\">; non-participation goes only to fraud (J7.2.2) or natural justice (J7.2.3).<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Needed, and met: a default judgment is on the merits. Neither defendant contests it, so it earns one line before the real fight over jurisdiction."}, {"letter": "D", "code": "J7.1.2.1", "title": "Presence: Federal States", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Adams v Cape<\/i>,<\/mark> <mark class=\"new\">Meridian<\/mark> <mark class=\"same\">must be present in<\/mark> <mark class=\"new\">Novo<\/mark> <mark class=\"same\">at the time of suit, meaning when<\/mark> <mark class=\"new\">the Novo process<\/mark> <mark class=\"same\">was served<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Adams v Cape<\/i> (obiter, \"with varying degrees of doubt\"), presence anywhere in<\/mark> <mark class=\"new\">Utopia<\/mark> <mark class=\"same\">may suffice for<\/mark> <mark class=\"new\">a federal court<\/mark><mark class=\"same\">, but<\/mark> <mark class=\"new\">the Novo State Court<\/mark> <mark class=\"same\">needs presence in<\/mark> <mark class=\"new\">Novo<\/mark><mark class=\"same\">.<\/mark> <mark class=\"new\">The Aurora office, 2,000 km away, does not count.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "J7.1.2.2", "title": "Presence: Natural Persons", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Adams v Cape<\/i> (obiter), voluntary presence suffices even if temporary, so<\/mark> <mark class=\"new\">Mr Tan<\/mark> <mark class=\"same\">served during<\/mark> <mark class=\"new\">a two-day visit<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Novo<\/mark> <mark class=\"same\">was present.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, presence must be voluntary;<\/mark> <mark class=\"new\">Mr Tan<\/mark><mark class=\"same\">,<\/mark> <mark class=\"new\">lured to Novo by Ostrava's sham standstill invitation,<\/mark> <mark class=\"same\">was not present.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "J2.1.1", "title": "Temporary Presence", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Maharanee of Baroda v Wildenstein<\/i> and <i>Colt Industries v Sarlie<\/i>, presence on<\/mark> <mark class=\"new\">a two-day visit<\/mark> <mark class=\"same\">suffices without any substantive connection, even if<\/mark> <mark class=\"new\">the guarantee<\/mark> <mark class=\"same\">arose wholly in<\/mark> <mark class=\"new\">Novo<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Mr Tan, served in person in Novo, was subject to the Novo court.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The trap. <i>Maharanee<\/i> is about serving a visitor in Singapore. International jurisdiction is a different test, and C&amp;Y require voluntary presence, which a lure defeats."}, {"letter": "G", "code": "J7.1.2.4", "title": "Submission by Conduct", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Henry v Geoprosco<\/i>,<\/mark> <mark class=\"new\">Meridian<\/mark><mark class=\"same\">'s application to set aside<\/mark> <mark class=\"new\">service out<\/mark> <mark class=\"same\">because<\/mark> <mark class=\"new\">Novo<\/mark> <mark class=\"same\">was forum non conveniens asked<\/mark> <mark class=\"new\">the Novo court<\/mark> <mark class=\"same\">to decline a jurisdiction it had, so was submission.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>IGCF<\/i> (PC), <i>Henry<\/i>'s existence/exercise line is \"unrealistic and irrational\"<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Giant Light Metal<\/i> (approving <i>Akai<\/i>), Singapore law decides, with<\/mark> <mark class=\"new\">Novo<\/mark> <mark class=\"same\">procedure as context. Per C&amp;Y it would be strange to find submission where<\/mark> <mark class=\"new\">Novo<\/mark> <mark class=\"same\">law would not treat<\/mark> <mark class=\"new\">Meridian<\/mark><mark class=\"same\">'s<\/mark> <mark class=\"new\">set-aside application<\/mark> <mark class=\"same\">as such<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "J-03.2", "side": "J", "hyp": 3, "n": 2, "source": "Mock Paper 3, Hypo 5", "title": "Ostrava v Meridian and Mr Tan", "full": "Mock Paper 3, Hypo 5", "q": "<p>Ostrava Capital LLC, a company of the State of Novo in the Utopian federation, lent US$20 million to Meridian Hospitality Pte Ltd, a Singapore company, to refurbish a resort in Elbonia. When Meridian defaulted, Ostrava sued it in the Novo State Court and served it in Singapore under Novo's service out rules. Meridian's application to set aside service on forum non conveniens grounds failed, and it took no further part.<\/p><p>In March 2026, the Novo court entered default judgment against Meridian for: (a) US$18 million in unpaid principal and interest; (b) statutory interest at 20% a year until payment; (c) US$6 million in punitive damages payable to Ostrava, expressed to be for Meridian's failure to obey the court's order for production of documents; and (d) an order that Meridian deliver up its share certificates in the company owning the Elbonian resort. Meridian may appeal within a year and has not done so. Under Novo law the judgment is binding unless and until it is overturned on appeal.<\/p><p>Ostrava then enforced the judgment in Elbonia, where the resort was sold and Ostrava received US$7 million. Last week a former Ostrava employee gave Meridian e-mails which appear to show that Ostrava forged the drawdown notices on which US$5 million of the claim was based; Meridian could not have obtained them earlier. Utopia is not gazetted under REFJA and is not a party to the Hague Convention on Choice of Court Agreements.<\/p><p>Ostrava now sues on the Novo judgment in Singapore. Assume that the Novo court had international jurisdiction over Meridian. Advise Meridian on how much, if anything, Ostrava may recover.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Assume jurisdiction, then work out the number. Each head of the judgment needs its own answer, and part of the debt has already been paid.<\/p>\n<p><strong>Punitive damages: J7.2.5.<\/strong> The US$6 million punishes disobedience of the court's order, so it is penal though paid to Ostrava (<i>Schnabel v Lui<\/i>); sever it and enforce the rest (<i>Licea<\/i>). The 20% statutory interest, payable to a private creditor, is not penal (<i>Sang Cheol Woo<\/i>).<\/p>\n<p><strong>Delivery up: J7.1.4.<\/strong> The order to deliver up share certificates is a non-money judgment, which is not enforceable at common law. Principal and calculable interest are definite sums.<\/p>\n<p><strong>Satisfaction: J7.2.8.<\/strong> Ostrava has already received US$7 million through the Elbonian sale, so it may enforce only the balance.<\/p>\n<p><strong>Trap to avoid.<\/strong> Sections 16 and 19 are CCAA tools, and Utopia is not a Contracting State; the common law penal rule and <i>Licea<\/i> do that work here. The fraud point is live but limited to US$5 million.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>If the Novo court had jurisdiction, Ostrava may enforce the US$18 million with the statutory interest, less the US$7 million already recovered in Elbonia, but not the US$6 million punitive award, which punishes disobedience of the court and is severable, nor the delivery-up order, which is not a money judgment; the new e-mails may also let Meridian resist the US$5 million tied to the forged notices.<\/blockquote>", "items": [{"letter": "A", "code": "J7.2.2", "title": "Intrinsic Fraud", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">forged drawdown notices<\/mark> <mark class=\"same\">at<\/mark> <mark class=\"new\">the Novo proceedings<\/mark> <mark class=\"same\">go to the merits. Per <i>Hong Pian Tee<\/i>,<\/mark> <mark class=\"new\">Meridian<\/mark> <mark class=\"same\">needs fresh evidence that reasonable diligence would not have uncovered and that would likely have changed the result<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Eleven v Boxsentry<\/i>, the intrinsic test applies to<\/mark> <mark class=\"new\">the Novo default judgment<\/mark> <mark class=\"same\">though<\/mark> <mark class=\"new\">Meridian<\/mark> <mark class=\"same\">took no part.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Only the US$5 million resting on the notices is affected.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Forged documents are intrinsic fraud, so Meridian needs fresh evidence i
