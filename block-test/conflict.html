de": "C2.2.3", "title": "Vitiating Factor and the Clause", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Maldives Airports<\/i> (cf Art 7 Hague Principles),<\/mark> <mark class=\"new\">cl 14<\/mark> <mark class=\"same\">belongs to the separable dispute resolution framework, so per <i>CIMB<\/i><\/mark> <mark class=\"new\">misrepresentation<\/mark> <mark class=\"same\">vitiating<\/mark> <mark class=\"new\">the swap<\/mark> <mark class=\"same\">does not necessarily infect it.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>CIMB<\/i>, a merely disputed<\/mark> <mark class=\"new\">misrepresentation<\/mark> <mark class=\"same\">leaves<\/mark> <mark class=\"new\">Elbonian law<\/mark> <mark class=\"same\">applying \"as if the contract were valid\"<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">So Elbonian law decides rescission; ask whether Valtura affirmed by paying €8 million.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "C2.7", "title": "Formal Validity: Notarisation", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>AQCEL<\/i>,<\/mark> <mark class=\"new\">a missing Suburbian notarisation<\/mark> <mark class=\"same\">has \"no relevance\" to the will to be bound, so it is form; per <i>Integral Petroleum<\/i>,<\/mark> <mark class=\"new\">a requirement of real public control<\/mark> <mark class=\"same\">has \"real substance\", so it is capacity (C2.8.2).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Transniko<\/i>, the lex fori places it where<\/mark> <mark class=\"new\">acceptance<\/mark> <mark class=\"same\">is received,<\/mark> <mark class=\"new\">Singapore<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">As form, it is satisfied under Elbonian law or Singapore law, the place of contracting.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "C-04.3", "side": "C", "hyp": 4, "n": 3, "source": "Mock Paper 4, Hypo 8", "title": "Castellan v Valtura", "full": "Mock Paper 4, Hypo 8", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>Castellan Bank, an Elbonian bank, entered into a ten-year interest rate swap with Valtura, a Suburbian municipality, through its Singapore branch. The confirmation is governed by Elbonian law. Payments were due monthly into Castellan's account in Singapore or Valtura's account in Suburbia, depending on which way rates moved. Rates moved against Valtura, which paid Castellan €8 million. In December 2025, after a diplomatic dispute, Suburbia passed a law prohibiting Suburbian municipalities from making any payment to an Elbonian bank, wherever the payment is to be made. Valtura stopped paying in January 2026, and Castellan claims a further €5 million as the close-out amount.<\/p><p>Valtura says that the December 2025 law is a complete answer. It also says that the swap is void because Suburbian law gives municipalities no power to enter into derivatives, and it claims back the €8 million.<\/p><p>The December 2025 law would frustrate the swap under Suburbian contract law, but not under Elbonian or Singapore contract law. Under Elbonian and Singapore domestic law, money paid under a void contract is recoverable as money paid for a consideration which has failed. Under Suburbian law, a municipality cannot recover money it paid under a transaction outside its powers. Advise Castellan on the December 2025 law and, if the swap is void, on Valtura's claim to the €8 million.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A later foreign ban that is not the law of the contract or of the place of payment, and a restitution claim whose governing law depends on the contract it was paid under.<\/p>\n<p><strong>The ban: C2.10.5.<\/strong> <i>Ralli<\/i> bites only in so far as performance is illegal at the contractual place of performance. Payment is due in Singapore, where it is lawful (<i>Peh Teck Quee<\/i>), and steps taken in Suburbia to arrange it are preparatory (<i>Kleinwort<\/i>). On the frustration reading, Elbonian law says the swap is not frustrated.<\/p>\n<p><strong>Irrelevant laws: C2.10.1.<\/strong> Illegality under the law of a party's residence or incorporation is irrelevant (<i>Sim See Kee<\/i>). The December 2025 law is Suburbian law, so it gives Valtura no defence.<\/p>\n<p><strong>The €8 million: C3.11.<\/strong> If the swap is void, restitution follows the proper law of the obligation; for a contract intended but void, that is the contract's proper law (<i>CIMB v Dresdner<\/i>), Elbonian law, under which the money is recoverable, as in <i>Haugesund<\/i>. The place of enrichment, Singapore, gives the same answer. Suburbian law's bar is not the governing law.<\/p>\n<p><strong>Trap to avoid.<\/strong> The Suburbian ban governs neither the contract nor the place of payment, so do not let it decide either question.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The December 2025 law is no defence, because payment is due in Singapore where it is lawful, Elbonian law does not treat the swap as frustrated, and illegality under the law of Valtura's place of incorporation is irrelevant; if the swap is void for want of capacity, Valtura's claim to the €8 million is governed by Elbonian law as the contract's proper law, under which the money is recoverable.<\/blockquote>", "items": [{"letter": "A", "code": "C3.11", "title": "Unjust Enrichment", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">per Dicey Rule 230 (adopted), the proper law of<\/mark> <mark class=\"new\">Valtura's restitution claim<\/mark><mark class=\"same\">: (a)<\/mark> <mark class=\"new\">the swap<\/mark><mark class=\"same\">'s (putative) proper law<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">CIMB v Dresdner:<\/mark> <mark class=\"new\">an intended but void swap<\/mark> <mark class=\"same\">goes to (a) unless<\/mark> <mark class=\"new\">the incapacity<\/mark> <mark class=\"same\">infects<\/mark> <mark class=\"new\">cl 14<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Under Elbonian law the €8 million is recoverable, as in <i>Haugesund<\/i>.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "C2.10.5", "title": "Ralli: The Place of Payment", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ralli Brothers<\/i>,<\/mark> <mark class=\"new\">payment to an Elbonian bank<\/mark> <mark class=\"same\">is unenforceable in so far as unlawful at<\/mark> <mark class=\"new\">the contractual place of performance<\/mark><mark class=\"same\">, whatever<\/mark> <mark class=\"new\">Elbonian law, the proper law<\/mark><mark class=\"same\">.<\/mark> <mark class=\"new\">Payment is due in Singapore, where it is lawful.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Kleinwort v Ungarische<\/i> and <i>Toprak<\/i>,<\/mark> <mark class=\"new\">the treasurer's authorisations in Suburbia<\/mark> <mark class=\"same\">are steps to get into a position to perform, so do not count, unlike<\/mark> <mark class=\"new\">the payment in Singapore<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "C2.10.3", "title": "Foster", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Foster v Driscoll<\/i> and <i>Regazzoni<\/i> (in Singapore, <i>Patriot v Lam Hong<\/i>; <i>Esben<\/i>), a contract whose real object and intention is<\/mark> <mark class=\"new\">paying an Elbonian bank<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Suburbia<\/mark> <mark class=\"same\">is unenforceable<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Valtura's payments after December 2025 would break Suburbian law.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "<i>Foster<\/i> needs a plan, at formation, to break a foreign law. The swap was lawful when made, and no one intended to break the later ban."}, {"letter": "D", "code": "C1.8", "title": "The Proper Law's Own Rule", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Kahler<\/i>, a contract illegal under<\/mark> <mark class=\"new\">the proper law<\/mark> <mark class=\"same\">is unenforceable<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The proper law, Elbonian law, contains no such ban, so this route does not help Valtura.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Illegality under the proper law bars enforcement (<i>Kahler<\/i>), but Elbonian law has no such ban. A line to close off the route."}, {"letter": "E", "code": "C2.10.1", "title": "Irrelevant Laws", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Sim See Kee<\/i> (and <i>Kleinwort<\/i>), illegality at<\/mark> <mark class=\"new\">Valtura's place of incorporation<\/mark> <mark class=\"same\">is irrelevant<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The December 2025 law is Suburbian law, which is neither the proper law nor the law of the place of payment.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "C2.2.1", "title": "Express Choice of Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Peh Teck Quee<\/i>, applying <i>Vita Food<\/i>,<\/mark> <mark class=\"new\">the confirmation<\/mark><mark class=\"same\">'s choice of<\/mark> <mark class=\"new\">Elbonian law<\/mark> <mark class=\"same\">is virtually conclusive<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Elbonian law decides whether the swap is frustrated, and it says not.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Fixes Elbonian law as the law that decides frustration. One line."}, {"letter": "G", "code": "C2.8.2", "title": "Capacity: Consequences", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y (Dicey r 162),<\/mark> <mark class=\"new\">Valtura<\/mark> <mark class=\"same\">needs capacity under both<\/mark> <mark class=\"new\">Suburbian law<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">Elbonian law<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Haugesund<\/i>, once<\/mark> <mark class=\"new\">Suburbian law<\/mark> <mark class=\"same\">denies capacity,<\/mark> <mark class=\"new\">Elbonian law, the proper law,<\/mark> <mark class=\"same\">decides the consequences<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">That includes what happens to money already paid.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "<i>Haugesund<\/i> sends the consequences of incapacity, including restitution, to the proper law. A bridge to C3.11."}]}, {"id": "C-05.1", "side": "C", "hyp": 5, "n": 1, "source": "Mock Paper 5, Hypo 10", "title": "Titan v Portus", "full": "Mock Paper 5, Hypo 10", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>Titan Cranes Pte Ltd, a Singapore company, hired a crane to Portus Ltd, a Utopian port operator, for use at Portus's terminal in Ruritania, under a contract expressly governed by Utopian law. Hire is payable monthly into Titan's Singapore bank account. Portus stopped paying hire in February 2024 but carried on using the crane. Portus made repeated written promises to pay until December 2025, which it never intended to keep and which persuaded Titan not to sue. Titan issued its claim in October 2026.<\/p><p>In the Singapore court, Titan sues Portus for unpaid hire and seeks an interlocutory injunction restraining Portus from selling the crane pending trial. Portus relies on the Utopian Civil Code:<\/p><ul><li>(a) \"All rights to hire are extinguished two years after the sum in question falls due.\" The two years have expired for all hire that fell due before October 2024. Portus's and Titan's Utopian law experts disagree completely on whether this extinguishes the right or only bars the remedy.<\/li><li>(b) \"A contract of hire exceeding US$1 million in value may be proved only by a notarised instrument.\" The contract is an unnotarised exchange of e-mails, and Titan proposes to prove it by oral evidence.<\/li><li>(c) \"No court shall grant an injunction in a dispute concerning hired goods.\"<\/li><\/ul><p>Under Singapore law, the limitation period for a claim in contract is six years, and proof of a contract does not require writing. Advise Titan on provisions (a), (b) and (c).<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Three Utopian rules, each needing its own characterisation. The experts' disagreement is bait: under the FLPA it no longer matters.<\/p>\n<p><strong>(a) Limitation: C1.5.2.<\/strong> Section 3(1) applies the lex causae's limitation period, and s 6(2) makes its label irrelevant, so Utopian law's two years applies and hire due before October 2024 is barred. Whether the rule extinguishes or bars is moot.<\/p>\n<p><strong>(b) Proof: C1.6.1.<\/strong> What must be proved is substance; how it is proved is procedure. \"May be proved only by a notarised instrument\" goes to how, so Singapore law allows oral evidence. On a functional view it might be form, which the proper law or the place of contracting may satisfy.<\/p>\n<p><strong>(c) Injunction: C1.3.2.<\/strong> An interim injunction protects the court's own process, so the lex fori governs. Provision (c) does not stop a Singapore injunction against selling the crane.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not apply both limitation periods, and do not decide (a) by asking whether it extinguishes or bars: that common law test is superseded. Titan's real route on the barred hire is s 4(2) undue hardship.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Under FLPA ss 3(1) and 6(2) Utopia's two-year period applies whatever its label, barring hire due before October 2024 unless s 4(2) helps; provision (b) governs how the contract is proved, so it is procedural and Titan may use oral evidence; and provision (c) cannot stop a Singapore interim injunction, which is for the lex fori.<\/blockquote>", "items": [{"letter": "A", "code": "C1.2.2", "title": "Applying the Star City Test", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Star City<\/i>,<\/mark> <mark class=\"new\">provision (a)'s \"extinguished\"<\/mark> <mark class=\"same\">negates<\/mark> <mark class=\"new\">the right<\/mark><mark class=\"same\">, so<\/mark> <mark class=\"new\">Utopian law<\/mark> <mark class=\"same\">applies.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Star City<\/i>,<\/mark> <mark class=\"new\">a rule that no action lies without notarisation<\/mark> <mark class=\"same\">bars only enforcement of<\/mark> <mark class=\"new\">the right<\/mark><mark class=\"same\">, so Singapore law applies.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The general substance-procedure test. For (a) the FLPA makes the label irrelevant, and for (b) the what-or-how divide in C1.6.1 is the sharper tool."}, {"letter": "B", "code": "C1.3.2", "title": "Interim Remedies", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y,<\/mark> <mark class=\"new\">the interlocutory injunction<\/mark> <mark class=\"same\">protects the court's own processes, so the lex fori governs its grant against<\/mark> <mark class=\"new\">Portus<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Shanghai Electric<\/i>, restraining<\/mark> <mark class=\"new\">a bond call<\/mark> <mark class=\"same\">is substantive, as it deprives<\/mark> <mark class=\"new\">its beneficiary<\/mark> <mark class=\"same\">of immediate payment<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">A freeze on selling the crane pending trial is not of that kind.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">So provision (c) does not bind the Singapore court.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "C1.5.2", "title": "FLPA: General Rule", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 3(1) FLPA, only<\/mark> <mark class=\"new\">Utopian law<\/mark><mark class=\"same\">'s limitation law applies, not Singapore's, and per s 6(2) its<\/mark> <mark class=\"new\">extinguishing or barring<\/mark> <mark class=\"same\">label is irrelevant, so<\/mark> <mark class=\"new\">hire due before October 2024 is<\/mark> <mark class=\"same\">barred.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Renvoi: excluded (ss 3(5), 6(2)), so only<\/mark> <mark class=\"new\">Utopian law<\/mark><mark class=\"same\">'s domestic period applies<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">So the experts' dispute is moot, and Singapore's six years never applies.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "C2.7", "title": "Formal Validity", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per the Giuliano-Lagarde Report, \"every external manifestation required\" of one expressing the will to be bound, so<\/mark> <mark class=\"new\">notarisation<\/mark> <mark class=\"same\">is<\/mark> <mark class=\"new\">form, if provision (b) is substantive<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>AQCEL<\/i> (adopting <i>PT Jaya Putra<\/i>'s obiter), meeting<\/mark> <mark class=\"new\">provision (b)<\/mark> <mark class=\"same\">under either<\/mark> <mark class=\"new\">Utopian law, the proper law,<\/mark> <mark class=\"same\">or<\/mark> <mark class=\"new\">the lex loci contractus<\/mark> <mark class=\"same\">suffices<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The fallback if (b) is substantive on a functional view: notarisation is then form, and Utopian law or the place of contracting may be satisfied. Argue it in the alternative."}, {"letter": "E", "code": "C1.6.1", "title": "Characterisation of Evidential Matters", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, what must be proved is substantive<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">and how is procedural, so admissibility of<\/mark> <mark class=\"new\">oral evidence of the hire contract<\/mark> <mark class=\"same\">is for the lex fori (<i>Banque Indosuez<\/i>).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Provision (b) says \"may be proved only by\", which goes to how, not what, so Singapore allows oral evidence.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Counter: per C&amp;Y, on a functional view (C1.2.3)<\/mark> <mark class=\"new\">provision (b)<\/mark> <mark class=\"same\">may be substantive, following<\/mark> <mark class=\"new\">Utopian law<\/mark> <mark class=\"same\">(C2.7).<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "C1.5.1", "title": "Common Law: Extinguish v Bar", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>BBA v BAZ<\/i>, a statute extinguishing the right is substantive, following<\/mark> <mark class=\"new\">Utopian law<\/mark><mark class=\"same\">, but one barring the remedy is procedural, so Singapore's<\/mark> <mark class=\"new\">six-year period<\/mark> <mark class=\"same\">applied to<\/mark> <mark class=\"new\">the claim<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Substantive wording (+):<\/mark> <mark class=\"new\">provision (a)<\/mark> <mark class=\"same\">reads<\/mark> <mark class=\"new\">\"all rights to hire are extinguished\"<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">So the court must first resolve the experts' disagreement.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The common law extinguish-or-bar test is superseded by the FLPA. Using it sends you into the experts' dispute, which s 6(2) makes irrelevant."}, {"letter": "G", "code": "C1.5.4", "title": "Undue Hardship (s 4(2))", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 4(2) FLPA,<\/mark> <mark class=\"new\">the two-year period<\/mark> <mark class=\"same\">is contrary to public policy if it causes<\/mark> <mark class=\"new\">Titan<\/mark> <mark class=\"same\">undue hardship. Per <i>Recovery Vehicle 1<\/i> (adopting <i>The Pegasus<\/i>), that is \"greater hardship than the circumstances warrant\"<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Recovery Vehicle 1<\/i>, the hardship must flow from<\/mark> <mark class=\"new\">the Utopian period<\/mark> <mark class=\"same\">itself, not from<\/mark> <mark class=\"new\">Titan's own choice to wait<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Portus's false promises explain the delay, so this is a good argument, not a certain one.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Titan's best answer to the time bar: Portus's false promises explain the delay. But the hardship must flow from the period itself, so it is a good argument, not a sure one."}]}, {"id": "C-05.2", "side": "C", "hyp": 5, "n": 2, "source": "Mock Paper 5, Hypo 10", "title": "Jamal v Titan", "full": "Mock Paper 5, Hypo 10", "q": "<p>Assume the Singapore court will assume jurisdiction, and that the only relevant laws are Singapore and Ruritanian law.<\/p><p>Titan Cranes Pte Ltd, a Singapore company, hired a crane to a port operator for use at its terminal in Ruritania. On 5 March 2024 the crane collapsed, seriously injuring Jamal, a Titan technician domiciled in Singapore who was on a two-week posting to the terminal. Jamal was in a coma for 13 months. It is not clear whether the collapse was caused by Titan's poor maintenance, Jamal's failure to follow a safety checklist, or both. Jamal sued Titan in negligence in Singapore 22 months after the collapse.<\/p><p>Titan pleads and proves these provisions of the Ruritanian Workplace Code: (f) \"All claims for personal injury must be brought within 18 months of the injury.\" The Singapore period has not expired. (g) \"Damages for pain and suffering shall not exceed US$50,000.\" A Singapore court would award about US$200,000. (h) \"Where an injured person is at fault, damages shall be reduced by one half.\" A Singapore court would apportion 10% to Jamal on the same facts. Jamal relies on provision (i) of the same Code: \"Where a worker is injured at work, the employer is presumed to have been negligent unless it proves otherwise.\" Under Ruritanian tort law, Jamal's claim is otherwise actionable.<\/p><p>Advise Titan on Jamal's claim.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Four foreign provisions on time, quantum, fault and proof. Each is characterised separately, and the claimant's coma changes the time bar answer.<\/p>\n<p><strong>Time: C1.5.4.<\/strong> Section 3(2) FLPA applies only the lex loci delicti's period, so Jamal is out of time under (f). But a 13-month coma left him five months to sue, which is hardship greater than the circumstances warrant (<i>Recovery Vehicle 1<\/i>). The bar is likely disapplied under s 4(2).<\/p>\n<p><strong>Cap and fault: C1.4.<\/strong> The head of damage exists under Ruritanian law; quantum is traditionally procedural, so US$200,000. On the <i>Goh Suan Hee<\/i> obiter, a statutory cap is a rule of law, so US$50,000 if quantum is substantive. Contributory negligence goes to the extent of liability, so Titan argues the 50% rule applies; on the traditional view Jamal bears 10%.<\/p>\n<p><strong>Presumption: C1.6.1.<\/strong> Burden of proof is generally procedural (<i>Re Fuld<\/i>), so Singapore's rule applies and Jamal must prove negligence. Provision (i) does not help him.<\/p>\n<p><strong>Trap to avoid.<\/strong> The common law extinguish-or-bar test is superseded: under the FLPA only the Ruritanian period applies, and s 4(2) is the safety valve.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Under FLPA s 3(2) the Ruritanian 18-month period applies and Jamal is out of time, but a 13-month coma makes the bar an undue hardship under s 4(2); if the claim proceeds, the head of damage exists, the cap and the halving rule apply only if quantum and apportionment are treated as substantive, and Singapore's procedural burden of proof means Jamal cannot rely on the Ruritanian presumption of negligence.<\/blockquote>", "items": [{"letter": "A", "code": "C1.4", "title": "Damages: Cap and Contributory Negligence", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Boys v Chaplin<\/i> and <i>Harding v Wealands<\/i>, heads<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">are substantive, so<\/mark> <mark class=\"new\">pain and suffering<\/mark> <mark class=\"same\">must exist under<\/mark> <mark class=\"new\">Ruritanian law<\/mark><mark class=\"same\">, but quantum is procedural, so<\/mark> <mark class=\"new\">Jamal<\/mark> <mark class=\"same\">recovers<\/mark> <mark class=\"new\">about US$200,000<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">(if quantum is substantive) per <i>Goh Suan Hee<\/i>,<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">'s rules of law<\/mark> <mark class=\"new\">(the US$50,000 cap)<\/mark> <mark class=\"same\">apply<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Contributory Negligence: open; it goes to the extent of liability, so<\/mark> <mark class=\"new\">Titan<\/mark> <mark class=\"same\">argues it is substantive on a functional view<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "C1.6.3", "title": "Pleaded but Unproved", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Brownlie<\/i>, once<\/mark> <mark class=\"new\">Ruritanian law<\/mark> <mark class=\"same\">is pleaded the court must apply it, so<\/mark> <mark class=\"new\">Titan<\/mark> <mark class=\"same\">failing to prove its case under it may simply lose (EFT Holdings)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Titan cannot prove provisions (f) to (h), so they fall away.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "On these facts Titan has proved the Ruritanian provisions, so the question of unproved law does not arise."}, {"letter": "C", "code": "C3.6.3", "title": "Displacing the Lex Loci Delicti", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">In <i>Boys v Chaplin<\/i>, British servicemen collided in Malta, and per Lord Wilberforce Malta had no interest in applying its special-damages-only rule to non-residents, so<\/mark> <mark class=\"new\">Ruritania's cap yields<\/mark> <mark class=\"same\">for<\/mark> <mark class=\"new\">two Singapore parties<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Rickshaw Caveat (−): per C&amp;Y, a road accident's place is rarely fortuitous<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">nor is a crane collapse at the site where the crane worked.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Jamal might argue Ruritania is fortuitous because both parties are Singaporean and the posting was short (<i>Boys v Chaplin<\/i>), but the crane's own site is no accident of location. He can try it issue by issue."}, {"letter": "D", "code": "C1.5.4", "title": "Undue Hardship (s 4(2))", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 4(2) FLPA,<\/mark> <mark class=\"new\">the 18-month period<\/mark> <mark class=\"same\">is contrary to public policy if it causes<\/mark> <mark class=\"new\">Jamal<\/mark> <mark class=\"same\">undue hardship. Per <i>Recovery Vehicle 1<\/i> (adopting <i>The Pegasus<\/i>), that is \"greater hardship than the circumstances warrant\"<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">A 13-month coma left Jamal five months to sue: strong hardship, likely enough to disapply the bar.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "C1.6.1", "title": "Burden of Proof", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Burden of Proof: Per <i>Re Fuld's Estate (No 3)<\/i>, generally procedural, so<\/mark> <mark class=\"new\">Singapore's rule that the claimant proves negligence<\/mark> <mark class=\"same\">applies despite<\/mark> <mark class=\"new\">Ruritanian law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So provision (i)'s presumption does not help Jamal; he must prove negligence.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "C1.5.1", "title": "Common Law: Extinguish v Bar", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>BBA v BAZ<\/i>, a statute extinguishing the right is substantive, following<\/mark> <mark class=\"new\">Ruritanian law<\/mark><mark class=\"same\">, but one barring the remedy is procedural, so Singapore's<\/mark> <mark class=\"new\">limitation period<\/mark> <mark class=\"same\">applied to<\/mark> <mark class=\"new\">the claim<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Procedural wording (−):<\/mark> <mark class=\"new\">provision (f)<\/mark> <mark class=\"same\">reads<\/mark> <mark class=\"new\">\"all claims for personal injury must be brought within 18 months\"<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">So (f) is procedural and Singapore's period applies.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "That test is superseded by the FLPA. Under s 3(2) the Ruritanian period applies whatever its wording, and Singapore's does not."}, {"letter": "G", "code": "C1.5.3", "title": "FLPA: Tort Cases", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 3(2) FLPA, a foreign law considered \"for the purpose of actionability\" is deemed to apply under s 3(1), a \"clear reference\" to double actionability (<i>IM Skaugen<\/i>), so<\/mark> <mark class=\"new\">Jamal's claim is<\/mark> <mark class=\"same\">barred under<\/mark> <mark class=\"new\">Ruritania's 18-month period<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Singapore's longer period does not run alongside it.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The starting point on time: only the Ruritanian period applies, so Jamal is out of time. C1.5.4 is where the answer turns."}]}, {"id": "C-05.3", "side": "C", "hyp": 5, "n": 3, "source": "Mock Paper 5, Hypo 10", "title": "Titan v Jamal and Portus", "full": "Mock Paper 5, Hypo 10", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>Titan Cranes Pte Ltd, a Singapore company, is defending a negligence claim in Singapore by Jamal, its technician, who was injured when a crane collapsed in Ruritania. Titan relies on provisions of the Ruritanian Workplace Code that impose an 18-month limitation period, cap damages for pain and suffering, and halve damages for a claimant at fault. Jamal relies on a provision of the same Code presuming an employer negligent.<\/p><p>Titan's Ruritanian law expert has died, and Titan has not found a replacement. Jamal says that Titan has therefore failed to prove its provisions, and that the court should presume that Ruritanian law is the same as Singapore law. Titan replies that, if Ruritanian law is not proved, Jamal cannot rely on the presumption of negligence and cannot show civil liability under the law of the place of the tort. Ruritania has a civil law system with no historical link to Singapore law.<\/p><p>In a separate action against Portus Ltd, a port operator, under a contract governed by Utopian law, Titan's and Portus's Utopian law experts disagree completely about a provision of the Utopian Civil Code.<\/p><p>Advise Titan on how Ruritanian and Utopian law are to be established. How, if at all, would your answer differ if the actions were in the SICC?<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Who has to prove foreign law, what happens when they cannot, and what the SICC changes. Titan's own argument gets the burden backwards.<\/p>\n<p><strong>Burden: C3.5.<\/strong> The claimant proves limb 1; a defendant who wants foreign law for limb 2 must plead and prove it (<i>EFT<\/i>). So Titan's reply fails: Jamal does not have to prove Ruritanian law.<\/p>\n<p><strong>Unproved law: C1.6.3.<\/strong> Once Ruritanian law is pleaded, the court must apply it, and the presumption of similarity applies only where fair. It is unsuitable for a civil law system with no link to Singapore law. Titan should find a new expert, since its provisions help it only if proved.<\/p>\n<p><strong>SICC: C1.6.5.<\/strong> The SICC may decide foreign law on submissions instead of proof (s 18L), which would deal with both the dead expert and the deadlocked Utopian experts.<\/p>\n<p><strong>Trap to avoid.<\/strong> Titan cannot use its own failure to prove Ruritanian law against Jamal. Limb 2 is a defence for Titan to raise.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Titan, not Jamal, must plead and prove Ruritanian law to rely on it, and the presumption of similarity is unsuitable for an unrelated civil law system, so Titan should find a new expert; the deadlocked Utopian experts call for a common expert or a reference to the foreign court; and in the SICC both laws could simply be decided on submissions under s 18L.<\/blockquote>", "items": [{"letter": "A", "code": "C1.6.1", "title": "SICC Evidence Carve-Out", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 18K SCJA (SICC O 13 r 15), on<\/mark> <mark class=\"new\">Titan<\/mark><mark class=\"same\">'s application<\/mark> <mark class=\"new\">the SICC<\/mark> <mark class=\"same\">may disapply Singapore evidence rules and apply<\/mark> <mark class=\"new\">Ruritanian rules<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">A further SICC difference, though not the main one here.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The SICC may also disapply Singapore evidence rules (s 18K). A secondary SICC difference."}, {"letter": "B", "code": "C1.6.5", "title": "SICC: Foreign Law on Submissions", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 18L SCJA (SICC O 16 r 8),<\/mark> <mark class=\"new\">the SICC<\/mark> <mark class=\"same\">may decide<\/mark> <mark class=\"new\">Ruritanian and Utopian law<\/mark> <mark class=\"same\">on submissions instead of proof by<\/mark> <mark class=\"new\">counsel or a registered law expert<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">That would deal with both the dead expert and the deadlocked experts.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "C1.6.2", "title": "Partisan Experts", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Wu Yang<\/i>, partisan experts are \"singularly unhelpful\", hence<\/mark> <mark class=\"new\">a single common Utopian law expert<\/mark> <mark class=\"same\">(O 12 r 3(1) ROC 2021; SICC O 14 r 2(4)(a)) or, rarely,<\/mark> <mark class=\"new\">one appointed by the court<\/mark> <mark class=\"same\">(O 12 r 3(3)).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">That is the answer to the deadlocked Utopian experts in the General Division.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The General Division's answer to the Utopian deadlock: a common expert, or rarely a court expert (<i>Wu Yang<\/i>). Worth a line."}, {"letter": "D", "code": "C3.3.3", "title": "Applying Limb 2", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Limb 2 is satisfied if<\/mark> <mark class=\"new\">Ruritanian law<\/mark> <mark class=\"same\">gives<\/mark> <mark class=\"new\">Jamal a civil remedy<\/mark> <mark class=\"same\">for<\/mark> <mark class=\"new\">the collapse<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Jamal must prove Ruritanian law to show civil liability there, and without an expert he cannot.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Limb 2 is for the defendant to invoke by pleading and proving foreign law (<i>EFT<\/i>). Jamal satisfies limb 1, and Titan's failure to prove Ruritanian law cannot be turned against him."}, {"letter": "E", "code": "C1.6.3", "title": "Limits of the Presumption", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Brownlie<\/i>, a rule of evidence on content, applied only where fair and reasonable to expect<\/mark> <mark class=\"new\">Ruritanian law<\/mark> <mark class=\"same\">to be materially similar.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Different traditions: per C&amp;Y, not for<\/mark> <mark class=\"new\">a revenue code<\/mark> <mark class=\"same\">or<\/mark> <mark class=\"new\">Ruritania's civil law system<\/mark> <mark class=\"same\">lacking universal principles<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">So the presumption is unsuitable here: Titan should find a new expert.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "C3.5", "title": "Proof of Foreign Law in Tort", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>EFT Holdings<\/i> (applying <i>Goh Chok Tong v Tang Liang Hong<\/i>), pleading<\/mark> <mark class=\"new\">Ruritanian law<\/mark> <mark class=\"same\">is voluntary, so if<\/mark> <mark class=\"new\">Titan<\/mark> <mark class=\"same\">does not plead it, no conflicts issue arises<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Pleaded but Not Proved: unproved<\/mark> <mark class=\"new\">Ruritanian law<\/mark> <mark class=\"same\">is presumed similar where fair (Brownlie; C1.6.3), though<\/mark> <mark class=\"new\">Titan, which bears the burden,<\/mark> <mark class=\"same\">may simply fail (EFT).<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">So Titan's reply fails: limb 2 is Titan's to raise and prove, not Jamal's.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "C1.6.4", "title": "References to Foreign Courts", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per O 29 ROC 2021 (SICC O 15), on<\/mark> <mark class=\"new\">Titan's application<\/mark> <mark class=\"same\">the court may order proceedings in<\/mark> <mark class=\"new\">a \"specified court\"<\/mark> <mark class=\"same\">on<\/mark> <mark class=\"new\">its own law<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Possible for the Utopian provision if Utopia's court is specified; costly, and foreign courts may decline.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "A reference to the Utopian court is possible if it is a specified court, but it is costly and the foreign court may decline. An option, not the answer."}]}, {"id": "C-06.1", "side": "C", "hyp": 6, "n": 1, "source": "Mock Paper 6, Hypo 12", "title": "Harbour Re v Almeida", "full": "Mock Paper 6, Hypo 12", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>Harbour Re Pte Ltd, a Singapore reinsurer, agreed in February 2023 to reinsure a hull policy that Almeida Seguros SA, a Lusitanian marine insurer, had issued to a Lusitanian shipowner. The hull policy is expressly governed by Lusitanian law. The reinsurance was placed by a broker in Singapore on a slip with no separate choice of law clause, but with the words \"Conditions: as original\". Almeida says these words choose Lusitanian law; Harbour says they refer only to the terms of cover.<\/p><p>The slip is in English and follows the hull policy's wording on all matters of cover. It also incorporates the Institute Time Clauses, a London market form interpreted by the English courts for over a century. Premium is payable in US dollars into Harbour's Singapore account; claims are payable in euros into Almeida's Lusitanian account. The slip refers disputes to arbitration in Singapore, though both parties have since waived that clause. Almeida pays claims under the hull policy in Lusitania, where the insured vessels are registered. Harbour says that after the slip was signed, Almeida always sent its claims by reference to Singapore law.<\/p><p>Almeida has claimed on the reinsurance. Harbour wants to avoid it for non-disclosure, which it may do under Singapore law but not Lusitanian law. Under Lusitanian domestic law, a reinsurance slip that does not state its governing law is invalid. Advise Harbour on the law governing the slip.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A slip with a phrase that might be a choice of law, and implied-choice factors pulling three ways. Take the stages in order, and do not let later conduct or forum factors leak in.<\/p>\n<p><strong>Stage 1: C2.2.4.<\/strong> The lex fori construes \"Conditions: as original\". It refers to the terms of cover, not the governing law, so there is no express choice.<\/p>\n<p><strong>Stage 2: C2.3.2.<\/strong> Arbitration in Singapore is a heavy pointer to Singapore law (<i>Pacific Recreation<\/i>), and the later waiver does not change the intention at contracting. The Institute clauses point to English law (<i>Amin Rasheed<\/i>) and the back-to-back cover to Lusitanian law (<i>JIO<\/i>). English and US dollars carry little weight.<\/p>\n<p><strong>Validation: C2.3.3.<\/strong> A Lusitanian reading would make the slip invalid, so the parties are presumed not to have intended it (<i>ut res magis valeat<\/i>). Best view: an implied choice of Singapore law, so Harbour may avoid.<\/p>\n<p><strong>Trap to avoid.<\/strong> Almeida's later habit of citing Singapore law is irrelevant to the proper law, which is fixed at contracting (<i>Las Vegas Hilton<\/i>). At most it founds an estoppel.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Read under Singapore law, \"Conditions: as original\" incorporates terms of cover, not a governing law; at Stage 2 the Singapore arbitration clause carries the most weight and validation points away from Lusitanian law, under which the slip would be invalid, so the slip is impliedly governed by Singapore law and Harbour may avoid for non-disclosure.<\/blockquote>", "items": [{"letter": "A", "code": "C2.3.3", "title": "Validation; Pointing Away", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y (cf <i>Pacific Recreation<\/i>), parties presumed to intend a valid contract (ut res magis valeat) chose<\/mark> <mark class=\"new\">Singapore law<\/mark><mark class=\"same\">, under which<\/mark> <mark class=\"new\">the slip<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">every term<\/mark> <mark class=\"same\">are valid.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">A Lusitanian reading would make the slip invalid for not stating its law, so the validation principle points away from Lusitanian law.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Pacific Recreation<\/i>, factors negating<\/mark> <mark class=\"new\">Lusitanian law<\/mark> <mark class=\"same\">did not imply<\/mark> <mark class=\"new\">any other law by themselves<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "C2.2.6", "title": "Change of Proper Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Kredietbank v Sinotani<\/i> (and <i>James Miller<\/i>),<\/mark> <mark class=\"new\">Harbour and Almeida<\/mark> <mark class=\"same\">may change<\/mark> <mark class=\"new\">Lusitanian law<\/mark> <mark class=\"same\">to<\/mark> <mark class=\"new\">Singapore law<\/mark><mark class=\"same\">, though whether the lex fori or the original proper law decides if the change is allowed is open.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Almeida's practice of claiming by reference to Singapore law shows that the parties changed the law after contracting.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "There was no agreement to change the law. Almeida's later practice is only subsequent conduct, which is irrelevant to the proper law."}, {"letter": "C", "code": "C2.1.2", "title": "Subsequent Conduct", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Las Vegas Hilton<\/i>, the proper law is fixed at contracting, so<\/mark> <mark class=\"new\">the later practice of citing Singapore law in claims<\/mark> <mark class=\"same\">is irrelevant, though per <i>James Miller<\/i> it may found an estoppel against<\/mark> <mark class=\"new\">Almeida<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Harbour cannot use the claims correspondence to prove the proper law.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Answers Harbour's own point: later conduct cannot fix the proper law. It might found an estoppel, but Harbour does not need one."}, {"letter": "D", "code": "C2.3.2", "title": "Applying the Implied Choice Factors", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Pacific Recreation<\/i>, submitting to<\/mark> <mark class=\"new\">arbitration in Singapore<\/mark> <mark class=\"same\">implies<\/mark> <mark class=\"new\">Singapore law<\/mark><mark class=\"same\">, the chosen forum being presumed to apply its own law.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per Lord Diplock in <i>Amin Rasheed<\/i>,<\/mark> <mark class=\"new\">the Institute Time Clauses, a London market form,<\/mark> <mark class=\"same\">imply<\/mark> <mark class=\"new\">English law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Per <i>JIO Minerals<\/i>,<\/mark> <mark class=\"new\">the slip<\/mark> <mark class=\"same\">so closely related to<\/mark> <mark class=\"new\">the hull policy under Lusitanian law<\/mark> <mark class=\"same\">takes<\/mark> <mark class=\"new\">Lusitanian law<\/mark><mark class=\"same\">, even between different parties.<\/mark><\/span><\/li><li><span class=\"n\">4<\/span><span class=\"tx\"><mark class=\"new\">English and US dollars carry little weight; the waiver came later.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "C2.5", "title": "Promissory Choice of Law Clause", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ace Insurance<\/i>,<\/mark> <mark class=\"new\">the slip's wording<\/mark> <mark class=\"same\">is declaratory, as<\/mark> <mark class=\"new\">an inferred choice of Singapore law<\/mark> <mark class=\"same\">cannot contain a promise and party autonomy is fettered anyway; only very clear language makes it promissory<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Almeida has not broken any promise about the governing law.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Promissory clauses matter only where a party sues for breach of the clause. No one does here; the question is simply which law governs."}, {"letter": "F", "code": "C2.2.4", "title": "Unclear Expression of Choice", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Enka v Chubb<\/i> and <i>Compagnie Tunisienne<\/i>, the lex fori's ordinary interpretation rules construe<\/mark> <mark class=\"new\">\"Conditions: as original\"<\/mark><mark class=\"same\">, the proper law being a connecting factor<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Read under Singapore law, the words incorporate the original's terms of cover, not its governing law, so there is no express choice of Lusitanian law.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "C2.4.3", "title": "Weighting at Stage 3", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per Prof Chong, the strongest argument is usually<\/mark> <mark class=\"new\">the place where both parties perform, but here they split: premium in Singapore, claims in Lusitania<\/mark><mark class=\"same\">, supported by<\/mark> <mark class=\"new\">the Singapore broker and reinsurer<\/mark><mark class=\"same\">, so<\/mark> <mark class=\"new\">Singapore law<\/mark> <mark class=\"same\">is the OPL.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, <i>Pacific Recreation<\/i>'s \"equal weight\" dictum is puzzling, as<\/mark> <mark class=\"new\">the place of performance<\/mark> <mark class=\"same\">carries great weight<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The Stage 3 fallback if no implied choice is found: premium, broker and reinsurer in Singapore against claims and vessels in Lusitania. Run it only if Stage 2 fails."}]}, {"id": "C-06.2", "side": "C", "hyp": 6, "n": 2, "source": "Mock Paper 6, Hypo 12", "title": "Harbour Re v Polaris", "full": "Mock Paper 6, Hypo 12", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>In June 2024, Harbour Re Pte Ltd, a Singapore reinsurer, retroceded part of a marine risk to Polaris Re Ltd, an Elbonian company, under a Retrocession Agreement which provides:<\/p><p>\"8. Articles 1 to 5 (premium and accounting) are governed by Singapore law. Articles 6 to 12 (claims) are governed by Elbonian law. 9. This agreement shall be interpreted in accordance with the Principles of Reinsurance Contract Law, and not the law of any country. 10. Each party promises that it will not contend, in any court or tribunal, that any law other than the law chosen in Clause 8 applies to this agreement.\"<\/p><p>A loss occurred in November 2024. By an endorsement dated 1 February 2025, the parties replaced clause 8 with: \"This agreement is governed by Singapore law.\" Polaris then paid part of Harbour's claim. It now says that the whole agreement, including clause 8 and the endorsement, was induced by Harbour's fraudulent understatement of the fleet's loss record, and it refuses to pay more. In May 2026, Polaris sued Harbour in Ruritania, whose courts apply Ruritanian law to all reinsurance disputes.<\/p><p>The Principles are a non-binding set of rules drafted by academics, not the law of any country. Under Singapore and Elbonian law, a contract induced by fraud is voidable; under Ruritanian law it is void. Under no relevant law is a choice of law clause itself affected by a fraud of the kind alleged. Advise Harbour on the law or laws governing the Retrocession Agreement, on Polaris's attack on it, and on any remedy it has for the Ruritanian action.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Three unusual clauses in one agreement: a split choice, a choice of non-national rules, and a promise about the choice. Take each in turn, then deal with the fraud plea and the Ruritanian suit.<\/p>\n<p><strong>Split and change: C2.2.6.<\/strong> A split choice is permitted if it is coherent and express (<i>Libyan Arab<\/i>), and parties may later change the proper law (<i>Kredietbank<\/i>), provided third parties are not prejudiced. Whether the February 2025 endorsement reaches the November 2024 loss is construction.<\/p>\n<p><strong>Cl 9: C2.1.2.<\/strong> Only a country's law can be the proper law (<i>Musawi<\/i>), so the Principles cannot govern. They can be incorporated as terms under the law chosen in cl 8 (<i>Beximco<\/i>).<\/p>\n<p><strong>Cl 10: C2.5.<\/strong> A choice of law clause is ordinarily declaratory (<i>Ace Insurance<\/i>), but \"promises\" is very clear language. Seising a court whose conflicts rules ignore the chosen law is clearly a breach (C&amp;Y), and Ruritania applies its own law to all reinsurance disputes. Remedies: damages and a contractual ASI. Polaris replies that cl 10 bars only \"contending\", not suing.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not let Polaris's fraud plea knock out the chosen law. The fraud does not infect the choice of law clause (<i>CIMB<\/i>), so the chosen law governs, under which the agreement is voidable, not void.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Cl 8's split is valid and the endorsement validly changed the proper law to Singapore law, subject to whether it reaches the earlier loss; cl 9 cannot make the Principles the governing law, though they may operate as terms; the alleged fraud leaves the chosen law in place, so the agreement is at most voidable; and cl 10 is a genuine promise, so Polaris's Ruritanian suit is arguably a breach, founding damages and a contractual anti-suit injunction.<\/blockquote>", "items": [{"letter": "A", "code": "C2.2.5", "title": "Floating Proper Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">As contracts cannot exist \"in a legal vacuum\" (<i>Amin Rasheed<\/i>),<\/mark> <mark class=\"new\">cl 8<\/mark> <mark class=\"same\">applying<\/mark> <mark class=\"new\">two laws, later replaced by one,<\/mark> <mark class=\"same\">is \"meaningless\" and of no legal effect (<i>Shanghai Turbo<\/i>)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So the split and the endorsement are both void.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "A floating clause leaves the law undetermined until a later event. Cl 8 fixes two laws from the start, and the endorsement is an agreed change, which is permitted."}, {"letter": "B", "code": "C2.2.6", "title": "Split and Change of Proper Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Libyan Arab Foreign Bank<\/i>,<\/mark> <mark class=\"new\">Singapore law<\/mark> <mark class=\"same\">may govern<\/mark> <mark class=\"new\">Articles 1 to 5<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">Elbonian law<\/mark> <mark class=\"same\">the rest (cf Art 2(2) Hague Principles)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Kredietbank v Sinotani<\/i> (and <i>James Miller<\/i>),<\/mark> <mark class=\"new\">Harbour and Polaris<\/mark> <mark class=\"same\">may change<\/mark> <mark class=\"new\">the split<\/mark> <mark class=\"same\">to<\/mark> <mark class=\"new\">Singapore law<\/mark><mark class=\"same\">, though whether the lex fori or the original proper law decides if the change is allowed is open.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Whether the endorsement reaches the November 2024 loss is a question of construction.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "C2.5", "title": "Promissory Choice of Law Clause", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ace Insurance<\/i>,<\/mark> <mark class=\"new\">a choice of law clause<\/mark> <mark class=\"same\">is declaratory, as<\/mark> <mark class=\"new\">an inferred choice<\/mark> <mark class=\"same\">cannot contain a promise<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">but cl 10 says \"promises\", which is very clear language.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y,<\/mark> <mark class=\"new\">cl 10<\/mark> <mark class=\"same\">is construed under<\/mark> <mark class=\"new\">Singapore law<\/mark><mark class=\"same\">, clearly breached by seising<\/mark> <mark class=\"new\">the Ruritanian court<\/mark> <mark class=\"same\">whose conflicts rules ignore<\/mark> <mark class=\"new\">cl 8<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, if promissory: damages, an ASI on the stronger breach basis (J6)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "C2.2.1", "title": "Express Choice of Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Peh Teck Quee<\/i>, applying <i>Vita Food<\/i>,<\/mark> <mark class=\"new\">the endorsement<\/mark><mark class=\"same\">'s choice of<\/mark> <mark class=\"new\">Singapore law<\/mark> <mark class=\"same\">is virtually conclusive<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Peh Teck Quee<\/i>,<\/mark> <mark class=\"new\">Singapore law<\/mark> <mark class=\"same\">needs no connection (cf Art 2(4) Hague Principles)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Subject to whether it applies to the earlier loss.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The endorsement's choice of Singapore law is virtually conclusive. One line, subject to its reach in time."}, {"letter": "E", "code": "C2.2.3", "title": "Fraud and the Choice of Law Clause", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>CIMB<\/i>, a merely disputed<\/mark> <mark class=\"new\">fraud<\/mark> <mark class=\"same\">leaves<\/mark> <mark class=\"new\">the chosen law<\/mark> <mark class=\"same\">applying \"as if the contract were valid\"<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So the agreement is voidable under the chosen law, not void under Ruritanian law; ask whether Polaris affirmed by paying after the endorsement.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Answers Polaris's fraud plea: the chosen law still governs, so the agreement is voidable, not void, and Polaris's later payment raises affirmation. Needed, but not where the clauses are decided."}, {"letter": "F", "code": "C2.2.9", "title": "Choice v Incorporation", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Beximco<\/i>,<\/mark> <mark class=\"new\">the Principles<\/mark> <mark class=\"same\">may be incorporated if<\/mark> <mark class=\"new\">the proper law<\/mark> <mark class=\"same\">permits and they are sufficiently certain<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So they can work as terms, not as the governing law.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Explains how the Principles can still operate, as incorporated terms. C2.1.2 states the rule that decides cl 9."}, {"letter": "G", "code": "C2.1.2", "title": "Non-National Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Musawi<\/i> and C&amp;Y, only a country's law (including<\/mark> <mark class=\"new\">a state within a federation<\/mark><mark class=\"same\">) qualifies, so a choice of<\/mark> <mark class=\"new\">the Principles of Reinsurance Contract Law<\/mark> <mark class=\"same\">fails as the proper law<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Fallback: incorporate<\/mark> <mark class=\"new\">the Principles<\/mark> <mark class=\"same\">as terms of a contract governed by<\/mark> <mark class=\"new\">the law chosen in cl 8<\/mark> <mark class=\"same\">(C2.2.9).<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "C-06.3", "side": "C", "hyp": 6, "n": 3, "source": "Mock Paper 6, Hypo 12", "title": "Mr Goh v Almeida", "full": "Mock Paper 6, Hypo 12", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>Almeida Seguros SA, a Lusitanian insurer, sells yacht policies in Singapore through a Singapore agent. Mr Goh, a Singapore resident and retired teacher, bought a policy for his yacht, moored at Sentosa, from that agent on Almeida's standard terms. The policy is expressly governed by Lusitanian law, a term which Almeida's general counsel introduced into all its Singapore consumer policies to avoid Singapore's Unfair Contract Terms Act. Clause 22 excludes Almeida's liability for negligent surveys. Almeida's surveyor negligently certified the yacht as seaworthy at Sentosa, and it sank in Singapore waters. Mr Goh is suing Almeida for US$400,000 in contract and in the tort of negligence.<\/p><p>Clause 22 is valid under Lusitanian law and may be raised as a defence to a tort claim under all relevant laws. It is unenforceable under the Unfair Contract Terms Act, as it does not satisfy the requirement of reasonableness. Mr Goh can show no other reason why Lusitanian law was chosen. Advise Mr Goh whether Almeida can rely on clause 22 against each of his claims.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A consumer policy with a foreign law chosen to escape UCTA, and an exemption clause raised against both contract and tort claims. UCTA's own reach decides both.<\/p>\n<p><strong>UCTA's reach: C2.2.7.<\/strong> Section 27(2) applies the Act despite the foreign choice if the term was imposed wholly or mainly to evade it, or if a Singapore consumer dealt and the essential steps were taken here. Both limbs are met. Lusitanian law still governs the rest of the policy, subject to UCTA.<\/p>\n<p><strong>The tort claim: C3.8.2.<\/strong> Cl 22 can be raised against a tort claim under all laws, and it is valid under Lusitanian law. On the <i>Sayers<\/i> majority's view only the proper law matters, but that proper law now applies subject to UCTA.<\/p>\n<p><strong>Overriding effect: C1.7.<\/strong> UCTA is superimposed on the foreign law, and it covers negligence liability in tort as well as in contract. So cl 22 fails on every view, <i>Sayers<\/i> included.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not strike out the Lusitanian choice entirely under s 27(2); the Act is superimposed and the chosen law survives. Striking it out is the separate bona fide route, run in the alternative.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Section 27(2) UCTA applies despite the Lusitanian choice, because the term was imposed mainly to evade the Act and Mr Goh is a Singapore consumer who bought here, so cl 22 must satisfy reasonableness and fails; and because UCTA reaches negligence liability in tort as well as contract, Almeida cannot rely on cl 22 against either claim.<\/blockquote>", "items": [{"letter": "A", "code": "C2.6", "title": "The Putative Proper Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">As<\/mark> <mark class=\"new\">Mr Goh's challenge to cl 22<\/mark> <mark class=\"same\">concerns existence, per <i>Lew v Nargolwala<\/i> a law agreed during negotiations governs (rare)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">He never negotiated the standard terms, so cl 22 was never agreed.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Mr Goh does not deny that the policy was formed; he challenges one term's validity. The putative proper law is for disputes about whether a contract exists."}, {"letter": "B", "code": "C2.2.2", "title": "Attack: Not Bona Fide", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Peh Teck Quee<\/i>, choosing<\/mark> <mark class=\"new\">Lusitanian law<\/mark> <mark class=\"same\">to evade<\/mark> <mark class=\"new\">Singapore's consumer protection<\/mark> <mark class=\"same\">defeats the clause only if evasion was the sole purpose.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Mr Goh can show no other reason, so the choice may be struck out altogether, leaving Singapore law as the OPL.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "An alternative route: with evasion the only reason, the choice may be struck out, leaving Singapore law as the OPL. Run it in the alternative."}, {"letter": "C", "code": "C3.6.5", "title": "Party Autonomy in Tort", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Almeida<\/mark> <mark class=\"same\">argues<\/mark> <mark class=\"new\">the Lusitanian law clause<\/mark> <mark class=\"same\">applies<\/mark> <mark class=\"new\">Lusitanian law<\/mark> <mark class=\"same\">to<\/mark> <mark class=\"new\">the negligence claim<\/mark><mark class=\"same\">, an open question (<i>Ong Ghee Soon<\/i>), though \"just a small step away\" (C&amp;Y).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">It could do so only through the flexible exception, and Singapore is not fortuitous.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Answers any argument that the Lusitanian clause governs the tort: only via the flexible exception, and Singapore is not fortuitous. One line."}, {"letter": "D", "code": "C2.2.7", "title": "UCTA Superimposed (s 27(2))", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 27(2) UCTA, the Act applies despite<\/mark> <mark class=\"new\">the Lusitanian law clause<\/mark> <mark class=\"same\">if<\/mark> <mark class=\"new\">that clause<\/mark> <mark class=\"same\">was imposed wholly or mainly to evade it, or<\/mark> <mark class=\"new\">a consumer<\/mark> <mark class=\"same\">habitually resident here dealt and the essential steps were taken here<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Lusitanian law<\/mark> <mark class=\"same\">then applying subject to UCTA.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Both limbs are met: evasion was the purpose, and Mr Goh is a Singapore consumer who bought from the Singapore agent.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "C3.4", "title": "Local Torts", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Rickshaw<\/i>, rejecting <i>Metall<\/i>'s English-law-only rule as \"unduly parochial\" and contrary to comity,<\/mark> <mark class=\"new\">negligence<\/mark> <mark class=\"same\">in Singapore still runs both limbs, both pointing to<\/mark> <mark class=\"new\">Singapore law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The survey and the sinking were both in Singapore.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The survey and sinking were in Singapore, so the tort is local and Singapore law governs both limbs. It confirms the tort side, but UCTA's overlay is what defeats cl 22."}, {"letter": "F", "code": "C1.7", "title": "Forum Mandatory Rules", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Effect: per C&amp;Y,<\/mark> <mark class=\"new\">UCTA<\/mark> <mark class=\"same\">is superimposed,<\/mark> <mark class=\"new\">Lusitanian law<\/mark> <mark class=\"same\">governing the rest<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Contrast bona fide (C2.2.2): \"wholly or mainly\" is wider than \"sole purpose\", and<\/mark> <mark class=\"new\">Lusitanian law<\/mark> <mark class=\"same\">survives subject to the Act, whereas<\/mark> <mark class=\"new\">a choice that is not bona fide<\/mark> <mark class=\"same\">is struck out.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">UCTA covers negligence liability in tort as well as contract, so it overrides on every view.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "C3.8.2", "title": "Exemption Clause as a Defence to Tort", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Clause 22<\/mark><mark class=\"same\">, valid under<\/mark> <mark class=\"new\">Lusitanian law<\/mark><mark class=\"same\">, excludes<\/mark> <mark class=\"new\">negligence<\/mark> <mark class=\"same\">liability that Singapore law<\/mark> <mark class=\"new\">subjects to reasonableness<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Sayers majority:<\/mark> <mark class=\"same\">only the proper law of the contract mattered<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">but that proper law now applies subject to UCTA.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "C-07.1", "side": "C", "hyp": 7, "n": 1, "source": "Mock Paper 7, Hypo 14", "title": "Sterling and Mr Wee", "full": "Mock Paper 7, Hypo 14", "q": "<p>Assume the Singapore court will assume jurisdiction in each dispute.<\/p><p>Sterling Maritime Pte Ltd, a Singapore shipping company, is controlled by Mr Wee, a Singapore citizen and resident.<\/p><p><strong>The loan.<\/strong> Goldleaf Finance Ltd, a Charltonian company with nothing in Charltonia but its registered office, lends money in Singapore from a Singapore serviced office. It lent Mr Wee S$3 million at 48% interest a year under an agreement signed in Singapore. On its lawyers' advice, the agreement chooses Charltonian law so that Goldleaf would not need a Singapore moneylender's licence. Goldleaf is unlicensed. Section 14 of the Moneylenders Act 2008 provides that no contract for a loan by an unlicensed moneylender is enforceable. It is silent on its territorial reach, is a conduct-regulating statute with criminal sanctions, and protects borrowers in Singapore. Mr Wee has defaulted.<\/p><p><strong>The casino.<\/strong> On a trip to Lusitania, Mr Wee obtained chips on credit from a licensed casino there, signing credit agreements governed by Lusitanian law, and lost US$800,000. The casino sues him in Singapore. Section 5(2) of the Civil Law Act 1909 provides that no action shall be brought for recovering any sum alleged to be won upon any wager.<\/p><p><strong>The charter.<\/strong> Sterling chartered a tanker to Dorado Trading Ltd, a Buritanian company, to carry fuel to the coast of Xalarat, whose law prohibits fuel imports above a quota. Both parties knew this, and intended from the outset that the fuel would be moved to small boats offshore at night and landed in Xalarat above the quota. The charterparty is expressly governed by Singapore law. Dorado has not paid the hire.<\/p><p>Advise Sterling and Mr Wee.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Three disputes, each beaten by a different overlay. Find the one rule that disposes of each claim before you spend time on the proper law.<\/p>\n<p><strong>The loan: C2.2.2.<\/strong> Charltonian law was chosen to avoid licensing, with no real connection to Charltonia, so the choice is not bona fide and is struck out. The OPL is Singapore law, and the Act applies directly.<\/p>\n<p><strong>The loan and the casino: C1.7.<\/strong> Even if the choice stood, s 14 is conduct-regulating and protective, so Parliament intended it to reach loans made here (<i>JIO<\/i>). Section 5(2) CLA overrides whatever the proper law (<i>Star City<\/i>). Both claims fail.<\/p>\n<p><strong>The charter: C2.10.3.<\/strong> Both parties intended at formation to land fuel in Xalarat above the quota. <i>Foster<\/i> is forum public policy, so the Singapore proper law is no answer, and the illegal object is central. Sterling cannot recover the hire.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not assume a Singapore proper law protects Sterling: <i>Foster<\/i> applies whatever the proper law. And keep Route B for conduct much worse than this.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Goldleaf's choice of Charltonian law is not bona fide and the Moneylenders Act overrides in any event, so the loan is unenforceable; s 5(2) CLA defeats the casino's claim whatever Lusitanian law says; and because Sterling and Dorado intended at formation to break Xalarat's quota, Foster bars Sterling's claim for hire despite the Singapore proper law.<\/blockquote>", "items": [{"letter": "A", "code": "C1.2.2", "title": "Applying the Star City Test", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Star City<\/i>,<\/mark> <mark class=\"new\">s 5(2) (\"no action shall be brought\")<\/mark> <mark class=\"same\">bars only enforcement of<\/mark> <mark class=\"new\">the casino's right<\/mark><mark class=\"same\">, so Singapore law applies.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Star City<\/i>,<\/mark> <mark class=\"new\">a rule that no debt arises from a wager<\/mark> <mark class=\"same\">negates<\/mark> <mark class=\"new\">the right<\/mark><mark class=\"same\">, so<\/mark> <mark class=\"new\">Lusitanian law<\/mark> <mark class=\"same\">applies.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "A second route on the casino: \"no action shall be brought\" makes s 5(2) procedural. C&amp;Y also treat it as overriding, which C1.7 already states."}, {"letter": "B", "code": "C2.2.8", "title": "Straight to the OPL", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Shanghai Turbo<\/i> and <i>The Iran Vojdan<\/i>, as<\/mark> <mark class=\"new\">Goldleaf and Mr Wee<\/mark> <mark class=\"same\">turned their minds to<\/mark> <mark class=\"new\">the law<\/mark> <mark class=\"same\">and failed<\/mark> <mark class=\"new\">(not bona fide)<\/mark><mark class=\"same\">, inferring a choice is \"artificial\", so go to Stage 3.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">At Stage 3, Singapore is where the loan was made, signed and lent from, so the Act applies directly.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The bridge once the loan clause is struck out: skip Stage 2 and go to the OPL, which is Singapore. One line."}, {"letter": "C", "code": "C1.7", "title": "Forum Mandatory Rules", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Effect: per C&amp;Y,<\/mark> <mark class=\"new\">s 5(2)<\/mark> <mark class=\"same\">is superimposed,<\/mark> <mark class=\"new\">Lusitanian law<\/mark> <mark class=\"same\">governing the rest, though it may sink the whole contract, e.g.,<\/mark> <mark class=\"new\">the casino's credit agreements<\/mark> <mark class=\"same\">under s 5(2) CLA.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>JIO Minerals<\/i>,<\/mark> <mark class=\"new\">a conduct-regulating, protective statute like s 14 of the Moneylenders Act<\/mark> <mark class=\"same\">more readily applies extraterritorially<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">So both the loan and the casino claim fail whatever their proper laws.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "C2.10.3", "title": "Foster: Joint Intention", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Foster v Driscoll<\/i> and <i>Regazzoni<\/i> (in Singapore, <i>Patriot v Lam Hong<\/i>; <i>Esben<\/i>), a contract whose real object and intention is<\/mark> <mark class=\"new\">landing fuel above the quota<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Xalarat<\/mark> <mark class=\"same\">is unenforceable<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ang v Lyu<\/i> and <i>Surewin<\/i>, <i>Foster<\/i> is forum public policy, so it applies under<\/mark> <mark class=\"new\">a Singapore<\/mark> <mark class=\"same\">proper law alike<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Magdeev<\/i> (and <i>Haddad v Rostamani<\/i>),<\/mark> <mark class=\"new\">the illegal landing<\/mark> <mark class=\"same\">must be dominant or \"central to the adventure\", which it<\/mark> <mark class=\"new\">is<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "ve
