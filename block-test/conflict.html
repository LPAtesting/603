 Hague fact and the service-out fact both pull you towards the wrong test.<\/p>\n<p><strong>Regime: J1.2.1.<\/strong> Both States are Contracting States, but an asymmetric clause is not exclusive under the CCAA (<i>CHLOE V<\/i>). So there is no s 11, and the case stays at common law.<\/p>\n<p><strong>Burden: J3.2.<\/strong> Served out, a claimant normally proves forum conveniens. But Kestrel promised to submit, so Harbour need only show that cl 20 is valid, binds Kestrel and covers the dispute, plus a serious question. Contesting forum is Kestrel's own breach.<\/p>\n<p><strong>Result: J4.3.1.<\/strong> Kestrel must show strong cause, and engineers in Utopia were foreseeable at contracting. It pleads no abuse or denial of justice, so service stands.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not let \"served out\" fix the burden. Ask first who is in breach; the burden always follows the party seeking release from its promise (J4.0.2).<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Cl 20 falls outside the CCAA because it is asymmetric, but at common law it binds Kestrel, so Harbour need only show the clause is valid, binds Kestrel and covers the dispute, plus a serious question; Kestrel must then show strong cause, which foreseeable witnesses in Utopia cannot supply, so service stands.<\/blockquote>", "items": [{"letter": "A", "code": "J1.2.1", "title": "Asymmetric Clause", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">cl 20<\/mark> <mark class=\"same\">gives<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">exclusive jurisdiction but lets<\/mark> <mark class=\"new\">Harbour<\/mark> <mark class=\"same\">sue<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"new\">anywhere<\/mark><mark class=\"same\">. Per <i>CHLOE V<\/i>, following the Hartley–Dogauchi Report (VCLT art 32), such a clause is not exclusive under the CCAA<\/mark><mark class=\"new\">, so s 11 is not engaged either, whatever the Contracting State facts.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">At common law<\/mark> <mark class=\"new\">cl 20<\/mark> <mark class=\"same\">stays exclusive against<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">(per C&amp;Y), so J1.1 applies.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "J1.1.4", "title": "Asymmetric, With Submission", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Cl 20 lets Harbour sue Kestrel in any court; Kestrel submits to Singapore and may sue only there.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">If<\/mark> <mark class=\"new\">Harbour<\/mark> <mark class=\"same\">sues here,<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">agreed to submit, so<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">bears strong cause to stay<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">If<\/mark> <mark class=\"new\">cl 20<\/mark> <mark class=\"same\">merely lets<\/mark> <mark class=\"new\">Harbour<\/mark> <mark class=\"same\">sue<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">anywhere, without<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">submitting to that court,<\/mark> <mark class=\"new\">Harbour<\/mark> <mark class=\"same\">suing here is permitted but<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">never agreed to submit, so<\/mark> <mark class=\"new\">Kestrel<\/mark><mark class=\"same\">'s stay goes to Spiliada (Week 10 handout).<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "It reaches the same place and shows why the word \"submits\" matters. But the block is framed for a stay, and Kestrel attacks service, so J3.2 is the block that says what Harbour must prove."}, {"letter": "C", "code": "J4.1.2", "title": "Compellability Reduced", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Weight falls if<\/mark> <mark class=\"new\">the engineers<\/mark> <mark class=\"same\">will<\/mark> <mark class=\"new\">testify by video<\/mark> <mark class=\"same\">(<i>Raffles Education<\/i>), or are<\/mark> <mark class=\"new\">Kestrel's own employees<\/mark><mark class=\"same\">, not third parties (Chong's feedback)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>JIO<\/i>, location carries little weight given video-link<\/mark> <mark class=\"new\">, so Kestrel's best connecting factor is thin.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Good fact spotting: the engineers are Kestrel's own employees. But this is a Spiliada stage 1 point. Under strong cause it earns one line, because witnesses in Utopia were foreseeable anyway."}, {"letter": "D", "code": "J4.3.1", "title": "Not Spiliada; Foreseeable Factors", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Strong cause applies where<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">breaches<\/mark> <mark class=\"new\">cl 20<\/mark><mark class=\"same\">; Spiliada where<\/mark> <mark class=\"new\">no one<\/mark> <mark class=\"same\">does.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Vinmar<\/i>, the test rests on party autonomy and commercial certainty, so \"it should take more\" to keep<\/mark> <mark class=\"new\">this case<\/mark> <mark class=\"same\">from<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">than on FNC<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Vinmar<\/i>,<\/mark> <mark class=\"new\">engineers in Utopia<\/mark> <mark class=\"same\">foreseeable at contracting carry little weight<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "J4.2.1", "title": "Burden Stays on Claimant", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Spiliada<\/i>, <i>Oriental Insurance<\/i> and <i>Zoom<\/i>,<\/mark> <mark class=\"new\">Harbour<\/mark> <mark class=\"same\">bears it without notice and still when<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">sets aside, jurisdiction over a foreign defendant being \"an imposition\" on it (<i>Li Shengwu<\/i>).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">argues Singapore is at most one of several equal fora. Per <i>Sudarga<\/i>, that fails:<\/mark> <mark class=\"new\">Harbour<\/mark> <mark class=\"same\">must show Singapore is the more appropriate forum<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The natural trap. A claimant serving out usually keeps the forum burden, but Kestrel promised to submit, so objecting is its own breach and the burden moves to it."}, {"letter": "F", "code": "J1.3", "title": "Must Hear; No FNC", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Cl 20<\/mark> <mark class=\"same\">designates<\/mark> <mark class=\"new\">the Singapore High Court<\/mark> <mark class=\"same\">and the CCAA applies (J1.2). Per s 11(1),<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">must not decline unless<\/mark> <mark class=\"new\">cl 20<\/mark> <mark class=\"same\">is null and void under Singapore law, including its choice of law rules.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per s 11(2),<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">cannot decline in favour of<\/mark> <mark class=\"new\">Utopia<\/mark><mark class=\"same\">, so neither Spiliada nor strong cause applies<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The Contracting State fact invites this. But an asymmetric clause is not exclusive, so s 11 never starts, and you would skip strong cause, the test that decides the application."}, {"letter": "G", "code": "J3.2", "title": "Singapore EJC or NEJC: In Principle v In Practice", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">In practice,<\/mark> <mark class=\"new\">Harbour<\/mark> <mark class=\"same\">need only show a good arguable case that<\/mark> <mark class=\"new\">cl 20<\/mark> <mark class=\"same\">is valid, binds<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">and covers<\/mark> <mark class=\"new\">the sensor dispute<\/mark> <mark class=\"same\">(J1.5–J1.6), plus a serious question<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Forum: need not be proved. If<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">contests it, that breaches its promise, so per <i>Shanghai Turbo (CA)<\/i><\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">bears strong cause (J4.3), whether it challenges existence or exercise<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "J-12.1", "side": "J", "hyp": 12, "n": 1, "source": "Block Finder set 1, Q2", "title": "Orchid v Meridian", "full": "", "q": "<p>Orchid Pte Ltd, a Singapore company, distributes water filters for Meridian Bhd, a Ruritanian company with no presence in Singapore. Their agreement, dated 10 January 2025 and signed in Ruritania, is expressly governed by Ruritanian law. Clause 17 says: \"The parties submit to the non-exclusive jurisdiction of the courts of Ruritania.\" Ruritania has been a Contracting State to the Hague Convention on Choice of Court Agreements since 2020.<\/p><p>Meridian terminates the agreement. Orchid sues for wrongful termination in the General Division and serves Meridian in Ruritania with approval. Meridian applies to set aside service. Assume a para 63(3) nexus and a serious question are shown, and that the connecting factors point to Ruritania, including former sales agents there who are non-party witnesses and cannot be compelled to come to Singapore.<\/p><p>A civil trial in Ruritania takes five years, against about ten months in Singapore, and Ruritanian law would give Orchid about one third of what a Singapore court would likely award. Advise Orchid on whether service will stand.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Cl 17 is a foreign NEJC, so no one is in breach. That point sets the burden, and the rest of the question is what Orchid can do once stage 1 goes against it.<\/p>\n<p><strong>Who carries it: J4.2.1.<\/strong> Service out keeps the burden on Orchid, even on Meridian's set-aside. Cite \"clearly\" and flag <i>Oro Negro<\/i>'s \"on balance\".<\/p>\n<p><strong>Stage 1 lost: J4.2.3.<\/strong> The hypo tells you stage 1 points to Ruritania, so the must-write issue is whether Orchid gets a second bite at all. It is open, so give both lines of authority.<\/p>\n<p><strong>What the bite is worth: J4.1.3.<\/strong> Five years is the fact Chong keeps reusing. Delay is disregarded unless egregious, and the damages gap alone is not conclusive, so the second bite probably fails.<\/p>\n<p><strong>Trap to avoid.<\/strong> The word \"non-exclusive\" displaces s 3(2). Per Chong (seminar), invoking deemed exclusivity on such a clause is a recurring exam error (J1.2.1).<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>No one has breached cl 17, so Orchid bears the forum burden throughout; with stage 1 pointing to Ruritania it can only try the open second bite, and a five-year trial and a smaller award are unlikely to be enough, so service will probably be set aside.<\/blockquote>", "items": [{"letter": "A", "code": "J4.1.2", "title": "Compellability; Governing Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>JIO<\/i>, non-party<\/mark> <mark class=\"new\">witnesses in Ruritania<\/mark> <mark class=\"same\">not compellable here point to<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">, if<\/mark> <mark class=\"new\">Meridian<\/mark> <mark class=\"same\">shows their evidence is \"at least arguably relevant\" to its defence.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Weight rises with an express choice of law (<i>Rappo<\/i>)<\/mark> <mark class=\"new\">, and this agreement has one.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Both lines are sound at stage 1, but the hypo tells you to assume stage 1 points to Ruritania. Time here repeats a given fact; the marks lie in what happens next."}, {"letter": "B", "code": "J4.2.1", "title": "Burden Stays on Claimant; How Much More", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Spiliada<\/i>, <i>Oriental Insurance<\/i> and <i>Zoom<\/i>,<\/mark> <mark class=\"new\">Orchid<\/mark> <mark class=\"same\">bears it without notice and still when<\/mark> <mark class=\"new\">Meridian<\/mark> <mark class=\"same\">sets aside<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Spiliada<\/i>, <i>AK Investment<\/i> and <i>Zoom<\/i>,<\/mark> <mark class=\"new\">Orchid<\/mark> <mark class=\"same\">must show Singapore \"clearly\" more appropriate than<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">; per <i>Oro Negro<\/i> (adopting <i>Siemens<\/i>), \"on balance\" suffices, \"by a hair or by a mile\". Cite \"clearly\", flag Oro Negro, argue both.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "J4.1.3", "title": "Delay; Higher Damages", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently trial takes<\/mark> <mark class=\"new\">5 years<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">against<\/mark> <mark class=\"new\">10 months<\/mark> <mark class=\"same\">here. Per C&amp;Y, delay is disregarded unless egregious; per <i>Grains and Industrial<\/i> (and Chong's feedback), even alleged delays of over 10 years in India failed.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Presently<\/mark> <mark class=\"new\">Orchid<\/mark> <mark class=\"same\">would recover<\/mark> <mark class=\"new\">about one third<\/mark> <mark class=\"same\">of the Singapore award in<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">. Per Chong's feedback, a legitimate juridical advantage alone is not conclusive<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "J1.2.1", "title": "Deemed Exclusive", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 3(2),<\/mark> <mark class=\"new\">cl 17<\/mark> <mark class=\"same\">is deemed exclusive unless the parties expressly provide otherwise.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Ruritania is a Contracting State and cl 17 post-dates entry into force, so Meridian says this is a Hague case and Singapore must stay or dismiss.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Section 3(2) applies only to a clause that does not say otherwise, and cl 17 says \"non-exclusive\". The CCAA does not apply, so s 12 is never engaged."}, {"letter": "E", "code": "J1.1.2", "title": "Foreign NEJC: No Breach Either Way", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Orchid<\/mark> <mark class=\"same\">sues here though<\/mark> <mark class=\"new\">cl 17<\/mark> <mark class=\"same\">names<\/mark> <mark class=\"new\">the courts of Ruritania<\/mark> <mark class=\"same\">non-exclusively. Per <i>Shanghai Turbo (CA)<\/i>, the \"wide waiver of objection\" is rejected, so suing here is no breach, and<\/mark> <mark class=\"new\">Meridian<\/mark><mark class=\"same\">'s objection is none either, as Singapore is not named. Plain Spiliada applies (J4.1).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Shanghai Turbo (CA)<\/i>,<\/mark> <mark class=\"new\">cl 17<\/mark> <mark class=\"same\">shows only that<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">is an appropriate forum, not clearly more appropriate<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "You must say this, because it picks Spiliada over strong cause. But it takes one line. It sets the test; J4.2.1 then says who carries it, which is what decides the application."}, {"letter": "F", "code": "J4.3.1", "title": "Higher Hurdle; Foreseeable Factors", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Vinmar<\/i>, the test rests on party autonomy and commercial certainty, so \"it should take more\" to keep<\/mark> <mark class=\"new\">the case<\/mark> <mark class=\"same\">from<\/mark> <mark class=\"new\">the Ruritanian courts<\/mark> <mark class=\"same\">than on FNC<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Vinmar<\/i>,<\/mark> <mark class=\"new\">witnesses in Ruritania<\/mark> <mark class=\"same\">foreseeable at contracting carry little weight, and parties are deemed to know<\/mark> <mark class=\"new\">Ruritania's delays<\/mark> <mark class=\"same\">(<i>Shanghai Turbo<\/i>).<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Tempting, because \"delay was foreseeable\" sounds like an answer to the five years. But strong cause needs a breach, and a foreign NEJC has no promise not to sue elsewhere. Use J4.1.3."}, {"letter": "G", "code": "J4.2.3", "title": "Second Bite", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently<\/mark> <mark class=\"new\">the factors point to Ruritania<\/mark><mark class=\"same\">, so can<\/mark> <mark class=\"new\">Orchid<\/mark> <mark class=\"same\">still show injustice there? Per <i>Oro Negro<\/i> and <i>IM Skaugen (CA)<\/i>, this is open: <i>Lewis v King<\/i> and <i>Metall<\/i> for; <i>Konamaneni<\/i> and Fentiman against.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Shen Sophie<\/i> (adopting Yeo) and C&amp;Y, access to justice and even-handed treatment of<\/mark> <mark class=\"new\">Orchid<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">Meridian<\/mark> <mark class=\"same\">apply both ways<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "J-13.1", "side": "J", "hyp": 13, "n": 1, "source": "Block Finder set 1, Q3", "title": "Ardent v Beaumont", "full": "", "q": "<p>Ardent Pte Ltd, a Singapore company, has two contracts with Beaumont SA, a French company with no presence in Singapore. Both are governed by Singapore law, and both say: \"The parties submit to the exclusive jurisdiction of the Singapore High Court.\" Neither mentions the SICC or service. The Maintenance Contract is dated 3 May 2015. The Licence Contract is dated 3 May 2019.<\/p><p>Beaumont stops paying under both. Ardent wants both claims heard in the SICC. Beaumont objects: the equipment, the staff and most of the documents are in France, and a French court would hear the case sooner.<\/p><p>France is a Contracting State to the Hague Convention on Choice of Court Agreements. Assume both claims are international and commercial. Advise Ardent on how each claim can reach the SICC, and whether Beaumont's objection can keep it out.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> The clauses are word for word the same, so the date does all the work. The objection then tests whether you reach for Spiliada when it does not apply.<\/p>\n<p><strong>Which route: J5.2.3.<\/strong> The 2019 clause was concluded on or after 1 October 2016, so \"Singapore High Court\" includes the SICC and Ardent may file there directly. Beaumont's only reply is Chong's point that the clause arguably needs a more specific reference to the SICC. The 2015 clause \"does not of itself\" submit to the SICC.<\/p>\n<p><strong>The 2019 claim, the objection: J5.3.<\/strong> With a written jurisdiction agreement there is no Spiliada, Australian test or strong cause. The French links count for nothing.<\/p>\n<p><strong>The 2015 claim: J5.4.1.<\/strong> There is no primary jurisdiction, so Ardent sues in the General Division and seeks transfer on the \"more appropriate\" test. In that action the clause is a Singapore EJC at common law, so Beaumont's objection needs strong cause (J4.3).<\/p>\n<p><strong>Trap to avoid.<\/strong> Same words, different dates. Do not write one answer for both contracts; Chong's framework runs contract by contract.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The 2019 clause includes the SICC, so Ardent files there directly and Beaumont's French links are irrelevant under O 2 r 3; the 2015 clause does not, so Ardent sues in the General Division, holds Beaumont to strong cause, and seeks transfer as the more appropriate court.<\/blockquote>", "items": [{"letter": "A", "code": "J5.3", "title": "Foreign Connections Irrelevant", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Beaumont<\/mark> <mark class=\"same\">asks the SICC to decline because<\/mark> <mark class=\"new\">the dispute centres on France<\/mark><mark class=\"same\">. Per O 2 r 3(2), the SICC may decline only if exercising jurisdiction is contrary to its international and commercial character or an abuse of its process<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y and Chong (AY23-24 mid-term feedback), there is no Spiliada balancing, Australian test or strong cause, so<\/mark> <mark class=\"new\">Beaumont<\/mark><mark class=\"same\">'s links to<\/mark> <mark class=\"new\">France<\/mark> <mark class=\"same\">count for nothing.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "J5.2.3", "title": "Clauses Naming the High Court", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">the Licence Contract's clause<\/mark><mark class=\"same\">, concluded on<\/mark> <mark class=\"new\">3 May 2019<\/mark> <mark class=\"same\">(on or after 1 October 2016), names<\/mark> <mark class=\"new\">the Singapore High Court<\/mark><mark class=\"same\">. Per O 2 r 2(1) and s 2(2)–(3) CCAA, it includes the SICC unless a contrary intention appears, so<\/mark> <mark class=\"new\">Ardent<\/mark> <mark class=\"same\">may file directly in the SICC.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per O 2 r 2(2),<\/mark> <mark class=\"new\">the Maintenance Contract's clause<\/mark><mark class=\"same\">, concluded on<\/mark> <mark class=\"new\">3 May 2015<\/mark> <mark class=\"same\">before 1 October 2016, \"does not of itself\" submit to the SICC.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "J5.4.2", "title": "Every Party's Consent", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently, the CCAA applies and<\/mark> <mark class=\"new\">the Maintenance Contract's clause<\/mark> <mark class=\"same\">names<\/mark> <mark class=\"new\">the Singapore High Court<\/mark><mark class=\"same\">. Per O 2 r 4(4), transfer also needs every party's consent.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per O 2 r 4(7), where<\/mark> <mark class=\"new\">that clause<\/mark> <mark class=\"same\">names the receiving court, each party is treated as consenting.<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">so<\/mark> <mark class=\"new\">Beaumont<\/mark> <mark class=\"same\">is treated as consenting although it objects.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "This is the CCAA-case transfer rule. The Maintenance clause predates 1 October 2016, so it is not a CCAA case, and O 2 r 4(1) needs no consent. The 2019 claim needs no transfer at all."}, {"letter": "D", "code": "J1.3", "title": "Must Hear", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">The Licence Contract's clause<\/mark> <mark class=\"same\">designates<\/mark> <mark class=\"new\">the Singapore High Court<\/mark> <mark class=\"same\">and the CCAA applies (J1.2). Per s 11(1),<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">must not decline unless<\/mark> <mark class=\"new\">the clause<\/mark> <mark class=\"same\">is null and void under Singapore law, including its choice of law rules.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per s 11(2),<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">cannot decline in favour of<\/mark> <mark class=\"new\">France<\/mark><mark class=\"same\">, so neither Spiliada nor strong cause applies<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Correct for the 2019 clause, and worth a line: Singapore must hear it. But it does not place the claim in the SICC, and it says nothing about the 2015 contract."}, {"letter": "E", "code": "J5.4.1", "title": "Only Route: Transfer", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per Chong (sample-final answer scheme; AY23-24 mid-term feedback), where<\/mark> <mark class=\"new\">the Maintenance Contract's clause<\/mark> <mark class=\"new\">predates 1 October 2016<\/mark><mark class=\"same\">, the SICC has no primary jurisdiction, so<\/mark> <mark class=\"new\">Ardent<\/mark> <mark class=\"same\">reaches it only by transfer under the O 2 r 4(1)(c) \"more appropriate\" test.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per Chong (seminar), the test turns on how international and commercial the dispute is, not its complexity<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "J5.2.4", "title": "No Permission Needed", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently, per O 5 r 6(2),<\/mark> <mark class=\"new\">Beaumont<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">France<\/mark> <mark class=\"same\">may be served out without permission, being<\/mark> <mark class=\"new\">a party to the written jurisdiction agreement (r 6(2)(a))<\/mark><mark class=\"same\">, whether or not<\/mark> <mark class=\"new\">the clause<\/mark> <mark class=\"same\">mentions service.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per O 5 r 6(5), the SICC may still review jurisdiction under O 2 r 3.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Correct for the 2019 claim, so give it one line under service. The hypo asks about route and objection, not mode of service."}, {"letter": "G", "code": "J4.4", "title": "The SICC Factor", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Ardent<\/mark> <mark class=\"same\">resists<\/mark> <mark class=\"new\">a stay<\/mark> <mark class=\"same\">by pointing to possible transfer to the SICC. Per <i>Rappo<\/i>, the court must not \"shut its eyes\" to<\/mark> <mark class=\"new\">international judges<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>IM Skaugen<\/i>,<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">alone it cannot displace<\/mark> <mark class=\"new\">France<\/mark><mark class=\"same\">, which \"would virtually always\" be the forum.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "This is for a Spiliada contest, and neither claim runs on Spiliada. Keep its points for the \"more appropriate\" argument under J5.4.1."}]}, {"id": "J-14.1", "side": "J", "hyp": 14, "n": 1, "source": "Block Finder set 1, Q4", "title": "Lumen v Novar", "full": "", "q": "<p>Lumen Pte Ltd, a Singapore company, supplies cloud services to Novar LLC, a Ruritanian company. Their agreement, dated 6 June 2024, is governed by Singapore law. Clause 31 says: \"Each party submits to the non-exclusive jurisdiction of the courts of Singapore.\"<\/p><p>On 1 March 2026 Lumen sues Novar in the General Division for unpaid fees (Suit 100). Novar appoints Singapore solicitors and files a defence on the merits without disputing jurisdiction. On 1 May 2026, instead of counterclaiming, Novar sues Lumen in the Ruritanian High Court for a declaration that no fees are due (the Ruritanian Claim). On 15 May 2026 Novar also applies to that court for an injunction ordering Lumen to stop Suit 100 (the Injunction Application).<\/p><p>Suit 100 has not reached trial, and no hearing date has been fixed in Ruritania. Lumen applies at once to the General Division for an anti-suit injunction against both. Advise Lumen.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Two foreign steps, one Singapore NEJC, and different answers for each. Per Chong (seminar), you run a separate analysis for each foreign proceeding.<\/p>\n<p><strong>The Ruritanian Claim, basis: J6.3.1.2.<\/strong> Suing abroad under a Singapore NEJC is not ordinarily a breach, so the contractual basis is gone. Lumen must rely on vexation.<\/p>\n<p><strong>The Ruritanian Claim, vexation: J6.3.2.<\/strong> Parallel proceedings alone are not enough, especially under an NEJC. Lumen needs something more: a mirror-image claim brought just after Novar defended Suit 100, instead of a counterclaim. That is arguable, but Suit 100 is not far advanced, so this limb is uncertain.<\/p>\n<p><strong>The Injunction Application: J6.5.1.<\/strong> This one directly attacks Suit 100. Singapore may protect its own proceedings, and the application is arguably a breach of the promise not to object. Plead vexation as well.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not argue that breaching cl 31 is itself vexatious. Per <i>Cooperative Muratori<\/i> the bases are conceptually distinct, so name each one separately (J6.3).<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Cl 31 is a Singapore NEJC, so the Ruritanian Claim is no breach and needs vexation, which parallel proceedings alone do not show; the Injunction Application attacks Suit 100 itself, so Lumen should plead breach and vexation and is likely to get an ASI against that application at least.<\/blockquote>", "items": [{"letter": "A", "code": "J6.3.2", "title": "Parallel Proceedings Alone Not Enough", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>UBS v Telesto<\/i> and C&amp;Y, parallel proceedings and the risk of conflicting judgments do not alone justify an ASI, especially where the parties agreed an NEJC.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>PT Sandipala<\/i> (C&amp;Y), the case is stronger where<\/mark> <mark class=\"new\">the parties and the fee dispute<\/mark> <mark class=\"same\">significantly overlap and<\/mark> <mark class=\"new\">Novar<\/mark> <mark class=\"same\">voluntarily took part in<\/mark> <mark class=\"new\">Suit 100<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Similar to <i>Lakshmi<\/i>,<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">Novar<\/mark> <mark class=\"same\">sued in<\/mark> <mark class=\"new\">the Ruritanian High Court<\/mark> <mark class=\"new\">just after defending<\/mark> <mark class=\"same\">instead of counterclaiming in<\/mark> <mark class=\"new\">Suit 100<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "J6.2.1", "title": "Singapore NEJC", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">cl 31<\/mark> <mark class=\"same\">is a Singapore NEJC governed by Singapore law. Arguably, per <i>Shanghai Turbo<\/i> and C&amp;Y, a defendant sued here must show strong cause not to be held to its submission, so<\/mark> <mark class=\"new\">cl 31<\/mark> <mark class=\"same\">works like an EJC and supplies the connection.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Contrast: The NEJC supplies interest only; suing in<\/mark> <mark class=\"new\">the Ruritanian High Court<\/mark> <mark class=\"same\">is not itself a breach (J6.3.1.2).<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Needed for sufficient interest, and one line settles it. It does not answer the real question, which is whether Novar's conduct is a breach or vexatious."}, {"letter": "C", "code": "J6.5.1", "title": "Anti-Anti-Suit Injunctions", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Novar<\/mark> <mark class=\"new\">has applied<\/mark> <mark class=\"same\">to<\/mark> <mark class=\"new\">the Ruritanian High Court<\/mark> <mark class=\"same\">for an ASI against<\/mark> <mark class=\"new\">Suit 100<\/mark><mark class=\"same\">. Per <i>Airbus<\/i> and C&amp;Y, Singapore may restrain<\/mark> <mark class=\"new\">Novar<\/mark> <mark class=\"same\">from seeking it, to protect its own proceedings, on the usual requirements (J6.1–J6.4).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, it may also issue where a foreign ASI<\/mark> <mark class=\"new\">would breach<\/mark> <mark class=\"new\">cl 31<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">After <i>UBS v Telesto<\/i>, plead vexation as well as breach, as Singapore reads <i>Sabah<\/i> as a vexation case (J6.3.1.2).<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "J6.0.1", "title": "One ASI per Foreign Proceeding", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per Chong (seminar), analyse<\/mark> <mark class=\"new\">the Ruritanian Claim<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">the Injunction Application<\/mark> <mark class=\"same\">separately: under a Singapore NEJC, suing abroad is no breach (vexation, J6.3.2), but seeking<\/mark> <mark class=\"new\">a foreign injunction against Suit 100<\/mark> <mark class=\"same\">is (contractual, J6.3.1.2).<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The right frame, and it should open your answer. But it only names the two routes; the blocks it points to do the analysis."}, {"letter": "E", "code": "J6.3.1.2", "title": "Singapore NEJC: No Breach", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">cl 31<\/mark> <mark class=\"same\">is a Singapore NEJC. Per C&amp;Y and <i>Shanghai Turbo<\/i>, suing in<\/mark> <mark class=\"new\">the Ruritanian High Court<\/mark> <mark class=\"same\">is not ordinarily a breach, the parties having accepted parallel proceedings; only a challenge to Singapore's jurisdiction, e.g.,<\/mark> <mark class=\"new\">the Injunction Application<\/mark><mark class=\"same\">, needs strong cause.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">So<\/mark> <mark class=\"new\">Lumen<\/mark> <mark class=\"same\">relies on vexation (J6.3.2) or abuse (J6.3.3)<\/mark> <mark class=\"new\">for the Ruritanian Claim.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "J6.3.1.1", "title": "Exclusive Clause Breached", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, breach is a question of interpretation under<\/mark> <mark class=\"new\">Singapore law<\/mark><mark class=\"same\">. Presently,<\/mark> <mark class=\"new\">Novar<\/mark> <mark class=\"same\">breached<\/mark> <mark class=\"new\">cl 31<\/mark><mark class=\"same\">, an exclusive<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">clause, by suing in<\/mark> <mark class=\"new\">the Ruritanian High Court<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Sun Travels<\/i>, breach is a separate basis: no unconscionability is needed, and the ASI ordinarily issues absent strong reasons (J6.3.1.4).<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "This is the EJC route, and cl 31 says \"non-exclusive\". Running it for the Ruritanian Claim puts the strong reasons burden on Novar when Lumen should be proving vexation."}, {"letter": "G", "code": "J6.1", "title": "Submission or Valid Service", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Novar<\/mark> <mark class=\"same\">is amenable, having<\/mark> <mark class=\"new\">submitted by defending on the merits in Suit 100<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">Per <i>Cooperative Muratori<\/i>, being within the court's in personam jurisdiction is what amenability requires.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Similar to <i>BCS v Baker<\/i>,<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">Novar<\/mark> <mark class=\"new\">defended<\/mark> <mark class=\"new\">Suit 100<\/mark> <mark class=\"same\">without contesting jurisdiction, and is amenable.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Always required, so state it. But Novar plainly submitted by defending on the merits, so one line clears it."}]}, {"id": "J-15.1", "side": "J", "hyp": 15, "n": 1, "source": "Block Finder set 1, Q5", "title": "Vega v Sol", "full": "", "q": "<p>Vega Inc, a Ruritanian company, sells machine parts to Sol Pte Ltd, a Singapore company. Their contract has no jurisdiction clause. Ruritania is not gazetted under REFJA and is not a Contracting State to the Hague Convention on Choice of Court Agreements.<\/p><p>Sol's only trading in Ruritania was a nine-day trade fair in June 2024, where it rented a stand and its staff took orders. Vega's claim form for unpaid invoices was served on Sol's sales director at that stand on day four. Sol applied to the Ruritanian High Court to set aside service because Ruritania was forum non conveniens. It lost and took no further part.<\/p><p>In January 2025 the court gave default judgment for US$4 million in compensatory damages and US$2 million in punitive damages, both payable to Vega. The time to appeal has passed, and under Ruritanian law the judgment is final and cannot be reopened by that court. Sol now says the invoices were forged. It held copies before the hearing and could have checked them against its own records.<\/p><p>Vega sues on the judgment in Singapore in November 2026. Advise Sol.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Sol has three lines of attack: no international jurisdiction, fraud, and the punitive award. Each has one block that decides it.<\/p>\n<p><strong>Jurisdiction: J7.1.2.3.<\/strong> <i>Dunlop v Cudell<\/i> is on all fours: a nine-day trade-fair stand was a fixed place of business, and Sol was served there. Presence is enough, so the jurisdiction challenge fails.<\/p>\n<p><strong>Fraud: J7.2.2 intrinsic.<\/strong> Forged documents go to the merits. <i>Eleven v Boxsentry<\/i> applies the intrinsic test even though Sol took no part, and Sol held copies, so it cannot meet the diligence test.<\/p>\n<p><strong>Punitive damages: J7.2.5.<\/strong> This is Sol's only real opening. The point is uncertain, but <i>Licea<\/i> severance means at best it trims the US$2 million and leaves the US$4 million.<\/p>\n<p><strong>Trap to avoid.<\/strong> Taking no part does not turn forgery into extrinsic fraud. Classify the fraud first; that is what Chong says she wants (J7.2.2).<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Ruritania had international jurisdiction because Sol's stand was a fixed place of business when it was served, the default judgment is on the merits and final, and the forgery is intrinsic fraud that diligence would have uncovered, so the US$4 million is enforceable and only the US$2 million punitive part is open to argument and severance.<\/blockquote>", "items": [{"letter": "A", "code": "J7.1.1", "title": "Default Judgment", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y,<\/mark> <mark class=\"new\">the Ruritanian judgment<\/mark> <mark class=\"same\">is on the merits although<\/mark> <mark class=\"new\">Sol<\/mark> <mark class=\"same\">did not appear and<\/mark> <mark class=\"new\">the Ruritanian court<\/mark> <mark class=\"same\">may not have considered the evidence; non-participation goes only to fraud (J7.2.2) or natural justice (J7.2.3).<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Vega must show this, but it is easily met. One line: a default judgment is on the merits, and non-participation only matters for fraud or natural justice."}, {"letter": "B", "code": "J7.2.2", "title": "Intrinsic Fraud; Default Judgments", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">forged invoices<\/mark> <mark class=\"same\">at<\/mark> <mark class=\"new\">the Ruritanian hearing<\/mark> <mark class=\"same\">go to the merits. Per <i>Hong Pian Tee<\/i>,<\/mark> <mark class=\"new\">Sol<\/mark> <mark class=\"same\">needs fresh evidence that reasonable diligence would not have uncovered and that would likely have changed the result<\/mark> <mark class=\"new\">, yet Sol held copies.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Eleven v Boxsentry<\/i>, the intrinsic test applies to a default judgment though<\/mark> <mark class=\"new\">Sol<\/mark> <mark class=\"same\">took no part.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "J7.1.2.4", "title": "Setting Aside on FNC Grounds", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Henry v Geoprosco<\/i>,<\/mark> <mark class=\"new\">Sol<\/mark><mark class=\"same\">'s application to set aside<\/mark> <mark class=\"new\">service<\/mark> <mark class=\"same\">because<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">was forum non conveniens asked<\/mark> <mark class=\"new\">the Ruritanian court<\/mark> <mark class=\"same\">to decline a jurisdiction it had, so was submission.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, a failed set-aside on any ground is a protest (<i>Re Dulles<\/i>), so<\/mark> <mark class=\"new\">Sol<\/mark><mark class=\"same\">'s<\/mark> <mark class=\"new\">FNC challenge<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">was not submission.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "A live debate, and it is the block to open if presence fails. But presence succeeds here, so submission is a short alternative."}, {"letter": "D", "code": "J7.2.5", "title": "Punitive Damages; Severance", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">(+) Per C&amp;Y, refusing<\/mark> <mark class=\"new\">the US$2m punitive award<\/mark> <mark class=\"same\">would be anomalous when Singapore awards punitive damages in tort (<i>ACB v Thomson Medical<\/i>). (−) But the point is uncertain<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Licea<\/i>, where<\/mark> <mark class=\"new\">the Ruritanian judgment<\/mark> <mark class=\"same\">awards<\/mark> <mark class=\"new\">US$4m compensatory<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">US$2m punitive<\/mark><mark class=\"same\">,<\/mark> <mark class=\"new\">Vega<\/mark> <mark class=\"same\">enforces the unobjectionable part if clearly identifiable and separable<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "J7.1.3", "title": "Final and Conclusive", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Sang Cheol Woo<\/i>,<\/mark> <mark class=\"new\">the judgment<\/mark> <mark class=\"same\">is final and conclusive if (a)<\/mark> <mark class=\"new\">the Ruritanian court<\/mark> <mark class=\"same\">cannot vary, reopen or set it aside, though<\/mark> <mark class=\"new\">the appellate court<\/mark> <mark class=\"same\">may hear an appeal; and (b)<\/mark> <mark class=\"new\">the Ruritanian court<\/mark> <mark class=\"same\">regards it as res judicata.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Also easily met, as the facts give you Ruritanian law: final, and not reopenable by that court. One line, without a detour."}, {"letter": "F", "code": "J7.1.2.3", "title": "Presence: Short but Fixed", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Adams v Cape<\/i>,<\/mark> <mark class=\"new\">Sol<\/mark> <mark class=\"same\">is present in<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">if, for more than a minimal period, its own business was carried on at or from a fixed place of business<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Dunlop v Cudell<\/i>, a nine-day trade-fair stand was a fixed place of business, so<\/mark> <mark class=\"new\">Sol<\/mark><mark class=\"same\">'s<\/mark> <mark class=\"new\">stand<\/mark> <mark class=\"same\">at<\/mark> <mark class=\"new\">the Ruritanian trade fair<\/mark> <mark class=\"same\">for<\/mark> <mark class=\"new\">nine days<\/mark> <mark class=\"same\">qualifies.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "J7.2.2", "title": "Extrinsic Fraud", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ee Hoong Liang<\/i>, extrinsic fraud is fraud<\/mark> <mark class=\"new\">Sol<\/mark> <mark class=\"same\">had no opportunity to examine and challenge, going to<\/mark> <mark class=\"new\">the Ruritanian court<\/mark><mark class=\"same\">'s jurisdiction<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Hong Pian Tee<\/i>, <i>Abouloff<\/i> applies: no new evidence is needed, and<\/mark> <mark class=\"new\">Sol<\/mark> <mark class=\"same\">may raise the fraud though<\/mark> <mark class=\"new\">it is raised here for the first time<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The trap for a debtor who stayed away. Extrinsic fraud is fraud it had no opportunity to challenge, but Sol had notice and the invoices. <i>Eleven v Boxsentry<\/i> applies the intrinsic test, so the diligence hurdle stays."}]}, {"id": "C-01.1", "side": "C", "hyp": 1, "n": 1, "source": "Mock Paper 1, Hypo 2", "title": "Medira v Vantis", "full": "Mock Paper 1, Hypo 2", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>Medira Inc is the national hospital operator of Buritania and a public body under Buritanian law. In 2024 it leased 20 MRI scanners for five years from Vantis Corp, an Elbonian company. The lease was signed in Singapore, where Medira's board was attending a trade fair; the scanners are to be installed in Medira's hospitals in Buritania, and rent is payable into Vantis's account in Lusitania. Clause 12 provides: \"This lease is governed by Buritanian law unless Vantis, within 30 days of any dispute arising, gives written notice electing Elbonian law, in which event Elbonian law shall govern this lease.\" On 1 March 2026, after a dispute arose, Vantis gave such notice.<\/p><p>The Buritanian Public Contracts Code provides: \"A contract with a public body which does not bear the seal of the Ministry of Health is of no effect.\" The lease bears no seal. The Buritanian Radiation Safety Act prohibits importing an MRI scanner without a safety certificate, which takes about 18 months to obtain; breach is an offence punishable by a fine. During negotiations, Vantis's regional director decided to clear the scanners through customs as \"laboratory furniture\" to avoid delay, and told Medira's head of procurement, who replied that customs clearance was Vantis's responsibility and said nothing more. The scanners were imported that way.<\/p><p>A clause in the form of clause 12 is valid under Elbonian, but not Buritanian, conflict of laws rules. Medira no longer wants the lease. Advise Medira, on Singapore conflict of laws, whether it can escape the lease.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Two escape routes, the seal and the import ban, and both depend on which law governs. So settle cl 12 first, then characterise the seal, then route the illegality.<\/p>\n<p><strong>Proper law: C2.2.5.<\/strong> Cl 12 has a default law plus a later election, so it sits between a floating clause and a change of proper law. By the lex fori the election is invalid, and by Buritanian law (the default and the OPL) too. Only Elbonian law validates it, and only by assuming it worked. Buritanian law governs.<\/p>\n<p><strong>The seal: C2.7.<\/strong> If it is form, Singapore law as the lex loci contractus has no seal rule, so the lease survives (<i>AQCEL<\/i>). But a ministry approval on public contracts is closer to validity under the proper law (<i>PT Jaya Putra<\/i>), which makes the lease of no effect. Best view: state control, not mere form, though it is arguable.<\/p>\n<p><strong>The ban: C2.10.1.<\/strong> Buritanian law is both the proper law and the law broken, so this is Route A: illegality under the proper law. <i>Foster<\/i> and the parties' intentions are irrelevant.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not jump to <i>Foster<\/i> because Vantis planned the false declaration at formation. That matters only if Elbonian law governs.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Vantis's election is invalid under the lex fori and under Buritanian law, so Buritanian law governs; if the Ministry seal goes to validity under the proper law rather than to form, the lease is of no effect, and in any event importing without a certificate breaks the proper law itself, so Route A illegality, not Foster, lets Medira resist enforcement.<\/blockquote>", "items": [{"letter": "A", "code": "C1.2.2", "title": "Applying the Star City Test", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Star City<\/i>,<\/mark> <mark class=\"new\">\"of no effect\"<\/mark> <mark class=\"same\">negates<\/mark> <mark class=\"new\">the right<\/mark><mark class=\"same\">, so<\/mark> <mark class=\"new\">Buritanian law<\/mark> <mark class=\"same\">applies.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Star City<\/i>,<\/mark> <mark class=\"new\">\"no action shall be brought\"<\/mark> <mark class=\"same\">bars only enforcement of<\/mark> <mark class=\"new\">the right<\/mark><mark class=\"same\">, so Singapore law applies.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">The seal rule says \"of no effect\", so it is substantive, not procedural.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The first step on the seal: \"of no effect\" goes to the right, so it is substantive, not procedural. One line, then on to form or validity."}, {"letter": "B", "code": "C2.7", "title": "Formal Validity", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per the Giuliano-Lagarde Report, \"every external manifestation required\" of one expressing the will to be bound, so<\/mark> <mark class=\"new\">the Ministry seal<\/mark> <mark class=\"same\">is<\/mark> <mark class=\"new\">arguably form<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>AQCEL<\/i> (adopting <i>PT Jaya Putra<\/i>'s obiter), meeting<\/mark> <mark class=\"new\">the seal requirement<\/mark> <mark class=\"same\">under either<\/mark> <mark class=\"new\">Buritanian law, the proper law,<\/mark> <mark class=\"same\">or<\/mark> <mark class=\"new\">Singapore law, the lex loci contractus,<\/mark> <mark class=\"same\">suffices<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Not form: per <i>PT Jaya Putra<\/i>,<\/mark> <mark class=\"new\">a ministry seal on public contracts<\/mark> <mark class=\"same\">goes to validity under<\/mark> <mark class=\"new\">Buritanian law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "C2.8.2", "title": "Corporations: Capacity", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y (Dicey r 162),<\/mark> <mark class=\"new\">Medira<\/mark> <mark class=\"same\">needs capacity under both<\/mark> <mark class=\"new\">Buritanian law, its law of incorporation,<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">the proper law<\/mark><mark class=\"same\">, a subjective proper law being acceptable as<\/mark> <mark class=\"new\">public bodies<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per the <i>Haugesund Kommune<\/i> majority, capacity is the internationalist \"legal ability to exercise specific rights\", so<\/mark> <mark class=\"new\">the seal rule<\/mark> <mark class=\"same\">removed<\/mark> <mark class=\"new\">Medira<\/mark><mark class=\"same\">'s capacity for<\/mark> <mark class=\"new\">the lease<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Medira's alternative characterisation: the seal may be a capacity rule. Worth arguing alongside C2.7, but C2.7 holds the form-or-validity line that decides it."}, {"letter": "D", "code": "C2.10.3", "title": "Foster: Comity; Mental State", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Foster v Driscoll<\/i> and <i>Regazzoni<\/i> (in Singapore, <i>Patriot v Lam Hong<\/i>; <i>Esben<\/i>), a contract whose real object and intention is<\/mark> <mark class=\"new\">importing scanners without a certificate<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Buritania<\/mark> <mark class=\"same\">is unenforceable<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ang v Lyu<\/i> and <i>Surewin<\/i>, <i>Foster<\/i> is forum public policy, so it applies under<\/mark> <mark class=\"new\">an Elbonian<\/mark> <mark class=\"same\">proper law alike<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Mental state: per <i>Dimplex Gems<\/i>,<\/mark> <mark class=\"new\">the procurement head's mere knowledge<\/mark> <mark class=\"same\">does not disqualify<\/mark> <mark class=\"new\">Medira<\/mark><mark class=\"same\">; active participation is needed (doubting <i>Soetanto<\/i>).<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The right route only if Elbonian law governs: Vantis intended to break Buritanian law at formation, and Medira's procurement head knew but took no active part. On the best view the proper law is Buritanian, so Route A takes over."}, {"letter": "E", "code": "C2.2.5", "title": "Floating Proper Law: Which Law Tests Validity?", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, the <i>Shanghai Turbo<\/i> HC on balance used the lex fori (also testing<\/mark> <mark class=\"new\">Buritanian and Elbonian law<\/mark><mark class=\"same\">), whereas <i>The Iran Vojdan<\/i> used<\/mark> <mark class=\"new\">the OPL<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Lex fori (−): per Prof Chong, under Singapore law<\/mark> <mark class=\"new\">cl 12's election<\/mark> <mark class=\"same\">is invalid even with<\/mark> <mark class=\"new\">Vantis's notice<\/mark><mark class=\"same\">, so<\/mark> <mark class=\"new\">the OPL<\/mark> <mark class=\"same\">governs.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Buritanian law, the OPL and the default, invalidates it too; Elbonian law validates it only by assuming it worked.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "C2.6", "title": "The Putative Proper Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">As<\/mark> <mark class=\"new\">the missing seal<\/mark> <mark class=\"same\">concerns existence, per <i>Lew v Nargolwala<\/i> a law agreed during negotiations governs (rare), failing which a <i>JIO<\/i>-style three-stage test applied to<\/mark> <mark class=\"new\">the lease negotiations<\/mark> <mark class=\"same\">finds the putative proper law<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">\"Of no effect\" means the lease never existed, so the putative proper law decides.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The putative proper law is for disputes about whether a contract was formed at all. No one denies agreeing the lease; the seal goes to form, validity or capacity."}, {"letter": "G", "code": "C2.10.1", "title": "Route A: Proper Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Kahler<\/i> and <i>Zivnostenka<\/i>, illegality under<\/mark> <mark class=\"new\">Buritanian law, the proper law,<\/mark> <mark class=\"same\">bars enforcement, unless<\/mark> <mark class=\"new\">the Radiation Safety Act<\/mark> <mark class=\"same\">itself offends Singapore public policy<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, breach of foreign written law<\/mark> <mark class=\"new\">planned at formation, as here,<\/mark> <mark class=\"same\">goes to Foster<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">but where the proper law is the law broken, it is Route A, and Foster and the parties' intentions are irrelevant.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "C-01.2", "side": "C", "hyp": 1, "n": 2, "source": "Mock Paper 1, Hypo 2", "title": "Medira v Vantis", "full": "Mock Paper 1, Hypo 2", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>Medira Inc, the national hospital operator of Buritania, leased MRI scanners from Vantis Corp, an Elbonian company. The lease is governed by Buritanian law; assume that Vantis's later attempt to elect Elbonian law under clause 12 was ineffective. At a technical briefing at Medira's head office in Buritania, a Vantis sales engineer told Medira's procurement committee that the scanners had achieved 99.5% uptime in hospitals worldwide. The committee recommended the deal. Medira's board met in Singapore, where its members were attending a medical trade fair, and approved the deal there after reading the engineer's slides. The lease was signed in Singapore. The scanners have achieved only 81% uptime.<\/p><p>Clause 19 of the lease reads: \"Medira acknowledges that it has not entered into this lease in reliance on any statement made by or on behalf of Vantis.\" Medira sues Vantis in Singapore in the tort of misrepresentation. Vantis argues that Elbonian law should govern the tort.<\/p><p>The statement is an actionable misrepresentation under Singapore and Buritanian tort law, but not Elbonian. A no-reliance clause may be raised as a defence to a misrepresentation action under all relevant laws. Clause 19 is valid under Buritanian and Elbonian contract law, but not under Singapore law, as it does not satisfy the requirement of reasonableness. Advise Medira.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A misrepresentation made in one country and relied on in two, met by a no-reliance clause that is valid under the contract's law but fails Singapore's reasonableness test.<\/p>\n<p><strong>Locating the tort: C3.3.2.<\/strong> Receipt and reliance are split, so the specific rule fails and the substance test applies (<i>JIO<\/i>). The statement was made and received in Buritania and relied on there by the committee; the board meeting in Singapore was fortuitous. Arguably Buritania, but the claim is actionable under both laws anyway.<\/p>\n<p><strong>The clause: C3.8.2.<\/strong> On the preferred view, admissibility is a tort question and validity a contract question. Cl 19 can be raised as a defence under all laws, so admissibility is met; validity is for the proper law, Buritanian law, which upholds it. On the <i>Sayers<\/i> majority's view the result is the same.<\/p>\n<p><strong>Singapore's rule: C1.7.<\/strong> The reasonableness rule overrides a foreign proper law only if it is an overriding mandatory rule. The Misrepresentation Act reaches a misrepresentation abroad only under a Singapore-law contract (<i>JIO<\/i>), and s 27(2) UCTA is not engaged. So it does not apply.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not assume Singapore's reasonableness rule decides it because the action is in Singapore. Medira wins only if the lease itself falls, taking cl 19 with it.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The misrepresentation is actionable under Singapore law and under Buritanian law, the likely place of the tort, but cl 19 is admissible against it under every law and valid under the Buritanian proper law, and Singapore's reasonableness rule does not override a foreign proper law here, so the claim fails unless the lease itself is of no effect.<\/blockquote>", "items": [{"letter": "A", "code": "C3.6.5", "title": "Party Autonomy in Tort", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Vantis<\/mark> <mark class=\"same\">argues<\/mark> <mark class=\"new\">cl 12<\/mark> <mark class=\"same\">applies<\/mark> <mark class=\"new\">Elbonian law<\/mark> <mark class=\"same\">to<\/mark> <mark class=\"new\">the misrepresentation<\/mark><mark class=\"same\">, an open question (<i>Ong Ghee Soon<\/i>), though \"just a small step away\" (C&amp;Y).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">But the election failed, and \"governs this lease\" is not wide enough to reach a tort.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Answers Vantis's argument: Elbonian law could reach the tort only through the flexible exception, and only if cl 12's election worked, which it did not. One line."}, {"letter": "B", "code": "C1.7", "title": "Forum Mandatory Rules", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Tiers: only the international tier overrides<\/mark> <mark class=\"new\">a foreign proper law<\/mark><mark class=\"same\">; a domestic mandatory rule binds only if<\/mark> <mark class=\"new\">Singapore law<\/mark> <mark class=\"same\">governs.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Misrepresentation Act: per <i>JIO Minerals<\/i>, the MA reaches<\/mark> <mark class=\"new\">a misrepresentation in Buritania<\/mark> <mark class=\"same\">only if<\/mark> <mark class=\"new\">the lease<\/mark> <mark class=\"same\">has a Singapore proper law<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">So Singapore's reasonableness rule cannot override the Buritanian proper law here.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "C3.8.2", "title": "Exemption Clause as a Defence to Tort", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Clause 19<\/mark><mark class=\"same\">, valid under<\/mark> <mark class=\"new\">Buritanian law<\/mark><mark class=\"same\">, excludes<\/mark> <mark class=\"new\">misrepresentation<\/mark> <mark class=\"same\">liability that Singapore law<\/mark> <mark class=\"new\">subjects to reasonableness<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">(1) admissibility is a tort question for double actionability, and (2) validity a contract question for<\/mark> <mark class=\"new\">the proper law<\/mark><mark class=\"same\">, so<\/mark> <mark class=\"new\">cl 19<\/mark><mark class=\"same\">, valid under<\/mark> <mark class=\"new\">Buritanian law<\/mark><mark class=\"same\">, succeeds only if admissible under both<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">the place of the tort<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Admissible under all laws and valid under the Buritanian proper law: the claim fails.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "C3.4", "title": "Local Torts", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Rickshaw<\/i>, rejecting <i>Metall<\/i>'s English-law-only rule as \"unduly parochial\" and contrary to comity,<\/mark> <mark class=\"new\">a misrepresentation relied on<\/mark> <mark class=\"same\">in Singapore still runs both limbs, both pointing to<\/mark> <mark class=\"new\">Singapore law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Even if the board's reliance makes Singapore the place of the tort, cl 19's validity is still for the proper law.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Medira may say the board's reliance makes this a Singapore tort. Even so, cl 19's validity is a contract question for the Buritanian proper law, so the result does not change."}, {"letter": "E", "code": "C3.3.2", "title": "Misrepresentation: Receipt and Reliance", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>JIO Minerals<\/i> (tentatively, citing Yeo) and <i>Ong Ghee Soon<\/i>,<\/mark> <mark class=\"new\">a statement<\/mark> <mark class=\"same\">directed at<\/mark> <mark class=\"new\">Medira<\/mark> <mark class=\"same\">and received and acted on in<\/mark> <mark class=\"new\">one country<\/mark> <mark class=\"same\">is a tort there, unless<\/mark> <mark class=\"new\">that country<\/mark> <mark class=\"same\">is fortuitous.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Receipt and reliance split: the specific rule fails, so use<\/mark> <mark class=\"new\">the substance test<\/mark><mark class=\"same\">, as in <i>JIO<\/i><\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">Made and received in Buritania, relied on there and in Singapore: arguably Buritania, the board meeting being fortuitous.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "C2.2.1", "title": "Express Choice of Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Peh Teck Quee<\/i>, applying <i>Vita Food<\/i>,<\/mark> <mark class=\"new\">cl 12<\/mark><mark class=\"same\">'s choice of<\/mark> <mark class=\"new\">Buritanian law<\/mark> <mark class=\"same\">is virtually conclusive unless not (a) bona fide, (b) legal, or (c) consistent with public policy<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So cl 19's validity is tested by Buritanian law.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Fixes the law that tests cl 19's validity: Buritanian, by express choice. A line inside the C3.8.2 analysis."}, {"letter": "G", "code": "C2.2.2", "title": "Attack: Not Bona Fide", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Peh Teck Quee<\/i>, choosing<\/mark> <mark class=\"new\">Buritanian law<\/mark> <mark class=\"same\">to evade<\/mark> <mark class=\"new\">Singapore's reasonableness rule<\/mark> <mark class=\"same\">defeats the clause only if evasion was the sole purpose.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Cl 19 would fail under Singapore law, so the Buritanian choice is an evasion and is struck out.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Buritanian law has every genuine connection with the lease: the lessee, the hospitals and the installation are all there. Evasion was not the sole purpose, so the choice stands."}]}, {"id": "C-01.3", "side": "C", "hyp": 1, "n": 3, "source": "Mock Paper 1, Hypo 2", "title": "Medira v Vantis and Haldane", "full": "Mock Paper 1, Hypo 2", "q": "<p>Assume the Singapore court will assume jurisdiction over all relevant parties.<\/p><p>Medira Inc, Buritania's national hospital operator, leased MRI scanners from Vantis Corp, an Elbonian company, for installation in Buritania, under a lease governed by Buritanian law. Vantis had engaged Dario, a Charltonian resident, to use his friendship with the Buritanian Health Minister to secure the lease, for a commission paid into his Singapore bank account if the lease was signed. The Vantis–Dario contract was concluded in Elbonia and chooses Charltonian law; both parties chose that law because they knew that such contracts are against Buritanian public policy.<\/p><p>Separately, Medira agreed a price by e-mail with Haldane Pte Ltd, a Singapore company with a Suburbian parent, for maintaining the scanners in Buritania. Haldane then e-mailed its standard Service Terms with a note: \"Unless we hear from you within 14 days, we will treat these terms as agreed.\" An annexe to the Service Terms, which was not brought to Medira's attention, chooses Suburbian law. Medira did not reply. Nothing has been signed.<\/p><p>Contracts for the purchase of personal influence are against Buritanian and Singapore public policy if the acts are committed within the jurisdiction, but valid under Charltonian law wherever the acts are committed. There is a sufficient connection between the Dario contract and the lease to prevent Vantis from enforcing the lease under Singapore and Elbonian law, but not under Buritanian law. Under Suburbian contract law, but not Singapore or Buritanian law, Medira's silence amounts to acceptance and the Suburbian clause is incorporated. Advise Medira whether the Dario contract helps it resist the lease, and whether it is bound to Haldane.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Two side transactions. The Dario contract is an illegality question about another contract, so it is tainting; the Haldane terms are a formation question, so it is the putative proper law.<\/p>\n<p><strong>Tainting: C2.10.6.<\/strong> Medira argues the influence-peddling contract taints Vantis's claim on the lease. Step 2 turns on which law's principles decide connection: Chong says the proper law of the contract sued on, the Buritanian lease, under which there is no sufficient connection. On the lex fori, there is. The answer turns on which law applies.<\/p>\n<p><strong>The underlying illegality: C2.10.4.<\/strong> Influence-buying offends Singapore's and Buritania's policies, which coincide at the place where the influence is exerted (<i>Lemenda<\/i>). Query whether validity under the Charltonian proper law trumps that (<i>Westacre<\/i>), and whether a <i>Lemenda<\/i> breach is serious enough to taint (Chong).<\/p>\n<p><strong>Haldane: C2.6.<\/strong> Existence is disputed, so use the putative proper law. On the double bootstraps, Suburbian law says Medira's silence created a contract. But binding Medira by silence through a hidden annexe is the case for <i>Lew<\/i>'s caveat, so the best view is that there is no contract.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not apply the annexe's choice of law as if a contract already existed. \"Virtually conclusive\" applies only once a contract is formed.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The Dario contract is a Lemenda breach whose effect on the lease turns on tainting, and on Chong's view the lease's Buritanian proper law finds no sufficient connection, so it probably does not help Medira; Medira is probably not bound to Haldane, because binding it by silence through a hidden annexe falls within Lew's caveat, leaving no contract under any law.<\/blockquote>", "items": [{"letter": "A", "code": "C2.10.6", "title": "Tainting by Foreign Illegality", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Medira<\/mark> <mark class=\"same\">argues<\/mark> <mark class=\"new\">the Dario contract<\/mark> <mark class=\"same\">taints<\/mark> <mark class=\"new\">Vantis's claim on the lease<\/mark><mark class=\"same\">, asking per <i>Euro-Diam<\/i> (1) is there a relevant foreign illegality, and (2) is it sufficiently connected to<\/mark> <mark class=\"new\">the claim<\/mark><mark class=\"same\">?<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Which proper law: per Chong (seminar), that of<\/mark> <mark class=\"new\">the lease, the claim sued on<\/mark><mark class=\"same\">, not of<\/mark> <mark class=\"new\">the Dario contract, the tainting transaction<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Buritanian law, the lease's proper law, finds no sufficient connection, though Singapore and Elbonian law do.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "C2.2.2", "title": "Attack: Not Bona Fide", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Peh Teck Quee<\/i>, choosing<\/mark> <mark class=\"new\">Charltonian law<\/mark> <mark class=\"same\">to evade<\/mark> <mark class=\"new\">Buritanian public policy<\/mark> <mark class=\"same\">defeats the clause only if evasion was the sole purpose.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">That was the parties' only reason, so the Dario contract falls to its OPL, Buritania, where the lobbying takes place.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Charltonian law was chosen only to escape Buritanian policy, so the choice is struck out and the Dario contract is governed by Buritanian law. That strengthens step 1 of tainting; it does not decide step 2."}, {"letter": "C", "code": "C2.2.1", "title": "Express Choice: Objective Intention", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Peh Teck Quee<\/i>, applying <i>Vita Food<\/i>,<\/mark> <mark class=\"new\">the annexe<\/mark><mark class=\"same\">'s choice of<\/mark> <mark class=\"new\">Suburbian law<\/mark> <mark class=\"same\">is virtually conclusive unless not (a) bona fide, (b) legal, or (c) consistent with public policy, each tested by the lex fori on objective intention, so<\/mark> <mark class=\"new\">Medira<\/mark><mark class=\"same\">'s claim not to have<\/mark> <mark class=\"new\">seen the annexe<\/mark> <mark class=\"same\">is irrelevant.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "That rule applies once a contract exists. Medira denies there is any contract, so the putative proper law decides first, and the hidden annexe cannot validate itself."}, {"letter": "D", "code": "C2.4.3", "title": "Weighting at Stage 3", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per Prof Chong, the strongest argument is usually<\/mark> <mark class=\"new\">the place where both parties perform, Buritania, where the scanners are maintained and paid for<\/mark><mark class=\"same\">, so<\/mark> <mark class=\"new\">Buritanian law<\/mark> <mark class=\"same\">is the OPL.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">As the putative OPL for the Haldane terms, Buritanian law finds no contract by silence.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Gives the fallback putative proper law for the Haldane terms, Buritanian law, which also finds no contract. Use it if the caveat argument fails."}, {"letter": "E", "code": "C2.10.4", "title": "Lemenda", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Lemenda<\/i>,<\/mark> <mark class=\"new\">Dario's commission for influencing the Buritanian Health Minister<\/mark> <mark class=\"same\">under<\/mark> <mark class=\"new\">a Charltonian-law contract<\/mark> <mark class=\"same\">is unenforced if contrary to both a forum policy founded on general morality and the same policy at<\/mark> <mark class=\"new\">Buritania, where the influence is exerted<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Prof Chong's query: does validity under<\/mark> <mark class=\"new\">Charltonian law, the proper law,<\/mark> <mark class=\"same\">trump the coincidence of<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">Buritanian<\/mark> <mark class=\"same\">policy?<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "C2.10.1", "title": "Routing Starter", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Medira<\/mark> <mark class=\"same\">pleads illegality against<\/mark> <mark class=\"new\">Vantis's claim on the lease<\/mark> <mark class=\"same\">via (A) the proper law, (B) forum international public policy, (C) Foster, (D) Lemenda, (E) Ralli, (F) tainting, or (G) reliance as a defence.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Per C&amp;Y,<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">while foreign public policy alone goes to Lemenda<\/mark><mark class=\"new\">, which fits
