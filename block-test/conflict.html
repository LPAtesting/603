ch of contract. Helion has said that it will rely on the illegality of the contract as a defence, and that it will counterclaim for the price of the last two shipments delivered.<\/p><p>Advise Quanta on its prospects before the Singapore court on each of its claims and on Helion's counterclaim. Assume that the Singapore court will assume jurisdiction over all relevant parties.<\/p><p>You are given the following additional information:<\/p><ol><li>Neither party has yet pleaded the content of English law.<\/li><li>The Freedonian decree would frustrate the contract under Singapore and Freedonian contract laws. Under English and Lusitanian contract laws, it would not, as Helion may discharge the contract by delivering to the nearest available port, which is in Charltonia.<\/li><li>Under Elbonian law, but not Singapore law, Quanta's smuggling is so closely connected to the contract with Bellamy as to render that contract unenforceable.<\/li><li>Inducing breach of contract is a tort under Singapore and Suburbian laws. It is not a tort under Lusitanian law, but the Lusitanian Unfair Competition Code requires a person who procures the breach of a contract in Lusitania to pay compensation to the victim.<\/li><li>Quanta's lost profits are recoverable under all relevant laws. A Lusitanian court would award about half of what a Singapore court would award for the same loss.<\/li><li>Quanta's shareholders and senior management are all in Singapore, and its loss of profits was felt there.<\/li><\/ol>", "Mock Paper 3, Hypo 5": "<p>Meridian Hospitality Pte Ltd (Meridian) is a Singapore incorporated company which operates hotels across Asia. Mr Tan is its founder and sole shareholder. He is a Singapore citizen who retired to Xalarat in 2025, where he now lives. His shares in Meridian are his only asset in Singapore.<\/p><p>Utopia is a federation of States. Each State has its own courts and its own contract law, and there are separate federal courts. Ostrava Capital LLC (Ostrava) is incorporated in the State of Novo in Utopia. In 2021, Ostrava lent US$20 million to Meridian to refurbish a resort in Elbonia. The loan agreement is governed by the law of the State of Novo and contains no jurisdiction clause. Mr Tan guaranteed the loan. The guarantee is governed by the law of the State of Novo and requires Mr Tan to keep an address for notices in Novo, for which he named a firm of accountants. Meridian has no presence in Novo. It does have a marketing office in the State of Aurora in Utopia, some 2,000 km from Novo. The office is leased in Meridian's name and staffed by two Meridian employees, who may not conclude contracts.<\/p><p>Meridian defaulted in 2024. Ostrava sued Meridian and Mr Tan in the Novo State Court, a first instance court which applied Novo law. Ostrava served Meridian in Singapore under Novo's service out rules. Ostrava's chairman invited Mr Tan to fly to Novo to discuss a standstill agreement. Mr Tan went. No standstill was ever intended, and he was served at the end of a two-day visit.<\/p><p>Meridian applied to the Novo State Court to set aside service on the ground that Novo was forum non conveniens. The application failed and Meridian took no further part. Mr Tan took no part at all. The notice of the hearing was sent to the accountants, who had ceased to act for him and did not forward it. He says that he first learnt of the outcome in May 2026.<\/p><p>In March 2026, the Novo State Court entered default judgment against Meridian and Mr Tan, jointly and severally, for: (a) US$18 million in unpaid principal and interest; (b) statutory interest at 20% a year until payment; (c) US$6 million in punitive damages payable to Ostrava, expressed to be for Meridian's failure to obey the court's order for production of documents; and (d) an order that Meridian deliver up its share certificates in the company owning the Elbonian resort. Meridian may appeal to the Novo Court of Appeal within one year of the judgment, and has not done so. Under Novo law, the judgment is binding unless and until it is overturned on appeal.<\/p><p>Ostrava then sought enforcement in Elbonia. Meridian defended on the ground that Ostrava had forged the drawdown notices on which US$5 million of the claim was based. After a full hearing, the Elbonian court found no forgery and declared the Novo judgment enforceable. The resort was sold and Ostrava received US$7 million.<\/p><p>Ostrava has now commenced proceedings in Singapore on both the Novo judgment and the Elbonian judgment. It has served Meridian at its registered office, and proposes to serve Mr Tan in Xalarat. It also intends to enforce in Yesouth, where Meridian owns its last remaining hotel. Last week, a former Ostrava employee gave Meridian e-mails which appear to show that the drawdown notices were forged.<\/p><p>Advise Meridian and Mr Tan on: (1) whether, and for how much, Ostrava may enforce in Singapore; and (2) whether the Singapore court can prevent Ostrava from enforcing in Yesouth.<\/p><p>Assume the following:<\/p><ol><li>Neither Utopia nor Elbonia is gazetted under the Reciprocal Enforcement of Foreign Judgments Act, and neither is a party to the Hague Convention on Choice of Court Agreements.<\/li><li>Under Novo procedural law, an application to set aside service on forum non conveniens grounds is not a submission to the Novo court.<\/li><li>Courts in the State of Novo do not enforce foreign money judgments unless there is a treaty, and there is no such treaty with Singapore.<\/li><li>Meridian could not have obtained the e-mails before the former employee came forward.<\/li><li>The courts of Yesouth will enforce a Novo judgment without inquiring into allegations of fraud.<\/li><\/ol>", "Mock Paper 3, Hypo 6": "<p>Aria Clinics Pte Ltd (Aria) is a Singapore incorporated company which runs aesthetic clinics in Singapore and Utopia. Dr Ong, its founder and medical director, is domiciled in Singapore.<\/p><p>In 2024, Aria engaged Beryl Labs Ltd (Beryl), a Utopian incorporated company, to test a new dermal filler. The testing contract was concluded in Utopia and provides:<\/p><blockquote>16. All disputes arising out of or in connection with this contract, whether in contract, tort or otherwise, shall be governed by Utopian law.<br>17. Beryl's total liability under or in connection with this contract, whether in contract or tort, shall not exceed the fees paid to it.<\/blockquote><p>Beryl's scientists carried out the tests in Utopia. They e-mailed a clean report to Aria's chief operating officer, who read it on his phone while on holiday in Buritania, and from there approved a bulk order of the filler. The tests had been carried out carelessly, and the filler harmed several patients. Aria recalled it, compensated the patients in Singapore and suffered heavy losses, which were felt in Singapore.<\/p><p>Tomas, a Ruritanian-domiciled social media influencer, then posted a video on Glimmer, a video platform hosted in Yesouth. He recorded it on holiday in Suburbia. In it he said that Dr Ong \"knowingly injected poison into her patients\". The video was viewed 40,000 times in Singapore, 5,000 times in Ruritania and 300 times in Suburbia. Tomas also posted Dr Ong's home address in Singapore and urged his followers to \"pay her a visit\". Dr Ong received threats, became ill, and lost a place on a medical board.<\/p><p>Tomas had been paid to make the video by Zentra Inc (Zentra), a Ruritanian incorporated company which competes with Aria in Utopia and Ruritania. The arrangement was made at meetings in Ruritania, with the aim of injuring Aria's business. Aria's new patient bookings in Singapore fell sharply.<\/p><p>Three claims are contemplated in Singapore:<\/p><ul><li>(a) Aria v Beryl, for the tort of negligence.<\/li><li>(b) Dr Ong v Tomas, for defamation and for the statutory tort of doxxing under the Online Safety (Relief and Accountability) Act 2025 (OSRAA). Dr Ong claims damages for emotional distress and for the loss of her place on the medical board.<\/li><li>(c) Aria v Tomas and Zentra, for the tort of conspiracy to injure by unlawful means.<\/li><\/ul><p>Glimmer's terms of use, to which Tomas agreed but Dr Ong did not, contain a clause choosing the law of Yesouth for all disputes arising from any post on the platform. Tomas says that this clause protects him.<\/p><p>Advise Aria and Dr Ong on their prospects of success in the Singapore court. You may assume that the Singapore court will assume jurisdiction over all the claims.<\/p><p>How, if at all, would your answer differ if Tomas had not pleaded any foreign law by the time of trial?<\/p><p>You are given the following additional information:<\/p><ol><li>Beryl is liable in negligence under Singapore and Buritanian domestic tort laws. Under Utopian domestic tort law there is no liability in tort for pure economic loss, but a party is contractually liable for carelessness in performing a contract.<\/li><li>Clause 17 is valid under Utopian law, but is not enforceable under Singapore law as it does not satisfy the requirement of reasonableness.<\/li><li>Tomas's statement is defamatory under the domestic laws of Singapore, Ruritania and Suburbia. \"Honest opinion on a matter of public concern\" is a complete defence under Ruritanian law only.<\/li><li>Damages for injury to feelings in a defamation action are available under Singapore and Suburbian laws, but never under Ruritanian law.<\/li><li>Under Ruritanian and Suburbian laws, all claims in tort must be brought within one year of the harm. That period has expired. It has not expired under Singapore law.<\/li><li>Conspiracy to injure by unlawful means is a tort under Singapore law. Under Ruritanian law, it is a tort only where the defendants' dominant purpose is to injure.<\/li><\/ol>", "Mock Paper 4, Hypo 7": "<p>Corvus Pte Ltd (Corvus), a Singapore incorporated company, is an offshore drilling contractor with a branch office in Suburbia. Dragoman SA (Dragoman) is a state-linked oil company incorporated in Elbonia. Dragoman is registered as a foreign company under the Singapore Companies Act, and it has a registered office and an authorised representative in Singapore, from where it trades crude oil.<\/p><p>Under a Drilling Services Agreement dated 10 May 2021, expressly governed by Elbonian law, Corvus drills wells off the Elbonian coast for Dragoman. It provides:<\/p><blockquote>17. All disputes arising out of or in connection with this agreement shall be resolved exclusively by the local courts.<\/blockquote><p>Under a Rig Lease dated 3 February 2023, expressly governed by Suburbian law, Corvus leases its drilling rig from Dragoman Leasing Ltd (DL), a Suburbian incorporated subsidiary of Dragoman. DL is not registered in Singapore and has no place of business here. The lease provides:<\/p><blockquote>25. The courts of Suburbia shall have non-exclusive jurisdiction over any dispute under this lease.<\/blockquote><p>Corvus also holds a political risk policy dated 1 September 2020 from Lion Assurance Pte Ltd (Lion), a Singapore insurer, which covers the rig. The policy was negotiated in Singapore and premiums are paid in Singapore. It is expressly governed by Singapore law and provides:<\/p><blockquote>30. The English courts shall have exclusive jurisdiction over any dispute under this policy.<\/blockquote><p>In March 2025, a military junta seized power in Elbonia. It suspended the Elbonian Commercial Court and created \"Economic Tribunals\", staffed by serving military officers, to hear all disputes involving state-linked companies. The rig was seized. Dragoman stopped paying Corvus, and Corvus's Elbonian lawyer was arrested. In June 2025, Corvus filed a claim at the Commercial Court registry. The registry returned it with a note stating that the court \"will not accept claims against state-linked entities until further notice\".<\/p><p>In January 2026, Corvus commenced proceedings in the General Division of the Singapore High Court against: (a) Dragoman, for unpaid fees; (b) DL, for a declaration that no rent is due after the seizure of the rig; and (c) Lion, for payment under the policy. All three claims arise from the seizure. Dragoman was served at its Singapore registered office, and Lion at its registered office. DL's finance director, Mr Petrov, was served at a Singapore hotel while on a family holiday.<\/p><p>Dragoman has applied for a stay under the Choice of Court Agreements Act. Lion has applied for a stay in favour of England. DL has applied to set aside service and, in the alternative, for a stay in favour of Suburbia. Corvus says that it would be absurd for the same seizure to be litigated in three countries.<\/p><p>In February 2026, Dragoman sued Corvus in the court of Suburbia for liquidated damages under the Drilling Services Agreement. The originating process was served at Corvus's Suburbian branch. Corvus ignored it. In April 2026, the Suburbian court gave default judgment against Corvus for US$3 million. Dragoman now relies on that judgment in the Singapore proceedings, as a defence to Corvus's claim for fees and as a debt due to it.<\/p><p>Advise Corvus on: (1) whether the Singapore court will hear its claims against Dragoman, DL and Lion; (2) the effect of the Suburbian judgment in Singapore; and (3) any further remedy it may have because Dragoman sued in Suburbia.<\/p><p>Assume the following:<\/p><ol><li>The Hague Convention on Choice of Court Agreements took legal effect in Elbonia on 1 January 2019 and in Suburbia on 1 January 2020. It applied to the United Kingdom as a member of the European Union from 1 October 2015, and in its own right from 1 January 2021.<\/li><li>Corvus alleges that Clause 17 was inserted at a late stage after Dragoman bribed Corvus's then general counsel. Under Elbonian law, including its choice of law rules, a jurisdiction clause procured by bribing a party's agent is void. Corvus has not yet obtained any evidence of Elbonian law.<\/li><li>All 214 reported decisions of the Economic Tribunals since March 2025 have been in favour of state-linked companies.<\/li><li>Trial in Suburbia takes about 3 years, compared to 12 months in Singapore.<\/li><li>Since the seizure of the rig, Corvus has been in financial difficulty. Litigating in England would cost about three times as much as litigating in Singapore.<\/li><li>There are no time bar issues in any of the relevant countries.<\/li><\/ol>", "Mock Paper 4, Hypo 8": "<p>Castellan Bank (Castellan) is incorporated in Elbonia and has a branch in Singapore. Valtura is a municipality in Suburbia. In May 2022, Castellan's Singapore branch persuaded Valtura's treasurer to enter into a ten-year interest rate swap. Castellan's dealers e-mailed the signed confirmation to Valtura, and Valtura's treasurer e-mailed back her acceptance from Suburbia. The confirmation states:<\/p><blockquote>14. This swap transaction is governed by Elbonian law.<\/blockquote><p>Payments were due monthly into Castellan's account in Singapore or Valtura's account in Suburbia, depending on which way rates moved. Rates moved against Valtura, which paid Castellan €8 million. In December 2025, following a diplomatic dispute, Suburbia passed a law prohibiting Suburbian municipalities from making any payment to an Elbonian bank, wherever the payment is to be made. Valtura stopped paying in January 2026. Castellan claims a further €5 million as the close-out amount on early termination.<\/p><p>Valtura has just been advised that the Suburbian Local Government Act gives municipalities no power to enter into derivatives. It therefore says that the swap is void and that it is entitled to the return of the €8 million. It also says that the Local Government Act requires every contract of a municipality to be notarised by a Suburbian notary, which was not done. In the alternative, Valtura says that the entire confirmation, including Clause 14, is voidable because Castellan's dealers told the treasurer that the swap \"could not lose money\".<\/p><p>Castellan has a separate dispute with Lila, aged 19, a Ruritanian domiciliary who is studying and living in Singapore. In 2024, Castellan's private bank in Singapore lent US$2 million to Lila's brother under a loan agreement expressly governed by Utopian law. He defaulted in June 2025. At a dinner in Singapore, Lila told Castellan's relationship manager: \"Don't worry, I will stand behind my brother.\" Two days later, the relationship manager e-mailed her a form of guarantee of her brother's existing debt. The form was expressed to be governed by Utopian law and stated that she would be bound unless she objected within seven days. Lila did not reply. She never signed anything.<\/p><p>Advise Castellan on: (1) whether it can enforce the swap against Valtura; (2) whether Valtura can recover the €8 million; and (3) whether it can enforce the guarantee against Lila. Assume that the Singapore court will assume jurisdiction over all relevant parties.<\/p><p>You are given the following additional information:<\/p><ol><li>Under Suburbian law, a transaction by a municipality outside its statutory powers is void. Under Elbonian domestic law, a transaction that a company has no power to enter into is valid unless the other party knew of the lack of power. Castellan did not know.<\/li><li>Under Suburbian law, a contract of a municipality that is not notarised is unenforceable. Elbonian and Singapore domestic laws have no notarisation requirement.<\/li><li>Under Elbonian and Singapore domestic laws, money paid under a void contract is recoverable as money paid for a consideration which has failed. Under Suburbian law, a municipality cannot recover money it paid under a transaction outside its powers.<\/li><li>Under all relevant laws, a contract can be rescinded for actionable misrepresentation. The dealers' statement is actionable under all relevant laws.<\/li><li>Under Utopian domestic contract law, but not Singapore domestic contract law: (a) silence following an oral assurance amounts to acceptance; (b) no consideration is needed for a guarantee; and (c) a guarantee need not be in writing.<\/li><li>Under Ruritanian law, a person under 21 lacks capacity to give a guarantee. Under Utopian and Singapore laws, a person aged 19 has capacity.<\/li><li>The December 2025 law would frustrate the swap under Suburbian contract law, but not under Elbonian or Singapore contract laws.<\/li><\/ol>", "Mock Paper 5, Hypo 9": "<p>Bright Harvest Pte Ltd (Bright Harvest) is a Singapore incorporated palm oil trader. In February 2026, it was placed under judicial management by the Singapore court. Its judicial managers are concerned about four sets of foreign proceedings, which threaten to strip the company of its remaining foreign receivables.<\/p><p><strong>Agrimax.<\/strong> Agrimax Inc (Agrimax), a Utopian incorporated company, bought palm oil from Bright Harvest for many years through its Singapore branch, under contracts governed by Singapore law which were negotiated, concluded and performed in Singapore. They contain no jurisdiction clause. Agrimax was registered as a foreign company under the Singapore Companies Act. It closed its branch in January 2026 but remains on the register. In April 2025, Agrimax sued Bright Harvest in Utopia under the Utopian Fair Commodities Act, alleging price-fixing and claiming treble damages. Bright Harvest's previous management knew of the action but did nothing. The action can only be brought in Utopia and trial is fixed for January 2027. Agrimax has now applied to the Utopian court for an order restraining Bright Harvest from seeking any relief in Singapore in relation to the Utopian action.<\/p><p><strong>Nordlund.<\/strong> Nordlund AS (Nordlund), a Lusitanian company, sued Bright Harvest in the Singapore General Division in 2023, claiming that the proceeds of a cargo were held on trust for it. After a full trial in 2024, the court dismissed the claim, finding that there was no trust. In March 2026, Nordlund sued Bright Harvest in Suburbia on the same dealings, claiming under the Suburbian doctrine of \"judicial estoppel\", and obtained an attachment over a receivable owed to Bright Harvest in Suburbia. Nordlund says that its new claim rests on e-mails it found in 2025. Those e-mails were disclosed to it in the Singapore action in 2023. If the attachment stands, Nordlund will rank ahead of Bright Harvest's other creditors.<\/p><p><strong>Seastar.<\/strong> Seastar Shipping Ltd (Seastar), an Elbonian company with no presence in Singapore, chartered a vessel to Bright Harvest under a charterparty governed by English law, which provides for all disputes to be referred to arbitration in London. In May 2026, Seastar sued Bright Harvest in Ruritania for demurrage. Bright Harvest applied for a stay in Ruritania, but the Ruritanian court refused to grant one. No arbitration has been commenced.<\/p><p><strong>Kalmar.<\/strong> Kalmar Ltd (Kalmar), a Buritanian company with no presence in Singapore, claims that Bright Harvest's former subsidiary destroyed its plantation in Buritania. The events, the witnesses and the governing law are all in Buritania. Bright Harvest's only link with Lusitania is a bank account there. Kalmar has sued Bright Harvest in Lusitania, where it can obtain a jury trial on a contingency fee basis. Bright Harvest has started proceedings in Buritania for a declaration of non-liability.<\/p><p>The judicial managers ask whether the Singapore court, excluding the SICC, can and should restrain Agrimax, Nordlund, Seastar and Kalmar from continuing with their foreign proceedings. They also wish to know what effect in Singapore a Utopian judgment for treble damages would have if the Utopian action is not restrained, and whether the answer would differ if a Singapore anti-suit injunction had been granted and Agrimax had carried on regardless. Advise the judicial managers.<\/p><p>Assume the following:<\/p><ol><li>Bright Harvest's dealings with Agrimax would not amount to a wrong under Singapore law.<\/li><li>The Utopian Fair Commodities Act provides that treble damages are payable to the private claimant, in order to punish and deter price-fixing.<\/li><li>Ruritania is a party to the New York Convention on the Recognition and Enforcement of Foreign Arbitral Awards.<\/li><li>The Buritanian courts do not have the power to grant anti-suit injunctions, and Kalmar has no assets or presence outside Buritania.<\/li><li>The doctrine of judicial estoppel is unknown to Singapore law.<\/li><li>No Singapore proceedings are currently pending against Seastar or Kalmar.<\/li><\/ol>", "Mock Paper 5, Hypo 10": "<p>Titan Cranes Pte Ltd (Titan), a Singapore incorporated company, hires out heavy-lift cranes. In January 2023, Titan contracted with Portus Ltd (Portus), a Utopian incorporated port operator, for the hire of a crane for use at Portus's terminal in Ruritania. The contract is expressly governed by Utopian law. Hire is payable monthly into Titan's Singapore bank account. On 1 February 2024, Ruritania banned the use of foreign-owned cranes at its ports, and imposed a fine on port operators in breach. Portus stopped paying hire that month, but carried on using the crane. The crane remains at the terminal.<\/p><p>On 5 March 2024, the crane collapsed, seriously injuring Jamal, a Titan technician who is domiciled in Singapore and was on a two-week posting to the terminal. Jamal was in a coma for 13 months. It is not clear whether the collapse was caused by Titan's poor maintenance, Jamal's failure to follow a safety checklist, or both.<\/p><p>In the Singapore court, Titan has sued Portus for the unpaid hire and for an order that Portus return the crane. Titan has also applied for an interlocutory injunction restraining Portus from selling the crane pending trial. Jamal has sued Titan in negligence.<\/p><p>Portus says that the Ruritanian ban ended its obligation to pay hire. It also relies on the following provisions of the Utopian Civil Code:<\/p><ul><li>(a) \"All rights to hire are extinguished two years after the sum in question falls due.\"<\/li><li>(b) \"A contract of hire exceeding US$1 million in value may be proved only by a notarised instrument.\" The hire contract is an unnotarised exchange of e-mails, and Titan proposes to prove it by oral evidence.<\/li><li>(c) \"No court shall grant an injunction in a dispute concerning hired goods.\"<\/li><\/ul><p>Titan relies on the following provisions of the Utopian Civil Code:<\/p><ul><li>(d) \"A court shall order the return of hired goods upon the expiry or termination of the hire.\"<\/li><li>(e) \"Sums overdue under a contract of hire bear interest at 24% a year.\"<\/li><\/ul><p>In answer to Jamal's claim, Titan pleads the following provisions of the Ruritanian Workplace Code:<\/p><ul><li>(f) \"All claims for personal injury must be brought within 18 months of the injury.\" Jamal issued his claim 22 months after the collapse. The period under Singapore law has not expired.<\/li><li>(g) \"Damages for pain and suffering shall not exceed US$50,000.\" A Singapore court would award about US$200,000 for Jamal's injuries.<\/li><li>(h) \"Where an injured person is at fault, damages shall be reduced by one half.\" A Singapore court would apportion 10% to Jamal on the same facts.<\/li><\/ul><p>Jamal relies on the following provision of the same Code:<\/p><ul><li>(i) \"Where a worker is injured at work, the employer is presumed to have been negligent unless it proves otherwise.\"<\/li><\/ul><p>Titan's Ruritanian law expert has since died, and Titan has not found a replacement. Jamal says that Titan has therefore failed to prove provisions (f), (g) and (h), and that the court should presume that Ruritanian law is the same as Singapore law. Titan replies that, if Ruritanian law is not proved, Jamal cannot rely on provision (i) and cannot show civil liability under the law of the place of the tort. Ruritania has a civil law system with no historical link to Singapore law. Portus's and Titan's Utopian law experts disagree completely on whether provision (a) extinguishes the right or only bars the remedy.<\/p><p>Advise Titan on its claims against Portus and on Jamal's claim against it, including how Utopian and Ruritanian law are to be established. Assume that the Singapore court will assume jurisdiction over all relevant parties, and that the only relevant laws for the tort claim are Singapore and Ruritanian laws.<\/p><p>How, if at all, would your answer differ if the actions had been brought in the SICC?<\/p><p>You are given the following additional information:<\/p><ol><li>Portus made repeated written promises to pay until December 2025, which persuaded Titan not to sue. Portus's promises were not intended to be kept. Titan issued its claim in October 2026, by which date the two-year period in provision (a) had expired for all hire that fell due before October 2024.<\/li><li>Under Singapore domestic law, the limitation period for a claim in contract is six years, and proof of a contract does not require writing.<\/li><li>Interest on Singapore judgments runs at 5.33% a year.<\/li><li>Under Ruritanian domestic tort law, Jamal's claim is otherwise actionable.<\/li><li>The Ruritanian ban would frustrate the contract under Singapore contract law. Under Utopian contract law, it would not, as the hirer bears the risk of any change in regulation.<\/li><\/ol>", "Mock Paper 6, Hypo 11": "<p>Stratus Pte Ltd (Stratus), a Singapore incorporated company, owns and runs a large data centre in Jurong. Five contracts relate to the data centre. All the contracts are in English.<\/p><ol><li>A Joint Venture Agreement dated 1 March 2016 between Stratus and Hyperion AG (Hyperion), a Charltonian incorporated company, expressly governed by Singapore law: \"The parties submit to the non-exclusive jurisdiction of the Singapore High Court.\"<\/li><li>An Engineering Contract dated 1 June 2021 between Stratus and Titanus SA (Titanus), a Buritanian incorporated company, expressly governed by Buritanian law: \"The Singapore International Commercial Court shall have jurisdiction over any dispute under this contract, without prejudice to the right of either party to sue in any other court.\"<\/li><li>An Operations Agreement dated 1 February 2023 between Stratus and Hyperion, expressly governed by Singapore law: \"The General Division of the High Court of Singapore, excluding the Singapore International Commercial Court, shall have exclusive jurisdiction over all disputes arising out of this agreement.\"<\/li><li>A Cooling Subcontract dated 1 May 2021 between Titanus and Volta Ltd (Volta), a Suburbian incorporated company. Stratus is not a party. It has no jurisdiction clause.<\/li><li>A Cleaning Contract dated 1 March 2022 between Stratus and Lim Bros Pte Ltd (Lim Bros), a Singapore incorporated family company which operates only in Singapore: \"Any dispute shall be heard by the Singapore International Commercial Court.\"<\/li><\/ol><p>In January 2026, the cooling system failed and fire destroyed much of the data centre. Stratus blames Titanus's design, Volta's cooling units, Hyperion's operating procedures, and Lim Bros's storage of solvents near the cooling plant. Stratus's claim against Lim Bros is for S$60,000.<\/p><p>Stratus wants a single trial in the SICC of its claims against Titanus (breach of contract), Hyperion (breach of the Joint Venture Agreement and the Operations Agreement), Volta (negligence) and Lim Bros (breach of contract). Each party resists as follows:<\/p><ul><li>Titanus says that the SICC should decline jurisdiction because the design work was done in Buritania, all its witnesses are there and Buritanian law governs. In April 2026, it sued Stratus in Buritania for a declaration of non-liability. A hearing there is fixed for February 2027.<\/li><li>Hyperion says that it did not agree to the SICC under either contract and refuses to consent to any transfer. It has been served in Charltonia.<\/li><li>Volta says that it never agreed to Singapore litigation of any kind and that it should not be joined.<\/li><li>Lim Bros says that this is a small local dispute which has no business in the SICC.<\/li><\/ul><p>Stratus has also applied for an injunction restraining Titanus from continuing the Buritanian proceedings.<\/p><p>Advise Stratus on: (1) whether its claims can be heard together in the SICC; (2) whether the injunction will be granted; and (3) if the claims against Hyperion under the Operations Agreement were heard in the SICC against Hyperion's objection, what difficulties Stratus might face in enforcing the judgment in Charltonia.<\/p><p>Assume the following:<\/p><ol><li>The Hague Convention on Choice of Court Agreements is in force in Charltonia and has been since 1 January 2020. Buritania and Suburbia are not parties to it.<\/li><li>Singapore choice of law rules point towards Singapore law for the negligence claim against Volta.<\/li><li>Buritanian law is written in Buritanian and has no reported English-language commentary. One of the International Judges of the SICC is a retired Buritanian judge.<\/li><li>Stratus's Engineering Contract claim will turn largely on the same expert evidence as its claim against Volta.<\/li><li>Stratus filed its SICC claim in May 2026 against Titanus in response to Titanus's Buritanian suit, but it has real claims and the data centre, the fire and the fire investigators are all in Singapore.<\/li><li>Titanus's Buritanian action will not be finished before the SICC action if the SICC action proceeds.<\/li><\/ol>", "Mock Paper 6, Hypo 12": "<p>Harbour Re Pte Ltd (Harbour) is a Singapore incorporated reinsurer. In February 2023, it agreed to reinsure a hull policy which Almeida Seguros SA (Almeida), a Lusitanian marine insurer, had issued to a Lusitanian shipowner. The hull policy is expressly governed by Lusitanian law. The reinsurance was placed by a broker in Singapore on a slip with no separate choice of law clause, but which contains the words \"Conditions: as original\". Almeida says that these words choose Lusitanian law. Harbour says that they refer only to the terms of cover. The slip is in English, and it follows the wording of the hull policy on all matters of cover. It also incorporates the Institute Time Clauses, a London market form whose terms have been interpreted by the English courts for over a century. Premium is payable in US dollars into Harbour's Singapore bank account, and claims are payable in euros into Almeida's Lusitanian bank account. The slip provides for disputes to be referred to arbitration in Singapore, but both parties have waived that clause. Almeida pays claims under the hull policy in Lusitania, and the insured vessels are registered there. Harbour says that, after the slip was signed, Almeida always sent its claims to Harbour by reference to Singapore law. Almeida has now claimed on the reinsurance. Harbour says that it may avoid the reinsurance for non-disclosure, which it may do under Singapore law but not Lusitanian law.<\/p><p>In June 2024, Harbour retroceded part of the risk to Polaris Re Ltd (Polaris), an Elbonian company, under a Retrocession Agreement which provides:<\/p><blockquote>8. Articles 1 to 5 (premium and accounting) are governed by Singapore law. Articles 6 to 12 (claims) are governed by Elbonian law.<br>9. This agreement shall be interpreted in accordance with the Principles of Reinsurance Contract Law, and not the law of any country.<br>10. Each party promises that it will not contend, in any court or tribunal, that any law other than the law chosen in Clause 8 applies to this agreement.<\/blockquote><p>A loss occurred in November 2024. By an endorsement dated 1 February 2025, Harbour and Polaris replaced Clause 8 with: \"This agreement is governed by Singapore law.\" Polaris then paid part of Harbour's claim. It now says that the whole of the Retrocession Agreement, including Clause 8 and the endorsement, was induced by Harbour's fraudulent understatement of the fleet's loss record, and it refuses to pay any more. In May 2026, Polaris sued Harbour in Ruritania, whose courts will apply Ruritanian law to all reinsurance disputes.<\/p><p>Separately, Almeida insures yachts in Singapore. Mr Goh, a Singapore resident and retired teacher, bought a policy for his yacht, moored at Sentosa, from Almeida's Singapore agent on Almeida's standard terms. The policy is expressly governed by Lusitanian law, a term which Almeida's general counsel introduced in all its Singapore consumer policies to avoid Singapore's Unfair Contract Terms Act. Clause 22 excludes Almeida's liability for negligent surveys. Almeida's surveyor negligently certified the yacht as seaworthy at Sentosa, and it sank in Singapore waters. Mr Goh is suing Almeida in contract and in the tort of negligence.<\/p><p>Advise: (1) Harbour on the law governing the reinsurance slip; (2) Harbour on the law or laws governing the Retrocession Agreement, Polaris's attack on it, and any remedy Harbour has for Polaris's Ruritanian action; and (3) Mr Goh on whether Almeida can rely on Clause 22 against each of his claims. Assume that the Singapore court will assume jurisdiction over all relevant parties.<\/p><p>You are given the following additional information:<\/p><ol><li>Under Lusitanian domestic law, a reinsurance slip which does not state its governing law is invalid.<\/li><li>The Principles of Reinsurance Contract Law are a non-binding set of rules drafted by a group of academics. They are not the law of any country.<\/li><li>Under Singapore and Elbonian domestic contract laws, a contract induced by fraud is voidable. Under Ruritanian law it is void. Under no relevant law is a choice of law clause itself affected by a fraud of the kind alleged.<\/li><li>Clause 22 is valid under Lusitanian law, and may be raised as a defence to a tort claim under all relevant laws. It is unenforceable under the Singapore Unfair Contract Terms Act as it does not satisfy the requirement of reasonableness.<\/li><li>Mr Goh's claim is for US$400,000. He can show no other reason why Lusitanian law was chosen.<\/li><\/ol>", "Mock Paper 7, Hypo 13": "<p>Mercury Digital Pte Ltd (Mercury) is a Singapore incorporated company which runs an over-the-counter digital asset trading desk from Singapore. In 2024, it entered into a Master Trading Agreement with Halcyon Ventures Ltd (Halcyon), a company incorporated in Yesouth. The agreement is expressly governed by Singapore law and provides:<\/p><blockquote>18. The courts of Singapore shall have non-exclusive jurisdiction over any dispute arising from this agreement.<br>19. Any process in connection with this agreement may be served by e-mail to legal@halcyon.example, wherever the recipient may be.<\/blockquote><p>Mr Idris founded Halcyon and controls it. He lived in Singapore as a permanent resident for 15 years, but has held on to his Xalarat citizenship and always told friends that he would retire to Xalarat. Until recently he traded through Bluewater Capital (Bluewater), a partnership which carries on business at an office in Raffles Place, with a Singapore resident as his partner.<\/p><p>In February 2026, Mercury transferred 12 million USDC, a stablecoin, to a wallet controlled by Mr Idris, on the strength of a false statement by Mr Idris, made over a video call to Mercury's dealers in Singapore, that Halcyon had delivered matching assets. Mr Idris then moved the coins to wallets held by Orbis Custody Ltd (Orbis) and Vega Holdings Inc (Vega). Orbis, a Buritanian company, was registered in Singapore until it ceased business here in 2024 and was deregistered. Vega is an Elbonian company with no connection to Singapore other than the coins. Both knew, or Mercury believes they knew, that the coins were stolen.<\/p><p>On 2 March 2026, Mercury learnt of the fraud. On 3 March, Mr Idris's lawyers told Mercury's lawyers that he was \"aware of your client's complaint\". On 4 March, Mr Idris flew out of Singapore. Mercury issued its originating claim on 6 March against Halcyon (breach of contract), Mr Idris (deceit), Bluewater (for Mr Idris's deceit), Orbis and Vega (knowing receipt, and restitution of the coins, or their traceable proceeds, held on constructive trust). No one knows where Mr Idris is now. His personal assistant in Singapore, who runs his property portfolio and pays his bills, remains in contact with him.<\/p><p>Mercury took the following steps and the defendants responded as follows:<\/p><ul><li>Mercury e-mailed the claim to Halcyon under Clause 19. Halcyon filed a defence on the merits and a counterclaim, and now argues that e-mail service was invalid without the court's approval.<\/li><li>Without obtaining approval to serve out, Mercury obtained an order for substituted service on Mr Idris by a message to his Telegram account and by leaving the claim with his personal assistant.<\/li><li>Mercury left the claim at Bluewater's office with a clerk.<\/li><li>Mercury applied without notice for approval to serve Orbis and Vega out of Singapore. Its affidavit did not mention that Orbis had already commenced proceedings in Buritania for a declaration that it owns the coins in its wallets. Approval was granted.<\/li><li>Orbis was served in Buritania. It filed a notice of intention to contest, then applied for a stay of the Singapore action on forum non conveniens grounds only. That application is pending.<\/li><li>Vega instructed Singapore solicitors, who confirmed that they would accept service. It then applied to set aside service for lack of nexus and, as a fall-back in the same summons, for a stay.<\/li><\/ul><p>Advise Mercury on whether the Singapore court has jurisdiction over each defendant and whether it will exercise that jurisdiction, and on whether it can restrain Orbis's proceedings in Buritania. Exclude any discussion of the SICC.<\/p><p>Assume the following:<\/p><ol><li>Singapore choice of law rules point towards Singapore law for the contract and deceit claims.<\/li><li>Most of the blockchain evidence is available online. Mercury's dealers are in Singapore, Orbis's staff are in Buritania and Vega's staff are in Elbonia.<\/li><li>Mercury wishes to enforce any Singapore judgment in Yesouth and Buritania, whose courts apply the same rules on foreign judgments as the Singapore common law.<\/li><li>Orbis maintains an account of its customers' wallets in Buritania. The USDC was held for Mercury's benefit in Singapore before it was transferred.<\/li><li>The Buritanian courts are competent and take about 18 months to hear a case.<\/li><\/ol>", "Mock Paper 7, Hypo 14": "<p>Sterling Maritime Pte Ltd (Sterling), a Singapore incorporated shipping company, is controlled by Mr Wee, a Singapore citizen and resident. Sterling and Mr Wee are involved in the following disputes before the Singapore court. In each dispute, assume that the Singapore court will assume jurisdiction.<\/p><p><strong>The Goldleaf loan.<\/strong> Goldleaf Finance Ltd (Goldleaf), a Charltonian company with no presence in Charltonia beyond its registered office, lends money in Singapore from a Singapore serviced office. It lent Mr Wee S$3 million at 48% interest a year. The loan agreement was signed in Singapore. It chooses Charltonian law, on the advice of Goldleaf's lawyers, so that Goldleaf would not need a Singapore moneylender's licence. Goldleaf is unlicensed. Mr Wee has defaulted.<\/p><p><strong>The Lusitanian casino.<\/strong> On a trip to Lusitania, Mr Wee obtained chips on credit from a licensed casino there, signing credit agreements expressly governed by Lusitanian law. He lost US$800,000. The casino has sued him in Singapore on the credit agreements.<\/p><p><strong>The Port Agreement.<\/strong> In 2025, Elbonian soldiers boarded Sterling's tanker, the <i>Grace<\/i>, in an Elbonian port, and held her crew at gunpoint. Mr Wee was told that the crew would remain in custody unless Sterling signed a Port Agreement with Elbonia Port Authority (EPA), a state-owned company. The agreement, which is governed by Elbonian law, requires Sterling to pay US$10 million and to waive all claims against EPA. Sterling signed and paid. Sterling now seeks to recover the money. EPA relies on the agreement.<\/p><p><strong>The Suburbian shipyard.<\/strong> In the same year, a Suburbian shipyard refused to finish repairs on Sterling's vessel unless Sterling agreed to pay 40% above the contract price, knowing that the vessel was about to begin a lucrative charter. Sterling agreed to a variation of the repair contract, which is governed by Suburbian law. It wishes to recover the extra sum.<\/p><p><strong>The <i>Hope<\/i>.<\/strong> In 2024, the government of Elbonia issued a decree confiscating without compensation all vessels in Elbonian waters owned by persons of Mr Wee's ethnic group. Sterling's tanker, the <i>Hope<\/i>, was seized in Elbonian waters, and the Elbonian government sold her to Kaspar Shipping Ltd (Kaspar), a Buritanian company which knew the circumstances. Kaspar took delivery in Elbonia and has since renamed the vessel. She recently called at Singapore. Sterling is suing Kaspar in Singapore for conversion.<\/p><p><strong>The Xalarat charter.<\/strong> In 2025, Sterling chartered a tanker to Dorado Trading Ltd (Dorado), a Buritanian company, to carry fuel to the coast of Xalarat. Xalarat law prohibits fuel imports above a set quota. Sterling and Dorado both knew this, and both intended that the fuel would be moved to small boats offshore at night so that it could be landed in Xalarat above the quota. Dorado has not paid the hire. The charterparty is expressly governed by Singapore law.<\/p><p><strong>The Suburbian agent.<\/strong> Sterling agreed to pay Mr Lim, a Singapore citizen who lives in Suburbia, a commission for securing berthing rights at a Suburbian port. Under the agency contract, which is governed by Suburbian law, Mr Lim paid \"facilitation fees\" to Suburbian port officials, which is lawful under Suburbian law. Sterling refuses to pay Mr Lim, and it also refuses to reimburse him for the fees.<\/p><p>Advise Sterling and Mr Wee.<\/p><p>You are given the following additional information:<\/p><ol><li>Section 14 of the Moneylenders Act 2008 provides that no contract for a loan by an unlicensed moneylender is enforceable. It is silent on its territorial reach. It is a conduct-regulating statute with criminal sanctions, and it protects borrowers in Singapore.<\/li><li>Section 5(2) of the Civil Law Act 1909 provides that no action shall be brought for recovering any sum alleged to be won upon any wager. The casino is not a licensed casino under the Singapore Casino Control Act.<\/li><li>Under Elbonian law, the Port Agreement is valid and binding, and duress is not recognised as a ground for setting aside a contract with a state entity.<\/li><li>Suburbian law has no doctrine of economic duress. Under Singapore law, the variation would be voidable for economic duress.<\/li><li>Under Elbonian law, the decree passed good title to the Elbonian government and then to Kaspar. Conversion of a vessel in those circumstances would be a tort under Singapore law.<\/li><li>Section 37 of the Prevention of Corruption Act 1960 extends the Act to acts by Singapore citizens outside Singapore. Mr Lim's payments would amount to corrupt payments under Singapore law if done in Singapore.<\/li><\/ol>", "Mock Paper 8, Hypo 15": "<p>Ocean Reefer Pte Ltd (Ocean Reefer) and Mei Foods Pte Ltd (Mei Foods) are Singapore incorporated seafood importers. In January 2025, each shipped chilled seafood from Suburbia to Singapore on the MV <i>Aster<\/i>, operated by Aster Line Ltd (Aster Line), a Suburbian incorporated company which has no presence in Singapore. On 12 January 2025, the <i>Aster<\/i> collided in Ruritanian waters with the MV <i>Boreas<\/i>, and all the cargo was lost.<\/p><p>The <i>Boreas<\/i> is owned by Dunmore Shipping Ltd (Dunmore), an Elbonian incorporated company. Dunmore is registered under the Singapore Companies Act and runs its crewing department from a Singapore office. It has no contract with Ocean Reefer or Mei Foods.<\/p><p>Each bill of lading, dated 2 January 2025 and expressly governed by Suburbian law, provides:<\/p><blockquote>25. Any claim against the Carrier under this bill of lading shall be brought exclusively in the courts of Suburbia.<\/blockquote><p>Ocean Reefer also has a Master Services Agreement with Aster Line dated 1 June 2024, expressly governed by Singapore law, under which Aster Line agreed to give Ocean Reefer priority space and to monitor its chilled cargo during every voyage. It provides:<\/p><blockquote>12. The Singapore courts shall have exclusive jurisdiction over all disputes arising out of or in connection with this agreement.<\/blockquote><p>Ocean Reefer says that the crew of the <i>Aster<\/i> failed to monitor the cargo before the collision and sailed too fast in fog. It has sued Dunmore in Singapore for negligence. It has also obtained approval to serve Aster Line in Suburbia with a Singapore claim for breach of the Master Services Agreement and of the bill of lading, and for negligence. Mei Foods has sued Dunmore in Singapore for negligence. Dunmore proposes to claim a contribution from Aster Line in those proceedings, and will need to serve Aster Line out of Singapore.<\/p><p>More than 50 other cargo owners have sued both shipowners in the Ruritanian Maritime Court. A test trial on liability for the collision has already taken place there over 30 days, and judgment is awaited. In order to protect its position, Ocean Reefer filed a claim against Dunmore in the Ruritanian Maritime Court in May 2025. Dunmore has argued that Ocean Reefer must elect between the two actions. In June 2026, on Dunmore's application, the Ruritanian court ruled that Ruritania is the natural forum for all claims arising from the collision.<\/p><p>Dunmore has applied for a stay of the Singapore actions in favour of Ruritania. Aster Line has applied to set aside service in favour of Suburbia. In July 2026, Dunmore commenced a limitation action in Yesouth, where one of its vessels happened to be calling. Yesouth has no other link with the collision, and its law would limit Dunmore's liability to a fraction of that available elsewhere.<\/p><p>Ocean Reefer's counsel wishes to argue that Singapore should replace <i>The Spiliada<\/i> with the Australian \"clearly inappropriate forum\" test, under which a stay would be unlikely.<\/p><p>Advise Ocean Reefer and Mei Foods on: (1) whether their claims will be heard in Singapore; and (2) whether Dunmore's action in Yesouth can be restrained. Exclude any discussion of the SICC.<\/p><p>Assume the following:<\/p><ol><li>Suburbia is a party to the Hague Convention on Choice of Court Agreements, which took legal effect there on 1 January 2019.<\/li><li>The negligence claims are governed, on any view, by Ruritanian law.<\/li><li>Ruritanian law has a one-year limitation period for all tort claims. Mei Foods did not file in Ruritania, and it issued its Singapore claim in March 2026. Singapore law has a three-year period for such claims.<\/li><li>Ruritanian Maritime Court proceedings are conducted in Ruritanian, and the court caps cargo claims at about one third of what Singapore law would allow.<\/li><li>The master and officers of the <i>Boreas<\/i> are Dunmore's employees. The officers of the <i>Aster<\/i> have left Aster Line's employment and now live in Ruritania. They will not travel to Singapore voluntarily.<\/li><li>Ocean Reefer has arrested another of Dunmore's vessels in Singapore and obtained security for its claim.<\/li><\/ol>", "Mock Paper 8, Hypo 16": "<p>Lumiere Holding AG (Lumiere AG), a Charltonian incorporated company, owns Lumiere Family Office Pte Ltd (Lumiere SG), a Singapore incorporated wealth manager. Konrad, a Charltonian citizen, is employed by Lumiere AG under a contract governed by Charltonian law, which provides:<\/p><blockquote>11. All claims arising from this employment shall be governed by Charltonian law.<br>12. The Employee shall not be liable for any loss caused by him unless it is caused by his gross negligence.<\/blockquote><p>In 2022, Lumiere AG seconded Konrad to Singapore for four years to run Lumiere SG. He signed no contract with Lumiere SG, but was appointed one of its directors, and he worked from its office in Singapore. During his secondment:<\/p><ul><li>(a) At meetings in Singapore, Konrad gave Lumiere SG's client list to Zenobia Wealth Ltd (Zenobia), a competitor incorporated in Yesouth. He and Zenobia's chief executive agreed in Singapore that he would steer clients to Zenobia and that they would share the fees. Lumiere SG lost clients worth US$4 million a year in Singapore.<\/li><li>(b) He caused a trust settled in Singapore by Mrs Chua, a Lumiere SG client, with Lumiere SG as trustee, to invest in a fund run by his friend, and took a secret commission of US$2 million for doing so. The trust deed is expressly governed by Singapore law. The commission was paid into his bank account in Xalarat, and he used it to buy an apartment in Elbonia.<\/li><li>(c) Through a clerical error by Lumiere SG's staff in Singapore, US$500,000 meant for another employee was paid into his bank account in Xalarat. He kept it.<\/li><li>(d) He says that, in a letter sent from Charltonia in 2023, Lumiere AG's chairman promised him that he would never be pursued for \"anything done in Singapore\", and that he relied on this letter.<\/li><\/ul><p>Lumiere SG discovered these matters in February 2024 but did not act, as it was negotiating with Konrad. It commenced an action in Singapore in June 2026 against Konrad for: (i) breach of fiduciary duty; (ii) breach of confidence; (iii) conspiracy (with Zenobia, who is also a defendant); (iv) the return of the US$500,000 as money paid by mistake; and (v) a declaration that the Elbonian apartment is held on constructive trust for Lumiere SG.<\/p><p>Konrad's defence, in which Zenobia joins so far as it can, is that:<\/p><ul><li>Charltonian law governs all of the claims because they all arise from his employment.<\/li><li>Clause 12 is a complete defence, as he was not grossly negligent, and Lumiere SG cannot avoid it by framing its claims in equity or in tort.<\/li><li>The claims are time-barred under Charltonian law, and in any event Lumiere SG delayed unreasonably.<\/li><li>A constructive trust is not available under Charltonian law, which has no law of trusts.<\/li><li>The chairman's letter bars the claims.<\/li><\/ul><p>Advise Lumiere SG on the law or laws that govern each of its claims, and on the merits of Konrad's defence. Assume that the Singapore court will assume jurisdiction over all relevant parties.<\/p><p>You are given the following additional information:<\/p><ol><li>Lumiere SG's claims would succeed under Singapore law if no defence applies.<\/li><li>Under Charltonian law, an employee owes duties only to his contractual employer, and an employee's liability for breach of those duties is a matter of contract. Charltonian law imposes liability for the misuse of confidential information only under its Unfair Competition Code, against a person who deals in the information for profit.<\/li><li>Under Charltonian law, a claim against an employee or former employee must be brought within two years of discovery. Under Singapore law, the claims in contract and tort are within time and there is no statutory period for the fiduciary claim.<\/li><li>Under Elbonian law, a constructive trust cannot be recognised over Elbonian land, but a court may order a person to transfer land he bought with another's money.<\/li><li>Under Xalarat law, a person who keeps money paid by mistake is liable to return it only if he knew of the mistake at the time. Konrad did know.<\/li><li>Under Charltonian law, the chairman's letter binds Lumiere AG but not Lumiere SG. Under Singapore law, it may give rise to a promissory estoppel in favour of Konrad against both.<\/li><li>Conspiracy to injure by unlawful means is a tort under Singapore law and under the law of Yesouth, but not under Charltonian law.<\/li><\/ol>", "Mock Paper 9, Hypo 17": "<p>Skylane Airways Pte Ltd (Skylane) is a Singapore incorporated airline. It has no assets or place of business in Freedonia. Aerovia Finance SA (Aerovia), a Freedonian incorporated company, leased three aircraft to Skylane. Each aircraft was leased under a separate lease dated 5 March 2022, expressly governed by Freedonian law and containing this clause:<\/p><blockquote>33. The Freedonian Commercial Court shall have exclusive jurisdiction over all disputes arising out of or in connection with this lease.<\/blockquote><p>Skylane fell into arrears in 2024. In February 2025, Aerovia sued Skylane in the Freedonian Commercial Court for rent due under the leases of Aircraft 1 and Aircraft 2. Skylane defended on the merits. In April 2025, the Commercial Court approved a settlement of the claim relating to Aircraft 2, under which Skylane agreed to pay US$4 million. Skylane has not paid.<\/p><p>In June 2025, against Skylane's timely objection, the Commercial Court transferred the Aircraft 1 claim to the Regional Court of Port Vel, also in Freedonia, to relieve congestion. The trial took place in Port Vel. Shortly before the trial, Aerovia's Freedonian lawyer bribed a court clerk to bring forward the hearing date by two days so that Skylane's expert witness could not attend. Skylane did not learn of the bribe until after the trial.<\/p><p>In January 2026, the Regional Court gave judgment on Aircraft 1 ordering Skylane to pay: (a) US$20 million in unpaid rent; (b) US$15 million as a statutory multiple of the rent, payable to Aerovia, for late return of the aircraft; and (c) to deliver up Aircraft 1 to Aerovia. Skylane has appealed. Under Freedonian law, the judgment is enforceable in Freedonia despite the appeal, but it may be reversed. The appeal will be heard in about 18 months.<\/p><p>Aircraft 1 is parked at Changi Airport. Aerovia has applied in Singapore under the Choice of Court Agreements Act to enforce the judgment and the settlement. It also relies on a Memorandum of Guidance between the Supreme Courts of Singapore and Freedonia on the mutual enforcement of money judgments. In the alternative, Aerovia has sued on the judgment at common law.<\/p><p>Aircraft 3 was grounded in Ruritania in 2024 when a Ruritanian maintenance company, Zephyr Aviation Ltd (Zephyr), asserted a lien over it for unpaid maintenance charges. Zephyr sued in Ruritania, Aerovia did not appear and Skylane did. In 2025, the Ruritanian court ordered Aircraft 3 to be sold, and declared that the buyer, Ostro Air, took title free of all other interests. Aerovia now says that Skylane still owes it rent on Aircraft 3, and that Ostro Air's title is bad, as under the Freedonian lease Aircraft 3 could never be sold without Aerovia's consent. Ostro Air has recently flown Aircraft 3 to Singapore.<\/p><p>In the Ruritanian action, Skylane argued and the Ruritanian court decided, as a necessary step in fixing Zephyr's lien, that the Aircraft 3 lease had been validly terminated by Skylane in December 2024 because Aerovia had failed to maintain the aircraft. Aerovia was notified of the action, but it chose not to take part.<\/p><p>Skylane has now started a claim in Singapore against Aerovia for fraudulent misrepresentation, alleging that Aerovia lied about the maintenance history of all three aircraft when the leases were signed. It knew of this allegation when it defended the Freedonian action, but decided not to raise it there. It also relies on a 2026 decision of the Freedonian Supreme Court, handed down after the Regional Court's judgment, which reverses the interpretation of the Freedonian Aviation Code on which the Regional Court relied in finding Skylane liable for rent.<\/p><p>Advise Skylane on: (1) the extent to which the Freedonian judgment and settlement will be recognised and enforced in Singapore; (2) the effect in Singapore of the Ruritanian judgment; and (3) whether it may pursue its new claim against Aerovia.<\/p><p>Assume the following:<\/p><ol><li>The Hague Convention on Choice of Court Agreements took legal effect in Freedonia on 1 January 2019. Ruritania is not a party to it, and neither Freedonia nor Ruritania is gazetted under the Reciprocal Enforcement of Foreign Judgments Act.<\/li><li>Aerovia's actual loss from the late return of Aircraft 1 was US$2 million.<\/li><li>The Regional Court of Port Vel is a competent Freedonian court, but it is not the Commercial Court.<\/li><li>An order to deliver up an aircraft is an available remedy under Singapore law.<\/li><li>Skylane's counterclaim for misrepresentation would have been permitted under Freedonian procedure.<\/li><li>Under Ruritanian law, an order of sale of this kind binds all persons with an interest in the aircraft, whether or not they were parties to the action.<\/li><\/ol>", "Mock Paper 9, Hypo 18": "<p>Verdant Agro Ltd (Verdant) is incorporated in Buritania, where it owns large plantations. In September 2025, contractors engaged by Verdant cleared land in Buritania by burning. For three weeks, the smoke drifted over Singapore. Marina Stay Pte Ltd (Marina), a Singapore hotel operator, lost a large number of bookings. It has sued Verdant in Singapore under section 6 of the Transboundary Haze Pollution Act 2014 and, in the alternative, in negligence and nuisance at common law.<\/p><p>GreenSeal Technologies Pte Ltd (GreenSeal), a Singapore incorporated company, developed an enzyme process that improves the yield of palm oil. It holds a registered patent for the process in Singapore and a separate registered patent in Buritania, but none in Suburbia. In 2021, GreenSeal and Verdant signed an agreement in Buritania, under which all the licensed activities were to take place at Verdant's Buritanian sites and all payments were to be made there. It provides:<\/p><blockquote>7. GreenSeal grants Verdant a licence to use the Process \"at all of Verdant's operations in the Region\".<br>15. All disputes arising out of or in connection with this agreement shall be governed by the law of the country in which the party commencing proceedings has its head office.<\/blockquote><p>\"Region\" is not defined. GreenSeal says that it meant Buritania only.<\/p><p>Verdant has used the process: (a) at its plantations in Buritania; (b) at its refinery in Suburbia; and (c) at a pilot plant in Singapore, run by Verdant from a rented laboratory for six months in 2025. It has also sold its oil in Singapore and Suburbia under the name \"GreenSeal Gold\", and consumers have believed that it is connected with GreenSeal, whose name is well known for its enzyme products in both countries.<\/p><p>GreenSeal has sued Verdant in Singapore for: (i) infringement of its Singapore patent, in respect of all three operations; (ii) infringement of its Buritanian patent, in respect of all three operations; (iii) passing off in Singapore and Suburbia, with an injunction restraining sales under the name in both countries.<\/p><p>Separately, during a palm oil conference in Singapore in 2025, Verdant's chauffeur negligently drove the company car into Mr Surya, a Buritanian agronomist employed by Verdant who was crossing the road outside the conference hotel. Both had flown in for the conference, and both live in Buritania. Mr Surya has sued Verdant in Singapore in negligence. Mr Surya's employment contract is governed by Buritanian law. Verdant says that the claim is really a Buritanian one and that Singapore's connection is an accident.<\/p><p>Marina's and GreenSeal's counsel also wish to argue, if necessary before the Court of Appeal, that the double actionability rule should be abolished because the lex fori limb is an anachronism.<\/p><p>Advise Marina, GreenSeal and Verdant on the claims, as appropriate. Assume that the Singapore court will assume jurisdiction over all relevant parties, and that any question of the validity of a foreign patent does not arise.<\/p><p>You are given the following additional information:<\/p><ol><li>Open burning for land clearance is lawful under Buritanian law, and Marina has no claim under Buritanian law on any basis.<\/li><li>Marina's economic loss would be recoverable in negligence under Singapore law, but only if a Singapore court finds that Verdant owed it a duty of care. The conduct required for liability under section 6 of the Act is satisfied on the facts.<\/li><li>Under Buritanian contract law, \"the Region\" means the whole of Southeast Asia. Under Singapore contract law, \"the Region\" in the agreement is too uncertain to have any effect.<\/li><li>Under Buritanian law, a licensee's use within the scope of its licence is a complete answer to any claim in tort.<\/li><li>Passing off is actionable under Singapore law. Suburbian law has no tort of passing off, but its Consumer Code gives a trader a civil claim for compensation and an injunction against the deceptive use of the trader's name. Neither party has yet pleaded or proved Suburbian law.<\/li><li>Floating choice of law clauses are valid under Buritanian, but not Singapore, conflict of laws rules.<\/li><li>Under Buritanian law, an employee cannot sue an employer in tort for an injury at work, but has a claim for no-fault compensation under a state scheme of about one fifth of the damages a Singapore court would award. Mr Surya's claim would otherwise succeed under Singapore law.<\/li><\/ol>", "Mock Paper 10, Hypo 19": "<p>Sunpath Energy Pte Ltd (Sunpath), a Singapore incorporated company, is building a solar farm in Ruritania through four contracts.<\/p><p>The Facility Agreement dated 1 April 2022 is between Sunpath and Nordbank AG (Nordbank), a Lusitanian bank with no presence in Singapore. It is expressly governed by Singapore law and provides:<\/p><blockquote>27. Each party agrees that the courts of Singapore have jurisdiction over any dispute under this agreement. Neither party will argue that any other forum is more appropriate. Nordbank may also sue Sunpath in any other court, and Sunpath submits to that court.<\/blockquote><p>The Construction Contract dated 1 July 2022 is between Sunpath and Helios Build Ltd (Helios), a Ruritanian company with no presence in Singapore. It provides:<\/p><blockquote>30. Disputes under this contract shall be governed by the law, and resolved in the courts, of the country which Sunpath nominates in writing once a dispute has arisen.<\/blockquote><p>The Parent Guarantee dated 1 July 2022 is between Sunpath and Bastion Holdings Ltd (Bastion), the Elbonian parent of Helios. It is expressly governed by Elbonian law and provides:<\/p><blockquote>8. Any dispute under this guarantee shall be resolved in the courts of Singapore or Elbonia.<\/blockquote><p>The Turbine Supply Agreement dated 1 September 2023 is between Sunpath and Aeolus Inc (Aeolus), a Utopian company with no presence in Singapore. It is expressly governed by Singapore law and provides:<\/p><blockquote>19. The parties shall first attempt to resolve any dispute by negotiation, then by mediation at the Singapore Mediation Centre. If the dispute is not resolved, the Singapore High Court shall have exclusive jurisdiction.<\/blockquote><p>The land for the solar farm was bought in the name of Mr Adi, a Ruritanian national, who holds it on trust for Sunpath under a nominee deed. The deed, dated 1 March 2022, is expressly governed by Ruritanian law and gives the courts of Ruritania exclusive jurisdiction. The Ruritanian courts do not recognise trusts.<\/p><p>In 2026, the project failed. Helios stopped work, claiming unpaid invoices. Sunpath says that the work was defective. It nominated Singapore under Clause 30. Helios denies that Clause 30 has any effect, and has sued Sunpath in Ruritania for the unpaid invoices. Sunpath has sued Helios and Bastion in the Singapore General Division.<\/p><p>Nordbank, without warning, filed for Sunpath's insolvency in Ruritania, where Sunpath has its project office. Aeolus, after one negotiating meeting and no mediation, sued Sunpath in Utopia for the price of turbines. It has also sued Sunpath's chief executive, Ms Rao, in Utopia in deceit, for statements she made when Sunpath signed the Turbine Supply Agreement, which Aeolus's lawyers have told it is a way of escaping Clause 19. Ms Rao, who is not a party to the agreement, lives in Singapore. Aeolus's price claim has reached an advanced stage, and Sunpath waited 11 months before objecting to it.<\/p><p>Mr Adi has now purported to sell the land to a local buyer. Sunpath has sued Mr Adi in Singapore for breach of trust. He has been served in Singapore while visiting his daughter, and applied for a stay under the Choice of Court Agreements Act.<\/p><p>Advise Sunpath on: (1) whether it can sue Helios, Bastion, Aeolus and Mr Adi in Singapore, and in which court; (2) whether it can restrain the foreign proceedings, including those brought against Ms Rao; and (3) what it may do if the Utopian court gives judgment against Sunpath before any order is made in Singapore. Nordbank's insolvency filing should also be considered.<\/p><p>Assume the following:<\/p><ol><li>The Hague Convention on Choice of Court Agreements took legal effect in Ruritania, Utopia and Elbonia on 1 January 2021. Lusitania is not a party to it.<\/li><li>Under Elbonian contract law, a clause in the form of Clause 8 of the Parent Guarantee is an exclusive choice of court agreement in favour of the two named courts.<\/li><li>Floating choice of law clauses are valid under Ruritanian but not Singapore conflict of laws rules.<\/li><li>Under Ruritanian law, Sunpath's beneficial interest in the land would not be recognised, so a Ruritanian court would dismiss its claim against Mr Adi.<\/li><li>Under Utopian law, a Singapore company's officers can be sued in deceit for statements made when contracting. The Utopian judgment, if any, would be a first instance money judgment.<\/li><li>Sunpath did not know that Aeolus's advanced-stage summary judgment application was being heard until a week before the hearing, but it did know of the Utopian action itself for 11 months.<\/li><li>All the construction records and witnesses are in Ruritania. The Ruritanian court takes about 4 years to decide a case.<\/li><li>Ms Rao's and Sunpath's witnesses on the turbine dealings are in Singapore, where the agreement was negotiated and signed.<\/li><\/ol>", "Mock Paper 10, Hypo 20": "<p>Acacia Foods Pte Ltd (Acacia), a Singapore incorporated company, makes chocolate at its factory in Utopia. Cacao Growers Ltd (Growers), a Ruritanian incorporated company, grows cocoa in Ruritania.<\/p><p>In January 2024, Acacia sent Growers a purchase order for 10,000 tonnes of organic cocoa beans to be shipped over two years from Ruritania to Acacia's factory in Utopia, with payment in US dollars into Growers' bank account in Suburbia. The purchase order states: \"This contract is governed by Singapore law.\" Growers replied with a sales confirmation on the same commercial terms, stating: \"In the event of a dispute, Ruritanian law governs if Growers commences the action and Singapore law governs if Acacia commences the action.\" Neither party responded further and shipments began. All the negotiations took place in Suburbia, where the parties' agents are based.<\/p><p>At a meeting in Suburbia before the purchase order was sent, Growers' sales director told Acacia's buyer that all Growers' beans were certified organic. The buyer e-mailed this to Acacia's board in Singapore, and the board approved the purchase there. The beans turned out to be uncertified. The purchase order contains a term, repeated in the sales confirmation, stating that the seller gives no warranty and accepts no liability for any statement about the origin of goods, whether in contract or tort.<\/p><p>To cut import duty, Acacia under-declared the value of the beans to the Utopian customs authorities on each shipment, which Growers knew but took no part in. Under-declaration is a crime under Utopian law. Acacia also obtained a tax refund in Utopia by a false return on an unrelated product line.<\/p><p>To obtain a Ruritanian export permit, Growers paid Mr Dao, a former Ruritanian minister, a fee to use his influence with the Trade Minister. Acacia knew about this and refunded half the fee to Growers under a side letter.<\/p><p>On 1 January 2025, the Ruritanian government banned all cocoa exports to Utopia, following a trade dispute. Growers stopped shipping at once and claims the price of beans already shipped, which Acacia has not paid. Acacia claims damages for non-delivery of the remaining beans and damages in the tort of misrepresentation for the uncertified beans. Acacia has sold organic chocolate to customers in Utopia, and it is facing large refund claims.<\/p><p>Advise Acacia on its liabilities to Growers and on its claims against Growers. Assume that the Singapore court will assume jurisdiction over all relevant parties.<\/p><p>How, if at all, would your answer change in the following alternative scenario: the Ruritanian ban had been announced in December 2023, before the purchase order was sent, to take effect on 1 January 2025, and both parties had planned for the last shipments to leave through a neighbouring country so as to avoid it?<\/p><p>You are given the following additional information:<\/p><ol><li>Under Singapore contract law, a contract is concluded on the terms of the last document sent. Under Ruritanian contract law, the first document prevails if the terms conflict. Under both laws, the contract is otherwise binding.<\/li><li>Floating choice of law clauses are valid under Ruritanian, but not Singapore, conflict of laws rules.<\/li><li>The statement about organic certification is actionable as a misrepresentation under Singapore and Suburbian domestic tort laws, but not under Ruritanian domestic tort law.<\/li><li>The liability exclusion term is valid under Ruritanian and Suburbian laws, but not under Singapore law, as it does not satisfy the requirement of reasonableness. It may be raised as a defence to a tort claim under all relevant laws.<\/li><li>The Ruritanian ban would frustrate the contract under Singapore and Suburbian contract laws. Under Ruritanian contract law, Growers would have to pay damages unless it had taken all steps to obtain an exemption, which it did not.<\/li><li>Contracts for the purchase of personal influence are against Ruritanian and Singapore public policies if the relevant acts are committed within the jurisdiction. Under Utopian and Suburbian laws, such contracts are valid wherever the relevant acts are committed.<\/li><li>Under Singapore law, neither the customs fraud nor the payment to Mr Dao is so closely connected to the contract as to prevent Growers or Acacia from enforcing it. Under Ruritanian law, both are.<\/li><li>A Singapore court would award damages about three times higher than a Suburbian or Ruritanian court for the same loss.<\/li><\/ol>"};
const PICK = 3;
const SIDES = {
  J: { name: "J side", exam: "Exam Q1", sub: "Jurisdiction to foreign judgments (J1–J7)" },
  C: { name: "C side", exam: "Exam Q2", sub: "Choice of law (C1–C3)" },
};
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const key = q => `law302-bfjc-${q.id}`;
const slug = q => q.id.toLowerCase().replace(".", "-");
const hkey = q => `${q.side}-${String(q.hyp).padStart(2, "0")}`;
function load(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function drop(k) { try { localStorage.removeItem(k); } catch (e) {} }
const how = () => $("#how").innerHTML;
const MSG = {
  BEST:  ["Best 3: well picked", "Best 3: you missed this one"],
  CLOSE: ["Close, but not top 3", "Close: fine to leave"],
  WRONG: ["Wrong block", "Rightly left out"],
};
const LABEL = { BEST: "BEST 3", CLOSE: "CLOSE", WRONG: "WRONG" };
const side = s => QS.filter(q => q.side === s);
const siblings = q => QS.filter(x => hkey(x) === hkey(q));
function hypos(s) {
  const out = [];
  side(s).forEach(q => { const last = out[out.length - 1]; if (last && last.key === hkey(q)) last.qs.push(q); else out.push({ key: hkey(q), qs: [q] }); });
  return out;
}
let filter = "";
try { filter = sessionStorage.getItem("law302-bfjc-filter") || ""; } catch (e) {}

function randomFrom(list) {
  const todo = list.filter(q => !load(key(q)));
  const pool = todo.length ? todo : list;
  return pool[Math.floor(Math.random() * pool.length)];
}

function home() {
  $("#prog").textContent = `${QS.length} questions`;
  const done = QS.filter(q => load(key(q)));
  const avg = done.length ? done.reduce((s, q) => s + load(key(q)).best, 0) / done.length : 0;
  const chips = [["", "Both sides"], ["J", "J only"], ["C", "C only"]].map(([f, t]) =>
    `<button class="chip${f === filter ? " on" : ""}" data-f="${f}">${t}</button>`).join("");
  const block = s => {
    const list = side(s), sd = SIDES[s], hs = hypos(s);
    const fin = list.filter(q => load(key(q))).length;
    const cards = hs.map(h => {
      const first = h.qs[0];
      const qchips = h.qs.map(q => {
        const r = load(key(q));
        return `<a class="qchip" href="#${slug(q)}" title="${q.id}${r ? ` · best ${r.best}/3` : ""}"><span class="dot${r ? ` s${r.best}` : ""}"></span>Q${q.n}</a>`;
      }).join("");
      return `<div class="hc"><div class="hh"><span class="hid">${h.key}</span><span class="ht">${first.title}</span></div>
        <span class="hs">${first.source} · ${h.qs.length} question${h.qs.length > 1 ? "s" : ""}</span><div class="qrow">${qchips}</div></div>`;
    }).join("");
    return `<section class="card side" aria-label="${sd.name}">
      <div class="side-h"><span class="tag">${s}</span><h2>${sd.name} · ${sd.exam}</h2><span class="sub">${sd.sub} · ${hs.length} hypos, ${list.length} questions · ${fin} done</span><span class="sp"></span>
        <button class="btn ghost rand" data-s="${s}">Random ${s} question</button></div>
      <div class="hgrid">${cards}</div></section>`;
  };
  app.innerHTML = `<h1>Which pre-write blocks would you open first?</h1>
    <p class="lead">${QS.length} questions, sorted only into J and C, so a label never tells you which file holds the answer. The 20 mock finals are each split into two to four questions, one call at a time; the last eight hypos come from the first Block Finder. Each question shows seven pre-write blocks already filled in for its facts. Pick the three that decide the outcome, then check.</p>
    ${how()}
    <section class="card">
      <div class="stats"><span class="big">${done.length} of ${QS.length} done</span>${done.length ? `<span>average best ${avg.toFixed(1)} / 3</span>` : ""}
        <button class="btn" id="mix">Random question</button>
        ${done.length ? `<button class="linkbtn" id="reset">Clear my scores</button>` : ""}</div>
      <div class="chips">${chips}</div>
      <div class="legendrow"><span class="qchip"><span class="dot"></span>Q1</span> not tried <span class="qchip"><span class="dot s3"></span>Q1</span> 3 / 3 <span class="qchip"><span class="dot s2"></span>Q1</span> 1–2 / 3 <span class="qchip"><span class="dot s0"></span>Q1</span> 0 / 3</div>
    </section>
    ${filter !== "C" ? block("J") : ""}
    ${filter !== "J" ? block("C") : ""}
    <p class="foot">Mock facts and mock answers, traced to your pre-writes and the mock answer frameworks; not from Prof Chong. Scores stay in this browser only.</p>`;
  app.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    filter = b.dataset.f; try { sessionStorage.setItem("law302-bfjc-filter", filter); } catch (e) {} home();
  });
  app.querySelectorAll(".rand").forEach(b => b.onclick = () => { location.hash = slug(randomFrom(side(b.dataset.s))); });
  $("#mix").onclick = () => { location.hash = slug(randomFrom(filter ? side(filter) : QS)); };
  const reset = $("#reset");
  if (reset) reset.onclick = () => {
    if (reset.dataset.armed) { QS.forEach(q => drop(key(q))); home(); return; }
    reset.dataset.armed = "1"; reset.textContent = "Tap again to clear all scores";
  };
}

function question(q) {
  const list = side(q.side), i = list.indexOf(q), prev = list[i - 1], next = list[i + 1], sd = SIDES[q.side];
  const sib = siblings(q);
  $("#prog").textContent = `0 / ${PICK} picked`;
  const tabs = sib.length > 1 ? `<nav class="tabs" aria-label="Questions on this hypo">${sib.map(x => {
    const r = load(key(x));
    return `<a href="#${slug(x)}" class="${x === q ? "on" : ""}"${x === q ? ' aria-current="page"' : ""}>Q${x.n}${r ? ` · ${r.best}/3` : ""}</a>`;
  }).join("")}</nav>` : "";
  const full = q.full && FULL[q.full] ? `<details class="full"><summary>Read the full hypo (${q.full})</summary><div class="card">${FULL[q.full]}</div></details>` : "";
  app.innerHTML = `<h1>${q.id} · ${q.title}</h1>
    <div class="meta">${sd.name} · ${sd.exam} · ${q.source} · question ${q.n} of ${sib.length} on this hypo</div>
    ${tabs}
    <section class="card qcard" aria-label="The facts for this question">${q.q}</section>
    ${full}
    ${how()}
    <section class="card">
      <h2>Which three blocks would you open first?</h2>
      <p class="hint">Each option is a pre-write block filled in for this question. Most could earn a line; pick the three that decide the outcome. Keys: 1 to 7 pick, Enter checks.</p>
      <p class="legend"><mark class="same">unchanged from the pre-write</mark> <mark class="new">changed for this hypo</mark> <span class="gap">…</span> left out</p>
      <div class="opts" id="opts"></div>
      <div class="checkrow">
        <button class="btn" id="check" disabled>Check</button>
        <button class="btn ghost" id="retry" hidden>Try again</button>
        <span class="count" id="count">Pick 3</span>
