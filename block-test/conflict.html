n refusing them. At worst, sever and enforce the compensatory third.<\/p>\n<p><strong>ASI ignored: J7.2.4.<\/strong> A judgment obtained in breach of a Singapore ASI is contrary to public policy (<i>Nimbus<\/i>), so a granted and ignored ASI strengthens the defence.<\/p>\n<p><strong>Trap to avoid.<\/strong> Doing nothing is not submission, so the previous management's inaction does not give Utopia jurisdiction, though it does hurt the ASI application.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Bright Harvest was neither present in Utopia nor submitted to its court, so a Utopian treble damages judgment would not be enforceable in Singapore; if that failed, the punitive two thirds may be refused as penal, leaving the compensatory third, and if Agrimax obtained the judgment in breach of a Singapore anti-suit injunction, enforcement would also be contrary to public policy.<\/blockquote>", "items": [{"letter": "A", "code": "J7.2.4", "title": "Breach of a Singapore ASI", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Nimbus<\/i> and C&amp;Y,<\/mark> <mark class=\"new\">the Utopian judgment<\/mark> <mark class=\"same\">obtained in breach of<\/mark> <mark class=\"new\">a Singapore ASI against Agrimax<\/mark> <mark class=\"same\">is contrary to public policy (J6).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So an ASI, if granted and ignored, gives Bright Harvest a further defence.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "J7.1.2.4", "title": "Submission by Conduct", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Nimbus<\/i>,<\/mark> <mark class=\"new\">Bright Harvest<\/mark> <mark class=\"same\">submitted only by a step that necessarily waived its objection to<\/mark> <mark class=\"new\">the Utopian court<\/mark><mark class=\"same\">'s jurisdiction<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Doing nothing is not submission, however unwise.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Confirms that inaction is not submission: only a step that necessarily waives the objection counts (<i>Nimbus<\/i>). Part of the jurisdiction answer."}, {"letter": "C", "code": "J7.2.5", "title": "Punitive Damages to a Private Party", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">(+) Per C&amp;Y, refusing<\/mark> <mark class=\"new\">the Utopian treble award<\/mark> <mark class=\"same\">would be anomalous when Singapore awards punitive damages in tort (<i>ACB v Thomson Medical<\/i>). (−) But the point is uncertain, <i>Licea<\/i> leaving open<\/mark> <mark class=\"new\">US RICO treble damages, a close analogue<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Licea<\/i>, where<\/mark> <mark class=\"new\">the Utopian judgment<\/mark> <mark class=\"same\">awards<\/mark> <mark class=\"new\">the compensatory third<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">the punitive two thirds<\/mark><mark class=\"same\">,<\/mark> <mark class=\"new\">Agrimax<\/mark> <mark class=\"same\">enforces the unobjectionable part if clearly identifiable and separable<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "J6.0.2", "title": "If the ASI Is Ignored", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Breach is contempt, so the ASI bites only if<\/mark> <mark class=\"new\">Agrimax<\/mark> <mark class=\"same\">has<\/mark> <mark class=\"new\">assets or a presence<\/mark> <mark class=\"same\">here (SNIA; C&amp;Y).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Agrimax has closed its Singapore branch, so the practical sting is the recognition defence.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Contempt bites only where the respondent has assets or a presence here. Useful context; J7.2.4 is the block that answers the question."}, {"letter": "E", "code": "J7.4.1", "title": "REFJA Analogues", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 4(5), only<\/mark> <mark class=\"new\">one third<\/mark> <mark class=\"same\">of<\/mark> <mark class=\"new\">the treble damages<\/mark> <mark class=\"same\">is registered; compare <i>Licea<\/i> at<\/mark> <mark class=\"new\">the common law<\/mark> <mark class=\"same\">(J7.2.5).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Agrimax can register the compensatory third.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "REFJA applies only to gazetted countries, and Utopia is not one. It is also not examinable; the common law penal rule and <i>Licea<\/i> do the work."}, {"letter": "F", "code": "J7.1.2", "title": "International Jurisdiction", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Agrimax<\/mark> <mark class=\"same\">must prove that<\/mark> <mark class=\"new\">Bright Harvest<\/mark> <mark class=\"same\">was present in<\/mark> <mark class=\"new\">Utopia<\/mark> <mark class=\"same\">(J7.1.2.1–J7.1.2.3) or submitted to<\/mark> <mark class=\"new\">the Utopian court<\/mark> <mark class=\"same\">(J7.1.2.4–J7.1.2.5).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, the test is Singapore's conflict rules, narrower than Singapore's own bases, with no mirror image. So<\/mark> <mark class=\"new\">Utopia's service-out jurisdiction<\/mark> <mark class=\"same\">does not count<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">No office in Utopia and no step taken there: no presence and no submission.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "J7.1.1", "title": "Default Judgment on the Merits", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y,<\/mark> <mark class=\"new\">a Utopian default judgment<\/mark> <mark class=\"same\">is on the merits although<\/mark> <mark class=\"new\">Bright Harvest<\/mark> <mark class=\"same\">did not appear and<\/mark> <mark class=\"new\">the Utopian court<\/mark> <mark class=\"same\">may not have considered<\/mark> <mark class=\"new\">its evidence<\/mark><mark class=\"same\">; non-participation goes only to fraud (J7.2.2) or natural justice (J7.2.3).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So the merits requirement would be met.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "A default judgment is on the merits, so that requirement is met. One line before jurisdiction defeats it."}]}, {"id": "J-06.1", "side": "J", "hyp": 6, "n": 1, "source": "Mock Paper 6, Hypo 11", "title": "Stratus v Hyperion", "full": "Mock Paper 6, Hypo 11", "q": "<p>Stratus Pte Ltd owns a data centre in Jurong. It has two contracts with Hyperion AG, a Charltonian company, both expressly governed by Singapore law:<\/p><ol><li>A Joint Venture Agreement dated 1 March 2016: \"The parties submit to the non-exclusive jurisdiction of the Singapore High Court.\"<\/li><li>An Operations Agreement dated 1 February 2023: \"The General Division of the High Court of Singapore, excluding the Singapore International Commercial Court, shall have exclusive jurisdiction over all disputes arising out of this agreement.\"<\/li><\/ol><p>In January 2026, fire destroyed much of the data centre. Stratus blames Hyperion's operating procedures, among other causes, and wants a single SICC trial of its claims against several parties; its claim against the engineering contractor is already properly before the SICC. Hyperion, served in Charltonia, says that it did not agree to the SICC under either contract and refuses to consent to any transfer. The Hague Convention on Choice of Court Agreements has been in force in Charltonia since 1 January 2020. Advise Stratus whether its claims against Hyperion under each agreement can be heard in the SICC.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Two clauses with the same counterparty, and two different routes into the SICC. Dates and wording decide, and Hyperion's refusal matters for one contract but not the other.<\/p>\n<p><strong>Primary jurisdiction: J5.2.3.<\/strong> The JVA clause predates 1 October 2016, so it does not of itself submit to the SICC. The Operations Agreement expressly excludes the SICC. Neither gives the SICC primary jurisdiction.<\/p>\n<p><strong>JVA, transfer: J5.4.1.<\/strong> Not a CCAA case (the clause is non-exclusive), so the General Division may transfer on the \"more appropriate\" test without every party's consent. A multi-party fire already before the SICC gives good prospects.<\/p>\n<p><strong>Operations Agreement, transfer: J5.4.2.<\/strong> A CCAA case, so transfer needs every party's consent, and deemed consent fails because the clause names the General Division and excludes the SICC. Hyperion refuses, so that claim stays in the General Division.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not treat both contracts alike. \"Never agreed to the SICC\" defeats the Operations Agreement transfer but not the JVA one.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Neither clause gives the SICC primary jurisdiction, the JVA clause because it predates 1 October 2016 and the Operations Agreement because it excludes the SICC; the JVA claim can still be transferred on the \"more appropriate\" test without Hyperion's consent, but the Operations Agreement claim is a CCAA case needing every party's consent, so it stays in the General Division.<\/blockquote>", "items": [{"letter": "A", "code": "J5.2.3", "title": "Pre-2016 Clause; Contrary Intention", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per O 2 r 2(2),<\/mark> <mark class=\"new\">the JVA clause, of 1 March 2016,<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">before 1 October 2016, \"does not of itself\" submit to the SICC. Per Chong (sample-final answer scheme), there is no primary jurisdiction, so<\/mark> <mark class=\"new\">Stratus<\/mark> <mark class=\"same\">sues in the General Division and seeks<\/mark> <mark class=\"new\">a transfer<\/mark> <mark class=\"same\">(J5.4).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per O 2 r 2(1) and s 2(2)–(3) CCAA, it includes the SICC unless<\/mark> <mark class=\"new\">\"excluding the SICC\" says otherwise, as in the Operations Agreement.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "J3.2", "title": "Singapore Clause, Defendant Abroad", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">In principle,<\/mark> <mark class=\"new\">Stratus<\/mark> <mark class=\"same\">must still make out all three requirements against<\/mark> <mark class=\"new\">Hyperion<\/mark><mark class=\"same\">, even inter partes.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Forum: need not be proved. If<\/mark> <mark class=\"new\">Hyperion<\/mark> <mark class=\"same\">contests it, that breaches its promise, so per <i>Shanghai Turbo (CA)<\/i><\/mark> <mark class=\"new\">Hyperion<\/mark> <mark class=\"same\">bears strong cause (J4.3)<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">(the JVA clause)<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">For the Operations Agreement, seek approval on the \"has the jurisdiction\" ground (J1.3).<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Hyperion was served in Charltonia, so the General Division claims need service out, and under the JVA clause Hyperion bears strong cause. Needed before any transfer, but not where the SICC question is decided."}, {"letter": "C", "code": "J1.3", "title": "Must Hear; Discretionary Transfer", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">The Operations Agreement clause<\/mark> <mark class=\"same\">designates<\/mark> <mark class=\"new\">the General Division<\/mark> <mark class=\"same\">and the CCAA applies (J1.2). Per s 11(1),<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">must not decline unless<\/mark> <mark class=\"new\">the clause<\/mark> <mark class=\"same\">is null and void under Singapore law, including its choice of law rules.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">But per s 11(5), on a discretionary transfer of<\/mark> <mark class=\"new\">the claim<\/mark> <mark class=\"same\">to<\/mark> <mark class=\"new\">the SICC<\/mark><mark class=\"same\">, the court must take the parties' choice into account; otherwise, per art 8(5) HCCCA,<\/mark> <mark class=\"new\">the Charltonian court<\/mark> <mark class=\"same\">may refuse recognition against<\/mark> <mark class=\"new\">Hyperion<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Correct for the Operations Agreement: under s 11 the General Division must hear it, and the art 8(5) risk explains why consent matters. But it does not decide the SICC question."}, {"letter": "D", "code": "J4.4", "title": "The SICC Factor", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Stratus<\/mark> <mark class=\"same\">resists<\/mark> <mark class=\"new\">Hyperion's objection<\/mark> <mark class=\"same\">by pointing to possible transfer to the SICC. Per <i>Rappo<\/i>, the court must not \"shut its eyes\" to<\/mark> <mark class=\"new\">international judges<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>IM Skaugen<\/i>,<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">alone it cannot displace<\/mark> <mark class=\"new\">Charltonia<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">so the SICC factor is Stratus's way in.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The SICC factor is a Spiliada point for a stay or forum conveniens. Hyperion seeks no Spiliada stay, and neither contract is decided by forum balancing."}, {"letter": "E", "code": "J5.4.2", "title": "Every Party's Consent; SICC Excluded", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently, the CCAA applies and<\/mark> <mark class=\"new\">the Operations Agreement clause<\/mark> <mark class=\"same\">names<\/mark> <mark class=\"new\">the General Division<\/mark><mark class=\"same\">. Per O 2 r 4(4), transfer also needs every party's consent.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">the clause<\/mark> <mark class=\"same\">names<\/mark> <mark class=\"new\">the General Division<\/mark> <mark class=\"same\">\"excluding the SICC\". Per O 2 r 5(1), transfer may be conditional on every party varying<\/mark> <mark class=\"new\">the clause<\/mark> <mark class=\"same\">to name the SICC.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Deemed consent (O 2 r 4(7)) fails as the clause does not name the SICC, and Hyperion refuses.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "J5.4.1", "title": "Non-CCAA Case", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per O 2 r 4(1), it may transfer if (a)<\/mark> <mark class=\"new\">the JVA claim<\/mark> <mark class=\"same\">is international and commercial when the order is made; (b) no prerogative relief is sought; and (c) the SICC is more appropriate.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, as the General Division may transfer without every party's consent, it should lean towards transfer where<\/mark> <mark class=\"new\">most<\/mark> <mark class=\"same\">parties consent<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">Hyperion's refusal does not block it.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">One fire and a pending SICC action point to the SICC.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "J5.5", "title": "Transfer From the SICC to the General Division", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per O 2 r 5(2), where the CCAA applies and<\/mark> <mark class=\"new\">the clause<\/mark> <mark class=\"same\">names only the SICC, transfer may be conditional on every party varying<\/mark> <mark class=\"new\">the clause<\/mark> <mark class=\"same\">to name the General Division (C&amp;Y).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Deemed consent applies where<\/mark> <mark class=\"new\">the Operations Agreement clause<\/mark> <mark class=\"same\">names the receiving court (O 2 r 4(7)).<\/mark> <mark class=\"new\">So Hyperion is treated as consenting.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The wrong direction. This block moves cases out of the SICC; Stratus wants the reverse, and deemed consent needs a clause naming the SICC."}]}, {"id": "J-06.2", "side": "J", "hyp": 6, "n": 2, "source": "Mock Paper 6, Hypo 11", "title": "Stratus v Titanus, Volta and Lim Bros", "full": "Mock Paper 6, Hypo 11", "q": "<p>Stratus Pte Ltd owns a data centre in Jurong, much of which was destroyed by fire in January 2026. It wants a single SICC trial of claims including these:<\/p><ul><li>Against Titanus SA, a Buritanian company, for breach of an Engineering Contract dated 1 June 2021 and expressly governed by Buritanian law: \"The Singapore International Commercial Court shall have jurisdiction over any dispute under this contract, without prejudice to the right of either party to sue in any other court.\" Titanus says the SICC should decline because the design work was done in Buritania, all its witnesses are there and Buritanian law governs.<\/li><li>Against Volta Ltd, a Suburbian company, which supplied the cooling units under a subcontract with Titanus to which Stratus is not a party, for negligence. Volta says it never agreed to Singapore litigation of any kind. Singapore choice of law rules point to Singapore law for this claim, and the claim against Titanus will turn largely on the same expert evidence.<\/li><li>Against Lim Bros Pte Ltd, a Singapore family company operating only in Singapore, for S$60,000 under a Cleaning Contract which provides: \"Any dispute shall be heard by the Singapore International Commercial Court.\" Lim Bros says this is a small local dispute which has no business in the SICC.<\/li><\/ul><p>The Hague Convention on Choice of Court Agreements is not in force in Buritania or Suburbia. Buritanian law is written in Buritanian, and one of the SICC's International Judges is a retired Buritanian judge. Advise Stratus whether these three claims can be heard together in the SICC.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Three defendants and three different routes: an SICC clause that is non-exclusive, a non-party, and a clause that names the SICC for a purely local dispute.<\/p>\n<p><strong>Titanus: J5.3.<\/strong> The clause is a written SICC agreement, so the SICC may not decline because the case is connected to Buritania (O 2 r 3(3)). The 2021 Rules treat exclusive and non-exclusive clauses alike, and the fire is in Singapore.<\/p>\n<p><strong>Volta: J5.6.<\/strong> Joinder needs no agreement, and the claims are connected through the same expert evidence. Volta can resist under O 2 r 3(2), and the foreign-connections bar does not protect it, but the fire in Singapore and Singapore law answer that.<\/p>\n<p><strong>Lim Bros: J5.1.1.<\/strong> Both parties are in Singapore and all performance was here, so the presumption that the claim is international can be rebutted, and the SICC may decline a S$60,000 local dispute. The better route is joinder, since the action as a whole stays international.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not run the General Division's <i>Spiliada<\/i> analysis in the SICC. Under a written SICC agreement, O 2 r 3 is the test, and foreign connections alone count for nothing.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The SICC cannot decline the Titanus claim merely because it is connected to Buritania, as the clause is a written SICC agreement; Volta, though it agreed to nothing, can be joined because the expert issues overlap and the fire was in Singapore; and Lim Bros's purely local claim is best brought in by joinder to the international action rather than on its own SICC clause.<\/blockquote>", "items": [{"letter": "A", "code": "J5.2.5", "title": "If the SICC Lacks Jurisdiction", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per O 2 r 3(5), if the SICC lacks jurisdiction over<\/mark> <mark class=\"new\">the Lim Bros claim<\/mark><mark class=\"same\">, it must transfer<\/mark> <mark class=\"new\">the case<\/mark> <mark class=\"same\">to the General Division if that court has jurisdiction and<\/mark> <mark class=\"new\">all parties<\/mark> <mark class=\"same\">consent; otherwise it may dismiss, stay or make any order.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per O 2 r 3(6),<\/mark> <mark class=\"new\">a \"High Court\" or \"General Division\" clause<\/mark> <mark class=\"same\">counts as each party's consent<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">but an SICC-only clause gives no deemed consent.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Explains the risk on Lim Bros: if the SICC declines, transfer to the General Division needs consent, and an SICC-only clause gives none. Joinder avoids the problem."}, {"letter": "B", "code": "J5.2.2", "title": "Exclusive or Not? (s 18F)", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 18F(1), absent express contrary words in<\/mark> <mark class=\"new\">the Engineering Contract clause<\/mark> <mark class=\"same\">(s 18F(2)),<\/mark> <mark class=\"new\">Stratus and Titanus<\/mark> <mark class=\"same\">are taken to have agreed (a) to submit exclusively to the SICC<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">\"Without prejudice to the right of either party to sue in any other court\" is express contrary wording, so the clause is non-exclusive.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The \"without prejudice\" words displace s 18F, so the Titanus clause is non-exclusive. True, but it matters little for exercise, because O 2 r 3 treats both kinds alike."}, {"letter": "C", "code": "J1.2.1", "title": "Rebutting the Deeming Rule", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">The Engineering Contract clause<\/mark> <mark class=\"same\">allows suit<\/mark> <mark class=\"new\">\"in any other court\"<\/mark><mark class=\"same\">, so s 3(2) is displaced and<\/mark> <mark class=\"new\">the CCAA<\/mark> <mark class=\"same\">does not apply.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Buritania is not a Contracting State in any case.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Confirms the Titanus clause is outside the CCAA, so s 11 does not apply. One line."}, {"letter": "D", "code": "J5.3", "title": "Foreign Connections Irrelevant", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per O 2 r 3(3), as there is<\/mark> <mark class=\"new\">the Engineering Contract clause, a written jurisdiction agreement<\/mark><mark class=\"same\">, the SICC must not decline \"solely on the ground that the action <span class=\"gap\">…<\/span> is connected to a jurisdiction other than Singapore\".<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, the old O 110 r 8 \"appropriateness\" wording left room to treat an NEJC differently; the 2021 Rules close that gap<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">so the \"without prejudice\" wording does not help Titanus.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "J5.1.1", "title": "Rebutting the Presumption", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Lim Bros<\/mark> <mark class=\"same\">rebuts the presumption:<\/mark> <mark class=\"new\">both parties trade only in Singapore, and all obligations were performed here<\/mark><mark class=\"same\">. Even where the parties agreed<\/mark> <mark class=\"new\">the claim<\/mark> <mark class=\"same\">into scope (O 2 r 1(3)(a)(ii), (b)(iii)), per C&amp;Y the SICC may decline it as contrary to its character (O 2 r 3(2)) (J5.3).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The better route is to join Lim Bros to the international action as a whole (s 18D(3)).<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "J4.4", "title": "The SICC Factor", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>IM Skaugen<\/i>,<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">alone it cannot displace<\/mark> <mark class=\"new\">Buritania<\/mark><mark class=\"same\">, which \"would virtually always\" be the forum.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>IM Skaugen<\/i>, it discounts the weight of<\/mark> <mark class=\"new\">Buritanian law<\/mark><mark class=\"same\">, depending on similarity to Singapore law and complexity.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">So Titanus's Buritanian connections still point away from Singapore.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "That is a factor in the General Division's <i>Spiliada<\/i> analysis. The claims here are in the SICC under written agreements, where O 2 r 3 applies instead."}, {"letter": "G", "code": "J5.6", "title": "Joinder; Non-Party Resists", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per O 10 r 6(1), joining<\/mark> <mark class=\"new\">Volta<\/mark> <mark class=\"same\">is appropriate \"so that the Court can resolve all the matters in dispute in the proceedings or any issues that are connected to those matters\".<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Volta<\/mark> <mark class=\"same\">seeks a stay under O 2 r 3(2). Per the slides, O 2 r 3(3) (the foreign-connections bar) protects only parties to<\/mark> <mark class=\"new\">a written SICC agreement<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "J-06.3", "side": "J", "hyp": 6, "n": 3, "source": "Mock Paper 6, Hypo 11", "title": "Stratus v Titanus and Hyperion", "full": "Mock Paper 6, Hypo 11", "q": "<p>Stratus Pte Ltd, a Singapore company, sued Titanus SA, a Buritanian company, in the SICC in May 2026, under an Engineering Contract which provides: \"The Singapore International Commercial Court shall have jurisdiction over any dispute under this contract, without prejudice to the right of either party to sue in any other court.\" In April 2026, Titanus had already sued Stratus in Buritania for a declaration of non-liability, and a hearing there is fixed for February 2027. Stratus has real claims, and the data centre, the fire and the fire investigators are all in Singapore. Titanus's Buritanian action will not finish before the SICC action. Stratus applies for an injunction restraining Titanus from continuing in Buritania.<\/p><p>Separately, Stratus has a claim against Hyperion AG, a Charltonian company, under an Operations Agreement which gives \"the General Division of the High Court of Singapore, excluding the Singapore International Commercial Court\" exclusive jurisdiction. Suppose that, despite Hyperion's timely objection, that claim were transferred to and decided by the SICC. The Hague Convention on Choice of Court Agreements has been in force in Charltonia since 1 January 2020; Buritania is not a party.<\/p><p>Advise Stratus on whether the injunction will be granted, and on what difficulties it might face in enforcing an SICC judgment against Hyperion in Charltonia.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> An injunction under a clause that expressly allows suits elsewhere, and a judgment that a foreign court may refuse because the case reached the SICC over an objection.<\/p>\n<p><strong>The clause: J6.3.1.3.<\/strong> A non-exclusive SICC clause means the parties accepted suits elsewhere, and C&amp;Y say the SICC should refrain where the foreign action came first, as Titanus's did. Stratus is left with vexation.<\/p>\n<p><strong>Vexation: J6.3.2.<\/strong> Parallel proceedings alone are not enough, especially under a non-exclusive clause. The Buritanian action will not finish first, so there is no race to judgment. The injunction will be refused.<\/p>\n<p><strong>Charltonia: J7.5.4.<\/strong> A discretionary transfer over a timely objection lets the recognising court refuse (art 8(5), mirrored in s 15(4)). The clause also excludes the SICC, so Hyperion will say no chosen court gave judgment.<\/p>\n<p><strong>Trap to avoid.<\/strong> \"Without prejudice to the right of either party to sue in any other court\" means there is no breach. Do not run a contractual ASI.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The Engineering Contract clause expressly permits suits elsewhere and Titanus sued first, so there is no breach and only vexation is left, which parallel proceedings alone cannot supply, especially when the Buritanian action will not finish first; an SICC judgment against Hyperion after a transfer it objected to risks refusal in Charltonia under the art 8(5) equivalent of s 15(4), which is why the transfer needs every party's consent in the first place.<\/blockquote>", "items": [{"letter": "A", "code": "J7.5.4", "title": "Objected Transfer", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 15(4), where<\/mark> <mark class=\"new\">the General Division<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">exercised a discretion to transfer to<\/mark> <mark class=\"new\">the SICC<\/mark> <mark class=\"same\">over<\/mark> <mark class=\"new\">Hyperion<\/mark><mark class=\"same\">'s timely objection, the court may refuse<\/mark> <mark class=\"new\">the SICC judgment<\/mark> <mark class=\"same\">against<\/mark> <mark class=\"new\">Hyperion<\/mark> <mark class=\"new\">(Charltonia's art 8(5) equivalent applies the same rule)<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The clause also excludes the SICC, so Hyperion will say that no chosen court gave judgment.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "J6.3.1.5", "title": "Early Stage", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">the Buritanian action is<\/mark> <mark class=\"same\">at an early stage, with only<\/mark> <mark class=\"new\">a hearing fixed for February 2027<\/mark><mark class=\"same\">, which points to the ASI (<i>Baker v BCS<\/i> (SICC); C&amp;Y).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Early stage helps on comity, but there is still no breach or vexation to found the ASI.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The Buritanian action is at an early stage, which would help on comity. It cannot supply the breach or vexation the ASI needs."}, {"letter": "C", "code": "J6.3.1.3", "title": "Non-Exclusive SICC Clause", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">the Engineering Contract clause<\/mark> <mark class=\"same\">is non-exclusive, so the parties implicitly accepted suits elsewhere. Per C&amp;Y, the SICC should refrain where<\/mark> <mark class=\"new\">the Buritanian action<\/mark> <mark class=\"same\">began before<\/mark> <mark class=\"new\">the SICC proceedings, in April 2026<\/mark><mark class=\"same\">;<\/mark> <mark class=\"new\">Stratus<\/mark> <mark class=\"same\">will likely rely on vexation (J6.3.2).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The Buritanian suit came first, a month before Stratus filed.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "J6.2.1", "title": "SICC Clause Supplies the Connection", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">the Engineering Contract clause<\/mark> <mark class=\"same\">is a written<\/mark> <mark class=\"new\">non-exclusive<\/mark> <mark class=\"same\">SICC agreement and<\/mark> <mark class=\"new\">the claim<\/mark> <mark class=\"same\">is international and commercial. Per C&amp;Y, Spiliada is irrelevant: O 2 r 3 SICC Rules 2021 supplies the connection test (J5.3).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Singapore has a sufficient interest; the problem is the lack of a legitimate basis.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Gives Singapore a sufficient interest, so that element is met. The application fails on legitimate basis, not on interest."}, {"letter": "E", "code": "J5.4.2", "title": "Every Party's Consent", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per O 2 r 4(4), transfer also needs every party's consent. Per C&amp;Y, this exceeds s 11(5) CCAA (\"take into account\") to protect HCCCA recognition: art 8(5) lets<\/mark> <mark class=\"new\">the Charltonian court<\/mark> <mark class=\"same\">refuse recognition against<\/mark> <mark class=\"new\">Hyperion<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So in Singapore the transfer should not happen at all without Hyperion's consent.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Explains why the problem should never arise: a CCAA transfer needs every party's consent, precisely to avoid the art 8(5) risk. The question assumes it happened anyway."}, {"letter": "F", "code": "J6.3.2", "title": "Parallel Proceedings Alone Not Enough", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>UBS v Telesto<\/i> and C&amp;Y, parallel proceedings and the risk of conflicting judgments do not alone justify an ASI, especially where the parties agreed<\/mark> <mark class=\"new\">a non-exclusive clause<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">There is no race to judgment either: the Buritanian action will not finish first, so refusing costs Stratus little.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "J6.3.1.1", "title": "Exclusive Clause Breached", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Titanus<\/mark> <mark class=\"same\">breached<\/mark> <mark class=\"new\">the Engineering Contract clause<\/mark><mark class=\"same\">, an exclusive<\/mark> <mark class=\"new\">SICC<\/mark> <mark class=\"same\">clause, by suing in<\/mark> <mark class=\"new\">Buritania<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Sun Travels<\/i>, breach is a separate basis: no unconscionability is needed, and the ASI ordinarily issues absent strong reasons (J6.3.1.4).<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The clause is expressly non-exclusive, so Titanus's suit breaches nothing. There is no contractual basis."}]}, {"id": "J-07.1", "side": "J", "hyp": 7, "n": 1, "source": "Mock Paper 7, Hypo 13", "title": "Mercury v Orbis and Vega", "full": "Mock Paper 7, Hypo 13", "q": "<p>Mercury Digital Pte Ltd runs a digital asset trading desk from Singapore. In February 2026 it transferred 12 million USDC to a wallet controlled by Mr Idris, on the strength of his false statement over a video call. Mr Idris moved the coins to wallets held by Orbis Custody Ltd, a Buritanian company, and Vega Holdings Inc, an Elbonian company. Orbis was registered in Singapore until it ceased business here in 2024 and was deregistered. Vega has no connection with Singapore beyond the coins.<\/p><p>Mercury sued Orbis and Vega in the General Division for knowing receipt and restitution, and obtained approval to serve them out of Singapore.<\/p><ul><li>Orbis was served in Buritania. It filed a notice of intention to contest, then applied for a stay of the Singapore action on forum non conveniens grounds only. That application is pending.<\/li><li>Vega instructed Singapore solicitors, who confirmed that they would accept service, and the claim was served on them. Vega then applied to set aside service for lack of nexus and, as a fall-back in the same summons, for a stay.<\/li><\/ul><p>Mercury wishes to enforce any Singapore judgment in Buritania, whose courts apply the same rules on foreign judgments as the Singapore common law. Advise Mercury whether Orbis and Vega have submitted to the Singapore court's jurisdiction, and why it matters. Exclude any discussion of the SICC.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Two defendants served out, each taking a different first step. Sort each step into \"submits\", \"does not submit\" or \"unclear\", then say why Mercury cares: a Singapore judgment is enforceable in Buritania only against a defendant that submitted.<\/p>\n<p><strong>Vega: J2.2.2.<\/strong> Instructing Singapore solicitors to accept service is submission (<i>Rothschild<\/i>), or at least service in Singapore (<i>COSCO<\/i>). Argue both; Yeo prefers submission. If it is submission, Vega's nexus challenge falls away and only exercise is left.<\/p>\n<p><strong>Fall-backs: J2.2.3.<\/strong> Orbis's notice of intention to contest is not submission, and neither is Vega's fall-back stay in the same summons (<i>Zoom<\/i>).<\/p>\n<p><strong>Orbis's stay: J2.2.4.<\/strong> A stay sought alone was the <i>Zoom<\/i> trap, but O 6 rr 7(6) and 12(5) now protect the filing. On C&amp;Y's narrow reading, Orbis submits only if its stay fails; Chong finds the rules \"quite encompassing\".<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not stop at Singapore jurisdiction. Service out gives the Singapore court jurisdiction but gives it no international jurisdiction in Buritania's eyes, so Mercury should press the submission points with enforcement in mind.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Vega has likely submitted by instructing solicitors to accept service, so only exercise remains against it; Orbis's notice to contest and Vega's fall-back stay are not submission, and Orbis's stay sought alone is protected when filed under O 6 r 7(6), submitting only if it fails on C&amp;Y's reading, which matters because a Singapore judgment will be enforced in Buritania only against a defendant that submitted.<\/blockquote>", "items": [{"letter": "A", "code": "J2.1.4", "title": "Ceased and Deregistered", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Tao Commodity<\/i>, s 376 is unavailable after<\/mark> <mark class=\"new\">Orbis's 2024 deregistration<\/mark><mark class=\"same\">, registration having supplied the nexus, so<\/mark> <mark class=\"new\">Mercury<\/mark> <mark class=\"same\">must serve<\/mark> <mark class=\"new\">Orbis<\/mark> <mark class=\"same\">out in<\/mark> <mark class=\"new\">Buritania<\/mark> <mark class=\"same\">(J3.1).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">But per C&amp;Y, the plain words of s 376(c) cover<\/mark> <mark class=\"new\">the deregistered Orbis<\/mark><mark class=\"same\">, ceasing business being the precursor to deregistration<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Deregistration matters only for service in Singapore. Mercury served Orbis out, so <i>Tao<\/i> and s 376(c) are academic."}, {"letter": "B", "code": "J6.1", "title": "Amenability", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Orbis<\/mark> <mark class=\"same\">is amenable, having<\/mark> <mark class=\"new\">applied for a stay here<\/mark> <mark class=\"same\">or been validly served<\/mark> <mark class=\"new\">out of<\/mark> <mark class=\"same\">Singapore (<i>Koh Kay Yew<\/i>; <i>Westbridge v Mittal<\/i>; C&amp;Y).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Similar to <i>Akai<\/i>, where the respondent, though served out on ostensible evidence, was not amenable as it had no presence or assets here and only opposed the ASI,<\/mark> <mark class=\"new\">Vega<\/mark> <mark class=\"same\">has<\/mark> <mark class=\"new\">no presence or assets in Singapore<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Amenability is the first requirement for an anti-suit injunction. The question asks about submission to the action itself, and no injunction is sought."}, {"letter": "C", "code": "J2.2.4", "title": "Failed Challenges and Stays Under ROC 2021", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, ROC 2014 deemed<\/mark> <mark class=\"new\">Orbis<\/mark> <mark class=\"same\">to submit if<\/mark> <mark class=\"new\">its challenge failed<\/mark><mark class=\"same\">, regardless of voluntariness. ROC 2021 dropped this<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">O 6 rr 7(6), 12(5) treat<\/mark> <mark class=\"new\">an exercise challenge<\/mark> <mark class=\"same\">as not submission, removing<\/mark> <mark class=\"new\">the Zoom trap<\/mark> <mark class=\"same\">for<\/mark> <mark class=\"new\">Orbis's stay<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, r 7(6) protects only<\/mark> <mark class=\"new\">the filing<\/mark><mark class=\"same\">, so if<\/mark> <mark class=\"new\">Orbis's FNC stay<\/mark> <mark class=\"same\">fails,<\/mark> <mark class=\"new\">Orbis<\/mark> <mark class=\"same\">submits at that point, a stay accepting that jurisdiction exists.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "J4.2.5", "title": "Fall-Back Stay and the Burden", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Zoom<\/i>,<\/mark> <mark class=\"new\">Vega<\/mark> <mark class=\"same\">should argue forum within its set-aside, where<\/mark> <mark class=\"new\">Mercury<\/mark> <mark class=\"same\">bears the burden (the \"obvious advantage\": C&amp;Y).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">But per <i>Zoom<\/i>, running it takes on the stage 1 burden<\/mark> <mark class=\"new\">Vega<\/mark> <mark class=\"same\">could have left with<\/mark> <mark class=\"new\">Mercury<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Orbis, by seeking a stay alone, likewise carries stage 1.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "A good strategy point: a stay takes on the stage 1 burden, so both defendants carry it on that prayer. But it goes to forum, not submission."}, {"letter": "E", "code": "J2.2.2", "title": "Stay Sought Alone; Solicitors Instructed", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Zoom<\/i> (<i>The Jian He<\/i>; <i>Chan Chin Cheung<\/i>),<\/mark> <mark class=\"new\">Orbis's FNC stay<\/mark> <mark class=\"same\">sought without contesting existence ordinarily submits at common law, as<\/mark> <mark class=\"new\">Orbis<\/mark> <mark class=\"same\">accepts jurisdiction exists.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Rothschild<\/i>,<\/mark> <mark class=\"new\">Vega<\/mark> <mark class=\"same\">instructing<\/mark> <mark class=\"new\">its Singapore solicitors<\/mark> <mark class=\"same\">to accept service is submission. Per <i>Shanghai Turbo<\/i> (SGCA) and <i>COSCO<\/i> (HC), it is service in Singapore under O 7 r 2(1)(d)<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">argue both, Yeo preferring submission<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "J7.1.2.4", "title": "Henry Should Not Be Followed", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>IGCF<\/i> (PC), <i>Henry<\/i>'s existence/exercise line is \"unrealistic and irrational\", no common law jurisdiction follows it<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, a failed set-aside on any ground is a protest (<i>Re Dulles<\/i>), so<\/mark> <mark class=\"new\">Orbis<\/mark><mark class=\"same\">'s<\/mark> <mark class=\"new\">FNC stay<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">was not submission.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">A Buritanian court applying these rules may treat Orbis as not having submitted, so a Singapore judgment may not be enforceable there.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Explains why Mercury cares: a Buritanian court applying these rules would likely treat a failed forum challenge as a protest (<i>IGCF<\/i>). One line on enforcement, after you decide submission here."}, {"letter": "G", "code": "J2.2.3", "title": "Notice to Contest; Fall-Back Stay", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per O 6 r 6(4), filing<\/mark> <mark class=\"new\">Orbis's notice of intention to contest<\/mark> <mark class=\"same\">within<\/mark> <mark class=\"new\">21 days of service out<\/mark> <mark class=\"same\">is not submission or a waiver of<\/mark> <mark class=\"new\">any defect in service<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Zoom<\/i> and <i>Williams<\/i>, a stay prayed as a fall-back to<\/mark> <mark class=\"new\">Vega's set-aside<\/mark> <mark class=\"same\">is not submission, even in<\/mark> <mark class=\"new\">one summons<\/mark><mark class=\"same\">, the prayers being considered in sequence.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">But Vega's set-aside matters only if the solicitors point fails.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "J-07.2", "side": "J", "hyp": 7, "n": 2, "source": "Mock Paper 7, Hypo 13", "title": "Mercury v Mr Idris and Bluewater", "full": "Mock Paper 7, Hypo 13", "q": "<p>Mercury Digital Pte Ltd runs a digital asset trading desk from Singapore. In February 2026, it transferred 12 million USDC to a wallet controlled by Mr Idris, on the strength of his false statement, made over a video call to Mercury's dealers in Singapore, that his company had delivered matching assets. Mr Idris lived in Singapore as a permanent resident for 15 years, but kept his Xalarat citizenship and always told friends he would retire to Xalarat. Until recently he traded through Bluewater Capital, a partnership carrying on business at an office in Raffles Place, with a Singapore resident as his partner.<\/p><p>Mercury learnt of the fraud on 2 March 2026. On 3 March, Mr Idris's lawyers told Mercury's lawyers that he was \"aware of your client's complaint\". On 4 March he flew out of Singapore. Mercury issued its originating claim on 6 March against Mr Idris (deceit) and Bluewater (for Mr Idris's deceit). No one knows where Mr Idris is. His personal assistant in Singapore, who runs his property portfolio and pays his bills, remains in contact with him.<\/p><p>Without obtaining approval to serve out, Mercury obtained an order for substituted service on Mr Idris by a message to his Telegram account and by leaving the claim with his personal assistant. It left the claim at Bluewater's office with a clerk. Singapore choice of law rules point to Singapore law for the deceit claim. Advise Mercury whether it has validly founded jurisdiction over Mr Idris and Bluewater, and what it should do now. Exclude any discussion of the SICC.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A defendant who left before the claim was issued, and a firm served through a clerk. Ask first whether Mercury had the right to serve, then whether the mode was proper.<\/p>\n<p><strong>Mr Idris, right to serve: J3.1.6.<\/strong> He had left Singapore before issue, so Mercury needed approval to serve out first: substituted service cannot be used to skip that step, and later notice does not cure it (<i>Consistel<\/i>). The evasion exception (<i>Re Urquhart<\/i>) is arguable, as he left the day after hearing of the complaint, but <i>Beranek<\/i> doubts it. The safe course is to apply now.<\/p>\n<p><strong>Mr Idris, nexus: J3.1.2.<\/strong> The statement was received and acted on in Singapore, and the loss was suffered here, so (f)(i) and (f)(ii) are strong. Ordinary residence under (a) is arguable; his domicile of origin, Xalarat, probably persists. Once approval is given, Telegram may be a proper mode if personal service is impracticable.<\/p>\n<p><strong>Bluewater: J2.1.6.<\/strong> The firm can be sued in its name because its partners carry on business here, but service must be on a partner or the person in control. A clerk is neither, so re-serve on the resident partner.<\/p>\n<p><strong>Trap to avoid.<\/strong> The personal assistant's control of Mr Idris's property affairs does not relate to this action, so O 7 r 4 does not help (<i>Rosenberg<\/i>).<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Mr Idris left before the claim was issued, so substituted service without approval to serve out breaks the Consistel hierarchy unless he left to evade service, which is arguable; Mercury should now seek approval on the (f)(i) and (f)(ii) tort grounds, with ordinary residence in the alternative, and should re-serve Bluewater on its resident partner, since leaving the claim with a clerk is not good service.<\/blockquote>", "items": [{"letter": "A", "code": "J2.1.6", "title": "Partnerships", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Under O 56 r 1, Mercury<\/mark> <mark class=\"same\">may sue<\/mark> <mark class=\"new\">Bluewater<\/mark> <mark class=\"same\">in its firm name if<\/mark> <mark class=\"new\">the partners<\/mark> <mark class=\"same\">carry on business here.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, this gives no in personam jurisdiction, so each<\/mark> <mark class=\"new\">partner<\/mark> <mark class=\"same\">to be made liable must be served or submit.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Mode of Service (O 56 r 3(1)): serve<\/mark> <mark class=\"new\">the resident partner<\/mark> <mark class=\"same\">or<\/mark> <mark class=\"new\">the person controlling the business at Raffles Place<\/mark><mark class=\"same\">.<\/mark> <mark class=\"new\">A clerk is neither.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "J4.2.1", "title": "Burden Stays on Claimant", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Spiliada<\/i>, <i>Oriental Insurance<\/i> and <i>Zoom<\/i>,<\/mark> <mark class=\"new\">Mercury<\/mark> <mark class=\"same\">bears it without notice and still when<\/mark> <mark class=\"new\">Mr Idris<\/mark> <mark class=\"same\">sets aside<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The fraud was practised on dealers in Singapore and the loss was suffered here, so Mercury should meet it.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Once Mercury serves out, it bears the forum burden. The fraud and loss in Singapore should carry it, but this comes after the right to serve is sorted."}, {"letter": "C", "code": "J2.1.1", "title": "Natural Person Present", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 16(1)(a)(i) SCJA,<\/mark> <mark class=\"new\">Mr Idris<\/mark> <mark class=\"same\">present<\/mark> <mark class=\"new\">at his Singapore home<\/mark> <mark class=\"same\">is personally served as of right under O 7 r 2(1)(a).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">He was a permanent resident for 15 years, so he can be treated as here.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Presence is judged at service, and Mr Idris had left. Fifteen years of residence do not make him present now."}, {"letter": "D", "code": "J3.1.6", "title": "The Hierarchy of Service", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Consistel<\/i>, where<\/mark> <mark class=\"new\">Mr Idris<\/mark> <mark class=\"same\">left Singapore before<\/mark> <mark class=\"new\">the originating claim<\/mark> <mark class=\"same\">was issued,<\/mark> <mark class=\"new\">Mercury<\/mark> <mark class=\"same\">must first seek permission to serve out; substituted service arises only if personal service is impracticable — \"a hierarchy of service which must be adhered to\".<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Consistel<\/i>, substituted service without first serving out is allowed where<\/mark> <mark class=\"new\">Mr Idris<\/mark> <mark class=\"same\">(i) left Singapore to evade<\/mark> <mark class=\"new\">service<\/mark> <mark class=\"same\">(<i>Re Urquhart<\/i>)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">He flew out the day after learning of the complaint, so (i) is arguable.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "J3.0.2", "title": "Which Route Is Most Onerous", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per the slides, O 7 r 2(1)(b) is as of right, O 7 r 4 needs permission (not as of right), and O 8 r 1(1) \"appropriate court\" needs approval on three requirements, burden on<\/mark> <mark class=\"new\">Mercury<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Mercury cannot avoid the O 8 route for Mr Idris now that he has gone.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Explains why O 8 is now unavoidable for Mr Idris. Useful framing; J3.1.6 decides the point."}, {"letter": "F", "code": "J2.1.2", "title": "Agent of an Absent Natural Person", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">With permission on a without-notice summons,<\/mark> <mark class=\"new\">the personal assistant<\/mark> <mark class=\"same\">may be served for<\/mark> <mark class=\"new\">Mr Idris<\/mark> <mark class=\"same\">if (a)<\/mark> <mark class=\"new\">he<\/mark> <mark class=\"same\">does not reside in or is absent from Singapore; (b) at service<\/mark> <mark class=\"new\">the assistant<\/mark> <mark class=\"same\">personally controls or manages here<\/mark> <mark class=\"new\">Mr Idris<\/mark><mark class=\"same\">'s affairs specifically relating to<\/mark> <mark class=\"new\">the action<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Running his property portfolio and paying his bills does not relate to the deceit claim.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The obvious alternative for Mr Idris, but it fails: the assistant's control of his property affairs does not relate to the deceit claim. One line to dismiss it."}, {"letter": "G", "code": "J3.1.2", "title": "Nexus: Tort and Residence", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">(f)(i) Act or Omission Here:<\/mark> <mark class=\"new\">The deceit<\/mark><mark class=\"same\">, wherever committed, is constituted at least in part by<\/mark> <mark class=\"new\">a statement received and acted on<\/mark> <mark class=\"same\">in Singapore.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">(f)(ii) Damage Here: Threshold:<\/mark> <mark class=\"new\">Mercury<\/mark><mark class=\"same\">'s claim is founded on, or seeks damages for, damage suffered in Singapore.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">(a) Ordinary Residence: Per <i>Levene v IRC<\/i>, residence \"with some degree of continuity and apart from accidental or temporary absences\"<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">Fifteen years here make it arguable.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "J-07.3", "side": "J", "hyp": 7, "n": 3, "source": "Mock Paper 7, Hypo 13", "title": "Mercury v Halcyon and Orbis", "full": "Mock Paper 7, Hypo 13", "q": "<p>Mercury Digital Pte Ltd, a Singapore digital asset trader, has a Master Trading Agreement with Halcyon Ventures Ltd, a Yesouth company, expressly governed by Singapore law, which provides:<\/p><p>\"18. The courts of Singapore shall have non-exclusive jurisdiction over any dispute arising from this agreement. 19. Any process in connection with this agreement may be served by e-mail to legal@halcyon.example, wherever the recipient may be.\"<\/p><p>Mercury sued Halcyon in Singapore for breach of contract and e-mailed the claim under clause 19. Halcyon filed a defence on the merits and a counterclaim, and now argues that e-mail service was invalid without the court's approval.<\/p><p>Mercury has also sued Orbis Custody Ltd, a Buritanian company, for knowing receipt of USDC taken from Mercury by fraud, and served it in Buritania with the court's approval. Before Mercury sued, Orbis had begun proceedings in Buritania for a declaration that it owns the coins in its wallets. Orbis has applied for a stay of the Singapore action. The fraud was practised on Mercury's dealers in Singapore, most of the blockchain evidence is online, Orbis keeps its wallet records in Buritania, and the Buritanian courts are competent and take about 18 months to hear a case.<\/p><p>Advise Mercury whether the Singapore court has jurisdiction over Halcyon, and whether it can restrain Orbis's Buritanian proceedings. Exclude any discussion of the SICC.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> One defendant whose contract allows service abroad, and one whose foreign suit came first. The first is about service; the second is about whether an ASI has any basis at all.<\/p>\n<p><strong>Halcyon: J3.1.5.<\/strong> Clause 19 allows service out by e-mail, so no approval was needed (O 8 r 1(3); <i>NW Corp<\/i>). Halcyon cannot dispute existence, only exercise, and under the Singapore clause it would bear strong cause. Its defence and counterclaim are submission anyway.<\/p>\n<p><strong>Orbis, interest: J6.2.3.<\/strong> Even if Singapore is the natural forum, that alone never justifies an ASI (<i>SNIA<\/i>). Mercury must show more.<\/p>\n<p><strong>Orbis, vexation: J6.3.2.<\/strong> Parallel proceedings are not enough; Mercury needs something more, such as bad faith. Orbis sued first for a declaration of its own title. The early stage helps on comity, but the better course is to wait for the stay decision.<\/p>\n<p><strong>Trap to avoid.<\/strong> Protecting Singapore's own process is for relitigation after a Singapore judgment. Where both actions are simply pending, Mercury must show Singapore is the natural forum and more.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Clause 19 allowed service on Halcyon abroad without approval, and Halcyon has in any event submitted by defending and counterclaiming, so jurisdiction over it is secure; an ASI against Orbis is unlikely for now, because natural forum alone is not enough and parallel proceedings, with Orbis having sued first, are not vexatious without something more.<\/blockquote>", "items": [{"letter": "A", "code": "J2.2.2", "title": "Defence and Counterclaim", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y (<i>Spamhaus<\/i>), filing<\/mark> <mark class=\"new\">a merits defence<\/mark> <mark class=\"same\">or<\/mark> <mark class=\"new\">a striking-out application<\/mark> <mark class=\"same\">without protest submits<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Lakshmi Anil Salgaocar<\/i> (HC), filing<\/mark> <mark class=\"new\">a counterclaim<\/mark> <mark class=\"same\">here is likewise premised on jurisdiction.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">So even if e-mail service were defective, Halcyon has submitted.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "A complete answer to Halcyon's complaint even if the e-mail service were bad: a merits defence and counterclaim are submission. The alternative to J3.1.5."}, {"letter": "B", "code": "J6.2.3", "title": "Natural Forum Alone Is Not Enough", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>SNIA<\/i> and C&amp;Y, natural forum alone never justifies an ASI<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Mercury<\/mark> <mark class=\"same\">must also show<\/mark> <mark class=\"new\">prejudice in Buritania<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Even if Singapore is the natural forum, where the fraud and the loss happened, that alone will not do.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "J6.2.2", "title": "Protecting Singapore's Own Process", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Orbis<\/mark><mark class=\"same\">'s<\/mark> <mark class=\"new\">Buritanian claim<\/mark> <mark class=\"same\">abuses Singapore's process by<\/mark> <mark class=\"new\">duplicating the Singapore action<\/mark><mark class=\"same\">. Per <i>BCS v Baker<\/i>, natural forum is then irrelevant<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Mercury need not show that Singapore is the natural forum.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "That basis protects Singapore judgments or processes from collateral attack. With both actions merely pending, Mercury must show natural forum plus vexation."}, {"letter": "D", "code": "J3.1.5", "title": "Service Out Without Approval", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per O 8 r 1(3), approval \"is not required if service out of Singapore is allowed under a contract between the parties\", so<\/mark> <mark class=\"new\">Mercury<\/mark> <mark class=\"same\">may serve<\/mark> <mark class=\"new\">Halcyon<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Yesouth<\/mark> <mark class=\"same\">without the three requirements.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>NW Corp<\/i>, service under r 1(3) founds jurisdiction without approval, so<\/mark> <mark class=\"new\">Halcyon<\/mark> <mark class=\"same\">cannot dispute its existence, only its exercise on natural forum grounds<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "J4.0.2", "title": "Burden Map", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Where service on<\/mark> <mark class=\"new\">Halcyon<\/mark> <mark class=\"same\">needed no approval (O 8 r 1(3); NW Corp) or rests on \"has the jurisdiction\" outside the CCAA,<\/mark> <mark class=\"new\">Halcyon<\/mark> <mark class=\"same\">may attack only<\/mark> <mark class=\"new\">exercise<\/mark> <mark class=\"same\">and bears that burden (C&amp;Y).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Halcyon<\/mark><mark class=\"same\">'s<\/mark> <mark class=\"new\">stay or set-aside<\/mark> <mark class=\"same\">objects to the agreed forum, so strong cause is on<\/mark> <mark class=\"new\">Halcyon<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Confirms that Halcyon can attack only exercise and bears strong cause under the Singapore clause. A line after jurisdiction is settled."}, {"letter": "F", "code": "J6.1", "title": "Amenability", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Orbis<\/mark> <mark class=\"same\">is amenable, having<\/mark> <mark class=\"new\">applied for a stay here<\/mark> <mark class=\"same\">or been validly served<\/mark> <mark class=\"new\">out of<\/mark> <mark class=\"same\">Singapore (<i>Koh Kay Yew<\/i>; <i>Westbridge v Mittal<\/i>; C&amp;Y).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">If the approval to serve out falls, for example for non-disclosure, amenability may fall with it.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Orbis is amenable through valid service, and its stay application. Needed, but the application fails later, on interest and basis."}, {"letter": "G", "code": "J6.3.2", "title": "Something More Than Parallel Proceedings", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>UBS v Telesto<\/i> and C&amp;Y, parallel proceedings and the risk of conflicting judgments do not alone justify an ASI<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Asiana<\/i> (citing <i>VEW v VEV<\/i>), duplication plus<\/mark> <mark class=\"new\">bad faith or abuse<\/mark> <mark class=\"same\">may be vexatious.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Orbis sued first, for a declaration of its own title, and nothing more is shown. Hold the application until the stay is decided.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "J-08.1", "side": "J", "hyp": 8, "n": 1, "source": "Mock Paper 8, Hypo 15", "title": "Ocean Reefer and Mei Foods v Dunmore", "full": "Mock Paper 8, Hypo 15", "q": "<p>Ocean Reefer Pte Ltd and Mei Foods Pte Ltd, Singapore seafood importers, each shipped chilled seafood from Suburbia to Singapore on the MV <i>Aster<\/i>. Each bill of lading, issued by the <i>Aster<\/i>'s operator, gives the Suburbian courts exclusive jurisdiction over claims against the carrier. On 12 January 2025, the <i>Aster<\/i> collided in Ruritanian waters with the MV <i>Boreas<\/i>, owned by Dunmore Shipping Ltd, an Elbonian company registered in Singapore which runs its crewing department from a Singapore office. All the cargo was lost. Neither importer has a contract with Dunmore.<\/p><p>More than 50 other cargo owners have sued both shipowners in the Ruritanian Maritime Court, where a 30-day test trial on liability has been held and judgment is awaited. Ocean Reefer filed a protective claim against Dunmore there in May 2025. Mei Foods did not, and issued its Singapore claim in March 2026. Both importers have sued Dunmore in Singapore for negligence, and Ocean Reefer has arrested another Dunmore vessel here and obtained security. In June 2026, on Dunmore's application, the Ruritanian court ruled that Ruritania is the natural forum for all claims arising from the collision. Dunmore applies for a stay of both Singapore actions. Ocean Reefer's counsel wants to argue that Singapore should adopt the Australian \"clearly inappropriate forum\" test.<\/p><p>The negligence claims are governed by Ruritanian law. Ruritanian law has a one-year limitation period for all tort claims; Singapore's is three years. The Ruritanian court works in Ruritanian and caps cargo claims at about one third of what Singapore law allows. The <i>Boreas<\/i>'s officers are Dunmore's employees; the <i>Aster<\/i>'s former officers now live in Ruritania and will not travel to Singapore. Advise the importers. Exclude any discussion of the SICC.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A collision abroad, no clause between the importers and Dunmore, and a large related action already tried in Ruritania. This is plain <i>Spiliada<\/i>, with Dunmore bearing stage 1 because it was served here, plus one claimant who is out of time everywhere.<\/p>\n<p><strong>Stage 1: J4.1.2.<\/strong> The tort is in Ruritanian waters and Ruritanian law governs. The 30-day test trial gives the <i>Cambridgeshire<\/i> factor, and the <i>Aster<\/i>'s former officers cannot be compelled here. Dunmore's own employees carry little weight. Ruritania is clearly more appropriate.<\/p>\n<p><strong>Stage 2: J4.1.3.<\/strong> The importers bear this burden. A one-third cap is a legitimate advantage but not conclusive, the language is an ordinary difference, and Ocean Reefer keeps its arrest security under a conditional stay.<\/p>\n<p><strong>Mei Foods: J4.2.4.<\/strong> Under FLPA s 3(2) the Ruritanian one-year period applies in Singapore too, so Mei Foods is out of time here as well. Singapore's three years is a red herring, and s 4(2) is weak when there is no reason for not filing.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not reach for strong cause: the bill of lading clause binds the carrier, not Dunmore. And do not let the Ruritanian forum ruling decide the stay, since each court decides its own forum (<i>Lakshmi<\/i>).<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>No clause binds Dunmore, so Spiliada applies with Dunmore bearing stage 1; the collision, the governing law, the test trial and the non-compellable Aster officers make Ruritania clearly more appropriate, the cap is not enough at stage 2, and Ocean Reefer keeps its security on a conditional stay; Mei Foods fails anyway because FLPA s 3(2) applies Ruritania's one-year bar here.<\/blockquote>", "items": [{"letter": "A", "code": "J4.1.3", "title": "Stage 2: Cap, Language, Security", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, ordinary differences in<\/mark> <mark class=\"new\">language<\/mark> <mark class=\"same\">are disregarded.<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Presently<\/mark> <mark class=\"new\">the importers<\/mark> <mark class=\"same\">would recover<\/mark> <mark class=\"new\">one third<\/mark> <mark class=\"same\">of the Singapore award in<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">. Per Chong's feedback, a legitimate juridical advantage alone is not conclusive<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Spiliada<\/i>,<\/mark> <mark class=\"new\">Ocean Reefer<\/mark> <mark class=\"same\">keeps<\/mark> <mark class=\"new\">its security from the arrest<\/mark> <mark class=\"same\">under a conditional stay.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "J4.1.2", "title": "Stage 1: Tort, Cambridgeshire, Witnesses", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>JIO<\/i> and <i>The Albaforth<\/i>, the place of the tort, located by the substance test (C3), is prima facie the natural forum unless fortuitous, here<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">because<\/mark> <mark class=\"new\">the collision happened in its waters<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Spiliada<\/i>, expertise built up in<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">through related litigation over<\/mark> <mark class=\"new\">the collision<\/mark> <mark class=\"same\">favours<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">, but only in complex technical cases<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Per <i>JIO<\/i>, non-party<\/mark> <mark class=\"new\">Aster officers in Ruritania<\/mark> <mark class=\"same\">not compellable here point to<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "J4.1.4", "title": "Spiliada v the Australian Test", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Voth<\/i>, an Australian court stays only if it is \"a clearly inappropriate forum\"<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>JIO<\/i> and <i>Eng Liat Kiang<\/i>,<\/mark> <mark class=\"new\">Dunmore<\/mark> <mark class=\"same\">must show<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">clearly more appropriate, a test that stays<\/mark> <mark class=\"new\">the cargo claims<\/mark> <mark class=\"same\">more readily even where Singapore could try it.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">The tests diverge only where<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">is more appropriate but Singapore not clearly inappropriate, so here the choice<\/mark> <mark class=\"new\">is<\/mark> <mark class=\"same\">decisive.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Counsel's test would change the result, but the General Division is bound by <i>JIO<\/i> and <i>Eng Liat Kiang<\/i>. Note it for the Court of Appeal."}, {"letter": "D", "code": "J4.3.1", "title": "Not Spiliada; Foreseeable Factors", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Strong cause applies where<\/mark> <mark class=\"new\">the importers<\/mark> <mark class=\"same\">breach<\/mark> <mark class=\"new\">the bill of lading clause<\/mark><mark class=\"same\">; Spiliada where<\/mark> <mark class=\"new\">no one<\/mark> <mark class=\"same\">does.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Vinmar<\/i>,<\/mark> <mark class=\"new\">witnesses in Ruritania<\/mark> <mark class=\"same\">foreseeable at contracting carry little weight<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">So the importers must show strong cause to keep their Singapore actions.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The bill of lading clause is between each importer and the carrier. Dunmore is not a party, so no one breaches a clause by suing Dunmore here: plain Spiliada."}, {"letter": "E", "code": "J4.5", "title": "Forum Election", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Koh Kay Yew<\/i> and <i>Virsagi<\/i>, where<\/mark> <mark class=\"new\">Ocean Reefer<\/mark> <mark class=\"same\">sues<\/mark> <mark class=\"new\">Dunmore<\/mark> <mark class=\"same\">here and in<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">on<\/mark> <mark class=\"new\">the same issues<\/mark><mark class=\"same\">, it must elect unless it justifies the multiplicity<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Rappo<\/i>, where<\/mark> <mark class=\"new\">Dunmore<\/mark> <mark class=\"same\">runs both, FNC is decided first, and election follows only if<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">is not clearly more appropriate<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Dunmore says Ocean Reefer must elect, but forum non conveniens is decided first (<i>Rappo<\/i>), and with Ruritania clearly more appropriate, election never arises. Ocean Reefer says its Ruritanian filing was protective."}, {"letter": "F", "code": "J7.3.2.3", "title": "Forum Rulings Do Not Bind", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, estoppel always depends on scheduling; <i>Lakshmi<\/i> is better explained as each court deciding its own appropriateness, so<\/mark> <mark class=\"new\">the Ruritanian court<\/mark><mark class=\"same\">'s view that<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">is forum conveniens never binds<\/mark> <mark class=\"new\">this court<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Lakshmi<\/i>,<\/mark> <mark class=\"new\">the June 2026 ruling<\/mark> <mark class=\"same\">may still bear on comity.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Answers Dunmore's best-sounding point: the Ruritanian natural forum ruling does not bind Singapore, though it may bear on comity. One line."}, {"letter": "G", "code": "J4.2.4", "title": "Time Bars and the FLPA", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per FLPA s 3(1), where<\/mark> <mark class=\"ne
