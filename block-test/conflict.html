Dario's influence-peddling.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The right opening line: foreign public policy alone points to <i>Lemenda<\/i>, and connection to the lease points to tainting. It only routes you."}, {"letter": "G", "code": "C2.6", "title": "Formation: Silence and the Caveat", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Double bootstraps (Prof Chong):<\/mark> <mark class=\"new\">Suburbian law<\/mark> <mark class=\"same\">first decides whether<\/mark> <mark class=\"new\">the Suburbian law clause<\/mark> <mark class=\"same\">was incorporated, then whether<\/mark> <mark class=\"new\">the Haldane contract<\/mark> <mark class=\"same\">was formed.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Where<\/mark> <mark class=\"new\">Suburbian law<\/mark> <mark class=\"same\">binds<\/mark> <mark class=\"new\">Medira<\/mark> <mark class=\"same\">by<\/mark> <mark class=\"new\">silence, through a hidden annexe<\/mark><mark class=\"same\">, <i>Lew<\/i> left open \"a very small caveat, very rarely applicable\", whose effect is no contract under any law<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Art 6(2) of the Hague Principles points the same way; best view, no contract.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "C-02.1", "side": "C", "hyp": 2, "n": 1, "source": "Mock Paper 2, Hypo 4", "title": "Quanta v Helion", "full": "Mock Paper 2, Hypo 4", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>Helion Materials Ltd, a Lusitanian company, agreed in Lusitania on 3 March 2024 to sell 1,200 tonnes of rare-earth magnets to Quanta Pte Ltd, a Singapore company, in 12 monthly shipments from a Lusitanian port to Quanta's factory in Freedonia, with payment into Helion's Singapore bank account. Clause 9 reads: \"This contract is governed by English law.\" Neither party has any connection with England. Helion's lawyers recommended the clause because Lusitanian law would have imposed an 8% strategic minerals surcharge on Helion.<\/p><p>On 1 September 2024, Freedonia banned the import of Lusitanian magnets, with a fine for importers in breach. Six shipments had been delivered. At Quanta's request, Helion agreed to discharge the remaining shipments at a port in Charltonia instead. Unknown to Helion, Quanta's logistics manager then arranged for the magnets to be trucked into Freedonia under invoices describing them as scrap metal; smuggling is a crime punishable by imprisonment there. Four shipments arrived this way. When the press reported the smuggling in February 2025, Helion stopped shipping at once.<\/p><p>Quanta sues Helion in Singapore for damages for non-delivery of the last two shipments, and Helion pleads illegality. Neither party has yet pleaded English law. The ban would frustrate the contract under Singapore and Freedonian law; under English and Lusitanian law it would not, as Helion may deliver to the nearest available port, in Charltonia. Advise Quanta.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A ban, a variation, and a plan to get round the ban that only one party knew of. Two illegality routes are live, and the unpleaded English law decides what happens if neither bites.<\/p>\n<p><strong>Ralli: C2.10.5.<\/strong> Start with <i>Esben<\/i>: the contract is unenforceable in so far as performance is illegal at the contractual place of performance. After the variation that place is Charltonia, where delivery is lawful, so <i>Ralli<\/i> does not bite on the remaining shipments. On the frustration reading, English law permits delivery in Charltonia.<\/p>\n<p><strong>Foster: C2.10.3.<\/strong> Quanta intended to smuggle into Freedonia. <i>Foster<\/i> usually bites at formation but can apply outside that paradigm (Chong's mid-term feedback). The act is contemplated in Freedonia and the proper law is irrelevant. The intention is Quanta's alone, so it bars only Quanta, and Quanta cannot enforce.<\/p>\n<p><strong>Pleading: C1.6.3.<\/strong> If neither party pleads English law, Singapore law applies in its own right and frustrates the contract. Quanta needs non-frustration, so it must plead and prove English law, and <i>Foster<\/i> still defeats it.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not treat the false invoices as tainting. The illegality lies in Quanta's own performance of this contract, and <i>Foster<\/i> bars only the party with the wicked intention.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Ralli does not bite after the variation, because delivery in Charltonia is lawful, but Quanta's plan to smuggle the magnets into Freedonia engages Foster whatever the proper law, barring Quanta alone; and unless Quanta pleads and proves English law, Singapore law applies and frustrates the contract, so its non-delivery claim fails either way.<\/blockquote>", "items": [{"letter": "A", "code": "C2.10.1", "title": "Routing Starter", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Helion<\/mark> <mark class=\"same\">pleads illegality against<\/mark> <mark class=\"new\">Quanta's damages claim<\/mark> <mark class=\"same\">via (A) the proper law, (B) forum international public policy, (C) Foster, (D) Lemenda, (E) Ralli, (F) tainting, or (G) reliance as a defence.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">per <i>Magdeev<\/i>, \"<i>Ralli<\/i> looks to action, <i>Foster<\/i> <span class=\"gap\">…<\/span> to intention\".<\/mark> <mark class=\"new\">Here there is both a ban at the place of delivery and a plan to break it.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The right routing line for your opening: a ban at the place of delivery points to <i>Ralli<\/i>, a plan to break it to <i>Foster<\/i>. It only sends you on to the blocks with the marks."}, {"letter": "B", "code": "C2.10.3", "title": "Foster: Beyond the Paradigm", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Magdeev<\/i> (and <i>Waugh v Morris<\/i>), intention at formation decides<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Beyond the paradigm: per Chong (mid-term feedback), <i>Foster<\/i> usually bites on illegality at the outset but may also apply outside it, e.g.<\/mark> <mark class=\"new\">Quanta's smuggling in performing the contract<\/mark><mark class=\"same\">, the thrust being<\/mark> <mark class=\"new\">Quanta's<\/mark> <mark class=\"same\">wicked intention<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Royal Boskalis<\/i>, unilateral intention bars only its holder, so<\/mark> <mark class=\"new\">Helion<\/mark> <mark class=\"same\">may sue<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">4<\/span><span class=\"tx\"><mark class=\"new\">The smuggling was contemplated within Freedonia (<i>Surewin<\/i>), and the proper law is irrelevant.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "C1.6.3", "title": "Default Rule: Foreign Law Not Pleaded", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Brownlie<\/i>, if neither party pleads<\/mark> <mark class=\"new\">English law<\/mark><mark class=\"same\">, Singapore law applies in its own right (adversarial procedure, arguably tacit agreement), not by presumption.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Singapore law frustrates the contract, so Quanta, which needs non-frustration, must plead and prove English law.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "C2.10.5", "title": "Ralli: After the Variation", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ralli Brothers<\/i>,<\/mark> <mark class=\"new\">delivery into Freedonia after its ban<\/mark> <mark class=\"same\">is unenforceable in so far as unlawful at<\/mark> <mark class=\"new\">the contractual place of performance<\/mark><mark class=\"same\">, whatever<\/mark> <mark class=\"new\">English law says<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">(1) Independent rule (start here): per <i>Esben<\/i>, Dicey's rule rooted in comity<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">(2) Frustration (alternative): <i>Peh Teck Quee<\/i> leaned to it<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">so ask whether<\/mark> <mark class=\"new\">English law<\/mark> <mark class=\"same\">frustrates or permits<\/mark> <mark class=\"new\">delivery in Charltonia<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">4<\/span><span class=\"tx\"><mark class=\"new\">After the variation, the contractual place is Charltonia, where delivery is lawful.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "C2.10.6", "title": "Tainting by Foreign Illegality", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Helion<\/mark> <mark class=\"same\">argues<\/mark> <mark class=\"new\">the smuggling<\/mark> <mark class=\"same\">taints<\/mark> <mark class=\"new\">Quanta's claim<\/mark><mark class=\"same\">, asking per <i>Euro-Diam<\/i> (1) is there a relevant foreign illegality, and (2) is it sufficiently connected to<\/mark> <mark class=\"new\">the claim<\/mark><mark class=\"same\">?<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ryder Industries<\/i>, not every breach counts<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">The smuggling is a serious crime, so Step 1 is met.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Tainting is for a claim on another contract affected by a related illegality, such as Quanta's claim against its own buyer. Here the illegality is in performing this contract, which is <i>Foster<\/i>'s ground."}, {"letter": "F", "code": "C2.10.7", "title": "Reliance on the Illegality as a Defence", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Esben Finance<\/i>,<\/mark> <mark class=\"new\">Helion<\/mark> <mark class=\"same\">may rely on<\/mark> <mark class=\"new\">the Foster arrangement<\/mark> <mark class=\"same\">against<\/mark> <mark class=\"new\">Quanta's claim<\/mark> <mark class=\"same\">unless the outcome would stultify comity<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Esben<\/i>, ex dolo malo bars<\/mark> <mark class=\"new\">Quanta's cause of action<\/mark><mark class=\"same\">, not defences; illegality is a shield, not a sword<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Helion may use the illegality as a shield, which is how it defends here. One line; the work is in showing that <i>Foster<\/i> applies."}, {"letter": "G", "code": "C2.2.2", "title": "Attack: Not Bona Fide", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Peh Teck Quee<\/i>, choosing<\/mark> <mark class=\"new\">English law<\/mark> <mark class=\"same\">to evade<\/mark> <mark class=\"new\">the Lusitanian surcharge<\/mark> <mark class=\"same\">defeats the clause only if evasion was the sole purpose.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">No English<\/mark> <mark class=\"same\">connection and<\/mark> <mark class=\"new\">the lawyers' advice<\/mark> <mark class=\"same\">show that evading<\/mark> <mark class=\"new\">Lusitanian law, the OPL,<\/mark> <mark class=\"same\">was the sole purpose, so the clause is struck out completely<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">But English and Lusitanian law agree on frustration, so the point barely matters.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Arguable: there is no English connection, and the clause was chosen to dodge the surcharge. But if it fails, the OPL is Lusitanian, which gives the same answer on frustration, so it barely matters."}]}, {"id": "C-02.2", "side": "C", "hyp": 2, "n": 2, "source": "Mock Paper 2, Hypo 4", "title": "Quanta v Bellamy and Helion", "full": "Mock Paper 2, Hypo 4", "q": "<p>Assume the Singapore court will assume jurisdiction over all relevant parties.<\/p><p>Helion Materials Ltd, a Lusitanian company, sold rare-earth magnets to Quanta Pte Ltd, a Singapore company, for delivery to Quanta's factory in Freedonia, with payment into Helion's Singapore bank account. The contract is governed by English law. After Freedonia banned imports of Lusitanian magnets, Helion agreed to discharge the remaining shipments in Charltonia. Unknown to Helion, Quanta's logistics manager then had the magnets trucked into Freedonia under invoices describing them as scrap metal. Smuggling is a crime punishable by imprisonment in Freedonia; the false description on the invoices is, on its own, an administrative infringement attracting a small penalty. Helion stopped shipping as soon as the press reported the smuggling. It has not been paid for the last two shipments delivered, and it counterclaims for their price.<\/p><p>Quanta incorporated the magnets into motors which it sold to Bellamy Ltd, an Elbonian manufacturer, under a contract expressly governed by Elbonian law. Bellamy refuses to pay for the last consignment of motors, because they were built with smuggled magnets. Under Elbonian law, but not Singapore law, Quanta's smuggling is so closely connected to the Bellamy contract as to make that contract unenforceable.<\/p><p>Advise Quanta on its claim against Bellamy for the price of the motors and on Helion's counterclaim.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> One smuggling plan, two other contracts. Against Bellamy the question is tainting of a different contract; against Helion the question is whether an innocent party can still be paid.<\/p>\n<p><strong>Bellamy: C2.10.6.<\/strong> Step 1: smuggling is a serious crime, though the false invoice alone is a minor infringement that cannot taint (<i>Ryder<\/i>). Step 2: which law's principles decide connection? Chong says the proper law of the contract sued on, Elbonian law, under which there is a connection. C&amp;Y also favour the proper law, so Quanta likely fails; on Singapore principles it would not.<\/p>\n<p><strong>Helion's counterclaim: C2.10.3.<\/strong> The smuggling intention was Quanta's alone. Unilateral intention bars only its holder (<i>Royal Boskalis<\/i>), so Helion, which knew nothing, may enforce.<\/p>\n<p><strong>The price: C2.10.5.<\/strong> Payment was due in Singapore, where it is lawful, so <i>Ralli<\/i> does not touch the counterclaim.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not treat the false invoice as the illegality; on its own it is administrative and cannot taint. And do not let Quanta's illegality infect Helion's claim.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Bellamy can likely resist the price because the smuggling is a serious illegality and, under the Elbonian proper law of the motor contract, it is sufficiently connected to taint that contract; Helion's counterclaim succeeds, because the smuggling plan was Quanta's alone and payment in Singapore is lawful, so neither Foster nor Ralli bars Helion.<\/blockquote>", "items": [{"letter": "A", "code": "C2.10.3", "title": "Unilateral Intention", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Royal Boskalis<\/i>, unilateral intention bars only its holder, so<\/mark> <mark class=\"new\">Helion<\/mark> <mark class=\"same\">may sue (Ang v Lyu; Surewin)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Helion knew nothing of the smuggling when it shipped.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "C2.10.7", "title": "Reliance on the Illegality as a Defence", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Esben<\/i>, ex dolo malo bars<\/mark> <mark class=\"new\">causes of action<\/mark><mark class=\"same\">, not defences; illegality is a shield, not a sword<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Bellamy uses the smuggling as a shield against the price claim.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Bellamy uses the illegality as a shield, which is permitted. It does not decide whether the taint reaches the motor contract."}, {"letter": "C", "code": "C2.10.6", "title": "Tainting by Foreign Illegality", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Bellamy<\/mark> <mark class=\"same\">argues<\/mark> <mark class=\"new\">the smuggling<\/mark> <mark class=\"same\">taints<\/mark> <mark class=\"new\">Quanta's claim on the motor contract<\/mark><mark class=\"same\">, asking per <i>Euro-Diam<\/i> (1) is there a relevant foreign illegality, and (2) is it sufficiently connected to<\/mark> <mark class=\"new\">the claim<\/mark><mark class=\"same\">?<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Smuggling is serious.<\/mark> <mark class=\"same\">As in <i>Ryder Industries<\/i><\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">the false invoice on its own<\/mark> <mark class=\"same\">does not taint.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Which proper law: per Chong (seminar), that of<\/mark> <mark class=\"new\">the Bellamy contract, the claim sued on<\/mark><mark class=\"same\">, not of<\/mark> <mark class=\"new\">the Helion contract, the tainting transaction<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "C2.10.5", "title": "Ralli: The Place of Payment", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ralli Brothers<\/i>,<\/mark> <mark class=\"new\">payment into Helion's Singapore account<\/mark> <mark class=\"same\">is unenforceable in so far as unlawful at<\/mark> <mark class=\"new\">the contractual place of performance<\/mark><mark class=\"same\">, whatever<\/mark> <mark class=\"new\">English law says<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Ralli biting only \"in so far as\" performance is unlawful.<\/mark> <mark class=\"new\">Payment in Singapore is lawful, so Ralli does not touch the price.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "C2.10.2", "title": "Route B: Forum International Public Policy", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">per <i>Westacre<\/i>, so is<\/mark> <mark class=\"new\">a contract built on smuggling<\/mark> <mark class=\"same\">under any<\/mark> <mark class=\"new\">proper law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So both the Bellamy contract and Helion's counterclaim fall to forum international public policy.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Route B is for conduct as grave as terrorism or corruption, or extreme duress. Smuggling magnets is handled by <i>Foster<\/i> and tainting, and Helion is innocent anyway."}, {"letter": "F", "code": "C2.2.1", "title": "Express Choice of Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Peh Teck Quee<\/i>, applying <i>Vita Food<\/i>,<\/mark> <mark class=\"new\">the motor contract<\/mark><mark class=\"same\">'s choice of<\/mark> <mark class=\"new\">Elbonian law<\/mark> <mark class=\"same\">is virtually conclusive<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Elbonian law is the proper law whose tainting principles Chong would apply.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Confirms that Elbonian law governs the motor contract, which is why its tainting principles matter. A line inside C2.10.6."}, {"letter": "G", "code": "C1.6.3", "title": "Default Rule: Foreign Law Not Pleaded", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Brownlie<\/i>, if neither party pleads<\/mark> <mark class=\"new\">Elbonian law<\/mark><mark class=\"same\">, Singapore law applies in its own right (adversarial procedure, arguably tacit agreement), not by presumption.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Under Singapore law there is no sufficient connection, so Bellamy must plead and prove Elbonian law.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "A good tactical point: if Bellamy does not plead Elbonian law, Singapore law applies and finds no connection. So Bellamy must plead and prove it."}]}, {"id": "C-02.3", "side": "C", "hyp": 2, "n": 3, "source": "Mock Paper 2, Hypo 4", "title": "Quanta v Rivala", "full": "Mock Paper 2, Hypo 4", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>Helion Materials Ltd, a Lusitanian company, agreed in Lusitania to sell 1,200 tonnes of rare-earth magnets to Quanta Pte Ltd, a Singapore company, for delivery to Quanta's factory in Freedonia. The contract is governed by English law. Quanta's shareholders and senior management are all in Singapore. In February 2025, Helion stopped shipping. A week later, it sold the remaining 200 tonnes to Rivala Corp, a Suburbian company, at a much higher price. At a meeting in Suburbia, Rivala's sales director, who knew of Helion's contract with Quanta, had offered Helion that price on condition that Helion stopped supplying Quanta.<\/p><p>Quanta sues Rivala in Singapore for the tort of inducing breach of contract. Inducing breach of contract is a tort under Singapore and Suburbian law. It is not a tort under Lusitanian law, but the Lusitanian Unfair Competition Code requires a person who procures the breach of a contract in Lusitania to pay compensation to the victim. Quanta's lost profits are recoverable under all relevant laws, but a Lusitanian court would award about half of what a Singapore court would award for the same loss. Quanta's loss of profits was felt in Singapore. Advise Quanta.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A tort with three possible locations, a foreign rule that is not called a tort, and a damages gap. Locate the tort first; the rest follows.<\/p>\n<p><strong>Location: C3.3.2.<\/strong> Inducing breach is located where the contract was broken and the claimant injured, not where the inducement happened (<i>Metall<\/i>). So not Suburbia. The breach was arguably in Lusitania, where shipping stopped, and the loss was felt in Singapore.<\/p>\n<p><strong>Limb 2: C3.3.3.<\/strong> If the tort is in Lusitania, limb 2 needs only some civil liability, and the Unfair Competition Code gives one, even though it is not a tort. If the tort is in Singapore, it is a local tort and Singapore law governs both limbs.<\/p>\n<p><strong>Damages: C1.4.<\/strong> Lost profits are recoverable under all laws, so the head exists. Quantum is traditionally procedural, so Quanta gets the Singapore award. On the <i>Goh Suan Hee<\/i> obiter, Rivala argues quantum is substantive and Quanta gets about half.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not locate the tort where Rivala made its offer. And Rivala's best argument is not about choice of law at all: it is that Quanta's smuggling left nothing enforceable to induce a breach of.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Inducing breach is located where the contract was broken and Quanta was injured, Lusitania or Singapore, not Suburbia; either way both limbs are met, the Lusitanian Code supplying civil liability if the tort is there, and Quanta recovers the Singapore measure of lost profits unless quantum is treated as substantive, though Rivala will argue that Quanta's own smuggling left no enforceable contract to induce a breach of.<\/blockquote>", "items": [{"letter": "A", "code": "C3.3.2", "title": "Inducing Breach of Contract", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Inducing Breach of Contract: per <i>Metall<\/i>, the tort is where<\/mark> <mark class=\"new\">Helion's contract<\/mark> <mark class=\"same\">was broken and<\/mark> <mark class=\"new\">Quanta<\/mark> <mark class=\"same\">injured, e.g.<\/mark> <mark class=\"new\">Lusitania, where shipping stopped, or Singapore, where the loss was felt<\/mark><mark class=\"same\">, not where<\/mark> <mark class=\"new\">the inducement<\/mark> <mark class=\"same\">occurred<\/mark> <mark class=\"new\">(Suburbia)<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Suburbia, where Rivala made its offer, is not the place of the tort.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "C3.2", "title": "Limb 1: Lex Fori", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>IM Skaugen<\/i>, ask whether<\/mark> <mark class=\"new\">Rivala's offer and Helion's breach<\/mark><mark class=\"same\">, if all done in Singapore, would be<\/mark> <mark class=\"new\">the tort of inducing breach<\/mark><mark class=\"same\">, so limb 1<\/mark> <mark class=\"new\">is satisfied<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Singapore law recognises the tort, so this limb is met.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Met, since Singapore law recognises the tort. One line."}, {"letter": "C", "code": "C3.4", "title": "Local Torts", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Rickshaw<\/i>, rejecting <i>Metall<\/i>'s English-law-only rule as \"unduly parochial\" and contrary to comity,<\/mark> <mark class=\"new\">inducing breach<\/mark> <mark class=\"same\">in Singapore still runs both limbs, both pointing to<\/mark> <mark class=\"new\">Singapore law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">If the loss felt here locates the tort in Singapore, Singapore law governs both limbs.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "If the loss felt in Singapore makes this a Singapore tort, both limbs point to Singapore law. A real possibility to argue alongside C3.3.2."}, {"letter": "D", "code": "C1.4", "title": "Damages", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Boys v Chaplin<\/i> and <i>Harding v Wealands<\/i>, heads<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">are substantive, so<\/mark> <mark class=\"new\">lost profits<\/mark> <mark class=\"same\">must exist under<\/mark> <mark class=\"new\">both laws<\/mark><mark class=\"same\">, but quantum is procedural, so<\/mark> <mark class=\"new\">Quanta<\/mark> <mark class=\"same\">recovers<\/mark> <mark class=\"new\">the full Singapore award<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Goh Suan Hee<\/i> (obiter), the split is \"wholly artificial\", so if quantum is substantive<\/mark> <mark class=\"new\">Quanta<\/mark> <mark class=\"same\">recovers<\/mark> <mark class=\"new\">about half<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "C3.6.5", "title": "Party Autonomy in Tort", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Rivala<\/mark> <mark class=\"same\">argues<\/mark> <mark class=\"new\">the English-law clause in the Helion contract<\/mark> <mark class=\"same\">applies<\/mark> <mark class=\"new\">English law<\/mark> <mark class=\"same\">to<\/mark> <mark class=\"new\">the inducement claim<\/mark><mark class=\"same\">, an open question (<i>Ong Ghee Soon<\/i>), though \"just a small step away\" (C&amp;Y).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So English law governs Quanta's claim against Rivala.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Rivala is not a party to the Helion contract, so its English-law clause cannot govern Quanta's tort claim against Rivala. Party autonomy binds only those who chose."}, {"letter": "F", "code": "C3.3.3", "title": "Applying Limb 2", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Limb 2 is satisfied if<\/mark> <mark class=\"new\">Lusitanian law<\/mark> <mark class=\"same\">gives<\/mark> <mark class=\"new\">a statutory right to compensation<\/mark> <mark class=\"same\">for<\/mark> <mark class=\"new\">procuring the breach<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The Unfair Competition Code is not a tort, but civil liability is enough.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "C2.10.3", "title": "Foster: Unilateral Intention", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Royal Boskalis<\/i>, unilateral intention bars only its holder<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Rivala will say that, since Quanta's own smuggling plan barred it from enforcing the Helion contract, there was no enforceable contract to induce Helion to break.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Rivala's best merits point: if Quanta's smuggling barred it from enforcing the Helion contract, there was arguably nothing to induce a breach of. Worth flagging as a risk."}]}, {"id": "C-03.1", "side": "C", "hyp": 3, "n": 1, "source": "Mock Paper 3, Hypo 6", "title": "Dr Ong v Tomas", "full": "Mock Paper 3, Hypo 6", "q": "<p>Assume the Singapore court has jurisdiction over all the claims.<\/p><p>Dr Ong, the Singapore-domiciled founder of a chain of aesthetic clinics, was attacked by Tomas, a Ruritanian-domiciled influencer, in a video he recorded on holiday in Suburbia and posted on Glimmer, a platform hosted in Yesouth. He said that Dr Ong \"knowingly injected poison into her patients\". The video was viewed 40,000 times in Singapore, 5,000 times in Ruritania and 300 times in Suburbia. Tomas also posted Dr Ong's Singapore home address and urged his followers to \"pay her a visit\". Dr Ong received threats, became ill, and lost a place on a medical board.<\/p><p>Dr Ong sues Tomas in Singapore for defamation and for the statutory tort of doxxing under the Online Safety (Relief and Accountability) Act 2025 (OSRAA), claiming damages for emotional distress and for the lost board place. Glimmer's terms of use, which Tomas accepted but Dr Ong did not, choose the law of Yesouth for all disputes arising from any post on the platform. Tomas says that this clause protects him.<\/p><p>The statement is defamatory under the laws of Singapore, Ruritania and Suburbia. \"Honest opinion on a matter of public concern\" is a complete defence under Ruritanian law only. Damages for injury to feelings in defamation are available under Singapore and Suburbian law but never under Ruritanian law. Under Ruritanian and Suburbian law, all tort claims must be brought within one year of the harm; that period has expired, but Singapore's has not. Advise Dr Ong.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> One video, two torts and three places of publication. Defamation stays under double actionability publication by publication; doxxing has its own statutory connecting factor.<\/p>\n<p><strong>Defamation: C3.7.1.<\/strong> Each publication is a separate tort, located where the video was downloaded. The 40,000 Singapore views are a local tort, and Tomas must plead foreign law for the Ruritanian and Suburbian views. OSRAA s 101 does not reach common law defamation.<\/p>\n<p><strong>Singapore views: C3.4.<\/strong> A local tort runs both limbs to Singapore law. Displacing it needs fortuity, and Tomas targeted her Singapore reputation. So honest opinion is irrelevant, distress damages are recoverable and the claim is in time.<\/p>\n<p><strong>Doxxing: C3.3.4.<\/strong> Section 101 treats the Part 10 tort as committed in Singapore if it was perceived here or caused damage here, so both limbs give Singapore law. The Yesouth clause cannot exclude it: Dr Ong is not a party, and party autonomy is not recognised in tort.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not cite s 102 to defeat the Glimmer clause: it covers Parts 11 and 12, not Part 10. And do not let the foreign time bars touch the Singapore views; they apply only to the torts abroad.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The Singapore publication is a local tort governed by Singapore law on both limbs, so Dr Ong recovers for it, distress included, while the Ruritanian and Suburbian publications fail on the one-year bars under FLPA s 3(2); the doxxing tort is deemed committed in Singapore by OSRAA s 101, and Glimmer's Yesouth clause, which Dr Ong never agreed to, cannot displace it.<\/blockquote>", "items": [{"letter": "A", "code": "C3.6.5", "title": "Party Autonomy in Tort", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Tomas<\/mark> <mark class=\"same\">argues<\/mark> <mark class=\"new\">Glimmer's clause (\"all disputes arising from any post\")<\/mark> <mark class=\"same\">applies<\/mark> <mark class=\"new\">Yesouth law<\/mark> <mark class=\"same\">to<\/mark> <mark class=\"new\">both torts<\/mark><mark class=\"same\">, an open question (<i>Ong Ghee Soon<\/i>), though \"just a small step away\" (C&amp;Y).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">But Dr Ong never agreed to the terms, so there is no choice between these parties to give effect to.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Answers Tomas's argument: whether a contract's law can govern a tort is open, but Dr Ong never agreed to Glimmer's terms. One line."}, {"letter": "B", "code": "C3.7.1", "title": "Defamation: Place of Publication", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Low Tuck Kwong<\/i>, double actionability applies and the tort is where<\/mark> <mark class=\"new\">the video<\/mark> <mark class=\"same\">is published, each publication a separate tort, so<\/mark> <mark class=\"new\">the 40,000 Singapore views<\/mark> <mark class=\"same\">are local (C3.4) and<\/mark> <mark class=\"new\">Tomas<\/mark> <mark class=\"same\">must plead<\/mark> <mark class=\"new\">Ruritanian or Suburbian law<\/mark> <mark class=\"same\">for<\/mark> <mark class=\"new\">the foreign views<\/mark> <mark class=\"same\">(C3.5).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">OSRAA: s 101 reaches only<\/mark> <mark class=\"new\">Part 10 to 12 harms such as doxxing<\/mark> <mark class=\"same\">(Yeo), so<\/mark> <mark class=\"new\">Dr Ong's defamation claim<\/mark> <mark class=\"same\">stays under double actionability (C3.3.4).<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "C1.5.3", "title": "FLPA: Tort Cases", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 3(2) FLPA, a foreign law considered \"for the purpose of actionability\" is deemed to apply under s 3(1), a \"clear reference\" to double actionability (<i>IM Skaugen<\/i>), so<\/mark> <mark class=\"new\">the Ruritanian and Suburbian publications are<\/mark> <mark class=\"same\">barred under<\/mark> <mark class=\"new\">those laws' one-year period<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Flexible exception: if it selects<\/mark> <mark class=\"new\">Singapore law as a single law<\/mark><mark class=\"same\">, that law's period applies, being the Limitation Act if<\/mark> <mark class=\"new\">Singapore law<\/mark> <mark class=\"same\">governs.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Right for the foreign publications: s 3(2) applies only the lex loci delicti's period, so the Ruritanian and Suburbian views are time-barred. It does not touch the Singapore views, which carry most of the damage."}, {"letter": "D", "code": "C3.3.3", "title": "Applying Limb 2", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Limb 2 is satisfied if<\/mark> <mark class=\"new\">Ruritanian law<\/mark> <mark class=\"same\">gives<\/mark> <mark class=\"new\">a defamation claim<\/mark> <mark class=\"same\">for<\/mark> <mark class=\"new\">the statement<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Ruritanian law's honest opinion defence and its bar on distress damages mean that,<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">so<\/mark> <mark class=\"new\">Tomas<\/mark> <mark class=\"same\">escapes unless<\/mark> <mark class=\"new\">Ruritanian law<\/mark> <mark class=\"same\">is displaced (C3.6.3).<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Time Bar:<\/mark> <mark class=\"new\">Ruritanian law<\/mark><mark class=\"same\">'s<\/mark> <mark class=\"new\">one-year period<\/mark> <mark class=\"same\">bars<\/mark> <mark class=\"new\">the Ruritanian claim<\/mark> <mark class=\"same\">via s 3(2) FLPA<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Shows why the Ruritanian publication also fails on limb 2 (honest opinion, no distress damages). Correct but secondary: those 5,000 views are a small part of the claim."}, {"letter": "E", "code": "C3.8.2", "title": "Sayers: Exemption Clause as a Defence", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Glimmer's clause<\/mark><mark class=\"same\">, valid under<\/mark> <mark class=\"new\">Yesouth law<\/mark><mark class=\"same\">, excludes<\/mark> <mark class=\"new\">defamation<\/mark> <mark class=\"same\">liability that Singapore law<\/mark> <mark class=\"new\">imposes<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Per the Sayers majority,<\/mark> <mark class=\"same\">only the proper law of the contract mattered, and it being Dutch, \"this action is dead\" (Salmon LJ), so if<\/mark> <mark class=\"new\">Yesouth law<\/mark> <mark class=\"same\">validates<\/mark> <mark class=\"new\">Glimmer's clause<\/mark><mark class=\"same\">,<\/mark> <mark class=\"new\">Dr Ong's claim<\/mark> <mark class=\"same\">fails.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Glimmer's clause chooses a law; it does not exclude liability, and Dr Ong is not a party to it. <i>Sayers<\/i> concerns an exemption clause between the parties to the tort."}, {"letter": "F", "code": "C3.3.4", "title": "OSRAA s 101: Tort Deemed in Singapore", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 101 OSRAA 2025, a<\/mark> <mark class=\"new\">Part 10<\/mark> <mark class=\"same\">tort is treated as in Singapore if any element was (a) initiated in or from Singapore, (b) perceived here, or (c) caused<\/mark> <mark class=\"new\">harm<\/mark> <mark class=\"same\">here, so<\/mark> <mark class=\"new\">the address post, viewed and acted on here,<\/mark> <mark class=\"same\">makes it a local tort.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Choice of law clause:<\/mark> <mark class=\"new\">Glimmer's Yesouth clause<\/mark> <mark class=\"same\">cannot exclude<\/mark> <mark class=\"new\">Tomas's doxxing liability<\/mark><mark class=\"same\">, party autonomy being unrecognised in tort (Yeo; C3.6.5).<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "C3.4", "title": "Local Torts", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Rickshaw<\/i>, rejecting <i>Metall<\/i>'s English-law-only rule as \"unduly parochial\" and contrary to comity,<\/mark> <mark class=\"new\">defamation published<\/mark> <mark class=\"same\">in Singapore still runs both limbs, both pointing to<\/mark> <mark class=\"new\">Singapore law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Point of difference: the exception may apply<\/mark> <mark class=\"new\">Ruritanian law<\/mark> <mark class=\"same\">where<\/mark> <mark class=\"new\">the Singapore publication<\/mark> <mark class=\"same\">is purely fortuitous<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">It is not: Tomas targeted her Singapore reputation, and 40,000 views were here.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">So for the Singapore views: liable, honest opinion irrelevant, distress damages recoverable, not time-barred.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"id": "C-03.2", "side": "C", "hyp": 3, "n": 2, "source": "Mock Paper 3, Hypo 6", "title": "Aria v Beryl", "full": "Mock Paper 3, Hypo 6", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>Aria Clinics Pte Ltd, a Singapore company which runs aesthetic clinics in Singapore and Utopia, engaged Beryl Labs Ltd, a Utopian company, to test a new dermal filler. The testing contract was concluded in Utopia and provides:<\/p><p>\"16. All disputes arising out of or in connection with this contract, whether in contract, tort or otherwise, shall be governed by Utopian law. 17. Beryl's total liability under or in connection with this contract, whether in contract or tort, shall not exceed the fees paid to it.\"<\/p><p>Beryl's scientists carried out the tests carelessly in Utopia and e-mailed a clean report to Aria's chief operating officer, who read it on his phone while on holiday in Buritania and from there approved a bulk order. The filler harmed several patients. Aria recalled it, compensated the patients in Singapore and suffered heavy losses, which were felt in Singapore.<\/p><p>Aria sues Beryl in Singapore in negligence. Beryl is liable in negligence under Singapore and Buritanian tort law. Under Utopian law there is no liability in tort for pure economic loss, but a party is contractually liable for carelessness in performing a contract. Clause 17 is valid under Utopian law, but not enforceable under Singapore law, as it does not satisfy the requirement of reasonableness. Advise Aria.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Careless work abroad, a report read in a third country and loss felt at home, plus a contract with a tort-wide choice of law and a liability cap. Locate the tort, check limb 2, then deal with the cap.<\/p>\n<p><strong>Location: C3.3.2.<\/strong> Negligence focuses on the act (<i>Vibrant Group<\/i>), so the tort is in Utopia, where the testing was done. Reading the report in Buritania was fortuitous, and the loss in Singapore does not move it.<\/p>\n<p><strong>Limb 2: C3.3.3.<\/strong> Utopian law has no tort liability for pure economic loss, but it makes Beryl contractually liable for careless performance. Civil liability of any kind satisfies limb 2 (<i>Ong Ghee Soon<\/i>; AY24-25 feedback).<\/p>\n<p><strong>The cap: C3.8.2.<\/strong> On the <i>Sayers<\/i> majority's view, only the proper law matters, and Utopian law upholds cl 17. On the preferred view, admissibility is a tort question and validity a contract question; Aria argues Singapore's rule on admissibility. Best view: the cap likely applies.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not treat cl 16 as deciding the tort. Party autonomy in tort runs only through the flexible exception, and Singapore is not fortuitous. Beryl's real protection is cl 17, not cl 16.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The negligence was committed in Utopia, where the testing was done, and limb 2 is met because Utopian law makes Beryl liable in contract for careless performance, so Aria's claim is actionable; but cl 17, valid under its Utopian proper law, likely caps Beryl's liability at the fees, unless the court treats admissibility as a tort question and applies Singapore's reasonableness rule.<\/blockquote>", "items": [{"letter": "A", "code": "C3.6.3", "title": "Displacing the Lex Loci Delicti", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">In <i>Boys v Chaplin<\/i>, British servicemen collided in Malta, and per Lord Wilberforce Malta had no interest in applying its special-damages-only rule to non-residents, so<\/mark> <mark class=\"new\">Utopia's bar on economic loss in tort<\/mark> <mark class=\"same\">yields for<\/mark> <mark class=\"new\">Aria<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">But Utopia, where the testing was done, is not fortuitous.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Aria might try to displace Utopian law, but Utopia is where the testing was done, so it is not fortuitous. Limb 2 is met anyway."}, {"letter": "B", "code": "C3.3.3", "title": "Applying Limb 2", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Limb 2 is satisfied if<\/mark> <mark class=\"new\">Utopian law<\/mark> <mark class=\"same\">gives<\/mark> <mark class=\"new\">a contractual remedy<\/mark> <mark class=\"same\">for<\/mark> <mark class=\"new\">the careless testing<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Utopian contractual liability for careless performance is a civil remedy, so limb 2 is met.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "C3.2", "title": "Limb 1: Lex Fori", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>IM Skaugen<\/i>, ask whether<\/mark> <mark class=\"new\">Beryl's careless testing and report<\/mark><mark class=\"same\">, if all done in Singapore, would be<\/mark> <mark class=\"new\">negligence causing economic loss<\/mark><mark class=\"same\">, so limb 1<\/mark> <mark class=\"new\">is satisfied<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Beryl is liable in negligence under Singapore law.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Met: Beryl is liable in negligence under Singapore law. One line."}, {"letter": "D", "code": "C3.4", "title": "Local Torts", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Rickshaw<\/i>, rejecting <i>Metall<\/i>'s English-law-only rule as \"unduly parochial\" and contrary to comity,<\/mark> <mark class=\"new\">negligence causing loss<\/mark> <mark class=\"same\">in Singapore still runs both limbs, both pointing to<\/mark> <mark class=\"new\">Singapore law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The losses were felt in Singapore, so this is a local tort.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Negligence is located by the act, not by where loss was felt (<i>Vibrant Group<\/i>). The testing was in Utopia, so this is not a Singapore tort."}, {"letter": "E", "code": "C3.8.2", "title": "Limitation Clause as a Defence to Tort", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Sayers majority:<\/mark> <mark class=\"same\">only the proper law of the contract mattered, and it being Dutch, \"this action is dead\" (Salmon LJ), so if<\/mark> <mark class=\"new\">Utopian law<\/mark> <mark class=\"same\">validates<\/mark> <mark class=\"new\">cl 17<\/mark><mark class=\"same\">,<\/mark> <mark class=\"new\">the claim above the fees<\/mark> <mark class=\"same\">fails.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">(1) admissibility is a tort question for double actionability, and (2) validity a contract question for<\/mark> <mark class=\"new\">the proper law<\/mark><mark class=\"same\">, so<\/mark> <mark class=\"new\">cl 17<\/mark><mark class=\"same\">, valid under<\/mark> <mark class=\"new\">Utopian law<\/mark><mark class=\"same\">, succeeds only if admissible under both<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">Utopia<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "C3.3.2", "title": "Negligence: Focus on the Act", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Vibrant Group<\/i>, the place of<\/mark> <mark class=\"new\">the negligent testing<\/mark> <mark class=\"same\">prevails, so<\/mark> <mark class=\"new\">the testing<\/mark> <mark class=\"same\">performed in<\/mark> <mark class=\"new\">Utopia<\/mark> <mark class=\"same\">locates the tort there despite<\/mark> <mark class=\"new\">reading in Buritania and loss<\/mark> <mark class=\"same\">in Singapore.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Negligent services / advice: where<\/mark> <mark class=\"new\">the tests<\/mark> <mark class=\"same\">were or ought to have been<\/mark> <mark class=\"new\">carried out<\/mark> <mark class=\"same\">(Voth).<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Reliance weighs less: in<\/mark> <mark class=\"new\">negligence<\/mark><mark class=\"same\">, reliance is only one route to<\/mark> <mark class=\"new\">a duty<\/mark> <mark class=\"same\">(NTUC Foodfare; Vibrant).<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "C3.6.5", "title": "Party Autonomy in Tort", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Beryl<\/mark> <mark class=\"same\">argues<\/mark> <mark class=\"new\">cl 16 (\"whether in contract, tort or otherwise\")<\/mark> <mark class=\"same\">applies<\/mark> <mark class=\"new\">Utopian law<\/mark> <mark class=\"same\">to<\/mark> <mark class=\"new\">the negligence claim<\/mark><mark class=\"same\">, an open question (<i>Ong Ghee Soon<\/i>), though \"just a small step away\" (C&amp;Y).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Route Through the Exception (C&amp;Y):<\/mark> <mark class=\"new\">only via the flexible exception, and Singapore, where Aria is based and the loss was felt, is not fortuitous.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Answers Beryl's reliance on cl 16: a contractual choice can govern a tort only through the flexible exception, and Singapore is not fortuitous. One line."}]}, {"id": "C-03.3", "side": "C", "hyp": 3, "n": 3, "source": "Mock Paper 3, Hypo 6", "title": "Aria v Tomas and Zentra", "full": "Mock Paper 3, Hypo 6", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>Aria Clinics Pte Ltd, a Singapore company, runs aesthetic clinics in Singapore and Utopia. Tomas, a Ruritanian-domiciled influencer, posted a video saying that Aria's founder had \"knowingly injected poison into her patients\". The video was viewed mostly in Singapore. Tomas had been paid to make it by Zentra Inc, a Ruritanian company which competes with Aria in Utopia and Ruritania. The arrangement was made at meetings in Ruritania, with the aim of injuring Aria's business. Aria's new patient bookings in Singapore fell sharply.<\/p><p>Aria sues Tomas and Zentra in Singapore for conspiracy to injure by unlawful means. Conspiracy to injure by unlawful means is a tort under Singapore law. Under Ruritanian law it is a tort only where the defendants' dominant purpose is to injure. Under Ruritanian law, all claims in tort must be brought within one year of the harm; that period has expired, but the Singapore period has not.<\/p><p>Advise Aria. How, if at all, would your answer differ if Tomas had not pleaded any foreign law by the time of trial?<\/p>", "why": "<p><strong>What the question is testing.<\/strong> A conspiracy planned abroad and felt at home, where the location decides whether a foreign time bar kills the claim, and a defendant who may never plead the foreign law at all.<\/p>\n<p><strong>Location: C3.3.2.<\/strong> Weigh the <i>EFT<\/i> factors: the conspirators and their combination are Ruritanian; the target and the loss are in Singapore. Arguable, with <i>EFT<\/i> leaning towards Ruritania.<\/p>\n<p><strong>Time bar: C1.5.3.<\/strong> If the tort is in Ruritania, limb 2 is met on the facts (the aim was to injure), but s 3(2) FLPA applies the Ruritanian one-year period, so the claim fails unless s 4(2) helps. If it is in Singapore, there is no bar and liability follows. The flexible exception does not help either side, as Ruritania is not fortuitous, so location decides.<\/p>\n<p><strong>No foreign law pleaded: C1.6.3.<\/strong> A defendant who wants foreign law must plead and prove it. If Tomas does not, Singapore law applies in its own right (<i>Brownlie<\/i>), and the time bar and dominant purpose rule fall away against him. Zentra may still plead them.<\/p>\n<p><strong>Trap to avoid.<\/strong> OSRAA s 101 relocates only Part 10 to 12 online harms. A common law conspiracy is still located by the <i>EFT<\/i> factors.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The conspiracy is arguably located in Ruritania, where the defendants combined, in which case limb 2 is met but the Ruritanian one-year bar under FLPA s 3(2) defeats the claim, whereas if it is located in Singapore the claim succeeds; if Tomas pleads no foreign law, Singapore law applies to the claim against him in its own right and the bar falls away, though Zentra may still rely on it.<\/blockquote>", "items": [{"letter": "A", "code": "C1.6.3", "title": "Default Rule: Foreign Law Not Pleaded", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Brownlie<\/i>, if neither party pleads<\/mark> <mark class=\"new\">Ruritanian law<\/mark><mark class=\"same\">, Singapore law applies in its own right (adversarial procedure, arguably tacit agreement), not by presumption.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">If Tomas does not plead it, the Ruritanian time bar and dominant purpose rule fall away against him; Zentra may still plead them.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "C3.3.2", "title": "Locating the Conspiracy", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>EFT Holdings<\/i>, weigh<\/mark> <mark class=\"new\">Tomas and Zentra, both Ruritanian<\/mark><mark class=\"same\">, where<\/mark> <mark class=\"new\">they combined (Ruritania)<\/mark><mark class=\"same\">,<\/mark> <mark class=\"new\">the video, seen mostly in Singapore<\/mark><mark class=\"same\">,<\/mark> <mark class=\"new\">Aria<\/mark><mark class=\"same\">'s location and<\/mark> <mark class=\"new\">where bookings fell (Singapore)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The factors split; <i>EFT<\/i> leans to where the conspirators combined, though <i>Metall<\/i> need not ignore the damage here.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "C3.5", "title": "Proof of Foreign Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>EFT Holdings<\/i> (applying <i>Goh Chok Tong v Tang Liang Hong<\/i>), pleading<\/mark> <mark class=\"new\">Ruritanian law<\/mark> <mark class=\"same\">is voluntary, so if<\/mark> <mark class=\"new\">Tomas<\/mark> <mark class=\"same\">does not plead it, no conflicts issue arises<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So the burden of raising Ruritanian law sits with the defendants.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Makes the same point as C1.6.3 from the tort side: pleading foreign law is voluntary for the defendant. C1.6.3 states the rule and its effect more directly."}, {"letter": "D", "code": "C3.3.3", "title": "Applying Limb 2", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Limb 2 is satisfied if<\/mark> <mark class=\"new\">Ruritanian law<\/mark> <mark class=\"same\">gives<\/mark> <mark class=\"new\">a conspiracy claim<\/mark> <mark class=\"same\">for<\/mark> <mark class=\"new\">the combination<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">It does if the dominant purpose was to injure, and the facts say the aim was to injure Aria's business.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Limb 2 is met on the facts, since the aim was to injure. The claim still fails on the time bar if the tort is in Ruritania."}, {"letter": "E", "code": "C1.5.4", "title": "Undue Hardship (s 4(2))", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 4(2) FLPA,<\/mark> <mark class=\"new\">Ruritania's one-year period<\/mark> <mark class=\"same\">is contrary to public policy if it causes<\/mark> <mark class=\"new\">Aria<\/mark> <mark class=\"same\">undue hardship.<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Aria gives no reason for letting time run, so this is weak.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Aria's only answer to the bar, but it gives no reason for letting time run. Weak."}, {"letter": "F", "code": "C1.5.3", "title": "FLPA: Tort Cases", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 3(2) FLPA, a foreign law considered \"for the purpose of actionability\" is deemed to apply under s 3(1), a \"clear reference\" to double actionability (<i>IM Skaugen<\/i>), so<\/mark> <mark class=\"new\">the conspiracy claim, if located in Ruritania, is<\/mark> <mark class=\"same\">barred under<\/mark> <mark class=\"new\">Ruritania's one-year period<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">If the tort is located in Singapore, there is no bar.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "C3.3.4", "title": "OSRAA s 101", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 101 OSRAA 2025, a<\/mark> <mark class=\"new\">Part 10<\/mark> <mark class=\"same\">tort is treated as in Singapore if any element was (a) initiated in or from Singapore, (b) perceived here<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The video was viewed mostly here, so the conspiracy is a Singapore tort.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Section 101 applies only to the statutory online harms in Parts 10 to 12. Conspiracy to injure is a common law tort, located under the <i>EFT<\/i> factors."}]}, {"id": "C-04.1", "side": "C", "hyp": 4, "n": 1, "source": "Mock Paper 4, Hypo 8", "title": "Castellan v Lila", "full": "Mock Paper 4, Hypo 8", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>Castellan Bank, an Elbonian bank with a Singapore branch, lent US$2 million through its Singapore private bank to Lila's brother under a loan agreement expressly governed by Utopian law. He defaulted in June 2025. Lila, aged 19, is a Ruritanian domiciliary who is studying and living in Singapore. At a dinner in Singapore, she told Castellan's relationship manager: \"Don't worry, I will stand behind my brother.\" Two days later, he e-mailed her a form of guarantee of her brother's existing debt. The form was expressed to be governed by Utopian law and stated that she would be bound unless she objected within seven days. Lila did not reply. She never signed anything.<\/p><p>Castellan sues Lila in Singapore on the guarantee. Under Utopian domestic contract law, but not Singapore's: (a) silence following an oral assurance amounts to acceptance; (b) no consideration is needed for a guarantee; and (c) a guarantee need not be in writing. Under Ruritanian law, a person under 21 lacks capacity to give a guarantee; under Utopian and Singapore law, a person aged 19 has capacity. Section 6(b) of the Civil Law Act 1909 provides that no action shall be brought to charge a person on a promise to answer for another's debt unless the promise is in writing signed by that person. Advise Castellan.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Three possible defences (no contract, no capacity, no writing), each with its own choice of law rule. The last one is decided by Singapore law whatever the proper law says.<\/p>\n<p><strong>Formation: C2.6.<\/strong> Lila denies any contract, so use the putative proper law. On the double bootstraps, Utopian law says silence is acceptance. But binding someone by silence after a remark at dinner is the case for <i>Lew<\/i>'s \"very small caveat\" (no contract under any law), and Art 6(2) of the Hague Principles points the same way.<\/p>\n<p><strong>Capacity: C2.8.1.<\/strong> The rule is unsettled: domicile (Ruritania, no capacity), place of contracting or proper law. C&amp;Y prefer the objective proper law, since Castellan could otherwise impose a law to suit itself. Singapore or Utopia gives capacity.<\/p>\n<p><strong>Writing: C1.6.1.<\/strong> Decisive. Section 6(b) says \"no action shall be brought\", so it is procedural (<i>Leroux v Brown<\/i>) and binds a Singapore action despite the Utopian proper law. Lila signed nothing.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not save the guarantee through the alternative reference rule for form. Section 6 is procedural, not form, so the proper law cannot satisfy it.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Whether Lila's silence formed a guarantee is for the putative proper law, subject to Lew's caveat, and on C&amp;Y's preferred objective proper law she had capacity, but s 6(b) CLA is procedural, so Castellan's action in Singapore fails because Lila signed nothing, whatever Utopian law says.<\/blockquote>", "items": [{"letter": "A", "code": "C2.6", "title": "Formation: The Putative Proper Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">As<\/mark> <mark class=\"new\">Lila's denial<\/mark> <mark class=\"same\">concerns existence, per <i>Lew v Nargolwala<\/i> a law agreed during negotiations governs (rare)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Double bootstraps (Prof Chong):<\/mark> <mark class=\"new\">Utopian law<\/mark> <mark class=\"same\">first decides whether<\/mark> <mark class=\"new\">the Utopian law clause<\/mark> <mark class=\"same\">was incorporated, then whether<\/mark> <mark class=\"new\">the guarantee<\/mark> <mark class=\"same\">was formed.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Where<\/mark> <mark class=\"new\">Utopian law<\/mark> <mark class=\"same\">binds<\/mark> <mark class=\"new\">Lila<\/mark> <mark class=\"same\">by<\/mark> <mark class=\"new\">silence after a dinner remark<\/mark><mark class=\"same\">, <i>Lew<\/i> left open \"a very small caveat, very rarely applicable\", whose effect is no contract under any law<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "C2.8.1", "title": "Natural Persons", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, the rule is unsettled among<\/mark> <mark class=\"new\">Ruritanian law, her domicile,<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">and<\/mark> <mark class=\"new\">the proper law<\/mark> <mark class=\"same\">(the modern trend: <i>Charron<\/i>; <i>Bodley Head<\/i>).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, as<\/mark> <mark class=\"new\">Castellan<\/mark> <mark class=\"same\">may impose a law under which<\/mark> <mark class=\"new\">Lila<\/mark> <mark class=\"same\">has capacity, the objective proper law should govern, under which<\/mark> <mark class=\"new\">Lila had<\/mark> <mark class=\"same\">capacity.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Singapore or Utopia, the likely objective proper law, both give a 19-year-old capacity.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "C1.2.3", "title": "Critique: The Functional Approach", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, the wide procedural category reflects old judicial parochialism, now tempered by FNC, so<\/mark> <mark class=\"new\">Castellan<\/mark> <mark class=\"same\">argues procedure covers only the \"mode or conduct of court proceedings\" (<i>Goh Suan Hee<\/i>)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>CIFG v Polimet<\/i>, <i>Star City<\/i> remains law since <i>Goh Suan Hee<\/i> left this open<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">so s 6 stays procedural for now.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Castellan's only answer on writing: on a functional view s 6 would be substantive form, governed by Utopian law. Argue it in the alternative, but <i>Star City<\/i> remains law (<i>CIFG v Polimet<\/i>)."}, {"letter": "D", "code": "C2.7", "title": "Formal Validity: Alternative Reference Rule", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>AQCEL<\/i> (adopting <i>PT Jaya Putra<\/i>'s obiter), meeting<\/mark> <mark class=\"new\">the writing requirement<\/mark> <mark class=\"same\">under either<\/mark> <mark class=\"new\">Utopian law, the proper law,<\/mark> <mark class=\"same\">or<\/mark> <mark class=\"new\">the lex loci contractus<\/mark> <mark class=\"same\">suffices, parties rarely thinking about<\/mark> <mark class=\"new\">signatures<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Utopian law needs no writing, so the guarantee is formally valid and s 6 is satisfied.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The alternative reference rule saves formal requirements. Section 6 is procedural, not form, so Utopian law cannot satisfy it."}, {"letter": "E", "code": "C1.6.1", "title": "Writing Requirements", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">s 6 CLA 1909 bars any \"action\" on<\/mark> <mark class=\"new\">Lila's alleged guarantee<\/mark> <mark class=\"same\">without signed writing, so per <i>Leroux v Brown<\/i> it is procedural and binds<\/mark> <mark class=\"new\">the Utopian-law guarantee<\/mark> <mark class=\"same\">here.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Counter: per C&amp;Y, on a functional view (C1.2.3)<\/mark> <mark class=\"new\">s 6<\/mark> <mark class=\"same\">may be substantive, following<\/mark> <mark class=\"new\">Utopian law, the proper law<\/mark> <mark class=\"same\">(C2.7).<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Lila signed nothing, so the action fails here whatever Utopian law says.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "C2.8.2", "title": "Corporations: Dual Test", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y (Dicey r 162),<\/mark> <mark class=\"new\">Lila<\/mark> <mark class=\"same\">needs capacity under both<\/mark> <mark class=\"new\">Ruritanian law<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">the proper law<\/mark><mark class=\"same\">, a subjective proper law being acceptable<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Ruritanian law denies capacity under 21, so the guarantee fails whatever Utopian law says.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The dual test is for corporations. For a natural person the rule is unsettled, and C&amp;Y prefer the objective proper law, so Lila's Ruritanian domicile does not decide it."}, {"letter": "G", "code": "C1.2.2", "title": "Applying the Star City Test", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Star City<\/i>,<\/mark> <mark class=\"new\">s 6(b) (\"no action shall be brought\")<\/mark> <mark class=\"same\">bars only enforcement of<\/mark> <mark class=\"new\">Castellan's right<\/mark><mark class=\"same\">, so Singapore law applies.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Star City<\/i>,<\/mark> <mark class=\"new\">a rule that no obligation arises without writing<\/mark> <mark class=\"same\">negates<\/mark> <mark class=\"new\">the right<\/mark><mark class=\"same\">, so<\/mark> <mark class=\"new\">Utopian law<\/mark> <mark class=\"same\">applies.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The test behind the result: \"no action shall be brought\" bars only enforcement, so Singapore law applies. C1.6.1 applies it to s 6 directly, which is why that is the block to open."}]}, {"id": "C-04.2", "side": "C", "hyp": 4, "n": 2, "source": "Mock Paper 4, Hypo 8", "title": "Castellan v Valtura", "full": "Mock Paper 4, Hypo 8", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>Castellan Bank, an Elbonian bank with a Singapore branch, persuaded the treasurer of Valtura, a Suburbian municipality, to enter into a ten-year interest rate swap in May 2022. Castellan's dealers e-mailed the signed confirmation to Valtura from Singapore, and Valtura's treasurer e-mailed back her acceptance from Suburbia. The confirmation states: \"14. This swap transaction is governed by Elbonian law.\" Payments were due into Castellan's Singapore account or Valtura's Suburbian account, depending on which way rates moved. Valtura has paid Castellan €8 million and stopped paying in January 2026.<\/p><p>Valtura now says that: (i) the Suburbian Local Government Act gives municipalities no power to enter into derivatives, so the swap is void; (ii) the Act requires every municipal contract to be notarised by a Suburbian notary, which was not done; and (iii) the whole confirmation, including clause 14, is voidable because Castellan's dealers told the treasurer that the swap \"could not lose money\".<\/p><p>Under Suburbian law, a transaction by a municipality outside its statutory powers is void. Under Elbonian domestic law, a transaction that a company has no power to enter into is valid unless the other party knew of the lack of power; Castellan did not know. Under Suburbian law, an unnotarised municipal contract is unenforceable; Elbonian and Singapore law have no notarisation requirement. Under all relevant laws, a contract can be rescinded for actionable misrepresentation, and the dealers' statement is actionable under all of them. Advise Castellan whether it can enforce the swap.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Three attacks on one swap (no power, no notary, misrepresentation), each with its own choice of law rule. The proper law, Elbonian law, does most of the work, but not all.<\/p>\n<p><strong>Capacity: C2.8.2.<\/strong> A corporation needs capacity under both its law of incorporation and the proper law. Suburbian law gives Valtura no power, and on the broad <i>Haugesund<\/i> view that is a lack of capacity. But <i>Haugesund<\/i> says the proper law then decides the consequences, and here Elbonian law upholds a transaction where the other side did not know. Valtura replies that the dual test means no contract at all, and that Elbonian law's rule covers companies, not municipalities.<\/p>\n<p><strong>Misrepresentation: C2.2.3.<\/strong> A disputed misrepresentation does not infect cl 14 itself (<i>CIMB<\/i>), so Elbonian law decides rescission. Rescission is available, so the live question is whether Valtura affirmed by paying €8 million.<\/p>\n<p><strong>Notarisation: C2.7.<\/strong> If it has no relevance to the will to be bound, it is form, and the proper law or the place of contracting saves it; acceptance was received in Singapore (<i>Transniko<\/i>). If it has real substance, it goes to capacity. As form, it is satisfied.<\/p>\n<p><strong>Trap to avoid.<\/strong> The proper law's consequences differ from <i>Haugesund<\/i>, where English law made the swap void. Do not import that result.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Valtura lacks power under Suburbian law, but on Haugesund the Elbonian proper law decides the consequences and upholds a swap where Castellan did not know, though Valtura will argue that the dual test leaves no contract; the misrepresentation does not infect cl 14, so Elbonian law decides rescission, subject to affirmation; and notarisation is likely form, satisfied under Elbonian or Singapore law, so Castellan can enforce unless capacity or rescission defeats it.<\/blockquote>", "items": [{"letter": "A", "code": "C2.6", "title": "Formed, Though Voidable", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">A contract voidable for<\/mark> <mark class=\"new\">misrepresentation<\/mark> <mark class=\"same\">was formed, so<\/mark> <mark class=\"new\">Elbonian law<\/mark> <mark class=\"same\">governs \"as if the contract were valid\" (CIMB), formation and validity being distinct (contrast PT First Media).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">So Valtura's attack is on validity, not formation.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Confirms that a voidable contract was formed, so the proper law governs as if valid. C2.2.3 makes the same point about the clause itself, which is the issue here."}, {"letter": "B", "code": "C2.8.1", "title": "Natural Persons", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, the rule is unsettled among<\/mark> <mark class=\"new\">Suburbian law, the treasurer's domicile,<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">and<\/mark> <mark class=\"new\">the proper law<\/mark> <mark class=\"same\">(the modern trend: <i>Charron<\/i>; <i>Bodley Head<\/i>).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">The treasurer had capacity, so Valtura is bound.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Valtura is a municipality, not a natural person. The treasurer's own capacity is beside the point; the corporate dual test applies."}, {"letter": "C", "code": "C2.8.2", "title": "Corporations: Capacity", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y (Dicey r 162),<\/mark> <mark class=\"new\">Valtura<\/mark> <mark class=\"same\">needs capacity under both<\/mark> <mark class=\"new\">Suburbian law, its law of incorporation,<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">Elbonian law, the proper law<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Haugesund<\/i>, once<\/mark> <mark class=\"new\">Suburbian law<\/mark> <mark class=\"same\">denies capacity,<\/mark> <mark class=\"new\">Elbonian law, the proper law,<\/mark> <mark class=\"same\">decides the consequences<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Unlike English law in <i>Haugesund<\/i>, Elbonian law upholds the swap; Valtura replies that its rule is for companies, not municipalities.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "C2.2.1", "title": "Express Choice of Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Peh Teck Quee<\/i>, applying <i>Vita Food<\/i>,<\/mark> <mark class=\"new\">cl 14<\/mark><mark class=\"same\">'s choice of<\/mark> <mark class=\"new\">Elbonian law<\/mark> <mark class=\"same\">is virtually conclusive<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Peh Teck Quee<\/i>,<\/mark> <mark class=\"new\">Elbonian law<\/mark> <mark class=\"same\">needs no connection (cf Art 2(4) Hague Principles)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"new\">Castellan is Elbonian, so the choice is plainly genuine anyway.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Cl 14's choice of Elbonian law is virtually conclusive and plainly genuine. One line to start."}, {"letter": "E", "code": "C2.2.2", "title": "Attack: Not Bona Fide", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Peh Teck Quee<\/i>, choosing<\/mark> <mark class=\"new\">Elbonian law<\/mark> <mark class=\"same\">to evade<\/mark> <mark class=\"new\">Suburbian limits on municipal power<\/mark> <mark class=\"same\">defeats the clause only if evasion was the sole purpose.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Elbonian law was chosen to save swaps that Suburbian law forbids, so it is struck out.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Castellan is an Elbonian bank, so Elbonian law has a genuine connection. Evasion was not the sole purpose, so the choice stands."}, {"letter": "F", "co
