<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Ought Machine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400;1,700&display=swap">
<style>
/* Layout: one patent-style drafting sheet. The drawing and its cards on the left, the bench notes on the right. */
:root{
  /* Same layout as The Forum Machine; LAW301's accent is violet, as on the combined lessons site. */
  --paper:#faf6ee; --sheet:#ffffff; --ink:#2a2a2a; --soft:#77736b; --rule:#e7e0d2; --rule2:#d9d1c1; --grid:transparent; --outline:#6b665c;
  --accent:#5f4b8b; --accent-soft:#ece7f5; --accent-line:#b3a4d4; --on-accent:#ffffff; --amber:#b5761b; --amber-soft:#fbefd6; --go-soft:#e5f3ea;
  --case:#e9c377; --case-ink:#3b2c0e; --chain:#b83b2e; --promise:#b5761b; --go:#2f7d4f; --stone:#8b867b; --stone-ink:#ffffff;
  --sg:#b5554a; --sg-soft:#fbe9e6; --fx:#5f4b8b; --c:#2d4a7a; --d:#6a4c9c;
  --sky1:#f5efe3; --sky2:#fbf8f1; --hill1:#ebe3d1; --hill2:#f1eadb; --road:#ddd5c4; --wood:#c9b695; --brass:#dcc69a; --cream:#fffdf8; --hl:#f1ecdf;
  --zone:rgba(95,75,139,.08); --zone-fill:rgba(255,255,255,.86); --zone-hot:rgba(233,195,119,.42);
  --shadow:0 1px 2px rgba(60,50,30,.06),0 2px 8px rgba(60,50,30,.05);
  --display:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; --stencil:var(--display); --body:var(--display); --mono:var(--display);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1b1d1f; --sheet:#24272a; --ink:#ebe7df; --soft:#a29d93; --rule:#363a3e; --rule2:#44494e; --outline:#a29d93;
  --accent:#b5a4e3; --accent-soft:#2c2740; --accent-line:#5a4f7d; --on-accent:#15181a; --amber:#e0a849; --amber-soft:#3a3020; --go-soft:#1e3427;
  --case:#d9b366; --case-ink:#2a1f08; --chain:#ec8476; --promise:#e0a849; --go:#6cc28e; --stone:#7d786e;
  --sg:#c9766a; --sg-soft:#3d2420; --fx:#b5a4e3; --c:#9db6e4; --d:#b9a2e0;
  --sky1:#202326; --sky2:#24272a; --hill1:#2a2d30; --hill2:#2d3033; --road:#3a3e42; --wood:#6a5f4b; --brass:#7d6d4b; --cream:#2b2e32; --hl:#2d3033;
  --zone:rgba(255,255,255,.08); --zone-fill:rgba(36,39,42,.88); --zone-hot:rgba(224,168,73,.3); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1b1d1f; --sheet:#24272a; --ink:#ebe7df; --soft:#a29d93; --rule:#363a3e; --rule2:#44494e; --outline:#a29d93;
  --accent:#b5a4e3; --accent-soft:#2c2740; --accent-line:#5a4f7d; --on-accent:#15181a; --amber:#e0a849; --amber-soft:#3a3020; --go-soft:#1e3427;
  --case:#d9b366; --case-ink:#2a1f08; --chain:#ec8476; --promise:#e0a849; --go:#6cc28e; --stone:#7d786e;
  --sg:#c9766a; --sg-soft:#3d2420; --fx:#b5a4e3; --c:#9db6e4; --d:#b9a2e0;
  --sky1:#202326; --sky2:#24272a; --hill1:#2a2d30; --hill2:#2d3033; --road:#3a3e42; --wood:#6a5f4b; --brass:#7d6d4b; --cream:#2b2e32; --hl:#2d3033;
  --zone:rgba(255,255,255,.08); --zone-fill:rgba(36,39,42,.88); --zone-hot:rgba(224,168,73,.3); --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font:16px/1.5 var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
#app{max-width:1280px;margin:0 auto;padding-block:14px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.brand{min-width:0}
.brand b{display:block;font:800 clamp(28px,3.4vw,40px)/.95 var(--display);text-transform:uppercase;letter-spacing:.012em}
.brand span{font:500 12.5px/1.3 var(--mono);color:var(--soft)}
.steps{display:flex;flex-wrap:wrap;gap:4px}
.steps button{appearance:none;background:transparent;color:var(--soft);border:1.5px solid transparent;font:600 12.5px/1 var(--mono);padding:7px 9px;cursor:pointer}
.steps button:hover{color:var(--ink);border-color:var(--rule)}
.steps button[aria-current="step"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:18px;align-items:start}
.left{display:flex;flex-direction:column;gap:12px;min-width:0}
.rig{position:sticky;top:8px;z-index:20;background:var(--sheet);border:1.5px solid var(--ink);outline:1px solid var(--rule);outline-offset:3px;margin:4px;container-type:inline-size}
.art{display:block;width:100%;height:auto;user-select:none}
.capbar{display:flex;justify-content:space-between;gap:12px;height:23px;align-items:center;border-top:1px solid var(--rule);padding-inline:10px;font:500 11px/1 var(--mono);color:var(--soft);white-space:nowrap;overflow:hidden}
.zones{position:absolute;inset:0 0 23px 0;pointer-events:none}
.zone{position:absolute;pointer-events:auto;appearance:none;display:flex;align-items:center;justify-content:center;text-align:center;
  border:2px dashed var(--ink);background:var(--zone-fill);color:var(--ink);font:600 clamp(11px,1.7cqw,15px)/1.25 var(--mono);padding:6px;cursor:pointer}
.zone.wide{background:var(--zone)}
.zone.hot,.zone:hover{background:var(--zone-hot);border-style:solid}
.stamp{position:absolute;left:50%;top:3%;transform:translateX(-50%) rotate(-3deg);font:700 clamp(15px,3.5cqw,34px)/1 var(--stencil);
  letter-spacing:.03em;text-transform:uppercase;padding:.2em .5em .14em;border:3px solid currentColor;color:var(--ink);background:var(--sheet);white-space:nowrap;
  animation:stamp .26s cubic-bezier(.2,1.5,.4,1) both;pointer-events:none}
.stamp.go{color:var(--go)} .stamp.bad{color:var(--chain)}
@keyframes stamp{from{transform:translateX(-50%) rotate(-3deg) scale(2.1);opacity:0}to{transform:translateX(-50%) rotate(-3deg) scale(1);opacity:1}}
#tray{display:flex;flex-direction:column;gap:8px;min-width:0;margin-inline:4px}
.tray-head{font:600 12px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:9px}
.hand.deck{grid-template-columns:minmax(0,560px)}
.card{appearance:none;display:block;width:100%;text-align:left;background:var(--sheet);color:var(--ink);border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--rule);
  font:400 14.5px/1.36 var(--body);padding:10px 12px;cursor:grab;touch-action:pan-y;user-select:none;transition:transform .12s,box-shadow .12s}
.hand.deck .card{font-size:16.5px;padding:13px 15px}
.card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--rule)}
.card.sel{outline:3px solid var(--case);outline-offset:1px}
.card:disabled{opacity:.5;cursor:default}
.card small{display:block;font:600 11px/1.2 var(--mono);color:var(--soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.ghost{position:fixed;z-index:60;pointer-events:none;transform:rotate(-2.5deg);box-shadow:8px 10px 0 var(--zone)}
.shake{animation:shake .32s linear}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{appearance:none;background:transparent;color:var(--ink);border:1px solid var(--rule);font:500 12px/1 var(--mono);padding:5px 7px;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip.ok{color:var(--go);border-color:var(--go)} .chip.no{color:var(--chain);border-color:var(--chain)} .chip.cond{color:var(--soft);border-style:dashed}
.bench{display:flex;flex-direction:column;gap:12px;min-width:0;padding-top:4px}
.eyebrow{font:600 12px/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
.bench h1{font:800 clamp(30px,3vw,38px)/1 var(--display);text-transform:uppercase;letter-spacing:.012em;text-wrap:balance;margin:0}
.task{margin:0;font-size:16px}
.task b{font-weight:600}
.cred{display:flex;align-items:center;gap:6px;font:600 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--soft)}
.pip{width:14px;height:14px;border:2px solid var(--case);background:var(--case);border-radius:50%;transition:background .2s}
.pip.off{background:transparent;border-color:var(--rule)}
.note{border-top:2px solid var(--ink);padding-top:9px;display:flex;flex-direction:column;gap:5px;animation:fade .24s ease both}
@keyframes fade{from{opacity:.25;transform:translateY(5px)}to{opacity:1;transform:none}}
.note .tag{font:600 11px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
.note .plain{font-size:18.5px;line-height:1.3;font-weight:600}
.note .exam{font-size:14px;line-height:1.45;color:var(--soft)}
.note .exam b{font-style:italic;font-weight:600;color:var(--ink)}
.note.nudge .plain{color:var(--chain)}
.ref{display:inline-block;font:600 11px/1.3 var(--mono);border:1px solid var(--rule);padding:0 4px;color:var(--soft);margin-left:3px;vertical-align:1px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{appearance:none;font:700 19px/1.05 var(--display);letter-spacing:.03em;text-transform:uppercase;padding:10px 15px;background:var(--ink);color:var(--sheet);border:1.5px solid var(--ink);cursor:pointer;text-align:left}
.btn:hover{background:transparent;color:var(--ink)}
.btn.alt{background:transparent;color:var(--ink)}
.btn.alt:hover{background:var(--zone)}
.extra{display:flex;flex-direction:column;gap:7px;min-width:0}
.parts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.parts button{appearance:none;width:100%;display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start;text-align:left;background:transparent;color:var(--ink);border:0;border-top:1px solid var(--rule);padding:8px 2px;cursor:pointer;font:400 14.5px/1.38 var(--body)}
.parts button:hover{background:var(--zone)}
.parts i{font:600 12px/22px var(--mono);font-style:normal;width:22px;height:22px;text-align:center;border:1.5px solid var(--ink);border-radius:50%}
.parts b{font-weight:600}
.gloss{font-size:14px;line-height:1.42;color:var(--soft);margin:0;display:flex;flex-direction:column;gap:5px}
.gloss b{color:var(--ink);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{appearance:none;font:600 12.5px/1 var(--mono);padding:7px 9px;background:transparent;color:var(--ink);border:1.5px solid var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.seglab{font:600 12px/1.2 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
.paper{padding:clamp(16px,3.4cqw,34px);min-height:clamp(320px,52cqw,470px);display:flex;flex-direction:column;gap:12px}
.paper h2{margin:0;font:600 12px/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--soft);border-bottom:1px solid var(--rule);padding-bottom:7px}
.paper p{margin:0;font-size:clamp(14.5px,1.9cqw,16.5px);line-height:1.5;animation:fade .35s ease both}
.paper p em{font-style:normal;font:600 11.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--soft);margin-right:6px}
.paper p b{font-style:italic;font-weight:600}
.paper .blank{color:var(--soft);font:500 13px/1.4 var(--mono)}
.minis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mini{border:1.5px solid var(--ink);background:var(--sheet);padding:8px 9px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mini svg{display:block;width:100%;height:auto}
.mini b{font:800 18px/1.05 var(--display);text-transform:uppercase;letter-spacing:.015em}
.mini span{font-size:13px;line-height:1.35;color:var(--soft)}
/* drawing */
.st{stroke:var(--ink);stroke-width:2.4;fill:none;stroke-linejoin:round;stroke-linecap:round}
.thin{stroke:var(--rule);stroke-width:1.4;fill:none}
.fl{fill:var(--sheet)}
.solid{fill:var(--ink);stroke:var(--ink)}
.lbl{font:600 13px var(--mono);fill:var(--ink)}
.lbl.s{fill:var(--soft);font-weight:500;font-size:12px}
.pawnL{font:800 26px var(--display);fill:var(--ink)}
.marble{fill:var(--case);stroke:var(--ink);stroke-width:2.4}
.marbleT{font:600 11.5px var(--mono);fill:var(--case-ink)}
.stone{fill:var(--stone);stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
.stoneT{font:600 11.5px var(--mono);fill:var(--stone-ink)}
.link{fill:none;stroke:var(--chain);stroke-width:2.6}
.lockB{fill:var(--chain);stroke:var(--ink);stroke-width:1.6}
.lockS{fill:none;stroke:var(--chain);stroke-width:3.4}
.block rect{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.block text{font:600 11.5px var(--mono);fill:var(--ink)}
.block.heavy rect{fill:var(--ink)}
.block.heavy text{fill:var(--sheet)}
.fly{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.brick{fill:var(--sheet);stroke:var(--ink);stroke-width:1.7}
.wallsign{font:700 34px var(--stencil);fill:var(--ink);letter-spacing:.04em}
.gz-c{fill:none;stroke:var(--rule);stroke-width:9}
.gz-l{fill:none;stroke:var(--case);stroke-width:9}
.callout{fill:var(--sheet);stroke:var(--ink);stroke-width:1.7}
.calloutT{font:600 13px var(--mono);fill:var(--ink)}
.lead{stroke:var(--ink);stroke-width:1.2;fill:none;stroke-dasharray:3 3}
button:focus-visible,.zone:focus-visible{outline:3px solid var(--case);outline-offset:2px}
@media (max-width:920px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .rig{top:env(safe-area-inset-top,0px)}
  .minis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:921px) and (min-height:700px){.bench{position:sticky;top:8px}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
@media (max-width:560px){
  .capbar span:last-child{display:none}.block text{font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
#brandHome{appearance:none;background:none;border:0;padding:0;color:inherit;cursor:pointer;text-align:left}
.hub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;align-items:start}
.route h1{margin:0;font:800 34px/1 var(--display);text-transform:uppercase}
.route p{margin:4px 0 12px;color:var(--soft);font-size:15px}
.route ol{list-style:none;margin:0;padding:0;border-left:3px solid var(--ink);margin-left:20px}
.route li{margin:0 0 10px}
.stop{appearance:none;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;width:100%;text-align:left;background:var(--sheet);color:var(--ink);border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--rule);padding:9px 12px;margin-left:-23px;cursor:pointer}
.stop:hover{transform:translate(-1px,-1px)}
.stop:disabled{opacity:.55;cursor:default;box-shadow:none;transform:none}
.stop i{font:800 24px/1 var(--display);font-style:normal;text-align:center}
.stop b{display:block;font:800 21px/1.05 var(--display);text-transform:uppercase;letter-spacing:.01em}
.stop small{font:500 12.5px/1.3 var(--mono);color:var(--soft)}
@media (max-width:760px){.hub{grid-template-columns:minmax(0,1fr)}}
[hidden]{display:none!important}
#brandSub{display:block}
.mixbar{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:14px}
.mixbar p{margin:0}
.cmp{width:100%;border-collapse:collapse;font-size:clamp(13px,1.8cqw,15.5px);line-height:1.35}
.cmp th,.cmp td{border:1px solid var(--rule);padding:9px 10px;text-align:left;vertical-align:top}
.cmp th{font-weight:600}
.cmp tr:first-child th{font:800 19px/1 var(--display);text-transform:uppercase;background:var(--zone)}

<script>
(() => {
'use strict';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS = 'http://www.w3.org/2000/svg';

/* A room context. Moving to another room makes old timers and tweens stop quietly. */
let epoch = 0;
function context() {

    alive,
    sleep: ms => new Promise(r => setTimeout(() => alive() && r(), reduce ? Math.min(ms, 40) : ms)),

      requestAnimationFrame(step);
    })

/* ---------- geometry of the drawing ---------- */
const P = { x: 450, y: 120 }, CUP = { sg: 150, x: 750, mid: 450 }, PAN = { sg: 260, x: 640 };
const GROUND = 440, BEAM_TOP = 113, MARBLE_Y = 93, TRAY_Y = 158, DEG = 3.4, MAX = 12, GEAR = 5.9;
const PAWN = { C: 62, D: 838 };

async function flyCard(R, layer, from, to, h = 110, d = 470) {
  const g = cardGlyph(); layer.append(g);
  await R.tween(d, t => g.setAttribute('transform', `translate(${lerp(from.x, to.x, t)} ${lerp(from.y, to.y, t) - Math.sin(Math.PI * t) * h}) rotate(${t * 300})`), lin);
  return g;
}
async function dropCard(R, g, at, dx) {
  await R.tween(560, t => { g.setAttribute('transform', `translate(${at.x + dx * t} ${at.y - 70 * Math.sin(Math.PI * Math.min(1, t * 1.5)) + 320 * t * t}) rotate(${-220 * t})`); g.style.opacity = 1 - t; }, lin);
  g.remove();
}
async function burst(R, layer, at, color = 'var(--case)') {
  const g = S('g', { transform: `translate(${at.x} ${at.y})` }), rays = [];
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2, l = S('line', { stroke: color, 'stroke-width': 3.2, 'stroke-linecap': 'round' }); g.append(l); rays.push({ l, a }); }
  layer.append(g);
  await R.tween(280, t => rays.forEach(({ l, a }) => { l.setAttribute('x1', Math.cos(a) * 16 * (1 + t)); l.setAttribute('y1', Math.sin(a) * 16 * (1 + t)); l.setAttribute('x2', Math.cos(a) * (26 + 34 * t)); l.setAttribute('y2', Math.sin(a) * (26 + 34 * t)); g.style.opacity = 1 - t * t; }), easeOut);
  g.remove();
}

/* ---------- the machine ---------- */
class Machine {
  constructor(R, opt = {}) {
    this.R = R; this.a = 0; this.v = 0; this.net = 0; this.T = 2; this.locked = false; this.trem = 0; this.off = false;
    this.left = opt.left || 'LEFT FREE'; this.right = opt.right || 'LAW PASSES'; this.readFn = opt.read || null; this.who = opt.who || [['Y', 'YOU'], ['P', 'PROPOSER']];
    this.pans = { sg: { blocks: [] }, x: { blocks: [] } };
    this.m = { s: CUP.sg, y: MARBLE_Y, spin: 0 }; this.marblePos = 'sg';
    this.bPos = 'D'; this.bx = PAWN.D; this.by = 0; this.brot = 0; this.stepH = { sg: 18, x: 18 };
    this.chainG = null; this.chainSide = null;
    this.build(); this.setBoulder('D'); this.loop();
  }
  build() {
    const s = this.svg = S('svg', { viewBox: '0 -40 900 510', class: 'art', role: 'img', 'aria-label': 'A balance beam with a temple at each end. A marble marked law sits in one temple. A boulder marked burden sits on one of two pawns.' }); paintScene(s);
    s.append(S('line', { x1: 14, y1: GROUND, x2: 886, y2: GROUND, class: 'st' }));
        s.append(S('rect', { x: 442, y: P.y, width: 16, height: GROUND - P.y, class: 'wood st' }));
    s.append(S('path', { d: `M396 ${GROUND} L420 ${GROUND - 20} H480 L504 ${GROUND} Z`, class: 'wood st' }));
    this.gauge = S('g', { transform: 'translate(450 322)' }); s.append(this.gauge); this.drawGauge();
    for (const side of ['sg', 'x']) {
      const g = S('g', { class: 'pan-' + side }), stack = S('g');
      g.append(S('line', { x1: 0, y1: 0, x2: 0, y2: 16, class: 'st' }), S('line', { x1: -86, y1: 16, x2: 86, y2: 16, class: 'st' }),
        S('line', { x1: -84, y1: 16, x2: -84, y2: TRAY_Y, class: 'st', style: 'stroke-width:1.5' }), S('line', { x1: 84, y1: 16, x2: 84, y2: TRAY_Y, class: 'st', style: 'stroke-width:1.5' }),
        S('path', { d: `M-94 ${TRAY_Y} H94 L80 ${TRAY_Y + 13} H-80 Z`, class: 'brass st' }), stack);
      s.append(g); this.pans[side].g = g; this.pans[side].stack = stack;
    }
    const beam = this.beam = S('g'); s.append(beam);
    beam.append(courtGlyph(CUP.sg), courtGlyph(CUP.x));
    beam.append(S('rect', { x: 92, y: BEAM_TOP, width: 716, height: 14, class: 'wood st' }));
    beam.append(S('rect', { x: 92, y: BEAM_TOP - 18, width: 8, height: 18, class: 'wood st' }), S('rect', { x: 800, y: BEAM_TOP - 18, width: 8, height: 18, class: 'wood st' }));
    this.steps = { sg: S('rect', { x: CUP.sg + 58, width: 18, class: 'brass st' }), x: S('rect', { x: CUP.x - 76, width: 18, class: 'brass st' }) };
    beam.append(this.steps.sg, this.steps.x); this.setStepH(18);
    for (const [cx, t] of [[CUP.sg, this.left], [CUP.x, this.right]]) { const n = S('text', { x: cx, y: 145, 'text-anchor': 'middle', class: 'lbl' }); n.textContent = t; beam.append(n); }
    const mg = marbleGlyph(); this.mG = mg.g; this.mSpin = mg.spin; beam.append(mg.g);
    s.append(S('circle', { cx: P.x, cy: P.y, r: 11, class: 'fl st' }), S('circle', { cx: P.x, cy: P.y, r: 3.5, class: 'solid' }));
    this.pawnC = pawnGlyph(PAWN.C, this.who[0][0], this.who[0][1], 'var(--c)'); this.pawnD = pawnGlyph(PAWN.D, this.who[1][0], this.who[1][1], 'var(--d)');
    s.append(this.pawnC.g, this.pawnD.g);
    const b = boulderGlyph(); this.bG = b.g; this.bRock = b.rock; s.append(b.g);
    this.fx = S('g'); s.append(this.fx);
  }
  drawGauge() {
    const g = this.gauge; g.innerHTML = '';
    const arc = (r, a0, a1) => { const p = a => [Math.sin(a * Math.PI / 180) * r, -Math.cos(a * Math.PI / 180) * r]; const [x0, y0] = p(a0), [x1, y1] = p(a1); return `M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}`; };
    const tN = clamp(this.T * DEG * GEAR, 8, 74);
    g.append(S('circle', { r: 68, class: 'fl st' }));
    g.append(S('path', { d: arc(56, -78, -tN), class: 'gz-l' }), S('path', { d: arc(56, -tN, tN), class: 'gz-c' }), S('path', { d: arc(56, tN, 78), class: 'gz-l' }));
    this.needle = S('line', { x1: 0, y1: 8, x2: 0, y2: -50, class: 'st', style: 'stroke-width:3' }); g.append(this.needle, S('circle', { r: 5, class: 'solid' }));
    this.read = S('text', { x: 0, y: 27, 'text-anchor': 'middle', class: 'lbl', style: 'font-size:11px' }); g.append(this.read);
    this.updateRead();
  }
  updateRead() {
    if (this.readFn) { this.read.textContent = this.readFn(this); return; }
    let t;
    if (this.off) t = 'NO DISCRETION';
    else if (this.locked) t = 'SCALE OFF';
    else if (Math.abs(this.net) < .01) t = 'DEAD LEVEL';
    else { const side = this.net > 0 ? this.right : this.left; t = (Math.abs(this.net) >= this.T ? 'CLEARLY ' : 'LEANS ') + side; }
    this.read.textContent = t;
  }
  setStepH(h, side) { for (const s of side ? [side] : ['sg', 'x']) { this.stepH[s] = h; this.steps[s].setAttribute('y', BEAM_TOP - h); this.steps[s].setAttribute('height', h); } }
  loop() {
    let last = performance.now();
    const f = now => {
      if (!this.R.alive()) return;
      const dt = Math.min(.033, (now - last) / 1000); last = now;
      const tgt = this.locked || this.off ? 0 : clamp(this.net * DEG, -MAX, MAX);
      if (reduce) { this.a = tgt; this.v = 0; } else { this.v += (45 * (tgt - this.a) - 7.5 * this.v) * dt; this.a += this.v * dt; }
      this.apply(now); requestAnimationFrame(f);
    };
    requestAnimationFrame(f);
  }
  apply(now) {
    const r = this.a * Math.PI / 180, c = Math.cos(r), sn = Math.sin(r);
    this.beam.setAttribute('transform', `rotate(${this.a} ${P.x} ${P.y})`);
    for (const s of ['sg', 'x']) { const dx = PAN[s] - P.x, dy = 127 - P.y; this.pans[s].g.setAttribute('transform', `translate(${P.x + dx * c - dy * sn} ${P.y + dx * sn + dy * c})`); }
    this.needle.setAttribute('transform', `rotate(${this.off ? -78 : clamp(this.a * GEAR, -78, 78)})`);
    const j = this.trem > 0 ? Math.sin(now / 24) * this.trem * 2.4 : 0; if (this.trem > 0) this.trem = Math.max(0, this.trem - .014);
    this.mG.setAttribute('transform', `translate(${this.m.s + j} ${this.m.y})`);
    this.mSpin.setAttribute('transform', `rotate(${this.m.spin})`);
  }
  mkBlock(id, label, w) {
    const b = { id, label, w, g: S('g', { class: 'block' }), r: S('rect', {}), t: S('text', { 'text-anchor': 'middle' }) };
    b.g.append(b.r, b.t); this.sizeBlock(b, w, label); return b;
  }
  sizeBlock(b, w) {
    const h = Math.round(16 + w * 10.5), bw = Math.round(86 + w * 24);
    b.h = h; b.w = w; b.r.setAttribute('x', -bw / 2); b.r.setAttribute('width', bw); b.r.setAttribute('height', h);
    b.t.setAttribute('x', 0); b.t.setAttribute('y', h / 2 + 4); b.t.textContent = b.label;
    b.g.classList.toggle('heavy', w >= 2);
  }
  layout(side) { let y = TRAY_Y; for (const b of this.pans[side].blocks) { y -= b.h; b.g.setAttribute('transform', `translate(0 ${y})`); } }
  recalc() { const sum = a => a.reduce((s, b) => s + b.w, 0); this.net = sum(this.pans.x.blocks) - sum(this.pans.sg.blocks); this.updateRead(); }
  placeBlock(side, o) { const b = this.mkBlock(o.id, o.label, o.w); this.pans[side].stack.append(b.g); this.pans[side].blocks.push(b); this.layout(side); this.recalc(); this.a = clamp(this.net * DEG, -MAX, MAX); }
  async addBlock(side, o) {
    const p = this.pans[side], b = this.mkBlock(o.id, o.label, o.w); p.stack.append(b.g);
    const fy = TRAY_Y - p.blocks.reduce((s, x) => s + x.h, 0) - b.h;
    b.g.setAttribute('transform', `translate(0 ${fy - 280})`);
    await this.R.tween(340, t => b.g.setAttribute('transform', `translate(0 ${fy - 280 * (1 - t)})`), easeIn);
    p.blocks.push(b); this.recalc(); this.v += (side === 'x' ? 1 : -1) * b.w * 9;
  }
  removeBlock(id) { for (const s of ['sg', 'x']) { const p = this.pans[s], i = p.blocks.findIndex(b => b.id === id); if (i >= 0) { p.blocks[i].g.remove(); p.blocks.splice(i, 1); this.layout(s); this.recalc(); } } }
  async resizeBlock(id, w) {
    for (const s of ['sg', 'x']) {
      const b = this.pans[s].blocks.find(b => b.id === id); if (!b) continue;
      const from = b.w;
      await this.R.tween(700, t => { this.sizeBlock(b, lerp(from, w, t)); this.layout(s); this.recalc(); });
      this.sizeBlock(b, w); this.layout(s); this.recalc();
    }
  }
  async poof(label) {
    const g = S('g', { class: 'block' }), r = S('rect', { x: -56, y: -13, width: 112, height: 26 }), t = S('text', { x: 0, y: 4, 'text-anchor': 'middle' });
    t.textContent = label; g.append(r, t); this.fx.append(g);
    await this.R.tween(320, u => g.setAttribute('transform', `translate(450 ${lerp(-20, 215, u)})`), easeIn);
    burst(this.R, this.fx, { x: 450, y: 215 }, 'var(--rule)');
    await this.R.tween(300, u => { g.style.opacity = 1 - u; g.setAttribute('transform', `translate(450 215) scale(${1 - u * .6})`); });
    g.remove();
  }
  setMarble(pos) { this.m.s = CUP[pos]; this.m.y = MARBLE_Y; this.marblePos = pos; }
  async rollMarble(to, d = 1100) {
    if (this.marblePos === to) return;
    const from = this.m.s, end = CUP[to], dist = end - from, h0 = this.marblePos === 'mid' ? 0 : this.stepH[this.marblePos] + 22, h1 = to === 'mid' ? 0 : this.stepH[to] + 22;
    await this.R.tween(d, t => {
      let lift = 0; if (t < .2) lift = Math.sin(Math.PI * t / .2) * h0; if (t > .8) lift = Math.sin(Math.PI * (t - .8) / .2) * h1;
      this.m.s = from + dist * t; this.m.y = MARBLE_Y - lift; this.m.spin = dist * t / 20 * 57.3;
    }, easeIO);
    this.m.y = MARBLE_Y; this.marblePos = to;
  }
  bHome(who) { return who === 'mid' ? { x: 566, y: GROUND - 37 } : { x: PAWN[who], y: GROUND - 81 * .9 - 36 }; }
  bApply() { this.bG.setAttribute('transform', `translate(${this.bx} ${this.by})`); this.bRock.setAttribute('transform', `rotate(${this.brot})`); }
  squash(who, s) { const p = who === 'C' ? this.pawnC : who === 'D' ? this.pawnD : null; if (p) p.body.setAttribute('transform', `scale(1 ${s})`); }
  setBoulder(who) { this.squash('C', 1); this.squash('D', 1); this.bPos = who; const h = this.bHome(who); this.bx = h.x; this.by = h.y; this.brot = 0; this.squash(who, .9); this.bApply(); }
  async moveBoulder(to) {
    if (this.bPos === to) return;
    const R = this.R, from = this.bPos, a = this.bHome(from), b = this.bHome(to), gy = GROUND - 37, dir = Math.sign(b.x - a.x) || 1;
    let x0 = a.x;
    if (from !== 'mid') {
      this.squash(from, 1); x0 = a.x + dir * 58;
