    --amber: #e0a849; --amber-soft: #3a3020; --amber-line: #6b5426; --green: #6cc28e; --green-soft: #1e3427; --green-line: #2f5c40;
    --red: #ec8476; --red-soft: #3d2420; --red-line: #6b3a33; --sheet-bg: #202326; --shadow: none; --on-accent: #15181a; color-scheme: dark;
  }

  --amber: #e0a849; --amber-soft: #3a3020; --amber-line: #6b5426; --green: #6cc28e; --green-soft: #1e3427; --green-line: #2f5c40;

.chip.on { background: var(--teal); border-color: var(--teal); color: var(--on-accent); }

<template id="how"><details class="how"><summary>How it works</summary><div class="card"><ul><li><strong>Seven options, pick the best 3.</strong> Each option is a pre-write block already filled in for this hypo, about 50 words, labelled with its code. The options are deliberately close: most are blocks you could use, but only three decide the outcome.</li><li><strong>Colours.</strong> <em>Italic</em> (green on the page) is copied unchanged from the pre-write; <strong>bold</strong> (amber on the page) is changed for this hypo; "…" marks pre-write text left out.</li><li><strong>Check.</strong> Score is out of 3. Each option you did not need is marked <strong>Close</strong> (worth a line, but not top 3) or <strong>Wrong</strong> (the wrong rule for these facts), with a short reason. One <strong>compiled reason</strong> explains the best three and gives a result line.</li></ul></div></details></template>

<script>
const QS = [{"n": 1, "paper": "Exam Q1", "pre": "J1, J3, J4", "title": "One-sided clause, served out", "q": "<p>Harbour Pte Ltd, a Singapore company, buys marine sensors from Kestrel AG, a Utopian company with no office, assets or registration in Singapore. Their supply contract, dated 1 March 2025, is expressly governed by Singapore law. Clause 20 reads: \"Kestrel submits to the jurisdiction of the Singapore High Court and may sue Harbour only in that court. Harbour may sue Kestrel in the Singapore High Court or in any other court of competent jurisdiction.\"<\/p><p>The sensors fail in Singapore waters. Harbour sues Kestrel for breach of contract in the General Division and obtains approval to serve the originating claim out of Singapore. Kestrel applies to set aside service, saying Utopia is the more appropriate forum: the sensors were designed and tested there, and its engineers, all Kestrel employees, live there.<\/p><p>Singapore and Utopia have both been Contracting States to the Hague Convention on Choice of Court Agreements since before the contract. Advise Harbour on the test that decides Kestrel's application, who carries the burden, and the likely result.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Cl 20 is one-sided and names Singapore, so the work lies in spotting who is in breach. The Hague fact and the service-out fact both pull you towards the wrong test.<\/p>\n<p><strong>Regime: J1.2.1.<\/strong> Both States are Contracting States, but an asymmetric clause is not exclusive under the CCAA (<i>CHLOE V<\/i>). So there is no s 11, and the case stays at common law.<\/p>\n<p><strong>Burden: J3.2.<\/strong> Served out, a claimant normally proves forum conveniens. But Kestrel promised to submit, so Harbour need only show that cl 20 is valid, binds Kestrel and covers the dispute, plus a serious question. Contesting forum is Kestrel's own breach.<\/p>\n<p><strong>Result: J4.3.1.<\/strong> Kestrel must show strong cause, and engineers in Utopia were foreseeable at contracting. It pleads no abuse or denial of justice, so service stands.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not let \"served out\" fix the burden. Ask first who is in breach; the burden always follows the party seeking release from its promise (J4.0.2).<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Cl 20 falls outside the CCAA because it is asymmetric, but at common law it binds Kestrel, so Harbour need only show the clause is valid, binds Kestrel and covers the dispute, plus a serious question; Kestrel must then show strong cause, which foreseeable witnesses in Utopia cannot supply, so service stands.<\/blockquote>", "items": [{"letter": "A", "code": "J4.2.1", "title": "Burden Stays on Claimant", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Spiliada<\/i>, <i>Oriental Insurance<\/i> and <i>Zoom<\/i>,<\/mark> <mark class=\"new\">Harbour<\/mark> <mark class=\"same\">bears it without notice and still when<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">sets aside, jurisdiction over a foreign defendant being \"an imposition\" on it (<i>Li Shengwu<\/i>).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">argues Singapore is at most one of several equal fora. Per <i>Sudarga<\/i>, that fails:<\/mark> <mark class=\"new\">Harbour<\/mark> <mark class=\"same\">must show Singapore is the more appropriate forum<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The natural trap. A claimant serving out usually keeps the forum burden, but Kestrel promised to submit, so objecting is its own breach and the burden moves to it."}, {"letter": "B", "code": "J1.2.1", "title": "Asymmetric Clause", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">cl 20<\/mark> <mark class=\"same\">gives<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">exclusive jurisdiction but lets<\/mark> <mark class=\"new\">Harbour<\/mark> <mark class=\"same\">sue<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"new\">anywhere<\/mark><mark class=\"same\">. Per <i>CHLOE V<\/i>, following the Hartley–Dogauchi Report (VCLT art 32), such a clause is not exclusive under the CCAA<\/mark><mark class=\"new\">, so s 11 is not engaged either, whatever the Contracting State facts.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">At common law<\/mark> <mark class=\"new\">cl 20<\/mark> <mark class=\"same\">stays exclusive against<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">(per C&amp;Y), so J1.1 applies.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "J1.1.4", "title": "Asymmetric, With Submission", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Cl 20 lets Harbour sue Kestrel in any court; Kestrel submits to Singapore and may sue only there.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">If<\/mark> <mark class=\"new\">Harbour<\/mark> <mark class=\"same\">sues here,<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">agreed to submit, so<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">bears strong cause to stay<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">If<\/mark> <mark class=\"new\">cl 20<\/mark> <mark class=\"same\">merely lets<\/mark> <mark class=\"new\">Harbour<\/mark> <mark class=\"same\">sue<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">anywhere, without<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">submitting to that court,<\/mark> <mark class=\"new\">Harbour<\/mark> <mark class=\"same\">suing here is permitted but<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">never agreed to submit, so<\/mark> <mark class=\"new\">Kestrel<\/mark><mark class=\"same\">'s stay goes to Spiliada (Week 10 handout).<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "It reaches the same place and shows why the word \"submits\" matters. But the block is framed for a stay, and Kestrel attacks service, so J3.2 is the block that says what Harbour must prove."}, {"letter": "D", "code": "J3.2", "title": "Singapore EJC or NEJC: In Principle v In Practice", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">In practice,<\/mark> <mark class=\"new\">Harbour<\/mark> <mark class=\"same\">need only show a good arguable case that<\/mark> <mark class=\"new\">cl 20<\/mark> <mark class=\"same\">is valid, binds<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">and covers<\/mark> <mark class=\"new\">the sensor dispute<\/mark> <mark class=\"same\">(J1.5–J1.6), plus a serious question<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Forum: need not be proved. If<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">contests it, that breaches its promise, so per <i>Shanghai Turbo (CA)<\/i><\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">bears strong cause (J4.3), whether it challenges existence or exercise<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "J1.3", "title": "Must Hear; No FNC", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Cl 20<\/mark> <mark class=\"same\">designates<\/mark> <mark class=\"new\">the Singapore High Court<\/mark> <mark class=\"same\">and the CCAA applies (J1.2). Per s 11(1),<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">must not decline unless<\/mark> <mark class=\"new\">cl 20<\/mark> <mark class=\"same\">is null and void under Singapore law, including its choice of law rules.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per s 11(2),<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">cannot decline in favour of<\/mark> <mark class=\"new\">Utopia<\/mark><mark class=\"same\">, so neither Spiliada nor strong cause applies<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The Contracting State fact invites this. But an asymmetric clause is not exclusive, so s 11 never starts, and you would skip strong cause, the test that decides the application."}, {"letter": "F", "code": "J4.1.2", "title": "Compellability Reduced", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Weight falls if<\/mark> <mark class=\"new\">the engineers<\/mark> <mark class=\"same\">will<\/mark> <mark class=\"new\">testify by video<\/mark> <mark class=\"same\">(<i>Raffles Education<\/i>), or are<\/mark> <mark class=\"new\">Kestrel's own employees<\/mark><mark class=\"same\">, not third parties (Chong's feedback)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>JIO<\/i>, location carries little weight given video-link<\/mark> <mark class=\"new\">, so Kestrel's best connecting factor is thin.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Good fact spotting: the engineers are Kestrel's own employees. But this is a Spiliada stage 1 point. Under strong cause it earns one line, because witnesses in Utopia were foreseeable anyway."}, {"letter": "G", "code": "J4.3.1", "title": "Not Spiliada; Foreseeable Factors", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Strong cause applies where<\/mark> <mark class=\"new\">Kestrel<\/mark> <mark class=\"same\">breaches<\/mark> <mark class=\"new\">cl 20<\/mark><mark class=\"same\">; Spiliada where<\/mark> <mark class=\"new\">no one<\/mark> <mark class=\"same\">does.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Vinmar<\/i>, the test rests on party autonomy and commercial certainty, so \"it should take more\" to keep<\/mark> <mark class=\"new\">this case<\/mark> <mark class=\"same\">from<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">than on FNC<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Vinmar<\/i>,<\/mark> <mark class=\"new\">engineers in Utopia<\/mark> <mark class=\"same\">foreseeable at contracting carry little weight<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"n": 2, "paper": "Exam Q1", "pre": "J1, J4", "title": "Foreign NEJC and a five-year trial", "q": "<p>Orchid Pte Ltd, a Singapore company, distributes water filters for Meridian Bhd, a Ruritanian company with no presence in Singapore. Their agreement, dated 10 January 2025 and signed in Ruritania, is expressly governed by Ruritanian law. Clause 17 says: \"The parties submit to the non-exclusive jurisdiction of the courts of Ruritania.\" Ruritania has been a Contracting State to the Hague Convention on Choice of Court Agreements since 2020.<\/p><p>Meridian terminates the agreement. Orchid sues for wrongful termination in the General Division and serves Meridian in Ruritania with approval. Meridian applies to set aside service. Assume a para 63(3) nexus and a serious question are shown, and that the connecting factors point to Ruritania, including former sales agents there who are non-party witnesses and cannot be compelled to come to Singapore.<\/p><p>A civil trial in Ruritania takes five years, against about ten months in Singapore, and Ruritanian law would give Orchid about one third of what a Singapore court would likely award. Advise Orchid on whether service will stand.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Cl 17 is a foreign NEJC, so no one is in breach. That point sets the burden, and the rest of the question is what Orchid can do once stage 1 goes against it.<\/p>\n<p><strong>Who carries it: J4.2.1.<\/strong> Service out keeps the burden on Orchid, even on Meridian's set-aside. Cite \"clearly\" and flag <i>Oro Negro<\/i>'s \"on balance\".<\/p>\n<p><strong>Stage 1 lost: J4.2.3.<\/strong> The hypo tells you stage 1 points to Ruritania, so the must-write issue is whether Orchid gets a second bite at all. It is open, so give both lines of authority.<\/p>\n<p><strong>What the bite is worth: J4.1.3.<\/strong> Five years is the fact Chong keeps reusing. Delay is disregarded unless egregious, and the damages gap alone is not conclusive, so the second bite probably fails.<\/p>\n<p><strong>Trap to avoid.<\/strong> The word \"non-exclusive\" displaces s 3(2). Per Chong (seminar), invoking deemed exclusivity on such a clause is a recurring exam error (J1.2.1).<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>No one has breached cl 17, so Orchid bears the forum burden throughout; with stage 1 pointing to Ruritania it can only try the open second bite, and a five-year trial and a smaller award are unlikely to be enough, so service will probably be set aside.<\/blockquote>", "items": [{"letter": "A", "code": "J1.1.2", "title": "Foreign NEJC: No Breach Either Way", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Orchid<\/mark> <mark class=\"same\">sues here though<\/mark> <mark class=\"new\">cl 17<\/mark> <mark class=\"same\">names<\/mark> <mark class=\"new\">the courts of Ruritania<\/mark> <mark class=\"same\">non-exclusively. Per <i>Shanghai Turbo (CA)<\/i>, the \"wide waiver of objection\" is rejected, so suing here is no breach, and<\/mark> <mark class=\"new\">Meridian<\/mark><mark class=\"same\">'s objection is none either, as Singapore is not named. Plain Spiliada applies (J4.1).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Shanghai Turbo (CA)<\/i>,<\/mark> <mark class=\"new\">cl 17<\/mark> <mark class=\"same\">shows only that<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">is an appropriate forum, not clearly more appropriate<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "You must say this, because it picks Spiliada over strong cause. But it takes one line. It sets the test; J4.2.1 then says who carries it, which is what decides the application."}, {"letter": "B", "code": "J4.2.3", "title": "Second Bite", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently<\/mark> <mark class=\"new\">the factors point to Ruritania<\/mark><mark class=\"same\">, so can<\/mark> <mark class=\"new\">Orchid<\/mark> <mark class=\"same\">still show injustice there? Per <i>Oro Negro<\/i> and <i>IM Skaugen (CA)<\/i>, this is open: <i>Lewis v King<\/i> and <i>Metall<\/i> for; <i>Konamaneni<\/i> and Fentiman against.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Shen Sophie<\/i> (adopting Yeo) and C&amp;Y, access to justice and even-handed treatment of<\/mark> <mark class=\"new\">Orchid<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">Meridian<\/mark> <mark class=\"same\">apply both ways<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "J1.2.1", "title": "Deemed Exclusive", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 3(2),<\/mark> <mark class=\"new\">cl 17<\/mark> <mark class=\"same\">is deemed exclusive unless the parties expressly provide otherwise.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Ruritania is a Contracting State and cl 17 post-dates entry into force, so Meridian says this is a Hague case and Singapore must stay or dismiss.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Section 3(2) applies only to a clause that does not say otherwise, and cl 17 says \"non-exclusive\". The CCAA does not apply, so s 12 is never engaged."}, {"letter": "D", "code": "J4.1.2", "title": "Compellability; Governing Law", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>JIO<\/i>, non-party<\/mark> <mark class=\"new\">witnesses in Ruritania<\/mark> <mark class=\"same\">not compellable here point to<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">, if<\/mark> <mark class=\"new\">Meridian<\/mark> <mark class=\"same\">shows their evidence is \"at least arguably relevant\" to its defence.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Weight rises with an express choice of law (<i>Rappo<\/i>)<\/mark> <mark class=\"new\">, and this agreement has one.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Both lines are sound at stage 1, but the hypo tells you to assume stage 1 points to Ruritania. Time here repeats a given fact; the marks lie in what happens next."}, {"letter": "E", "code": "J4.2.1", "title": "Burden Stays on Claimant; How Much More", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Spiliada<\/i>, <i>Oriental Insurance<\/i> and <i>Zoom<\/i>,<\/mark> <mark class=\"new\">Orchid<\/mark> <mark class=\"same\">bears it without notice and still when<\/mark> <mark class=\"new\">Meridian<\/mark> <mark class=\"same\">sets aside<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Spiliada<\/i>, <i>AK Investment<\/i> and <i>Zoom<\/i>,<\/mark> <mark class=\"new\">Orchid<\/mark> <mark class=\"same\">must show Singapore \"clearly\" more appropriate than<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">; per <i>Oro Negro<\/i> (adopting <i>Siemens<\/i>), \"on balance\" suffices, \"by a hair or by a mile\". Cite \"clearly\", flag Oro Negro, argue both.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "J4.3.1", "title": "Higher Hurdle; Foreseeable Factors", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Vinmar<\/i>, the test rests on party autonomy and commercial certainty, so \"it should take more\" to keep<\/mark> <mark class=\"new\">the case<\/mark> <mark class=\"same\">from<\/mark> <mark class=\"new\">the Ruritanian courts<\/mark> <mark class=\"same\">than on FNC<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Vinmar<\/i>,<\/mark> <mark class=\"new\">witnesses in Ruritania<\/mark> <mark class=\"same\">foreseeable at contracting carry little weight, and parties are deemed to know<\/mark> <mark class=\"new\">Ruritania's delays<\/mark> <mark class=\"same\">(<i>Shanghai Turbo<\/i>).<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Tempting, because \"delay was foreseeable\" sounds like an answer to the five years. But strong cause needs a breach, and a foreign NEJC has no promise not to sue elsewhere. Use J4.1.3."}, {"letter": "G", "code": "J4.1.3", "title": "Delay; Higher Damages", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently trial takes<\/mark> <mark class=\"new\">5 years<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">against<\/mark> <mark class=\"new\">10 months<\/mark> <mark class=\"same\">here. Per C&amp;Y, delay is disregarded unless egregious; per <i>Grains and Industrial<\/i> (and Chong's feedback), even alleged delays of over 10 years in India failed.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Presently<\/mark> <mark class=\"new\">Orchid<\/mark> <mark class=\"same\">would recover<\/mark> <mark class=\"new\">about one third<\/mark> <mark class=\"same\">of the Singapore award in<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">. Per Chong's feedback, a legitimate juridical advantage alone is not conclusive<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"n": 3, "paper": "Exam Q1", "pre": "J1, J4, J5", "title": "Two \"High Court\" clauses", "q": "<p>Ardent Pte Ltd, a Singapore company, has two contracts with Beaumont SA, a French company with no presence in Singapore. Both are governed by Singapore law, and both say: \"The parties submit to the exclusive jurisdiction of the Singapore High Court.\" Neither mentions the SICC or service. The Maintenance Contract is dated 3 May 2015. The Licence Contract is dated 3 May 2019.<\/p><p>Beaumont stops paying under both. Ardent wants both claims heard in the SICC. Beaumont objects: the equipment, the staff and most of the documents are in France, and a French court would hear the case sooner.<\/p><p>France is a Contracting State to the Hague Convention on Choice of Court Agreements. Assume both claims are international and commercial. Advise Ardent on how each claim can reach the SICC, and whether Beaumont's objection can keep it out.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> The clauses are word for word the same, so the date does all the work. The objection then tests whether you reach for Spiliada when it does not apply.<\/p>\n<p><strong>Which route: J5.2.3.<\/strong> The 2019 clause was concluded on or after 1 October 2016, so \"Singapore High Court\" includes the SICC and Ardent may file there directly. Beaumont's only reply is Chong's point that the clause arguably needs a more specific reference to the SICC. The 2015 clause \"does not of itself\" submit to the SICC.<\/p>\n<p><strong>The 2019 claim, the objection: J5.3.<\/strong> With a written jurisdiction agreement there is no Spiliada, Australian test or strong cause. The French links count for nothing.<\/p>\n<p><strong>The 2015 claim: J5.4.1.<\/strong> There is no primary jurisdiction, so Ardent sues in the General Division and seeks transfer on the \"more appropriate\" test. In that action the clause is a Singapore EJC at common law, so Beaumont's objection needs strong cause (J4.3).<\/p>\n<p><strong>Trap to avoid.<\/strong> Same words, different dates. Do not write one answer for both contracts; Chong's framework runs contract by contract.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The 2019 clause includes the SICC, so Ardent files there directly and Beaumont's French links are irrelevant under O 2 r 3; the 2015 clause does not, so Ardent sues in the General Division, holds Beaumont to strong cause, and seeks transfer as the more appropriate court.<\/blockquote>", "items": [{"letter": "A", "code": "J5.3", "title": "Foreign Connections Irrelevant", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Beaumont<\/mark> <mark class=\"same\">asks the SICC to decline because<\/mark> <mark class=\"new\">the dispute centres on France<\/mark><mark class=\"same\">. Per O 2 r 3(2), the SICC may decline only if exercising jurisdiction is contrary to its international and commercial character or an abuse of its process<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y and Chong (AY23-24 mid-term feedback), there is no Spiliada balancing, Australian test or strong cause, so<\/mark> <mark class=\"new\">Beaumont<\/mark><mark class=\"same\">'s links to<\/mark> <mark class=\"new\">France<\/mark> <mark class=\"same\">count for nothing.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "J4.4", "title": "The SICC Factor", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Ardent<\/mark> <mark class=\"same\">resists<\/mark> <mark class=\"new\">a stay<\/mark> <mark class=\"same\">by pointing to possible transfer to the SICC. Per <i>Rappo<\/i>, the court must not \"shut its eyes\" to<\/mark> <mark class=\"new\">international judges<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>IM Skaugen<\/i>,<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">alone it cannot displace<\/mark> <mark class=\"new\">France<\/mark><mark class=\"same\">, which \"would virtually always\" be the forum.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "This is for a Spiliada contest, and neither claim runs on Spiliada. Keep its points for the \"more appropriate\" argument under J5.4.1."}, {"letter": "C", "code": "J5.4.2", "title": "Every Party's Consent", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently, the CCAA applies and<\/mark> <mark class=\"new\">the Maintenance Contract's clause<\/mark> <mark class=\"same\">names<\/mark> <mark class=\"new\">the Singapore High Court<\/mark><mark class=\"same\">. Per O 2 r 4(4), transfer also needs every party's consent.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per O 2 r 4(7), where<\/mark> <mark class=\"new\">that clause<\/mark> <mark class=\"same\">names the receiving court, each party is treated as consenting.<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">so<\/mark> <mark class=\"new\">Beaumont<\/mark> <mark class=\"same\">is treated as consenting although it objects.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "This is the CCAA-case transfer rule. The Maintenance clause predates 1 October 2016, so it is not a CCAA case, and O 2 r 4(1) needs no consent. The 2019 claim needs no transfer at all."}, {"letter": "D", "code": "J5.2.3", "title": "Clauses Naming the High Court", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">the Licence Contract's clause<\/mark><mark class=\"same\">, concluded on<\/mark> <mark class=\"new\">3 May 2019<\/mark> <mark class=\"same\">(on or after 1 October 2016), names<\/mark> <mark class=\"new\">the Singapore High Court<\/mark><mark class=\"same\">. Per O 2 r 2(1) and s 2(2)–(3) CCAA, it includes the SICC unless a contrary intention appears, so<\/mark> <mark class=\"new\">Ardent<\/mark> <mark class=\"same\">may file directly in the SICC.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per O 2 r 2(2),<\/mark> <mark class=\"new\">the Maintenance Contract's clause<\/mark><mark class=\"same\">, concluded on<\/mark> <mark class=\"new\">3 May 2015<\/mark> <mark class=\"same\">before 1 October 2016, \"does not of itself\" submit to the SICC.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "J1.3", "title": "Must Hear", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">The Licence Contract's clause<\/mark> <mark class=\"same\">designates<\/mark> <mark class=\"new\">the Singapore High Court<\/mark> <mark class=\"same\">and the CCAA applies (J1.2). Per s 11(1),<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">must not decline unless<\/mark> <mark class=\"new\">the clause<\/mark> <mark class=\"same\">is null and void under Singapore law, including its choice of law rules.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per s 11(2),<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">cannot decline in favour of<\/mark> <mark class=\"new\">France<\/mark><mark class=\"same\">, so neither Spiliada nor strong cause applies<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Correct for the 2019 clause, and worth a line: Singapore must hear it. But it does not place the claim in the SICC, and it says nothing about the 2015 contract."}, {"letter": "F", "code": "J5.4.1", "title": "Only Route: Transfer", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per Chong (sample-final answer scheme; AY23-24 mid-term feedback), where<\/mark> <mark class=\"new\">the Maintenance Contract's clause<\/mark> <mark class=\"new\">predates 1 October 2016<\/mark><mark class=\"same\">, the SICC has no primary jurisdiction, so<\/mark> <mark class=\"new\">Ardent<\/mark> <mark class=\"same\">reaches it only by transfer under the O 2 r 4(1)(c) \"more appropriate\" test.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per Chong (seminar), the test turns on how international and commercial the dispute is, not its complexity<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "J5.2.4", "title": "No Permission Needed", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently, per O 5 r 6(2),<\/mark> <mark class=\"new\">Beaumont<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">France<\/mark> <mark class=\"same\">may be served out without permission, being<\/mark> <mark class=\"new\">a party to the written jurisdiction agreement (r 6(2)(a))<\/mark><mark class=\"same\">, whether or not<\/mark> <mark class=\"new\">the clause<\/mark> <mark class=\"same\">mentions service.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per O 5 r 6(5), the SICC may still review jurisdiction under O 2 r 3.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Correct for the 2019 claim, so give it one line under service. The hypo asks about route and objection, not mode of service."}]}, {"n": 4, "paper": "Exam Q1", "pre": "J6", "title": "NEJC and a foreign injunction", "q": "<p>Lumen Pte Ltd, a Singapore company, supplies cloud services to Novar LLC, a Ruritanian company. Their agreement, dated 6 June 2024, is governed by Singapore law. Clause 31 says: \"Each party submits to the non-exclusive jurisdiction of the courts of Singapore.\"<\/p><p>On 1 March 2026 Lumen sues Novar in the General Division for unpaid fees (Suit 100). Novar appoints Singapore solicitors and files a defence on the merits without disputing jurisdiction. On 1 May 2026, instead of counterclaiming, Novar sues Lumen in the Ruritanian High Court for a declaration that no fees are due (the Ruritanian Claim). On 15 May 2026 Novar also applies to that court for an injunction ordering Lumen to stop Suit 100 (the Injunction Application).<\/p><p>Suit 100 has not reached trial, and no hearing date has been fixed in Ruritania. Lumen applies at once to the General Division for an anti-suit injunction against both. Advise Lumen.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Two foreign steps, one Singapore NEJC, and different answers for each. Per Chong (seminar), you run a separate analysis for each foreign proceeding.<\/p>\n<p><strong>The Ruritanian Claim, basis: J6.3.1.2.<\/strong> Suing abroad under a Singapore NEJC is not ordinarily a breach, so the contractual basis is gone. Lumen must rely on vexation.<\/p>\n<p><strong>The Ruritanian Claim, vexation: J6.3.2.<\/strong> Parallel proceedings alone are not enough, especially under an NEJC. Lumen needs something more: a mirror-image claim brought just after Novar defended Suit 100, instead of a counterclaim. That is arguable, but Suit 100 is not far advanced, so this limb is uncertain.<\/p>\n<p><strong>The Injunction Application: J6.5.1.<\/strong> This one directly attacks Suit 100. Singapore may protect its own proceedings, and the application is arguably a breach of the promise not to object. Plead vexation as well.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not argue that breaching cl 31 is itself vexatious. Per <i>Cooperative Muratori<\/i> the bases are conceptually distinct, so name each one separately (J6.3).<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Cl 31 is a Singapore NEJC, so the Ruritanian Claim is no breach and needs vexation, which parallel proceedings alone do not show; the Injunction Application attacks Suit 100 itself, so Lumen should plead breach and vexation and is likely to get an ASI against that application at least.<\/blockquote>", "items": [{"letter": "A", "code": "J6.0.1", "title": "One ASI per Foreign Proceeding", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per Chong (seminar), analyse<\/mark> <mark class=\"new\">the Ruritanian Claim<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">the Injunction Application<\/mark> <mark class=\"same\">separately: under a Singapore NEJC, suing abroad is no breach (vexation, J6.3.2), but seeking<\/mark> <mark class=\"new\">a foreign injunction against Suit 100<\/mark> <mark class=\"same\">is (contractual, J6.3.1.2).<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The right frame, and it should open your answer. But it only names the two routes; the blocks it points to do the analysis."}, {"letter": "B", "code": "J6.3.2", "title": "Parallel Proceedings Alone Not Enough", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>UBS v Telesto<\/i> and C&amp;Y, parallel proceedings and the risk of conflicting judgments do not alone justify an ASI, especially where the parties agreed an NEJC.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>PT Sandipala<\/i> (C&amp;Y), the case is stronger where<\/mark> <mark class=\"new\">the parties and the fee dispute<\/mark> <mark class=\"same\">significantly overlap and<\/mark> <mark class=\"new\">Novar<\/mark> <mark class=\"same\">voluntarily took part in<\/mark> <mark class=\"new\">Suit 100<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Similar to <i>Lakshmi<\/i>,<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">Novar<\/mark> <mark class=\"same\">sued in<\/mark> <mark class=\"new\">the Ruritanian High Court<\/mark> <mark class=\"new\">just after defending<\/mark> <mark class=\"same\">instead of counterclaiming in<\/mark> <mark class=\"new\">Suit 100<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "J6.3.1.1", "title": "Exclusive Clause Breached", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, breach is a question of interpretation under<\/mark> <mark class=\"new\">Singapore law<\/mark><mark class=\"same\">. Presently,<\/mark> <mark class=\"new\">Novar<\/mark> <mark class=\"same\">breached<\/mark> <mark class=\"new\">cl 31<\/mark><mark class=\"same\">, an exclusive<\/mark> <mark class=\"new\">Singapore<\/mark> <mark class=\"same\">clause, by suing in<\/mark> <mark class=\"new\">the Ruritanian High Court<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Sun Travels<\/i>, breach is a separate basis: no unconscionability is needed, and the ASI ordinarily issues absent strong reasons (J6.3.1.4).<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "This is the EJC route, and cl 31 says \"non-exclusive\". Running it for the Ruritanian Claim puts the strong reasons burden on Novar when Lumen should be proving vexation."}, {"letter": "D", "code": "J6.1", "title": "Submission or Valid Service", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Novar<\/mark> <mark class=\"same\">is amenable, having<\/mark> <mark class=\"new\">submitted by defending on the merits in Suit 100<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">Per <i>Cooperative Muratori<\/i>, being within the court's in personam jurisdiction is what amenability requires.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Similar to <i>BCS v Baker<\/i>,<\/mark> <span class=\"gap\">…<\/span> <mark class=\"new\">Novar<\/mark> <mark class=\"new\">defended<\/mark> <mark class=\"new\">Suit 100<\/mark> <mark class=\"same\">without contesting jurisdiction, and is amenable.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Always required, so state it. But Novar plainly submitted by defending on the merits, so one line clears it."}, {"letter": "E", "code": "J6.5.1", "title": "Anti-Anti-Suit Injunctions", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">Novar<\/mark> <mark class=\"new\">has applied<\/mark> <mark class=\"same\">to<\/mark> <mark class=\"new\">the Ruritanian High Court<\/mark> <mark class=\"same\">for an ASI against<\/mark> <mark class=\"new\">Suit 100<\/mark><mark class=\"same\">. Per <i>Airbus<\/i> and C&amp;Y, Singapore may restrain<\/mark> <mark class=\"new\">Novar<\/mark> <mark class=\"same\">from seeking it, to protect its own proceedings, on the usual requirements (J6.1–J6.4).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, it may also issue where a foreign ASI<\/mark> <mark class=\"new\">would breach<\/mark> <mark class=\"new\">cl 31<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">After <i>UBS v Telesto<\/i>, plead vexation as well as breach, as Singapore reads <i>Sabah<\/i> as a vexation case (J6.3.1.2).<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "J6.2.1", "title": "Singapore NEJC", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">cl 31<\/mark> <mark class=\"same\">is a Singapore NEJC governed by Singapore law. Arguably, per <i>Shanghai Turbo<\/i> and C&amp;Y, a defendant sued here must show strong cause not to be held to its submission, so<\/mark> <mark class=\"new\">cl 31<\/mark> <mark class=\"same\">works like an EJC and supplies the connection.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Contrast: The NEJC supplies interest only; suing in<\/mark> <mark class=\"new\">the Ruritanian High Court<\/mark> <mark class=\"same\">is not itself a breach (J6.3.1.2).<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Needed for sufficient interest, and one line settles it. It does not answer the real question, which is whether Novar's conduct is a breach or vexatious."}, {"letter": "G", "code": "J6.3.1.2", "title": "Singapore NEJC: No Breach", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">cl 31<\/mark> <mark class=\"same\">is a Singapore NEJC. Per C&amp;Y and <i>Shanghai Turbo<\/i>, suing in<\/mark> <mark class=\"new\">the Ruritanian High Court<\/mark> <mark class=\"same\">is not ordinarily a breach, the parties having accepted parallel proceedings; only a challenge to Singapore's jurisdiction, e.g.,<\/mark> <mark class=\"new\">the Injunction Application<\/mark><mark class=\"same\">, needs strong cause.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">So<\/mark> <mark class=\"new\">Lumen<\/mark> <mark class=\"same\">relies on vexation (J6.3.2) or abuse (J6.3.3)<\/mark> <mark class=\"new\">for the Ruritanian Claim.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"n": 5, "paper": "Exam Q1", "pre": "J7", "title": "Trade-fair judgment", "q": "<p>Vega Inc, a Ruritanian company, sells machine parts to Sol Pte Ltd, a Singapore company. Their contract has no jurisdiction clause. Ruritania is not gazetted under REFJA and is not a Contracting State to the Hague Convention on Choice of Court Agreements.<\/p><p>Sol's only trading in Ruritania was a nine-day trade fair in June 2024, where it rented a stand and its staff took orders. Vega's claim form for unpaid invoices was served on Sol's sales director at that stand on day four. Sol applied to the Ruritanian High Court to set aside service because Ruritania was forum non conveniens. It lost and took no further part.<\/p><p>In January 2025 the court gave default judgment for US$4 million in compensatory damages and US$2 million in punitive damages, both payable to Vega. The time to appeal has passed, and under Ruritanian law the judgment is final and cannot be reopened by that court. Sol now says the invoices were forged. It held copies before the hearing and could have checked them against its own records.<\/p><p>Vega sues on the judgment in Singapore in November 2026. Advise Sol.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Sol has three lines of attack: no international jurisdiction, fraud, and the punitive award. Each has one block that decides it.<\/p>\n<p><strong>Jurisdiction: J7.1.2.3.<\/strong> <i>Dunlop v Cudell<\/i> is on all fours: a nine-day trade-fair stand was a fixed place of business, and Sol was served there. Presence is enough, so the jurisdiction challenge fails.<\/p>\n<p><strong>Fraud: J7.2.2 intrinsic.<\/strong> Forged documents go to the merits. <i>Eleven v Boxsentry<\/i> applies the intrinsic test even though Sol took no part, and Sol held copies, so it cannot meet the diligence test.<\/p>\n<p><strong>Punitive damages: J7.2.5.<\/strong> This is Sol's only real opening. The point is uncertain, but <i>Licea<\/i> severance means at best it trims the US$2 million and leaves the US$4 million.<\/p>\n<p><strong>Trap to avoid.<\/strong> Taking no part does not turn forgery into extrinsic fraud. Classify the fraud first; that is what Chong says she wants (J7.2.2).<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Ruritania had international jurisdiction because Sol's stand was a fixed place of business when it was served, the default judgment is on the merits and final, and the forgery is intrinsic fraud that diligence would have uncovered, so the US$4 million is enforceable and only the US$2 million punitive part is open to argument and severance.<\/blockquote>", "items": [{"letter": "A", "code": "J7.1.1", "title": "Default Judgment", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y,<\/mark> <mark class=\"new\">the Ruritanian judgment<\/mark> <mark class=\"same\">is on the merits although<\/mark> <mark class=\"new\">Sol<\/mark> <mark class=\"same\">did not appear and<\/mark> <mark class=\"new\">the Ruritanian court<\/mark> <mark class=\"same\">may not have considered the evidence; non-participation goes only to fraud (J7.2.2) or natural justice (J7.2.3).<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Vega must show this, but it is easily met. One line: a default judgment is on the merits, and non-participation only matters for fraud or natural justice."}, {"letter": "B", "code": "J7.2.2", "title": "Extrinsic Fraud", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ee Hoong Liang<\/i>, extrinsic fraud is fraud<\/mark> <mark class=\"new\">Sol<\/mark> <mark class=\"same\">had no opportunity to examine and challenge, going to<\/mark> <mark class=\"new\">the Ruritanian court<\/mark><mark class=\"same\">'s jurisdiction<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Hong Pian Tee<\/i>, <i>Abouloff<\/i> applies: no new evidence is needed, and<\/mark> <mark class=\"new\">Sol<\/mark> <mark class=\"same\">may raise the fraud though<\/mark> <mark class=\"new\">it is raised here for the first time<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "The trap for a debtor who stayed away. Extrinsic fraud is fraud it had no opportunity to challenge, but Sol had notice and the invoices. <i>Eleven v Boxsentry<\/i> applies the intrinsic test, so the diligence hurdle stays."}, {"letter": "C", "code": "J7.1.2.3", "title": "Presence: Short but Fixed", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Adams v Cape<\/i>,<\/mark> <mark class=\"new\">Sol<\/mark> <mark class=\"same\">is present in<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">if, for more than a minimal period, its own business was carried on at or from a fixed place of business<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Dunlop v Cudell<\/i>, a nine-day trade-fair stand was a fixed place of business, so<\/mark> <mark class=\"new\">Sol<\/mark><mark class=\"same\">'s<\/mark> <mark class=\"new\">stand<\/mark> <mark class=\"same\">at<\/mark> <mark class=\"new\">the Ruritanian trade fair<\/mark> <mark class=\"same\">for<\/mark> <mark class=\"new\">nine days<\/mark> <mark class=\"same\">qualifies.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "D", "code": "J7.1.2.4", "title": "Setting Aside on FNC Grounds", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Henry v Geoprosco<\/i>,<\/mark> <mark class=\"new\">Sol<\/mark><mark class=\"same\">'s application to set aside<\/mark> <mark class=\"new\">service<\/mark> <mark class=\"same\">because<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">was forum non conveniens asked<\/mark> <mark class=\"new\">the Ruritanian court<\/mark> <mark class=\"same\">to decline a jurisdiction it had, so was submission.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, a failed set-aside on any ground is a protest (<i>Re Dulles<\/i>), so<\/mark> <mark class=\"new\">Sol<\/mark><mark class=\"same\">'s<\/mark> <mark class=\"new\">FNC challenge<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">was not submission.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "A live debate, and it is the block to open if presence fails. But presence succeeds here, so submission is a short alternative."}, {"letter": "E", "code": "J7.2.5", "title": "Punitive Damages; Severance", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">(+) Per C&amp;Y, refusing<\/mark> <mark class=\"new\">the US$2m punitive award<\/mark> <mark class=\"same\">would be anomalous when Singapore awards punitive damages in tort (<i>ACB v Thomson Medical<\/i>). (−) But the point is uncertain<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Licea<\/i>, where<\/mark> <mark class=\"new\">the Ruritanian judgment<\/mark> <mark class=\"same\">awards<\/mark> <mark class=\"new\">US$4m compensatory<\/mark> <mark class=\"same\">and<\/mark> <mark class=\"new\">US$2m punitive<\/mark><mark class=\"same\">,<\/mark> <mark class=\"new\">Vega<\/mark> <mark class=\"same\">enforces the unobjectionable part if clearly identifiable and separable<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "F", "code": "J7.1.3", "title": "Final and Conclusive", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Sang Cheol Woo<\/i>,<\/mark> <mark class=\"new\">the judgment<\/mark> <mark class=\"same\">is final and conclusive if (a)<\/mark> <mark class=\"new\">the Ruritanian court<\/mark> <mark class=\"same\">cannot vary, reopen or set it aside, though<\/mark> <mark class=\"new\">the appellate court<\/mark> <mark class=\"same\">may hear an appeal; and (b)<\/mark> <mark class=\"new\">the Ruritanian court<\/mark> <mark class=\"same\">regards it as res judicata.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Also easily met, as the facts give you Ruritanian law: final, and not reopenable by that court. One line, without a detour."}, {"letter": "G", "code": "J7.2.2", "title": "Intrinsic Fraud; Default Judgments", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Presently,<\/mark> <mark class=\"new\">forged invoices<\/mark> <mark class=\"same\">at<\/mark> <mark class=\"new\">the Ruritanian hearing<\/mark> <mark class=\"same\">go to the merits. Per <i>Hong Pian Tee<\/i>,<\/mark> <mark class=\"new\">Sol<\/mark> <mark class=\"same\">needs fresh evidence that reasonable diligence would not have uncovered and that would likely have changed the result<\/mark> <mark class=\"new\">, yet Sol held copies.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Eleven v Boxsentry<\/i>, the intrinsic test applies to a default judgment though<\/mark> <mark class=\"new\">Sol<\/mark> <mark class=\"same\">took no part.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}, {"n": 6, "paper": "Exam Q2", "pre": "C2", "title": "Floating clause and an import ban", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>By a contract dated 1 June 2025, signed in Ruritania, Zephyr Pte Ltd, a Singapore company, agrees to sell 2,000 drone motors to Talon Co, a Ruritanian company. Delivery and payment are both to take place at Port Asher, Ruritania. Clause 12 says: \"This contract is governed by Singapore law if Zephyr commences proceedings, and by Ruritanian law if Talon commences proceedings.\"<\/p><p>On 1 February 2026 Ruritania bans the import of drone motors. Talon refuses to take delivery at Port Asher or to pay. Zephyr sues Talon in Singapore for damages for non-acceptance.<\/p><p>You are told that Ruritanian law permits a clause like cl 12. Under Singapore domestic law the ban would frustrate the contract. Under Ruritanian domestic law it would not, because the seller can deliver to the nearest available port. Advise on the law governing the contract and whether the ban defeats Zephyr's claim.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> \"X law if A sues, Y law if B sues\" is Chong's reused clause. You are told Ruritanian law permits it, and that signals both routes must be run.<\/p>\n<p><strong>The clause: C2.2.5.<\/strong> Under the lex fori, cl 12 is invalid, so go to the OPL. Under the OPL, if Ruritanian law permits it, cl 12 is valid and Singapore law governs because Zephyr sued. Run both.<\/p>\n<p><strong>The OPL: C2.4.3.<\/strong> Both parties perform at Port Asher and the contract was signed in Ruritania, so Ruritanian law is the OPL. The lex fori route therefore ends in Ruritanian law, and the OPL route ends in Singapore law.<\/p>\n<p><strong>The ban: C2.10.5.<\/strong> A ban after contracting at the place of performance is <i>Ralli<\/i>. On reading (1) it bars enforcement whatever the proper law. On reading (2) the answer flips with the proper law: frustrated under Singapore law, not under Ruritanian law. So Zephyr wants cl 12 struck out: only then does Ruritanian law govern and the contract survive.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not assume Zephyr wants its own clause upheld. Upholding cl 12 gives it Singapore law, which frustrates the contract on reading (2). Work out each route's outcome before you advise.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Cl 12 is a floating clause, invalid under the lex fori but valid if the OPL, Ruritanian law, permits it, so argue both; the ban at Port Asher engages Ralli, which bars the claim on the Esben reading and otherwise turns on whether the proper law frustrates the contract.<\/blockquote>", "items": [{"letter": "A", "code": "C2.10.5", "title": "Ralli: Three Readings", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y (and Day), <i>Ralli<\/i> is (1) an independent conflicts rule, (2) frustration under<\/mark> <mark class=\"new\">the proper law<\/mark><mark class=\"same\">, or (3) comity-based abstention, and<\/mark> <mark class=\"new\">the result<\/mark> <mark class=\"same\">turns on<\/mark> <mark class=\"new\">the reading<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">(1) Independent rule (start here): per <i>Esben<\/i>, Dicey's rule rooted in comity, catching supervening and initial illegality alike<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">(2) Frustration (alternative):<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">ask whether<\/mark> <mark class=\"new\">the proper law<\/mark> <mark class=\"same\">frustrates or permits<\/mark> <mark class=\"new\">delivery to the nearest available port<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "B", "code": "C2.2.8", "title": "Skip Stage 2", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Shanghai Turbo<\/i> and <i>The Iran Vojdan<\/i>, as<\/mark> <mark class=\"new\">Zephyr and Talon<\/mark> <mark class=\"same\">turned their minds to the governing law and failed<\/mark> <mark class=\"new\">(a floating clause)<\/mark><mark class=\"same\">, inferring a choice is \"artificial\", so go to Stage 3.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Low stakes: per <i>Pacific Recreation<\/i>, skipping Stage 2 is \"not as significant a step as it seems\", as the same factors recur at Stage 3.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Correct and needed, but it is a one-line bridge: no implied choice, straight to the OPL."}, {"letter": "C", "code": "C2.10.3", "title": "Foster: Comity; Wicked Intention", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Foster v Driscoll<\/i> and <i>Regazzoni<\/i> (in Singapore, <i>Patriot v Lam Hong<\/i>; <i>Esben<\/i>), a contract whose real object and intention is<\/mark> <mark class=\"new\">importing banned motors<\/mark> <mark class=\"same\">in<\/mark> <mark class=\"new\">Ruritania<\/mark> <mark class=\"same\">is unenforceable<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Magdeev<\/i> (and <i>Waugh v Morris<\/i>), intention at formation decides, even if the plan was never carried out<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Foster turns on intention at formation, and per Magdeev a later prohibition does not suffice. The ban came eight months after contracting and no one planned to break it. Dates decide between Foster and Ralli."}, {"letter": "D", "code": "C2.2.5", "title": "Which Law Tests Validity?", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, the <i>Shanghai Turbo<\/i> HC on balance used the lex fori (also testing both candidate laws), whereas <i>The Iran Vojdan<\/i> used the OPL<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Lex fori (−): per Prof Chong, under Singapore law<\/mark> <mark class=\"new\">cl 12<\/mark> <mark class=\"same\">is invalid even with an election mechanism, so the OPL governs.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">OPL (+): per Prof Chong, if<\/mark> <mark class=\"new\">the OPL, Ruritanian law,<\/mark> <mark class=\"same\">permits floating clauses,<\/mark> <mark class=\"new\">cl 12<\/mark> <mark class=\"same\">is valid and<\/mark> <mark class=\"new\">Singapore law<\/mark> <mark class=\"same\">governs once<\/mark> <mark class=\"new\">Zephyr<\/mark> <mark class=\"new\">sues first<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "C2.2.6", "title": "Change of Proper Law; Split", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Kredietbank v Sinotani<\/i> (and <i>James Miller<\/i>),<\/mark> <mark class=\"new\">Zephyr and Talon<\/mark> <mark class=\"same\">may change<\/mark> <mark class=\"new\">Singapore law<\/mark> <mark class=\"same\">to<\/mark> <mark class=\"new\">Ruritanian law<\/mark><mark class=\"same\">, though whether the lex fori or the original proper law decides if the change is allowed is open.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Coherence: the split must be internally coherent, so not<\/mark> <mark class=\"new\">different laws<\/mark> <mark class=\"same\">depending on<\/mark> <mark class=\"new\">which party sues<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Zephyr's best rebuttal: cl 12 is a permitted split, not a floating clause. Worth a sentence, but the coherence line cuts against it, as the law cannot turn on who sues."}, {"letter": "F", "code": "C2.4.3", "title": "Application: Where Both Perform", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per Prof Chong, the strongest argument is usually<\/mark> <mark class=\"new\">Port Asher, where both parties perform<\/mark><mark class=\"same\">, supported by<\/mark> <mark class=\"new\">the place of contracting<\/mark><mark class=\"same\">, so<\/mark> <mark class=\"new\">Ruritanian law<\/mark> <mark class=\"same\">is the OPL.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, <i>Pacific Recreation<\/i>'s \"equal weight\" dictum is puzzling, as the place of performance carries great weight (<i>Bonython<\/i>; <i>Enka<\/i>)<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "C2.10.1", "title": "Framework: Foster vs Ralli vs Lemenda", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y, breach of foreign written law intended at formation goes to <i>Foster<\/i> and in required performance to <i>Ralli<\/i>, while foreign public policy alone goes to <i>Lemenda<\/i>; per <i>Magdeev<\/i>, \"<i>Ralli<\/i> looks to action, <i>Foster<\/i> <span class=\"gap\">…<\/span> to intention\".<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"new\">Ask which of these the Port Asher ban engages.<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The right routing line for your opening, and one sentence is enough. It only sends you to C2.10.5, where the marks are."}]}, {"n": 7, "paper": "Exam Q2", "pre": "C2", "title": "Smuggling plan and a guarantee", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>By a contract dated 2 February 2026, governed by Singapore law (the Sale Contract), Aster Pte Ltd, a Singapore company, sells 500 cooling units to Bahari Co, a Ruritanian company, for US$2 million. Delivery is at Aster's warehouse in Jurong. Ruritanian law has banned the import of these units since 2024.<\/p><p>From the outset Bahari plans to smuggle the units into Ruritania, labelled as spare parts. A week before delivery, Aster's sales manager learns of the plan and says nothing. Aster delivers at Jurong as agreed and takes no other part. Ruritanian customs seize the units, and Bahari refuses to pay.<\/p><p>Aster sues Bahari for the price. It also sues Dorn Ltd, Bahari's Utopian parent, on a guarantee of the price governed by Utopian law (the Guarantee). You are told that the smuggling is sufficiently connected to the Guarantee to taint it under Utopian law, but not under Singapore law. Advise Aster on both claims.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> The illegality cluster: which route, whose intention, and which law decides tainting. The last line of the hypo is Chong's usual \"under X law but not Y law\" signal.<\/p>\n<p><strong>Does Foster apply? C2.10.3 Territorial.<\/strong> Delivery in Jurong is lawful, but the court looks to the real object, and the plan was to import into Ruritania. Foster is forum public policy, so the Singapore proper law does not remove it.<\/p>\n<p><strong>Can Aster still sue? C2.10.3 Unilateral.<\/strong> The intention was Bahari's alone, so it bars only Bahari. The manager's late knowledge is not active participation, so Aster may sue for the price.<\/p>\n<p><strong>The Guarantee: C2.10.6 Step 2.<\/strong> Whether it is tainted depends on which law decides: the lex fori says no, Utopian law says yes. If proper law, it is the law of the Guarantee, the claim sued on, not the Sale Contract. Run both and pick one.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not use the Sale Contract's Singapore law as \"the proper law\" for tainting. Chong's point is that it is the law of the contract sued on.<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>Bahari's plan engages Foster though delivery was at Jurong, but the intention was Bahari's alone and the manager's late knowledge is not participation, so Aster recovers the price; the Guarantee turns on whether tainting is for the lex fori, which says no, or Utopian law as its proper law, which says yes, so argue both.<\/blockquote>", "items": [{"letter": "A", "code": "C2.10.4", "title": "Lemenda: Double Policy Breach", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Lemenda<\/i>,<\/mark> <mark class=\"new\">a sale of units bound for Ruritania<\/mark> <mark class=\"same\">under<\/mark> <mark class=\"new\">a Singapore-law contract<\/mark> <mark class=\"same\">is unenforced if contrary to both a forum policy founded on general morality and the same policy at<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Shaikh Faisal<\/i>, breaching<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">'s policy does not bar a Singapore-law contract absent a similar Singapore policy<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Lemenda is for foreign public policy alone. Here a written Ruritanian law is broken, so C2.10.1's framework sends the issue to Foster."}, {"letter": "B", "code": "C2.10.3", "title": "Territorial; Proper Law Irrelevant", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Surewin<\/i>,<\/mark> <mark class=\"new\">importing the units<\/mark> <mark class=\"same\">must be contemplated within<\/mark> <mark class=\"new\">Ruritania<\/mark><mark class=\"same\">, though per <i>Foster<\/i> and <i>Regazzoni<\/i> not necessarily at<\/mark> <mark class=\"new\">Jurong<\/mark><mark class=\"same\">, the court looking to the real object.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ang v Lyu<\/i> and <i>Surewin<\/i>, <i>Foster<\/i> is forum public policy, so it applies under<\/mark> <mark class=\"new\">a Singapore<\/mark> <mark class=\"same\">proper law alike<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "C2.10.6", "title": "Step 1: Relevant Foreign Illegality", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\"><i>Anuva<\/i> excluded illegal acts, but per C&amp;Y a transaction is made of acts (cf <i>Howard v Shirlstar<\/i>), so per <i>Surewin<\/i> ask whether<\/mark> <mark class=\"new\">the smuggling<\/mark> <mark class=\"same\">breached<\/mark> <mark class=\"new\">Ruritanian law<\/mark><mark class=\"same\">, or whether Singapore would enforce<\/mark> <mark class=\"new\">the Sale Contract<\/mark> <mark class=\"same\">(C2.10.3 to C2.10.5).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ryder Industries<\/i>, not every breach counts:<\/mark> <mark class=\"new\">a breach of forum international policy<\/mark> <mark class=\"same\">qualifies<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "You must clear this, but it is short. A planned breach of a Ruritanian import ban is a serious illegality, and the hypo already assumes the link. The dispute is at Step 2."}, {"letter": "D", "code": "C2.10.6", "title": "Step 2: Which Law's Principles?", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Unresolved,<\/mark> <span class=\"gap\">…<\/span> <mark class=\"same\">per Prof Chong, if tainting is part of the lex fori, Singapore's principles decide, and if of the proper law, that law's do.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Which proper law: per Chong (seminar), that of<\/mark> <mark class=\"new\">the Guarantee, the claim sued on<\/mark><mark class=\"same\">, not of<\/mark> <mark class=\"new\">the Sale Contract, the tainting transaction<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">3<\/span><span class=\"tx\"><mark class=\"same\">Submission (C&amp;Y; Forsyth): apply<\/mark> <mark class=\"new\">Utopian law<\/mark><mark class=\"same\">'s principles unless<\/mark> <mark class=\"new\">Singapore's<\/mark> <mark class=\"same\">rise to overriding mandatory rules or international policy<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "C2.10.5", "title": "Ralli: Illegal Performance", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ralli Brothers<\/i>,<\/mark> <mark class=\"new\">delivery into Ruritania after its ban<\/mark> <mark class=\"same\">is unenforceable in so far as unlawful at the contractual place of performance, whatever the proper law.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">(1) Independent rule (start here): per <i>Esben<\/i>, Dicey's rule rooted in comity, catching supervening and initial illegality alike<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Ralli needs illegality in required performance at the contractual place, and that is Jurong, where delivery is lawful. The smuggling is Bahari's own plan, not a contractual duty."}, {"letter": "F", "code": "C2.10.3", "title": "Unilateral Intention; Mental State", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Royal Boskalis<\/i>, unilateral intention bars only its holder, so<\/mark> <mark class=\"new\">Aster<\/mark> <mark class=\"same\">may sue (<i>Ang v Lyu<\/i>; <i>Surewin<\/i>), though not for an order compelling the illegal performance.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Mental state: per <i>Dimplex Gems<\/i>,<\/mark> <mark class=\"new\">the sales manager's<\/mark> <mark class=\"same\">mere knowledge does not disqualify<\/mark> <mark class=\"new\">Aster<\/mark><mark class=\"same\">; active participation is needed (doubting <i>Soetanto<\/i>).<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "G", "code": "C2.10.6", "title": "Proportionality", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Ting Siew May<\/i> (applied in <i>Surewin<\/i>), refusing<\/mark> <mark class=\"new\">the Guarantee<\/mark> <mark class=\"same\">must be proportionate, weighing (a) the prohibiting rule's purpose, (b) gravity, (c) remoteness or centrality, (d) object, intent and conduct and (e) consequences of denial.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Surewin application: refusing the pledge was disproportionate, as the bank was unaware<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Use this if you pick the lex fori route, since it is how Singapore principles work. But it only runs after Step 2 picks Singapore, so it is a branch, not the opening block."}]}, {"n": 8, "paper": "Exam Q2", "pre": "C3", "title": "Forecast read on holiday", "q": "<p>Assume the Singapore court will assume jurisdiction.<\/p><p>Ember Pte Ltd, a Singapore company, buys a logistics business from Castellan SA, a Utopian company. While working in Utopia, Castellan's CFO emails a profit forecast to Ember's CEO, who opens it on holiday in Ruritania. Back in Singapore, Ember's board reviews the forecast and resolves to buy, and the sale agreement is signed in Singapore.<\/p><p>The sale agreement is expressly governed by Utopian law. In clause 9 Ember confirms that it \"has not relied on any statement made before this agreement\". Clause 14 says that all disputes arising out of or in connection with the agreement are governed by Utopian law.<\/p><p>The forecast was carelessly prepared and false. Ember sues Castellan in Singapore in the tort of negligent misrepresentation only. Under Utopian law, clause 9 is valid and a complete defence, and a two-year limitation period has expired. Under Singapore law, clause 9 would fail a reasonableness test, and the claim is in time. Advise on the law or laws governing the claim and whether clause 9 and the Utopian time bar defeat it.<\/p>", "why": "<p><strong>What the question is testing.<\/strong> Made in Utopia, read in Ruritania, relied on in Singapore: the place of the tort decides almost everything else, including the time bar.<\/p>\n<p><strong>Locate the tort: C3.3.2 Misrepresentation.<\/strong> Receipt and reliance split, so the specific rule fails and you use the substance test. Receipt on holiday is fortuitous, and the board relied in Singapore, so the tort is on balance in Singapore. Castellan replies with <i>IM Skaugen<\/i>: across several countries, the place of making may prevail, which would be Utopia. If Singapore holds, both limbs point to Singapore law and the Utopian time bar falls away.<\/p>\n<p><strong>Castellan's way back: C3.6.5.<\/strong> Cl 14 is wide, so Castellan argues Utopian law governs the tort through the flexible exception. It is an open question, and <i>Rickshaw<\/i>'s fortuity threshold is the obstacle, because Singapore is not fortuitous here.<\/p>\n<p><strong>Cl 9: C3.8.2.<\/strong> Run the <i>Sayers<\/i> majority first: valid under Utopian law, so the claim fails. Then the preferred approach: valid under its proper law, but it must also be admissible under Singapore law on both limbs, and there it fails the reasonableness test.<\/p>\n<p><strong>Trap to avoid.<\/strong> Do not treat the governing law clause as settling the tort. The claim is framed in tort, so double actionability runs first (<i>Rickshaw<\/i>).<\/p>\n<p class=\"vl-h\">Result line<\/p><blockquote>The tort is on balance in Singapore, receipt in Ruritania being fortuitous and reliance here, so both limbs point to Singapore law and the Utopian time bar falls away unless cl 14 displaces them through the exception, which is open and hard to fit with Rickshaw; cl 9 is valid under Utopian law but, on the preferred approach, inadmissible under Singapore law.<\/blockquote>", "items": [{"letter": "A", "code": "C3.8.1", "title": "Contract Negating an Element", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per C&amp;Y (North), (i) the effect of<\/mark> <mark class=\"new\">the sale agreement<\/mark> <mark class=\"same\">on tort liability is a tort question for double actionability, and (ii) its validity a contract question for<\/mark> <mark class=\"new\">its proper law, Utopian law<\/mark><mark class=\"same\">.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Galaxias: the trespass was an English tort, so English law held a contractual right to remain negates trespass<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The same two-question logic. But this block is for a contract that answers an element, like a licence. The router sends a non-reliance clause raised as a defence to C3.8.2."}, {"letter": "B", "code": "C3.3.2", "title": "Misrepresentation: Receipt + Reliance", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>JIO Minerals<\/i> (tentatively, citing Yeo) and <i>Ong Ghee Soon<\/i>,<\/mark> <mark class=\"new\">a forecast<\/mark> <mark class=\"same\">directed at<\/mark> <mark class=\"new\">Ember<\/mark> <mark class=\"same\">and received and acted on in<\/mark> <mark class=\"new\">one place<\/mark> <mark class=\"same\">is a tort there, unless that place is fortuitous.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Receipt and reliance split: the specific rule fails, so use the substance test<\/mark> <mark class=\"new\">: Ruritania was a holiday, and the board relied in Singapore.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "C", "code": "C3.9.2", "title": "Lex Loci Delicti's Period", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per s 3(1) and s 3(2) FLPA 2012,<\/mark> <mark class=\"new\">Utopian law<\/mark><mark class=\"same\">'s domestic limitation period alone applies, renvoi being excluded (ss 3(5), 6(2)), so<\/mark> <mark class=\"new\">the claim<\/mark> <mark class=\"new\">is<\/mark> <mark class=\"same\">barred, subject to s 4(2) undue hardship (C1.5.4).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">per s 3(2) FLPA, locating the tort in Singapore avoids<\/mark> <mark class=\"new\">Utopian law<\/mark><mark class=\"same\">'s shorter period (C3.3).<\/mark><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "The right result, in one line. Limitation follows from where the tort is located, so C3.3.2 does the work."}, {"letter": "D", "code": "C3.6.5", "title": "Party Autonomy: Route Through the Exception", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"new\">Castellan<\/mark> <mark class=\"same\">argues cl<\/mark> <mark class=\"new\">14<\/mark> <mark class=\"same\">applies<\/mark> <mark class=\"new\">Utopian law<\/mark> <mark class=\"same\">to the tort, an open question (<i>Ong Ghee Soon<\/i>), though \"just a small step away\" (C&amp;Y).<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Obstacle: <i>Rickshaw<\/i>'s fortuity threshold and non-exclusive concession blocked it (C3.4), so<\/mark> <mark class=\"new\">Ember<\/mark> <mark class=\"same\">argues the separate tort stays.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}, {"letter": "E", "code": "C3.3.2", "title": "Negligence: Focus on the Act", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Vibrant Group<\/i>, the place of<\/mark> <mark class=\"new\">the CFO's careless forecast<\/mark> <mark class=\"same\">prevails, so<\/mark> <mark class=\"new\">the forecast<\/mark> <mark class=\"same\">performed in<\/mark> <mark class=\"new\">Utopia<\/mark> <mark class=\"same\">locates the tort there despite reliance and loss in Singapore.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Reliance weighs less: in negligence, reliance is only one route to a duty (<i>NTUC Foodfare<\/i>; <i>Vibrant<\/i>).<\/mark><\/span><\/li><\/ul>", "verdict": "WRONG", "html": "Vibrant's act-focused rule is for negligence such as an audit. Ember pleads a misrepresentation directed at it, and per Vibrant reliance counts for more there, so Utopia is not the answer."}, {"letter": "F", "code": "C3.4", "title": "Double Actionability for Local Torts", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">Per <i>Rickshaw<\/i>, rejecting <i>Metall<\/i>'s English-law-only rule as \"unduly parochial\" and contrary to comity,<\/mark> <mark class=\"new\">negligent misrepresentation<\/mark> <mark class=\"same\">in Singapore still runs both limbs, both pointing to Singapore law.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">Point of difference: the exception may apply<\/mark> <mark class=\"new\">Utopian law<\/mark> <mark class=\"same\">where the Singapore locus is purely fortuitous, no stricter test applying<\/mark> <span class=\"gap\">…<\/span><\/span><\/li><\/ul>", "verdict": "CLOSE", "html": "Correct once you locate the tort here, and it shows the exception still runs. But it is a consequence of C3.3.2, not the opening move."}, {"letter": "G", "code": "C3.8.2", "title": "Clause as a Defence: Sayers and the Preferred Approach", "block": "<ul class=\"blk\"><li><span class=\"n\">1<\/span><span class=\"tx\"><mark class=\"same\">only the proper law of the contract mattered, and it being Dutch, \"this action is dead\" (Salmon LJ), so if<\/mark> <mark class=\"new\">Utopian law<\/mark> <mark class=\"same\">validates cl<\/mark> <mark class=\"new\">9<\/mark><mark class=\"same\">, the claim fails.<\/mark><\/span><\/li><li><span class=\"n\">2<\/span><span class=\"tx\"><mark class=\"same\">(1) admissibility is a tort question for double actionability, and (2) validity a contract question for<\/mark> <mark class=\"new\">Utopian law<\/mark><mark class=\"same\">, so cl<\/mark> <mark class=\"new\">9<\/mark><mark class=\"same\">, valid under<\/mark> <mark class=\"new\">Utopian law<\/mark><mark class=\"same\">, succeeds only if admissible under both Singapore law and the lex loci delicti.<\/mark><\/span><\/li><\/ul>", "verdict": "BEST", "html": ""}]}];
const PICK = 3;
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
