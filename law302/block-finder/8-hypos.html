const key = q => `law302-bf-q${q.n}`;
function load(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function drop(k) { try { localStorage.removeItem(k); } catch (e) {} }
const how = () => $("#how").innerHTML;
const MSG = {
  BEST:  ["Best 3: well picked", "Best 3: you missed this one"],
  CLOSE: ["Close, but not top 3", "Close: fine to leave"],
  WRONG: ["Wrong block", "Rightly left out"],
};
const LABEL = { BEST: "BEST 3", CLOSE: "CLOSE", WRONG: "WRONG" };
let filter = "";

function home() {
  $("#prog").textContent = `${QS.length} hypos`;
  const chips = ["", "Exam Q1", "Exam Q2"].map(f => `<button class="chip${f === filter ? " on" : ""}" data-f="${f}">${f === "" ? "All" : f === "Exam Q1" ? "Exam Q1 (J1-J7)" : "Exam Q2 (C1-C3)"}</button>`).join("");
  const cards = QS.filter(q => !filter || q.paper === filter).map(q => {
    const r = load(key(q));
    const sc = r ? `<span class="sc s${r.best}">Best ${r.best} / 3</span>` : `<span class="sc"></span>`;
    return `<a class="qc" href="#q${q.n}"><span class="qn">Q${q.n}</span><span class="qt">${q.title}</span><span class="qs">${q.paper} · ${q.pre}</span>${sc}</a>`;
  }).join("");
  const done = QS.filter(q => load(key(q)));
  const avg = done.length ? done.reduce((s, q) => s + load(key(q)).best, 0) / done.length : 0;
  const todo = QS.find(q => !load(key(q)));
  const next = (todo || QS[0]);
  app.innerHTML = `<h1>Which pre-write blocks would you open first?</h1>
    <p class="lead">Eight mock hypos in the shape of Prof Chong's paper. Each one shows seven of your pre-write blocks, already filled in for those facts. Pick the three that decide the outcome, then check.</p>
    ${how()}
    <section class="card">
      <div class="stats"><span class="big">${done.length} of ${QS.length} done</span>${done.length ? `<span>average best ${avg.toFixed(1)} / 3</span>` : ""}
        <a class="btn" href="#q${next.n}">${done.length === 0 ? "Start with Q1" : todo ? `Next: Q${todo.n}` : "All done: start again"}</a>
        ${done.length ? `<button class="linkbtn" id="reset">Clear my scores</button>` : ""}</div>
      <div class="chips">${chips}</div>
      <div class="qgrid">${cards}</div>
    </section>
    <p class="foot">Mock facts and mock answers, traced to your pre-writes; not from Prof Chong. Scores stay in this browser only.</p>`;
  app.querySelectorAll(".chip").forEach(b => b.onclick = () => { filter = b.dataset.f; home(); });
  const reset = $("#reset");
  if (reset) reset.onclick = () => {
    if (reset.dataset.armed) { QS.forEach(q => drop(key(q))); home(); return; }
    reset.dataset.armed = "1"; reset.textContent = "Tap again to clear all scores";
  };
}

function question(q) {
  const i = QS.indexOf(q), prev = QS[i - 1], next = QS[i + 1];
  $("#prog").textContent = `0 / ${PICK} picked`;
  app.innerHTML = `<h1>Q${q.n} · ${q.title}</h1>
    <div class="meta">${q.paper} · ${q.pre} · hypo ${i + 1} of ${QS.length}</div>
    <section class="card qcard" aria-label="The hypo">${q.q}</section>
    ${how()}
    <section class="card">
      <h2>Which three blocks would you open first?</h2>
      <p class="hint">Each option is a pre-write block filled in for this hypo. Most could earn a line; pick the three that decide the outcome. Keys: 1 to 7 pick, Enter checks.</p>
      <p class="legend"><mark class="same">unchanged from the pre-write</mark> <mark class="new">changed for this hypo</mark> <span class="gap">…</span> left out</p>
      <div class="opts" id="opts"></div>
      <div class="checkrow">
        <button class="btn" id="check" disabled>Check</button>
        <button class="btn ghost" id="retry" hidden>Try again</button>
        <span class="count" id="count">Pick 3</span>
        <span class="score" id="score"></span>
      </div>
    </section>
    <section class="card why" id="why" hidden><h2>Why these three</h2>${q.why}</section>
    <div class="checkrow" style="justify-content:center"><button class="btn ghost" id="reveal">Show the answer without picking</button></div>
    <nav class="pn">${prev ? `<a href="#q${prev.n}">← Q${prev.n}</a>` : "<span></span>"}<a href="#home">All hypos</a>${next ? `<a href="#q${next.n}">Q${next.n} →</a>` : "<span></span>"}</nav>`;
  const box = $("#opts");
  let revealed = false;
  const picked = () => box.querySelectorAll(".opt.sel").length;
  const isDone = () => box.classList.contains("done");
  function update() {
    const n = picked();
    $("#check").disabled = n !== PICK;
    $("#count").classList.remove("nudge");
    $("#count").textContent = n === PICK ? "Ready to check" : `Pick ${PICK - n} more`;
    $("#prog").textContent = `${n} / ${PICK} picked`;
    box.querySelectorAll(".opt").forEach(o => o.classList.toggle("full", n === PICK));
  }
  function pick(el) {
    if (isDone()) return;
    const on = el.classList.contains("sel");
    if (!on && picked() >= PICK) {
      $("#count").textContent = `You have ${PICK}: untick one first`;
      $("#count").classList.add("nudge");
      return;
    }
    el.classList.toggle("sel", !on);
    el.setAttribute("aria-checked", String(!on));
    update();
  }
  q.items.forEach(o => {
    const el = document.createElement("div");
    el.className = "opt";
    el.setAttribute("role", "checkbox");
    el.setAttribute("aria-checked", "false");
    el.tabIndex = 0;
    el.innerHTML = `<div class="oh"><span class="lt">${o.letter}</span><span class="t"><span class="code">${o.code}</span>${o.title}</span></div>${o.block}<div class="res"></div>`;
    el._o = o;
    el.addEventListener("click", () => pick(el));
    el.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); e.stopPropagation(); pick(el); } });
    box.appendChild(el);
  });
  function check() {
    let hit = 0; const missed = [], close = [], bad = [];
    box.querySelectorAll(".opt").forEach(el => {
      const o = el._o, sel = el.classList.contains("sel");
      let cls;
      if (o.verdict === "BEST") { if (sel) { hit++; cls = "r-hit"; } else { missed.push(o.letter); cls = "r-miss"; } }
      else if (sel) { cls = o.verdict === "CLOSE" ? "r-close" : "r-bad"; (o.verdict === "CLOSE" ? close : bad).push(o.letter); }
      else cls = "r-ok";
      el.classList.add(cls);
      $(".res", el).innerHTML = `<div class="rhead"><span class="badge b-${o.verdict}">${LABEL[o.verdict]}</span><span class="outcome">${MSG[o.verdict][sel ? 0 : 1]}</span></div>` + (o.html ? `<p class="short">${o.html}</p>` : "");
    });
    box.classList.add("done");
    const parts = [];
    if (close.length) parts.push(`close: ${close.join(", ")}`);
    if (bad.length) parts.push(`wrong: ${bad.join(", ")}`);
    if (missed.length) parts.push(`missed: ${missed.join(", ")}`);
    $("#score").innerHTML = revealed ? `<span class="big">Answer shown</span>` :
      `<span class="big">Score ${hit} / ${PICK}</span><span class="sub">` + (hit === PICK ? "All three best blocks." : parts.join("; ").replace(/^./, c => c.toUpperCase()) + ".") + `</span>`;
    ["#check", "#reveal", "#count"].forEach(s => $(s).hidden = true);
    ["#retry", "#why"].forEach(s => $(s).hidden = false);
    $("#prog").textContent = revealed ? "Answer shown" : `Score ${hit} / ${PICK}`;
    if (!revealed) {
      const old = load(key(q)) || {};
      save(key(q), { last: hit, best: Math.max(hit, old.best ?? 0), tries: (old.tries ?? 0) + 1 });
    }
  }
  function retry() {
    revealed = false;
    box.classList.remove("done");
    box.querySelectorAll(".opt").forEach(el => {
      el.classList.remove("sel", "full", "r-hit", "r-miss", "r-close", "r-bad", "r-ok");
      el.setAttribute("aria-checked", "false");
      $(".res", el).innerHTML = "";
    });
    $("#score").innerHTML = "";
    ["#retry", "#why"].forEach(s => $(s).hidden = true);
    ["#check", "#reveal", "#count"].forEach(s => $(s).hidden = false);
    update();
  }
  $("#check").onclick = check;
  $("#retry").onclick = retry;
  $("#reveal").onclick = () => { revealed = true; check(); $("#why").scrollIntoView({ behavior: "smooth", block: "start" }); };
  update();
  document.onkeydown = e => {
    if (e.metaKey || e.ctrlKey || e.altKey || !$("#opts")) return;
    if (/^[1-7]$/.test(e.key)) pick(box.children[+e.key - 1]);
    else if (e.key === "Enter" && !$("#check").disabled && !isDone()) check();
  };
}

function route() {
  document.onkeydown = null;
  const m = location.hash.match(/^#q(\d+)$/);
  const q = m && QS.find(x => x.n === +m[1]);
  if (q) question(q); else home();
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
</script>

</body>
</html>
